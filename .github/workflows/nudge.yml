# The nudges: five pushes a day, scheduled in Singapore time (UTC+8, no DST,
# so the offsets never move). In Singapore they land at 08:07, 12:20, 15:40,
# 22:15 and 23:40 - the day's shape, the open hours before the Malta shift,
# the hour it starts, the check-in while it runs, and last call after it ends.
#
# Each payload is one word and nothing else. app/sw.js on the phone reads the
# mirrored day-state and writes the actual words - and it picks WHICH words
# from the hour the ping actually arrives at on that phone, not from the word
# in the payload, because he travels constantly and these crons do not.
#
# No-ops cleanly until the PUSH_BUNDLE secret exists (see scripts/send-push.mjs).
name: nudge

on:
  schedule:
    - cron: "7 0 * * *"     # 08:07 Singapore - the day's shape (off the :00 slot GitHub delays most)
    - cron: "20 4 * * *"    # 12:20 Singapore - the open hours before the shift
    - cron: "40 7 * * *"    # 15:40 Singapore - Malta is about to wake
    - cron: "15 14 * * *"   # 22:15 Singapore - the check-in, mid-shift
    - cron: "40 15 * * *"   # 23:40 Singapore - last call, after the shift ends
  workflow_dispatch:
    inputs:
      kind:
        description: "morning, midday, shift, evening or bed"
        required: false
        default: "evening"

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push@3 --no-audit --no-fund
      - run: node scripts/send-push.mjs
        env:
          KIND: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.kind
             || (github.event.schedule == '7 0 * * *'  && 'morning')
             || (github.event.schedule == '20 4 * * *' && 'midday')
             || (github.event.schedule == '40 7 * * *' && 'shift')
             || (github.event.schedule == '15 14 * * *' && 'evening')
             || 'bed' }}
          PUSH_BUNDLE: ${{ secrets.PUSH_BUNDLE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
