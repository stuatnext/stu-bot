# The nudges: heads-ups, 30-60 minutes before the real blocks of his day.
# v85, his words: "The phone notifications are popping up at weird times...
# I would rather get a notification alerting me half an hour or an hour
# before I need to do something."
#
# Cron is UTC; Singapore is UTC+8 with no daylight saving. Each line below is
# one heads-up (scripts/push-schedule.mjs maps it and decides whether today
# is a day for it: workdays, weekends, date nights, and nothing at all on the
# trip days in bot/push.json). The shift and stop lines come in pairs because
# Malta keeps European daylight saving - only the right one of each pair
# sends. Minutes are off the :00 slot, which is where GitHub delays runs most.
#
#   08:35 the day's shape       09:50 coffee or the focus block
#   12:35 clean / Mandarin / the call home
#   15:15 or 16:15 Malta in 45  19:02 date night (Mon & Fri from 2 Nov)
#   22:30 or 23:30 wrap up      23:05 wind down (weekends)
#
# Each payload is one word. app/sw.js on the phone writes the words from the
# day's own plan, mirrored from the app: "At 10:45: Strait Up Growth".
# No-ops cleanly until the PUSH_BUNDLE secret exists (see scripts/send-push.mjs).
name: nudge

on:
  schedule:
    - cron: "35 0 * * *"
    - cron: "50 1 * * *"
    - cron: "35 4 * * *"
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
    - cron: "2 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "morning, focus, midday, shift, date, stop or bed"
        required: false
        default: "midday"

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push@3 --no-audit --no-fund
      - run: node scripts/send-push.mjs
        env:
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || '' }}
          SCHEDULE: ${{ github.event.schedule }}
          PUSH_BUNDLE: ${{ secrets.PUSH_BUNDLE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
