# The Daylight bot. Reaches out so that using it is not a decision you have to make.
#
# NOTE: this file must live INSIDE .github/workflows/ as a directory. A file
# literally named "workflows" is never registered and silently never runs -
# which is exactly what happened to the previous bot in stu-time-bot.
name: Daylight bot

on:
  schedule:
    # Cron is UTC. Singapore is UTC+8.
    - cron: '30 0 * * 1-5'   # 08:30 SGT - names the day, asks for a first action
    - cron: '0 7 * * 1-5'    # 15:00 SGT - one hour before the shift
    - cron: '0 14 * * 1-5'   # 22:00 SGT - how did it go
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning, evening or collect'
        required: false
        default: 'morning'

permissions:
  contents: write

concurrency:
  group: daylight-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide which message this is
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 0 * * 1-5") echo "mode=morning" >> "$GITHUB_OUTPUT" ;;
              "0 14 * * 1-5") echo "mode=evening" >> "$GITHUB_OUTPUT" ;;
              *)              echo "mode=collect" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot/daylight.py "${{ steps.pick.outputs.mode }}"

      - name: Keep the record
        run: |
          git config user.name  "daylight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/state.json
          git diff --staged --quiet || git commit -m "bot: ${{ steps.pick.outputs.mode }} $(date -u +%Y-%m-%d)"
          git push
