<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daylight</title>
<meta name="description" content="A day fixed to head office, lived in Singapore.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daylight">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EDEFEC; --surface:#FBFCFA; --surface-2:#E4E8E3; --sunk:#E0E4DF;
  --line:#D4D9D3; --line-strong:#B7BFB9;
  --ink:#141B18; --ink-2:#4A5551; --ink-3:#79847F;
  --accent:#1F4FE0; --accent-soft:#DDE4FB;
  --signal:#B35C0C; --signal-soft:#F7E6D4;
  --crit:#A03830; --crit-soft:#F3DEDC;
  --good:#2C7A51; --good-soft:#DCEDE3;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
    --line:#293430; --line-strong:#3C4945;
    --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
    --accent:#7C9BFF; --accent-soft:#1C2647;
    --signal:#E09453; --signal-soft:#2E2317;
    --crit:#E08A82; --crit-soft:#2C1C1C;
    --good:#5CB585; --good-soft:#16261D;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
  --line:#293430; --line-strong:#3C4945;
  --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
  --accent:#7C9BFF; --accent-soft:#1C2647;
  --signal:#E09453; --signal-soft:#2E2317;
  --crit:#E08A82; --crit-soft:#2C1C1C;
  --good:#5CB585; --good-soft:#16261D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.wrap{max-width:620px; margin:0 auto;
  padding:18px max(16px, env(safe-area-inset-left)) 26px max(16px, env(safe-area-inset-right));}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.02em;}
h1{font-size:clamp(25px,6.2vw,32px); font-weight:800; line-height:1.1;}
h2{font-size:18px; font-weight:600; margin:24px 0 6px;}
h3{font-size:15px; font-weight:600; margin:0;}
p{margin:9px 0;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);}
.mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-2);} .dim{color:var(--ink-3); font-size:14px;}
strong{font-weight:600;} a{color:var(--accent);}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px;}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 17px; margin:13px 0;}
.card.tip{background:var(--signal-soft); border-color:var(--signal);}
.card.ok{background:var(--good-soft); border-color:var(--good);}
.card.hot{background:var(--crit-soft); border-color:var(--crit);}

/* The shift bar. The single most bespoke thing here: a day fixed to Malta. */
.bar{display:flex; height:34px; border-radius:9px; overflow:hidden; margin:12px 0 6px; border:1px solid var(--line);}
.bar span{display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); min-width:0; overflow:hidden;}
.bar .free{background:var(--good-soft); color:var(--good);}
.bar .work{background:var(--accent-soft); color:var(--accent);}
.bar .rest{background:var(--sunk);}
.bar .now{background:var(--crit); width:3px; min-width:3px; flex:none;}
.legend{display:flex; justify-content:space-between; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}

.say{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r); padding:17px; margin:13px 0;}
.say .lbl{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:7px;}
.say q{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
  font-size:clamp(22px,6.2vw,29px); line-height:1.2; letter-spacing:-.02em; quotes:none;}
.say .after{margin:9px 0 0; font-size:14px; color:var(--ink-2);}

.row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row b{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); flex:none; width:76px; padding-top:3px;}
.row div{flex:1; min-width:0;}

.pill{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:5px; background:var(--sunk); color:var(--ink-2);}
.pill.e{background:var(--good-soft); color:var(--good);}
.pill.m{background:var(--accent-soft); color:var(--accent);}
.pill.l{background:var(--signal-soft); color:var(--signal);}
.pill.hot{background:var(--crit-soft); color:var(--crit);}

button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); padding:12px 15px; min-height:46px;}
button:active{transform:translateY(1px);}
.btns{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap;}
.btns button{flex:1; min-width:130px;}
button.pri{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
:root[data-theme="dark"] button.pri, :root:not([data-theme="light"]) button.pri{color:#0D1211;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) button.pri{color:#fff;} }

/* Four ingredients of a day he already said was good. Tappable, never a streak. */
.ing{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 0;}
.ing button{min-height:66px; padding:9px 4px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; font-size:11.5px; color:var(--ink-3); line-height:1.2;}
.ing button .g{font-size:17px; line-height:1;}
.ing button[aria-pressed="true"]{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:600;}

textarea,input[type=text]{width:100%; font:inherit; padding:12px 13px; border-radius:10px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); resize:vertical;}
textarea{min-height:62px;}

nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20;}
nav button{flex:1; border:none; border-radius:0; background:none; padding:10px 2px 12px;
  font-size:11px; color:var(--ink-3); min-height:60px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;}
nav button[aria-current="true"]{color:var(--accent); font-weight:600;}
nav .ic{font-size:18px; line-height:1;}

table{width:100%; border-collapse:collapse; margin:10px 0; font-size:14.5px;}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400;}
td:first-child{white-space:nowrap; font-family:"JetBrains Mono",monospace; font-weight:500;}
ul{margin:9px 0; padding-left:20px;} li{margin:6px 0;} li::marker{color:var(--ink-3);}
.count{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-weight:700;
  font-size:26px; letter-spacing:-.03em; line-height:1;}

/* ================================================================== the game
   Everything below is the card game. A collectible is an object: portrait,
   framed, with art on the front and a back you turn over. Boxes with text in
   them are a website. */

.tc{position:relative; aspect-ratio:5/7; perspective:1100px; -webkit-perspective:1100px;}
.tc-i{position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.3,1.3,.5,1);}
.tc.down .tc-i{transform:rotateY(180deg);}
.tc-f,.tc-b{position:absolute; inset:0; border-radius:11px; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.22), 0 8px 20px rgba(0,0,0,.14);}
.tc-b{transform:rotateY(180deg);}

/* The frame is the metal, the pane is what it holds. */
.tc-f{padding:5px; background:linear-gradient(155deg,var(--fa),var(--fb) 38%,var(--fc) 62%,var(--fb));}
.tc-pane{position:absolute; inset:5px; border-radius:7px; overflow:hidden;
  background:var(--pane); display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.16) inset;}

/* Art window. Deterministic per card, tinted by rarity, never empty. */
.tc-art{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; color:var(--ink);
  background:radial-gradient(120% 90% at 50% 20%,var(--artA),var(--artB));
  border-top:1px solid rgba(0,0,0,.2); border-bottom:1px solid rgba(0,0,0,.2);
  box-shadow:0 0 14px rgba(0,0,0,.09) inset;}
.tc-art svg{position:absolute; inset:0; width:100%; height:100%; display:block;}

/* Name plate. */
.tc-nm{flex:none; padding:5px 7px; font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700; letter-spacing:-.015em; line-height:1.1; color:var(--plateInk);
  background:linear-gradient(180deg,var(--plateA),var(--plateB));
  font-size:clamp(8.5px,2.7vw,11.5px); overflow:hidden; text-wrap:balance;
  display:flex; align-items:center; min-height:26px;}
.tc-nt{flex:none; padding:6px 8px 7px; font-size:10px; line-height:1.3; color:var(--plateInk2);
  background:linear-gradient(180deg,var(--plateB),var(--plateA)); display:none;}
.tc.lg .tc-nm{font-size:16.5px; padding:9px 12px; min-height:0;}
.tc.lg .tc-art{flex:0 0 54%;}
.tc.lg .tc-nt{display:flex; align-items:flex-start; flex:1 1 auto; font-size:12.5px;
  padding:10px 12px 12px;}

/* Rarity gem, bottom right of the art. */
.tc-gem{position:absolute; right:5px; bottom:5px; width:13px; height:13px; z-index:4;
  border-radius:3px; transform:rotate(45deg); border:1px solid rgba(0,0,0,.3);
  background:linear-gradient(140deg,var(--fc),var(--fa)); box-shadow:0 1px 3px rgba(0,0,0,.35);}
.tc.lg .tc-gem{width:20px; height:20px;}
.tc-cnt{position:absolute; left:5px; bottom:5px; z-index:4; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px;
  background:rgba(0,0,0,.5); color:#fff;}

/* Rarity palettes. Steel, blue, amber, gold. */
.tc.r0{--fa:#9AA5A0; --fb:#C9D1CC; --fc:#7E8A85; --pane:#F4F6F3;
  --artA:#E7EBE6; --artB:#CFD6D0; --ink:#2B3531; --plateA:#EDF0EC; --plateB:#DFE4DF;
  --plateInk:#1E2724; --plateInk2:#4E5854;}
.tc.r1{--fa:#3F6BE8; --fb:#8FA9F5; --fc:#2749A8; --pane:#F2F5FE;
  --artA:#DCE5FD; --artB:#B9C9F7; --ink:#16255C; --plateA:#E6ECFE; --plateB:#D3DDFA;
  --plateInk:#16255C; --plateInk2:#41548F;}
.tc.r2{--fa:#D98B2B; --fb:#F2C77A; --fc:#A85F0E; --pane:#FEF7EC;
  --artA:#FBE9CC; --artB:#F3CE9B; --ink:#5A3407; --plateA:#FCEFDA; --plateB:#F7E2C2;
  --plateInk:#5A3407; --plateInk2:#8A6224;}
.tc.r3{--fa:#C8A227; --fb:#FBEC9B; --fc:#8C6A0B; --pane:#FFFBEA;
  --artA:#FCF3CE; --artB:#F0DE94; --ink:#4C3A03; --plateA:#FDF6DB; --plateB:#F8EDBE;
  --plateInk:#4C3A03; --plateInk2:#7A6212;}
.tc.r3 .tc-f{box-shadow:0 0 0 1px #E9CF63, 0 2px 6px rgba(0,0,0,.25), 0 0 22px rgba(226,186,60,.5);}

/* Foil. A conic sheen that moves with the card, on rare and above only. */
.tc-holo{position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.5;
  mix-blend-mode:color-dodge;
  background:conic-gradient(from var(--ang,0deg) at 50% 45%,
    rgba(255,0,128,.34),rgba(255,200,0,.34),rgba(0,255,190,.34),
    rgba(80,120,255,.34),rgba(255,0,128,.34));}
.tc.r3 .tc-holo{opacity:.66;}
.tc-glare{position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 48%,transparent 60%);
  transform:translateX(-130%);}
.tc.sweep .tc-glare{animation:glare 1.1s ease-out .1s 1;}
@keyframes glare{to{transform:translateX(130%);}}

/* The back. Same for every card, so a face-down stack reads as a stack. */
.tc-b{background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 7px,transparent 7px 14px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 7px,transparent 7px 14px),
    linear-gradient(160deg,#1B3A6B,#0C1B33 55%,#16305A);
  border:1px solid rgba(255,255,255,.14);}
.tc-b::after{content:""; position:absolute; inset:9px; border-radius:5px;
  border:1px solid rgba(255,255,255,.22);
  background:radial-gradient(60% 40% at 50% 50%,rgba(255,255,255,.13),transparent 70%);}
.tc-mark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  z-index:2; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; color:rgba(255,255,255,.5);
  font-size:min(9vw,28px); letter-spacing:-.04em;}

/* Locked cards in the binder are backs, not blurred text. You can see the gap. */
.tc.lk .tc-b{opacity:.5;}
.tc.lk{filter:saturate(.5);}

/* ------------------------------------------------------------------ binder */
.binder{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:11px 0 4px;}
@media (min-width:520px){ .binder{grid-template-columns:repeat(4,1fr);} }
.binder .tc{cursor:pointer;}
.binder .tc:active{transform:scale(.96);}

.seth{display:flex; align-items:center; gap:11px; margin:26px 0 2px;}
.seth h2{margin:0; font-size:17px;}
.ring{width:36px; height:36px; flex:none; transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:4;}
.ring .bg{stroke:var(--sunk);}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .6s ease;}
.ring.done .fg{stroke:var(--good);}

/* ------------------------------------------------------------------- packs
   A pack is a foil sachet with a tear strip, not a button with a border. */
.packs{display:flex; gap:11px; justify-content:center; margin:14px 0 6px;}
.packs .pk{flex:1 1 0; max-width:150px; margin:0;}
.pk{position:relative; width:100%; max-width:190px; margin:14px auto 4px; aspect-ratio:3/4;
  border-radius:9px; cursor:pointer; overflow:hidden; border:none; padding:0; display:block;
  background:linear-gradient(150deg,#2A3F86,#5C7BD8 28%,#1B2C63 55%,#4A66C4 78%,#22356F);
  box-shadow:0 6px 20px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.16) inset;
  color:#fff; font-family:"Bricolage Grotesque",sans-serif;}
.pk.big{background:linear-gradient(150deg,#6B4A0E,#E0B54B 28%,#4E360A 55%,#C79A34 78%,#5A3F0C);}
.pk-strip{position:absolute; top:0; left:0; right:0; height:20%;
  border-bottom:2px dashed rgba(255,255,255,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04));}
.pk-body{position:absolute; inset:20% 0 0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px; text-align:center; padding:8px 14px;}
.pk-ttl{font-weight:800; font-size:15px; letter-spacing:-.02em; line-height:1.1;
  text-shadow:0 1px 3px rgba(0,0,0,.4);}
.pk-sub{font-family:"Instrument Sans",sans-serif; font-weight:500; font-size:11px;
  opacity:.85; line-height:1.25;}
#stage .pk{max-width:196px;}
#stage .pk-ttl{font-size:20px;} #stage .pk-sub{font-size:12.5px;}
.pk-n{position:absolute; top:22%; right:9px; font-family:"JetBrains Mono",monospace;
  font-size:11px; font-weight:700; background:rgba(0,0,0,.4); padding:2px 7px; border-radius:20px;}
.pk-sheen{position:absolute; inset:-30% -60%; pointer-events:none;
  background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  animation:pksheen 3.4s ease-in-out infinite;}
@keyframes pksheen{0%{transform:translateX(-60%);}55%,100%{transform:translateX(60%);}}
.pk:active{transform:scale(.975);}
.pk.tear .pk-strip{animation:tear .42s ease-in forwards;}
@keyframes tear{to{transform:translateY(-130%) rotate(-7deg); opacity:0;}}
.pk.tear{animation:pkgo .5s ease-in .18s forwards;}
@keyframes pkgo{to{transform:scale(1.15); opacity:0;}}

/* -------------------------------------------------------------- the stage
   Opening a pack takes over the screen. That is the difference between a
   reward and a list item. */
#stage{position:fixed; inset:0; z-index:120; display:none;
  background:radial-gradient(80% 55% at 50% 38%,#1B2942,#070B12 72%);
  padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  overscroll-behavior:contain;}
#stage.on{display:flex; animation:stagein .28s ease-out both;}
@keyframes stagein{from{opacity:0;}to{opacity:1;}}
#stage .rays{position:absolute; inset:0; pointer-events:none; opacity:0; z-index:0;
  background:conic-gradient(from 0deg at 50% 42%,transparent 0 12deg,rgba(255,255,255,.09) 12deg 18deg,
    transparent 18deg 30deg,rgba(255,255,255,.07) 30deg 34deg,transparent 34deg 60deg);
  animation:spin 26s linear infinite;}
#stage.lit .rays{opacity:1; transition:opacity .5s;}
@keyframes spin{to{transform:rotate(360deg);}}
#stage .step{position:relative; z-index:2; font-family:"JetBrains Mono",monospace; font-size:12px;
  letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.62); min-height:16px;}
#stage .slot{position:relative; z-index:2; width:min(66vw,250px); max-height:56vh; aspect-ratio:5/7;}
#stage .slot .tc{position:absolute; inset:0;}
#stage .under{position:relative; z-index:2; width:min(66vw,250px); display:flex; gap:8px;}
#stage .under button{flex:1; min-height:48px; border-radius:11px; font-weight:600;
  border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.1); color:#fff;}
#stage .under button.pri{background:#fff; color:#0B1220; border-color:#fff;}
#stage .dots{position:relative; z-index:2; display:flex; gap:6px;}
#stage .dots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.24);}
#stage .dots i.on{background:#fff;}
#stage .dots i.hi{background:#F5C451; box-shadow:0 0 8px #F5C451;}

/* The card behind the one you are looking at, so a pack feels like a stack. */
#stage .ghost{position:absolute; inset:0; border-radius:11px; background:linear-gradient(160deg,#1B3A6B,#0C1B33);
  border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 18px rgba(0,0,0,.4);}
#stage .g1{transform:translateY(9px) scale(.965); opacity:.62;}
#stage .g2{transform:translateY(17px) scale(.93); opacity:.34;}

.burst{position:absolute; inset:0; z-index:4; pointer-events:none;}
.burst i{position:absolute; left:50%; top:46%; width:5px; height:5px; border-radius:50%;
  background:#FFD86B; opacity:0; animation:spark .95s ease-out forwards;}
@keyframes spark{
  0%{opacity:1; transform:translate(0,0) scale(1);}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.25);}
}

/* The score, once the last card is over. */
.score{position:relative; z-index:2; text-align:center; color:#fff; animation:rise .5s ease-out both;}
.score .big{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:31px; font-weight:700; letter-spacing:-.02em; color:#8FE3B4;}
.score .sm{font-size:13px; color:rgba(255,255,255,.7); margin-top:3px;}
@keyframes rise{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}

.lvlup{position:relative; z-index:2; font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:20px; color:#F5C451; text-align:center; animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes pop{from{opacity:0; transform:scale(.6);}to{opacity:1; transform:none;}}

/* ---------------------------------------------------------- the objectives
   Three things to do, as three things you tap. A panel with a button inside
   it is a form; the tile itself has to be the target. */
.qhead{display:flex; align-items:center; gap:12px; margin:22px 0 10px;}
.qhead h2{margin:0; flex:1;}
.qpips{display:flex; gap:5px; flex:none;}
.qpips i{width:22px; height:6px; border-radius:3px; background:var(--sunk);
  transition:background .3s ease;}
.qpips i.on{background:var(--good);}
.qpips i.all{background:var(--signal); box-shadow:0 0 9px var(--signal);}

.quests{display:grid; gap:9px;}
.q{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  padding:13px 15px; border-radius:15px; min-height:74px;
  border:1px solid var(--line); background:linear-gradient(150deg,var(--surface),var(--surface-2));
  transition:transform .12s ease, border-color .2s, background .2s;}
.q:active{transform:scale(.985);}
.q .qg{flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; font-size:17px; background:var(--sunk); color:var(--ink-2);
  border:1px solid var(--line); transition:all .2s;}
.q .qt{flex:1; min-width:0;}
.q .qt b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
  font-size:15.5px; letter-spacing:-.01em;}
.q .qt span{display:block; font-size:12.5px; color:var(--ink-3); line-height:1.3; margin-top:1px;}
.q .qn{flex:none; text-align:center; min-width:44px;}
.q .qn b{display:block; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1;}
.q .qn span{display:block; font-size:9px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); margin-top:3px;}
.q.on{border-color:var(--good); background:linear-gradient(150deg,var(--good-soft),var(--surface));}
.q.on .qg{background:var(--good); color:#fff; border-color:var(--good);}
.q.on .qt b{color:var(--good);}
.q.hot .qn b{color:var(--signal);}

/* ------------------------------------------------------------------ freezes
   Five a month, spent by hand. The pips are the point: you can see what is
   left without doing arithmetic, and an empty row is a real feeling. */
.frz{margin:12px 0 0; padding:13px 15px; border-radius:15px;
  border:1px solid var(--line); background:var(--surface);}
.frz.cold{border-color:var(--accent); background:var(--accent-soft);}
.frz .top{display:flex; align-items:center; gap:11px;}
.frz .pips{display:flex; gap:5px; flex:none;}
.frz .pips i{width:13px; height:13px; border-radius:50%; background:var(--sunk);
  border:1px solid var(--line-strong);}
.frz .pips i.on{background:var(--accent); border-color:var(--accent);}
.frz .lbl{flex:1; min-width:0; font-size:13.5px; color:var(--ink-2);}
.frz .lbl b{color:var(--ink);}
.frz .btns{margin-top:10px;}
.frz .btns button{min-height:42px; font-size:14px;}

/* ------------------------------------------------------------------- HUD */
.hud{display:flex; align-items:center; gap:12px; padding:13px 15px; margin:13px 0;
  border-radius:var(--r); border:1px solid var(--line);
  background:linear-gradient(150deg,var(--surface),var(--surface-2));}
.hud .lv{position:relative; width:52px; height:52px; flex:none;}
.hud .lv svg{width:52px; height:52px; transform:rotate(-90deg);}
.hud .lv circle{fill:none; stroke-width:5;}
.hud .lv .bg{stroke:var(--sunk);}
.hud .lv .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .8s ease;}
.hud .lv b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:17px; font-weight:700;}
.hud .who{flex:1; min-width:0;}
.hud .who h3{font-size:16px;}
.hud .who .dim{font-size:12.5px;}
.hud .xp{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:700; font-size:23px; letter-spacing:-.02em; text-align:right; line-height:1.1;}
.hud .xp small{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400;}

/* A toast for the moment the third pillar lands. */
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); z-index:130; opacity:0; pointer-events:none;
  background:var(--good); color:#fff; border-radius:11px; padding:12px 18px;
  font-weight:600; font-size:14.5px; box-shadow:0 6px 22px rgba(0,0,0,.28); max-width:88vw; text-align:center;}
#toast.on{animation:toast 2.8s ease-out both;}
@keyframes toast{
  0%{opacity:0; transform:translateX(-50%) translateY(20px);}
  12%,78%{opacity:1; transform:translateX(-50%) translateY(0);}
  100%{opacity:0; transform:translateX(-50%) translateY(-8px);}
}

/* ------------------------------------------------------------ reward track
   The real-life rewards are the point of the streak, so they get to look like
   prizes rather than list items. */
.flame{display:flex; align-items:center; gap:16px; padding:18px; margin:13px 0; border-radius:18px;
  border:1px solid var(--signal); color:var(--ink);
  background:linear-gradient(150deg,var(--signal-soft),var(--surface) 70%);}
.flame .n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:44px; font-weight:700; letter-spacing:-.04em; line-height:.9; color:var(--signal);}
.flame .n{flex:none; text-align:center;}
.flame .n small{display:block; font-family:"Instrument Sans",sans-serif; font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:500; color:var(--ink-3);
  margin-top:7px; white-space:nowrap;}
.flame p{margin:0; font-size:13.5px; color:var(--ink-2);}

.trk{display:flex; gap:14px; align-items:flex-start; padding:15px; margin:11px 0; border-radius:16px;
  border:1px solid var(--line); background:linear-gradient(150deg,var(--surface),var(--surface-2));}
.trk.won{border-color:var(--good); background:linear-gradient(150deg,var(--good-soft),var(--surface));}
.trk .mdl{position:relative; width:58px; height:58px; flex:none;}
.trk .mdl svg{width:58px; height:58px; transform:rotate(-90deg);}
.trk .mdl circle{fill:none; stroke-width:5;}
.trk .mdl .bg{stroke:var(--sunk);}
.trk .mdl .fg{stroke:var(--signal); stroke-linecap:round; transition:stroke-dasharray .7s ease;}
.trk.won .mdl .fg{stroke:var(--good);}
.trk .mdl b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:700;}
.trk .bd{flex:1; min-width:0;}
.trk .bd .tag{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);}
.trk .bd h3{font-size:16px; margin:2px 0 0;}
.trk .bd .prize{font-size:14px; margin:5px 0 0; color:var(--ink);}
.trk .bd .prize em{font-style:normal; font-weight:600;}
.trk .bd .dim{font-size:12.5px; margin-top:4px;}
.trk .btns{gap:8px; margin-top:11px;}
.trk .btns button{flex:1 1 auto; min-width:0; min-height:40px; font-size:13.5px; padding:8px 12px;}

.medals{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0;}
.md{text-align:center;}
.md .disc{width:100%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:17px; border:2px solid var(--line-strong); background:var(--sunk); color:var(--ink-3);}
.md.got .disc{border-color:#C8A227; color:#5A4506;
  background:radial-gradient(65% 65% at 35% 28%,#FBEC9B,#D9B23C 60%,#B08C1C);
  box-shadow:0 2px 8px rgba(180,140,30,.35);}
.md .lbl{font-size:10.5px; line-height:1.2; margin-top:5px; color:var(--ink-3);}
.md.got .lbl{color:var(--ink-2); font-weight:600;}

/* ---------------------------------------------------------------- the pot
   A real number in real money. It gets the biggest type on the page because
   it is the only thing here you can actually spend. */
.pot{position:relative; overflow:hidden; padding:22px 20px; margin:13px 0; border-radius:20px;
  border:1px solid var(--good); color:var(--ink);
  background:linear-gradient(150deg,var(--good-soft),var(--surface) 72%);}
.pot .amt{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:clamp(40px,12vw,58px); font-weight:700; letter-spacing:-.045em; line-height:1;
  color:var(--good);}
.pot .cap{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin-top:9px;}
.pot p{margin:10px 0 0; font-size:13.5px; color:var(--ink-2);}
.ledger{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:12px; overflow:hidden; margin:12px 0;}
.ledger div{display:flex; justify-content:space-between; gap:12px; padding:10px 13px;
  background:var(--surface); font-size:13.5px;}
.ledger div span:last-child{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:600; flex:none;}
.ledger div.out span:last-child{color:var(--crit);}
.ledger div.tot{background:var(--sunk); font-weight:600;}

/* A locked set is a door. It should look like one. */
.door{display:flex; align-items:center; gap:13px; padding:15px 16px; margin:11px 0;
  border-radius:15px; border:1px dashed var(--line-strong); background:var(--sunk);}
.door .lk{flex:none; width:38px; height:38px; border-radius:11px; display:flex;
  align-items:center; justify-content:center; font-size:16px;
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink-3);}
.door .bd{flex:1; min-width:0;}
.door .bd b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
  font-size:15.5px; color:var(--ink-2);}
.door .bd span{display:block; font-size:12.5px; color:var(--ink-3); line-height:1.3; margin-top:2px;}
.door .at{flex:none; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); text-align:right; max-width:96px; line-height:1.3;}

/* --------------------------------------------------------------- detail */
#sheet{position:fixed; inset:0; z-index:110; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; padding:24px;
  background:rgba(6,10,16,.86); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);}
#sheet.on{display:flex; animation:stagein .2s ease-out both;}
#sheet .slot{width:min(70vw,262px); aspect-ratio:5/7; position:relative;}
#sheet .slot .tc{position:absolute; inset:0;}
#sheet .meta{color:rgba(255,255,255,.72); text-align:center; font-size:13.5px; max-width:280px;}
#sheet button{min-height:46px; padding:0 26px; border-radius:11px; font-weight:600;
  border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.11); color:#fff;}

@media (prefers-reduced-motion:reduce){
  .tc-i,.tc.sweep .tc-glare,.pk-sheen,#stage .rays,.burst i,.score,.lvlup,#toast.on,
  #stage.on,#sheet.on,.pk.tear .pk-strip,.pk.tear{animation:none !important; transition:none !important;}
  #toast.on{opacity:1;}
}
</style>

<script>
"use strict";

/* Daylight.

   A bespoke thing, and the brief was specific: keep me accountable, help me
   plan, help me build a routine, help me make the most of my time - for
   somebody who is an expat on European hours, building a name in prediction
   markets, running a Singapore company that holds his Employment Pass, and
   wanting to give something back.

   So it is built around the one fact that shapes every day: work is fixed to
   head office in Malta, not to where he is standing. Everything else - the threads, the
   countdowns, the place of the day - hangs off that. */

/* The shift is defined in Malta local time, not UTC and not Singapore time.
   Malta observes European daylight saving and Singapore does not, so the same
   contracted hours land an hour later in Singapore every winter - which is a
   thing that happens TO him rather than something anyone decided. */
var HQ_START_LOCAL = 10 * 60, HQ_END_LOCAL = 17 * 60;   /* Malta local */

function lastSunday(y, m){            /* m is 1-12 */
  var d = new Date(Date.UTC(y, m, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
/* EU summer time: last Sunday in March to last Sunday in October, 01:00 UTC. */
function euSummer(when){
  var y = when.getFullYear();
  return when >= lastSunday(y, 3) && when < lastSunday(y, 10);
}
function hqOffset(when){ return euSummer(when || new Date()) ? 120 : 60; }
function workUTC(when){
  var o = hqOffset(when);
  return [HQ_START_LOCAL - o, HQ_END_LOCAL - o];
}

/* [ name, minutes offset from UTC ] */
var CAMPS = [
  ["Singapore", 480], ["Sheffield / UK", 60], ["Bangkok", 420], ["Jakarta", 420],
  ["Hanoi", 420], ["Bali", 480], ["Hong Kong", 480], ["Tokyo", 540],
  ["Sydney", 600], ["Colombo", 330], ["Delhi", 330], ["Dubai", 240], ["Lisbon", 60]
];

/* The six things actually going on. Each has one next action, because a thread
   with three next actions has none.
   [ key, name, why it matters, next action, when, hot ] */
var THREADS = [
  ["oct", "The October ask",
   "You are a supplier renegotiating, not an employee asking. And you will be four days past launching a new event.",
   "Fill in the orange bits of the draft. Event numbers, and what your channel drove.", "Week of 27 Oct", true],
  ["client", "A second client",
   "One customer funds the salary, which holds the pass, which is your permission to live here. There is no floor under it.",
   "Follow up with people you meet at NEXTPredict, in November.", "November", true],
  ["family", "Getting them here",
   "Your brother needs a date to book leave against and to save toward. Neither works without a month.",
   "Pick the month and say it out loud to your mum.", "This week", true],
  ["people", "Knowing anyone here",
   "Zero people you see without your partner arranging it. He feels short of community too, so it is a shared problem.",
   "Text Kelvin. Propose a date rather than asking if he is free.", "Today", true],
  ["write", "Something you own",
   "LinkedIn is rented and shared with a client. A newsletter is not, and the list leaves with you.",
   "Start the nostalgia newsletter. One format, not three.", "After 24 Oct", false],
  ["admin", "The boring load-bearing stuff",
   "It is the evidence file for a 2028 PR application, not housekeeping. And your friend carries the director liability.",
   "Health cover. You hold an EP and have none.", "This week", true]
];

/* Dated things. [ label, ISO date, note ] */
var MILESTONES = [
  ["NEXTPredict", "2026-10-22", "Moderating a panel and running it commercially. Negotiate nothing before this."],
  ["The muzzle lifts", "2026-10-24", "Once Kalshi and Polymarket have been on the stage, you can say what you think."],
  ["The conversation", "2026-10-27", "Scope and rate in one document. The line is: I launched this."],
  ["Mum and your brother", "2027-02-01", "February is the driest month and the first window after the hours change."],
  ["PR window", "2028-01-01", "PTS scheme. One to two years of track record, then six to twelve months to process."]
];

/* The next four months, as actually planned. Some end dates are inferred and
   marked - the point is not precision, it is that this stops living in his head.
   [ label, where, start, end, kind, uk, note ] */
var TRIPS = [
["Stopover", "UK", "2026-09-08", "2026-09-08", "move", 1, "One night. Counts as a UK day."],
["Company retreat", "Bulgaria", "2026-09-09", "2026-09-11", "work", 0, "End date assumed - correct it."],
["Family", "UK", "2026-09-12", "2026-09-23", "family", 1, "The twelve days. This is the one to protect from work."],
["Home", "Singapore", "2026-09-24", "2026-10-09", "home", 0, "TOKEN2049 falls in here. Sixteen days - the longest settled run before January."],
["With your partner", "France", "2026-10-10", "2026-10-16", "leisure", 0, "Yours and his. Not a working trip."],
["Family", "UK", "2026-10-17", "2026-10-21", "family", 1, "A few days and a weekend before New York."],
["NEXTPredict", "New York", "2026-10-22", "2026-10-23", "work", 0, "Moderating, and running it commercially. The muzzle lifts on the 24th."],
["Undecided", "UK or home", "2026-10-24", "2026-11-01", "open", 0, "The open week. See below - this is the decision."],
["Home", "Singapore", "2026-11-02", "2026-12-19", "home", 0, "Seven weeks. The first real stretch of ground since June."],
["Christmas", "UK", "2026-12-20", "2027-01-02", "family", 1, "Fourteen days."]
];

function ukDays(includeOpen){
  var n = 0;
  TRIPS.forEach(function(t){
    if (!t[5] && !(includeOpen && t[4] === "open")) return;
    if (t[4] === "open" && !includeOpen) return;
    var a = new Date(t[2] + "T00:00:00"), b = new Date(t[3] + "T00:00:00");
    n += Math.round((b - a) / 86400000) + 1;
  });
  return n;
}

/* The three things he said he would want to look back on, in his order.
   Building a presence came fourth and is deliberately not here - it lives in
   Next, as a thread, not as something measured daily.
   [ key, label, glyph, what it means ] */
var PILLARS = [
  ["train",  "Trained",     "\u25b2", "Gym, a run, or a long walk. Anything that counts as moving on purpose."],
  ["family", "Family",      "\u25cf", "Spoke to someone at home. A message does not count; a conversation does."],
  ["stop",   "Stopped",     "\u25a0", "Finished when the shift finished. Not burning yourself out is a thing you do, not a mood."]
];

/* Bedtime is the keystone. Wake time follows from it, and everything else
   follows from wake time. He named it himself: "simply just agreeing to go to
   sleep at a certain time." */
var BED_DEFAULT = "23:45";

/* A streak you can break in one bad night is a streak that ends in week two.
   Two freezes a month absorb the ordinary misses without making it meaningless. */
var FREEZES_PER_MONTH = 5;

function pDone(iso, key){
  var d = S.days[iso];
  return !!(d && d.p && d.p[key]);
}
function monthOf(iso){ return iso.slice(0, 7); }

/* The first day this pillar was ever recorded. Nothing before it counts as a
   miss - days before he started using the app are not failures. */
function firstDay(key){
  var ks = Object.keys(S.days).filter(function(k){ return pDone(k, key); }).sort();
  return ks.length ? ks[0] : null;
}

/* Freezes are spent by hand. The earlier version spent them for him the
   moment the streak walker found a gap, which meant they were gone before he
   knew a day had gone wrong - a safety net you cannot feel is not a safety
   net. Now nothing is spent unless he presses the button, and a frozen day is
   a decision with a date on it. */
function frozen(k){ return !!(S.freezes || {})[k]; }
function freezesUsed(month){
  return Object.keys(S.freezes || {}).filter(function(k){ return monthOf(k) === month; }).length;
}
function freezesLeft(month){
  return Math.max(0, FREEZES_PER_MONTH - freezesUsed(month || monthOf(today())));
}

/* A day can be frozen while there is still something to save: not one that is
   already complete, not one that has not happened, and not past the month's
   allowance. */
function canFreeze(k){
  if (k > today() || allThree(k)) return false;
  return frozen(k) || freezesLeft(monthOf(k)) > 0;
}

/* Walk back from today. A frozen day carries the run across without counting
   toward it - the streak survives, but a day he did not do is not a day he
   did. Anything else missed ends it. */
function streak(key){
  var first = firstDay(key);
  if (!first) return 0;
  var n = 0, now = new Date();
  for (var i = 0; i < 400; i++){
    var k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (k < first) break;
    if (pDone(k, key)){ n++; continue; }
    if (k === today()) continue;            /* today is not a miss until it is over */
    if (frozen(k)) continue;                /* spent deliberately, on this date */
    break;
  }
  return n;
}

/* Collectibles. Places are the natural set - he is already logging them, and
   Singapore divides into districts he has mostly never been to. */
function districts(){
  var seen = {}, all = {};
  PLACES.forEach(function(p){ all[p[1]] = (all[p[1]] || 0) + 1; });
  Object.keys(S.done).forEach(function(n){
    var p = PLACES.filter(function(x){ return x[0] === n; })[0];
    if (p) seen[p[1]] = (seen[p[1]] || 0) + 1;
  });
  return { all: all, seen: seen };
}

/* [ threshold, name, what it is for ] */
var BADGES = [
  [3,   "Started",        "train",  "Three sessions. The hardest three."],
  [10,  "Habit",          "train",  "Ten. Past the point most people stop."],
  [30,  "Built",          "train",  "Thirty. This is a body that trains now."],

/* ---------------------------------------------------------------- storage */
var KEY = "daylight.v4";
var S = load();

function load(){
  var d = { camp:"Singapore", wake:"08:30", bed:"23:45", done:{}, skip:{}, filter:0,
            days:{}, threads:{}, cards:{}, rewards:{}, claimed:{}, openedDay:0, openedStreak:0,
            theme:null, mute:false, rate:0, spends:[], freezes:{} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){ var p = JSON.parse(raw); for (var k in d) if (k in p) d[k] = p[k]; }
  } catch(e){}
  return d;
}
function save(){ FD = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* days[iso] = { said: "...", kept: true|false|undefined, ing: {out:1,...} } */
function day(iso){
  var d = S.days[iso];
  if (!d){ d = S.days[iso] = { p:{} }; }
  if (!d.p) d.p = {};
  return d;
}

/* ---------------------------------------------------------------- dates */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return iso(new Date()); }
function shift(n){ var d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
function nice(s){
  var p = s.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + m[Number(p[1])-1];
}
function daysUntil(isoStr){
  var a = new Date(today() + "T00:00:00"), b = new Date(isoStr + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

/* ---------------------------------------------------------------- day shape
   Free morning equals your UTC offset; the evening is what is left of the
   eight hours after it. Flying west trades one for the other, hour for hour. */
function t2m(s){ var p = s.split(":"); return Number(p[0])*60 + Number(p[1]); }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
function offset(){
  for (var i=0;i<CAMPS.length;i++) if (CAMPS[i][0] === S.camp) return CAMPS[i][1];
  return 480;
}
function shape(){
  var off = offset(), wake = t2m(S.wake);
  var w = workUTC(new Date());
  var start = w[0] + off, end = w[1] + off;
  var n = new Date(), nowLocal = n.getHours()*60 + n.getMinutes();
  return {
    start:start, end:end, wake:wake, now:nowLocal,
    startT:hhmm(start), endT:hhmm(end),
    morning:Math.max(0, start - wake),
    evening:Math.max(0, 1380 - end),
    untilWork:start - nowLocal,
    working: nowLocal >= start && nowLocal < end,
    late: end >= 1440
  };
}
function dur(m){
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m/60), r = m%60;
  if (h && r) return h + "h " + r + "m";
  return h ? h + "h" : r + "m";
}

/* ---------------------------------------------------------------- picking */
function seedFor(s){
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(list, seed){
  var a = list.slice(), r = seed;
  for (var i=a.length-1;i>0;i--){
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    var j = r % (i+1);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(){
  var f = S.filter || 0;   /* 0 all, 1 outdoors, 2 hawker */
  var pool = PLACES.filter(function(p){
    if (S.done[p[0]]) return false;
    if (f === 1 && p[3] !== 0) return false;
    if (f === 2 && p[3] !== 2) return false;
    return true;
  });
  if (!pool.length) pool = PLACES.filter(function(p){
    return f === 1 ? p[3] === 0 : f === 2 ? p[3] === 2 : true;
  });
  if (!pool.length) return null;
  var order = shuffled(pool, seedFor(today()));
  return order[(S.skip[today()] || 0) % order.length];
}

/* ---------------------------------------------------------------- helpers */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function maps(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Singapore");
}
/* Not a difficulty ladder. What kind of place it is, so you know what you are
   walking into - which is information, not a warning. */
var KIND = [["e","Outdoors"],["m","Counter service"],["l","Hawker stall"]];

var PACK_SIZE = 3, STREAK_PACK_SIZE = 5;

function allThree(iso){
  return PILLARS.every(function(g){ return pDone(iso, g[0]); });
}

/* Recomputed from the record rather than incremented, so it cannot drift.
   Full days earn standard packs; every seventh consecutive one earns a streak
   pack, which is bigger and pulls better. */
function packCounts(){
  var full = Object.keys(S.days).filter(allThree).sort();
  var streakPacks = 0, run = 0, prev = null;
  full.forEach(function(k){
    if (prev){
      var gap = Math.round((new Date(k) - new Date(prev)) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else run = 1;
    if (run % 7 === 0) streakPacks++;
    prev = k;
  });
  return { day: full.length, streak: streakPacks };
}
function packsWaiting(){
  var e = packCounts();
  return { day: Math.max(0, e.day - (S.openedDay || 0)),
           streak: Math.max(0, e.streak - (S.openedStreak || 0)) };
}

function rollRarity(r, boosted){
  var w = boosted ? [40, 36, 24, 0] : [RARITY[0][2], RARITY[1][2], RARITY[2][2], 0];
  var total = w[0] + w[1] + w[2], x = r * total;
  if (x < w[0]) return 0;
  if (x < w[0] + w[1]) return 1;
  return 2;
}

/* Pulls prefer cards not yet held, so a pack usually closes a gap rather than
   handing him a fourth kopi-o. */
/* Gold is earned by hand and locked sets are not yours yet, so neither can
   turn up in a pack. Pulling a card for a set you cannot see is a bug that
   looks like a feature until you try to find it. */
function inPool(c){ return c[2] !== "gold" && setOpen(c[2]); }

function openPack(kind){
  var size = kind === "streak" ? STREAK_PACK_SIZE : PACK_SIZE;
  var boosted = kind === "streak";
  var got = [], seed = (Date.now() ^ (Math.random() * 4294967296)) >>> 0;
  for (var n = 0; n < size; n++){
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var rar = rollRarity(((seed >>> 8) & 0xffff) / 65536, boosted);
    var tier = CARDS.filter(function(c){ return c[1] === rar && inPool(c); });
    if (!tier.length) tier = CARDS.filter(function(c){ return c[1] === 0 && inPool(c); });
    if (!tier.length) tier = CARDS.filter(inPool);
    if (!tier.length) break;
    var fresh = tier.filter(function(c){ return !(S.cards || {})[c[0]] && got.indexOf(c[0]) < 0; });
    var from = fresh.length ? fresh : tier.filter(function(c){ return got.indexOf(c[0]) < 0; });
    if (!from.length) from = tier;
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var card = from[seed % from.length];
    got.push(card[0]);
    S.cards = S.cards || {};
    S.cards[card[0]] = (S.cards[card[0]] || 0) + 1;
  }
  if (kind === "streak") S.openedStreak = (S.openedStreak || 0) + 1;
  else S.openedDay = (S.openedDay || 0) + 1;
  save();
  return got;
}
function heldCount(){ return Object.keys(S.cards || {}).length; }

var REWARD_TIERS = [
  [7,   "Weekly",    "Something small. A coffee somewhere new, a book."],
  [30,  "Monthly",   "Something that costs a bit. A meal out, a massage, a day trip."],
  [90,  "Quarterly", "Something you would otherwise talk yourself out of."]
];
function bestStreak(){
  return Math.max.apply(null, PILLARS.map(function(g){ return streak(g[0]); }));
}

/* ---------------------------------------------------------------- progression
   A game is sticky when there is always something you are close to. So: sets
   you can be one card from finishing, a level that always has a next one, and
   two kinds of pack so a streak feels different from a good day. */

function setCards(key){ return CARDS.filter(function(c){ return c[2] === key; }); }
function setHeld(key){
  return setCards(key).filter(function(c){ return (S.cards || {})[c[0]]; }).length;
}
function setsComplete(){
  return SETS.filter(function(s){ return setHeld(s[0]) === setCards(s[0]).length; }).length;
}

function xp(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){ if (held[c[0]]) n += RARITY[c[1]][3]; });
  Object.keys(S.days).forEach(function(k){ if (allThree(k)) n += 15; });
  n += Object.keys(S.done || {}).length * 20;
  n += setsComplete() * 100;
  return n;
}

/* ------------------------------------------------------------------- the pot
   His idea, and a better one than XP: a number in real money that builds while
   you are consistent and goes down when you spend it on yourself. XP is a score
   you cannot do anything with. This one buys a coffee.

   He sets the rate, because a rate the app picked would be the app deciding
   what his consistency is worth. Everything else is a multiple of it, so the
   whole economy moves when he changes one number. */
var RATE_DEFAULT = 5;
function rate(){ var r = Number(S.rate); return r > 0 ? r : RATE_DEFAULT; }

function potEarned(){
  var r = rate(), pc = packCounts();
  return {
    days:     pc.day * r,           /* every full day */
    streaks:  pc.streak * r * 2,    /* every seventh consecutive one, again */
    sets:     setsComplete() * r * 3,
    trophies: goldHeld() * r * 5
  };
}
function goldHeld(){
  return CARDS.filter(function(c){ return c[1] === 3 && (S.cards || {})[c[0]]; }).length;
}
function potSpent(){
  return (S.spends || []).reduce(function(a, s){ return a + Number(s[1] || 0); }, 0);
}
function potTotal(){
  var e = potEarned();
  return e.days + e.streaks + e.sets + e.trophies;
}
function pot(){ return potTotal() - potSpent(); }
function money(n){
  return "$" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "");
}

/* Ranks rather than bare numbers - a level should say something about you. */
var RANKS = [
  [0,     "Just landed"],
  [150,   "Two months in"],
  [450,   "Finding your way"],
  [950,   "Regular"],
  [1700,  "Local-ish"],
  [2800,  "Knows a guy"],
  [4200,  "Gives directions"],
  [6200,  "Been here years"],
  [9000,  "Institution"]
];
function rank(){
  var x = xp(), i = 0;
  for (var j = 0; j < RANKS.length; j++) if (x >= RANKS[j][0]) i = j;
  var next = RANKS[i + 1] || null;
  return { level: i + 1, name: RANKS[i][1], xp: x,
           from: RANKS[i][0], to: next ? next[0] : null, nextName: next ? next[1] : null };
}

/* The nearest set to finishing. This is the hook - "one more card" is a much
   better prompt than "collect them all". */
function nearestSet(){
  var best = null;
  SETS.forEach(function(s){
    if (s[0] === "gold" || !setOpen(s[0])) return;
    var total = setCards(s[0]).length, have = setHeld(s[0]);
    if (have === total || have === 0) return;
    var left = total - have;
    if (!best || left < best.left) best = { set: s, left: left, have: have, total: total };
  });
  return best;
}

/* =================================================================== the game
   Art, sound, and a pack opening that takes over the screen. Everything here
   exists because a card you cannot turn over is a paragraph with a border. */

function hashOf(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}

/* Behind every emblem sits one of eight backdrops, picked by the card's name.
   Without this a set of eleven hawker cards is eleven identical bowls, and a
   collection where everything looks the same is not worth collecting. */
/* Shifts are unsigned. hashOf returns a full uint32, and a signed >> on
   anything with the top bit set goes negative - which quietly put half the
   deck's artwork off-card, at 0.65 scale and 18 degrees off true. */
function backdrop(h){
  var kind = h % 8, o = "<g opacity='.17' stroke='currentColor' fill='none' stroke-width='1.4'>", i, j;
  if (kind === 0){
    for (i = 1; i <= 6; i++) o += "<circle cx='50' cy='50' r='" + (i * 9 + (h % 5)) + "'/>";
  } else if (kind === 1){
    for (i = -4; i < 12; i++) o += "<path d='M" + (i * 13) + " 0 L" + (i * 13 + 60) + " 100'/>";
  } else if (kind === 2){
    for (i = 0; i < 8; i++) for (j = 0; j < 8; j++)
      o += "<circle cx='" + (7 + i * 12.5) + "' cy='" + (7 + j * 12.5) + "' r='1.7' fill='currentColor' stroke='none'/>";
  } else if (kind === 3){
    for (i = 0; i < 26; i++)
      o += "<circle cx='" + ((h >>> (i % 12)) % 100) + "' cy='" + ((h >>> ((i + 5) % 13)) % 100)
         + "' r='" + (1 + (i % 4)) + "' fill='currentColor' stroke='none'/>";
  } else if (kind === 4){
    for (i = 0; i < 8; i++) o += "<path d='M0 " + (i * 15 - 6) + " L50 " + (i * 15 + 6) + " L100 " + (i * 15 - 6) + "'/>";
  } else if (kind === 5){
    for (i = -3; i < 10; i++){
      o += "<path d='M" + (i * 14) + " 0 L" + (i * 14 + 100) + " 100'/>";
      o += "<path d='M" + (i * 14) + " 100 L" + (i * 14 + 100) + " 0'/>";
    }
  } else if (kind === 6){
    for (i = 0; i < 16; i++){
      var a = i * 22.5 * Math.PI / 180;
      o += "<path d='M50 50 L" + (50 + Math.cos(a) * 78).toFixed(1) + " "
         + (50 + Math.sin(a) * 78).toFixed(1) + "'/>";
    }
  } else {
    for (i = 0; i < 7; i++)
      o += "<path d='M-10 " + (100 - i * 15) + " q60 -" + (26 + i * 3) + " 120 0'/>";
  }
  return o + "</g>";
}

/* Each set has its own emblem, varied per card by its name, so no two faces
   are identical and every card still reads as belonging somewhere. */
function cardArt(c){
  var h = hashOf(c[0]), k = c[2];
  var a = h % 97, b = (h >>> 7) % 89, d = (h >>> 13) % 73;
  var o = "<svg viewBox='0 0 100 100' preserveAspectRatio='xMidYMid meet' aria-hidden='true'>";
  o += backdrop(h);
  var tx = ((h >>> 3) % 11) - 5, ty = ((h >>> 9) % 11) - 5;
  var rot = ((h >>> 17) % 13) - 6, sc = (0.82 + ((h >>> 21) % 18) / 100).toFixed(2);
  o += "<g transform='translate(" + (50 + tx) + " " + (50 + ty) + ") rotate(" + rot
     + ") scale(" + sc + ") translate(-50 -50)'>";
  var S1 = "stroke='currentColor' fill='none' stroke-linecap='round' stroke-linejoin='round'";

    o += "<path " + S1 + " stroke-width='2.4' opacity='.85' d='M16 58 Q50 " + (86 + a % 7) + " 84 58 Z'/>";
    o += "<path " + S1 + " stroke-width='1.8' opacity='.5' d='M16 58 h68'/>";
    for (i = 0; i < 3; i++){
      x = 34 + i * 16;
      o += "<path " + S1 + " stroke-width='1.9' opacity='" + (.5 - i * .08) + "' d='M" + x + " 44 q" +
        (6 - (a + i * 5) % 11) + " -8 0 -15 q" + ((b + i * 7) % 11 - 5) + " -7 0 -13'/>";
    }
  } else if (k === "kopi"){
    o += "<circle " + S1 + " stroke-width='2.4' opacity='.8' cx='50' cy='52' r='" + (25 + a % 5) + "'/>";
    o += "<circle " + S1 + " stroke-width='1.5' opacity='.5' cx='50' cy='52' r='" + (17 + b % 5) + "'/>";
    o += "<circle " + S1 + " stroke-width='1.1' opacity='.32' cx='" + (26 + a % 9) + "' cy='" +
      (24 + b % 9) + "' r='" + (8 + d % 6) + "'/>";
    o += "<path " + S1 + " stroke-width='2' opacity='.55' d='M75 44 q11 3 11 11 t-11 11'/>";
  } else if (k === "slang"){
    o += "<rect " + S1 + " stroke-width='2.3' opacity='.8' x='14' y='22' rx='9' width='" +
      (52 + a % 14) + "' height='30'/>";
    o += "<path " + S1 + " stroke-width='2.3' opacity='.8' d='M26 52 l-3 12 l13 -12'/>";
    o += "<rect " + S1 + " stroke-width='1.8' opacity='.42' x='" + (34 + b % 10) +
      "' y='62' rx='7' width='" + (38 + d % 12) + "' height='22'/>";
  } else if (k === "every"){
    for (i = 0; i < 20; i++){
      x = 20 + (i % 5) * 14; y = 24 + Math.floor(i / 5) * 14;
      var lit = ((h >>> i) & 1) === 1;
      o += "<rect x='" + x + "' y='" + y + "' width='9' height='10' rx='1.5' " +
        (lit ? "fill='currentColor' opacity='.42'" : "fill='none' stroke='currentColor' stroke-width='1.3' opacity='.4'") + "/>";
    }
  } else if (k === "herit"){
    for (i = 0; i < 3; i++){
      x = 20 + i * 22;
      o += "<path " + S1 + " stroke-width='2.1' opacity='.75' d='M" + x + " 74 v-22 a10 10 0 0 1 20 0 v22'/>";
    }
    o += "<path " + S1 + " stroke-width='2.4' opacity='.85' d='M12 74 h76'/>";
    o += "<path " + S1 + " stroke-width='2' opacity='.55' d='M14 34 l36 -" + (14 + a % 8) + " l36 " + (14 + a % 8) + "'/>";
  } else if (k === "green"){
    for (i = 0; i < 5; i++){
      x = 22 + ((h >>> (i * 3)) % 56); y = 30 + ((h >>> (i * 5)) % 42);
      o += "<path " + S1 + " stroke-width='1.9' opacity='" + (.34 + (i % 3) * .14) +
        "' d='M" + x + " " + y + " q" + (9 + i) + " -" + (13 + i * 2) + " " + (18 + i * 2) + " 0 q-" +
        (9 + i) + " " + (13 + i * 2) + " -" + (18 + i * 2) + " 0 Z'/>";
    }
  } else if (k === "isles"){
    o += "<path " + S1 + " stroke-width='2.2' opacity='.7' d='M22 44 q10 -12 22 -4 q11 7 26 1 q8 -3 10 5 l-2 16 h-56 Z'/>";
    for (i = 0; i < 4; i++){
      y = 68 + i * 8;
      o += "<path " + S1 + " stroke-width='1.7' opacity='" + (.5 - i * .09) + "' d='M8 " + y + " q11 -5 22 0 t22 0 t22 0 t22 0'/>";
    }
  } else if (k === "region"){
    o += "<path " + S1 + " stroke-width='1.9' opacity='.55' stroke-dasharray='4 5' d='M16 74 Q50 " +
      (14 + a % 14) + " 84 44'/>";
    o += "<circle cx='16' cy='74' r='4' fill='currentColor' opacity='.7'/>";

    o += "<circle " + S1 + " stroke-width='1.4' opacity='.3' cx='50' cy='52' r='" + (30 + b % 7) + "'/>";
  } else if (k === "road"){
    var px = 14, py = 78, path = "M14 78";
    for (i = 0; i < 4; i++){
      px = 14 + (i + 1) * 18; py = 78 - (i + 1) * 12 + ((h >>> (i * 4)) % 13) - 6;
      path += " L" + px + " " + py;
    }
    o += "<path " + S1 + " stroke-width='2.3' opacity='.7' d='" + path + "'/>";

/* A card. Face up or face down, small in the binder or large on the stage. */
function tcard(c, count, opts){
  opts = opts || {};
  var r = c[1];
  var cls = "tc r" + r + (opts.down ? " down" : "") + (count ? "" : " lk")
          + (opts.lg ? " lg" : "") + (opts.extra || "");
  var h = "<div class='" + cls + "'" + (opts.attr || "") + ">";
  h += "<div class='tc-i'>";
  h += "<div class='tc-f'><div class='tc-pane'>";
  h += "<div class='tc-nm'>" + esc(c[0]) + "</div>";
  h += "<div class='tc-art'>" + cardArt(c);
  if (r >= 2) h += "<div class='tc-holo'></div>";
  if (count > 1) h += "<span class='tc-cnt'>x" + count + "</span>";
  h += "<div class='tc-gem'></div></div>";
  h += "<div class='tc-nt'>" + esc(c[3]) + "</div>";
  h += "<div class='tc-glare'></div>";
  h += "</div></div>";
  h += "<div class='tc-b'><div class='tc-mark'>D</div></div>";
  h += "</div></div>";
  return h;
}

/* ------------------------------------------------------------------ sound
   Synthesised, so there are no files to load and nothing to go missing. It
   only ever starts on a tap, which is also the only way iOS allows it. */
var AC = null;
function actx(){
  if (S.mute) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e){ return null; }
  return AC;
}
function tone(f, t0, dur, type, vol, to){
  var a = actx(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), n = a.currentTime + t0;
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, n);
  if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
  g.gain.setValueAtTime(0.0001, n);
  g.gain.exponentialRampToValueAtTime(vol || .16, n + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g); g.connect(a.destination);
  o.start(n); o.stop(n + dur + .02);
}
function hiss(t0, dur, vol, f0, f1){
  var a = actx(); if (!a) return;
  var len = Math.floor(a.sampleRate * dur);
  var buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = a.createBufferSource(); src.buffer = buf;
  var flt = a.createBiquadFilter(); flt.type = "bandpass";
  var n = a.currentTime + t0;
  flt.frequency.setValueAtTime(f0 || 900, n);
  flt.frequency.exponentialRampToValueAtTime(f1 || 2600, n + dur);
  var g = a.createGain(); g.gain.setValueAtTime(vol || .14, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  src.connect(flt); flt.connect(g); g.connect(a.destination);
  src.start(n); src.stop(n + dur);
}
function sfx(name){
  if (S.mute) return;
  if (name === "tap")   { tone(620, 0, .05, "square", .07); }
  if (name === "tear")  { hiss(0, .42, .2, 500, 3400); tone(150, .02, .3, "sawtooth", .07, 70); }
  if (name === "flip")  { hiss(0, .1, .09, 1600, 500); tone(340, 0, .1, "triangle", .1, 560); }
  if (name === "rare")  { [523, 659, 784].forEach(function(f, i){ tone(f, i * .07, .34, "triangle", .13); }); }
  if (name === "gold")  { [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * .075, .5, "triangle", .15); });
                          hiss(.1, .5, .07, 3000, 7000); }
  if (name === "level") { [392, 523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * .085, .42, "sine", .14); }); }
  if (name === "done")  { tone(587, 0, .16, "sine", .11); tone(784, .09, .26, "sine", .11); }
}
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e){} }
function toast(msg){
  var el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("on");
  void el.offsetWidth;               /* restart the animation */
  el.classList.add("on");
}
function reduced(){
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e){ return false; }
}

/* -------------------------------------------------------------- the stage */
var ST = null;

function stageEl(){ return document.getElementById("stage"); }

function openStage(kind){
  var before = rank().level;
  var got = openPack(kind);
  ST = { cards: got, i: 0, kind: kind, lvlBefore: before, turned: 0 };
  var el = stageEl();
  el.innerHTML =
      "<div class='rays'></div>"
    + "<div class='step' id='stStep'>Tap to open</div>"
    + "<button class='pk" + (kind === "streak" ? " big" : "") + "' id='stPack'>"
    +   "<span class='pk-sheen'></span><span class='pk-strip'></span>"
    +   "<span class='pk-body'><span class='pk-ttl'>"
    +     (kind === "streak" ? "Streak Pack" : "Day Pack") + "</span>"
    +   "<span class='pk-sub'>" + got.length + " cards</span></span>"
    + "</button>"
    + "<div class='under' style='visibility:hidden'></div>";
  el.className = "on";
  document.body.style.overflow = "hidden";
  document.getElementById("stPack").addEventListener("click", tearPack, { once: true });
}

function tearPack(){
  var pk = document.getElementById("stPack");
  sfx("tear"); buzz([12, 30, 18]);
  pk.classList.add("tear");
  stageEl().classList.add("lit");
  setTimeout(showSlot, reduced() ? 0 : 560);
}

function showSlot(){
  var el = stageEl(), left = ST.cards.length - ST.i;
  var dots = "";
  for (var i = 0; i < ST.cards.length; i++){
    var c = CARDS.filter(function(x){ return x[0] === ST.cards[i]; })[0];
    var seen = i < ST.i;
    dots += "<i class='" + (seen ? (c && c[1] >= 2 ? "on hi" : "on") : "") + "' data-dot='" + i + "'></i>";
  }
  el.innerHTML =
      "<div class='rays'></div>"
    + "<div class='step' id='stStep'>Tap to turn over &middot; " + (ST.i + 1)
    +   " of " + ST.cards.length + "</div>"
    + "<div class='slot' id='stSlot'>"
    +   (left > 2 ? "<div class='ghost g2'></div>" : "")
    +   (left > 1 ? "<div class='ghost g1'></div>" : "")
    + "</div>"
    + "<div class='dots'>" + dots + "</div>"
    + "<div class='under' id='stUnder' style='visibility:hidden'>"
    +   "<button id='stNext'>Next</button></div>";
  el.className = "on lit";

  var c = CARDS.filter(function(x){ return x[0] === ST.cards[ST.i]; })[0];
  var slot = document.getElementById("stSlot");
  slot.insertAdjacentHTML("beforeend", tcard(c, S.cards[c[0]], { down: true, lg: true }));
  var tc = slot.querySelector(".tc");
  tc.addEventListener("click", function(){ turnCard(tc, c); }, { once: true });
  tilt(tc);
}

function turnCard(tc, c){
  tc.classList.remove("down");
  sfx("flip"); buzz(14);
  var delay = reduced() ? 0 : 340;
  setTimeout(function(){
    if (c[1] >= 2){
      tc.classList.add("sweep");
      sparks(tc, c[1] === 3 ? 22 : 14);
      sfx(c[1] === 3 ? "gold" : "rare");
      buzz([20, 45, 25, 45, 40]);
    }
    var st = document.getElementById("stStep");
    if (st) st.textContent = RARITY[c[1]][0] + (S.cards[c[0]] > 1 ? " \u00b7 spare" : " \u00b7 new");
    var dot = document.querySelector("[data-dot='" + ST.i + "']");
    if (dot) dot.className = c[1] >= 2 ? "on hi" : "on";
    var u = document.getElementById("stUnder");
    if (u){
      u.style.visibility = "visible";
      var b = document.getElementById("stNext");
      var last = ST.i >= ST.cards.length - 1;
      b.textContent = last ? "Done" : "Next";
      if (last) b.className = "pri";
      b.onclick = function(){
        sfx("tap");
        if (last) showScore(); else { ST.i++; showSlot(); }
      };
    }
  }, delay);
}

function sparks(host, n){
  if (reduced()) return;
  var b = document.createElement("div");
  b.className = "burst";
  var h = "";
  for (var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2 + Math.random();
    var d = 70 + Math.random() * 90;
    h += "<i style='--dx:" + (Math.cos(a) * d).toFixed(0) + "px;--dy:"
       + (Math.sin(a) * d).toFixed(0) + "px;animation-delay:" + (i * 14) + "ms'></i>";
  }
  b.innerHTML = h;
  host.appendChild(b);
  setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1300);
}

/* Touch the card and the foil moves. Rare cards should reward being looked at. */
function tilt(tc){
  if (reduced()) return;
  function at(ev){
    var t = (ev.touches && ev.touches[0]) || ev;
    var r = tc.getBoundingClientRect();
    var x = (t.clientX - r.left) / r.width - .5, y = (t.clientY - r.top) / r.height - .5;
    var inner = tc.querySelector(".tc-i");
    if (inner && !tc.classList.contains("down")){
      inner.style.transform = "rotateY(" + (x * 17).toFixed(1) + "deg) rotateX("
        + (-y * 17).toFixed(1) + "deg)";
    }
    tc.style.setProperty("--ang", ((x + .5) * 340).toFixed(0) + "deg");
  }
  function off(){
    var inner = tc.querySelector(".tc-i");
    if (inner && !tc.classList.contains("down")) inner.style.transform = "";
  }
  tc.addEventListener("touchmove", function(e){ at(e); }, { passive: true });
  tc.addEventListener("touchend", off);
  tc.addEventListener("mousemove", at);
  tc.addEventListener("mouseleave", off);
}

function showScore(){
  var el = stageEl(), fresh = 0, gain = 0;
  ST.cards.forEach(function(n){
    var c = CARDS.filter(function(x){ return x[0] === n; })[0];
    if (!c) return;
    gain += RARITY[c[1]][3];
    if (S.cards[n] === 1) fresh++;
  });
  var spare = ST.cards.length - fresh;
  var r = rank(), levelled = r.level > ST.lvlBefore;
  var w = packsWaiting(), more = w.day + w.streak;

  el.innerHTML =
      "<div class='rays'></div>"
    + (levelled ? "<div class='lvlup'>Level " + r.level + " &middot; " + esc(r.name) + "</div>" : "")
    + "<div class='score'><div class='big'>+" + gain + " XP</div>"
    +   "<div class='sm'>" + fresh + " new" + (spare ? " &middot; " + spare + " spare" : "")
    +   " &middot; " + heldCount() + " of " + CARDS.length + " held</div></div>"
    + "<div class='under'>"
    +   (more ? "<button id='stMore'>Open another</button>" : "")
    +   "<button class='pri' id='stDone'>Done</button></div>";
  el.className = "on lit";
  sfx(levelled ? "level" : "done");
  buzz(levelled ? [30, 60, 30, 60, 60] : 20);
  document.getElementById("stDone").onclick = closeStage;
  var m = document.getElementById("stMore");
  if (m) m.onclick = function(){
    sfx("tap");
    openStage(packsWaiting().streak ? "streak" : "day");
  };
}

function closeStage(){
  sfx("tap");
  var el = stageEl();
  el.className = "";
  el.innerHTML = "";
  document.body.style.overflow = "";
  ST = null;
  render();
}

/* -------------------------------------------------------------- card detail
   Tapping a card in the binder should show you the card, not a tooltip. */
function openSheet(name){
  var c = CARDS.filter(function(x){ return x[0] === name; })[0];
  if (!c) return;
  var held = (S.cards || {})[name];
  var st = SETS.filter(function(s){ return s[0] === c[2]; })[0];
  var el = document.getElementById("sheet");
  el.innerHTML = "<div class='slot' id='shSlot'></div>"
    + "<div class='meta'>" + (held
        ? esc(st ? st[1] : "") + " &middot; " + RARITY[c[1]][0] + (held > 1 ? " &middot; " + held + " copies" : "")
        : "Not found yet &middot; " + esc(st ? st[1] : "")) + "</div>"
    + "<button id='shClose'>Close</button>";
  el.className = "on";
  document.getElementById("shSlot").innerHTML = tcard(c, held, { lg: true, down: !held });
  var tc = el.querySelector(".tc");
  if (held) tilt(tc);
  sfx("tap");
  document.getElementById("shClose").onclick = closeSheet;
  el.onclick = function(ev){ if (ev.target === el) closeSheet(); };
}
function closeSheet(){
  var el = document.getElementById("sheet");
  el.className = ""; el.innerHTML = "";
}

/* Trophies are not pulled, they are earned - but the moment should look the
   same, or claiming one feels like ticking a box. */
function claimTrophy(name){
  var before = rank().level;
  S.cards = S.cards || {};
  S.cards[name] = 1;
  save();
  ST = { cards: [name], i: 0, kind: "gold", lvlBefore: before, turned: 0 };
  var el = stageEl();
  el.className = "on lit";
  el.innerHTML = "";
  document.body.style.overflow = "hidden";
  showSlot();
}

function ring(have, total){
  var C = 2 * Math.PI * 15, k = total ? have / total : 0;
  return "<svg class='ring" + (k === 1 ? " done" : "") + "' viewBox='0 0 34 34' aria-hidden='true'>"
    + "<circle class='bg' cx='17' cy='17' r='15'></circle>"
    + "<circle class='fg' cx='17' cy='17' r='15' stroke-dasharray='" + (C * k).toFixed(1) + " " + C.toFixed(1) + "'></circle>"
    + "</svg>";
}

/* ---------------------------------------------------------------- the bar */
function barHTML(){
  /* The bar always runs wake to midnight, so the proportions mean something.
     Opening it at 3am should not put the night inside the free segment. */
  var s = shape(), from = s.wake, to = 1440;
  var span = to - from;
  function pct(a, b){ return Math.max(0, Math.min(100, ((b - a) / span) * 100)); }
  var freeW = pct(from, Math.min(s.start, to));
  var workW = pct(Math.max(s.start, from), Math.min(s.end, to));
  var restW = Math.max(0, 100 - freeW - workW);
  var inDay = s.now >= from && s.now <= to;
  var nowPos = pct(from, s.now);

  var h = "<div class='bar' style='position:relative'>";
  if (inDay) h += "<div class='now' style='position:absolute;top:0;bottom:0;left:" + nowPos.toFixed(2) + "%'></div>";
  if (freeW > 0.5) h += "<div class='free' style='width:" + freeW.toFixed(2) + "%;display:flex;align-items:center;justify-content:center'>"
    + (freeW > 16 ? "<span class='free'>Yours</span>" : "") + "</div>";
  if (workW > 0.5) h += "<div class='work' style='width:" + workW.toFixed(2) + "%;display:flex;align-items:center;justify-content:center'>"
    + (workW > 16 ? "<span class='work'>Malta</span>" : "") + "</div>";
  if (restW > 0.5) h += "<div class='rest' style='width:" + restW.toFixed(2) + "%'></div>";
  h += "</div>";
  h += "<div class='legend'><span>" + hhmm(from) + "</span><span class='mono'>" + s.startT
    + " &ndash; " + s.endT + "</span><span>24:00</span></div>";
  return h;
}

/* ---------------------------------------------------------------- today */
function viewToday(){
  var s = shape(), t = today(), d = day(t), y = day(shift(-1));
  var h = "";

  /* The day, with the shift drawn as it actually is - not a solid block. */
  h += "<div class='card'>";
  h += barHTML();
  if (s.working){
    h += "<p class='muted' style='margin:10px 0 0'>On shift until <strong>" + s.endT + "</strong>. "
      + (s.evening > 0 ? dur(s.evening) + " of evening after it." : "No evening after it &mdash; which is what October is for.") + "</p>";
  } else if (s.now < s.wake){
    h += "<p class='muted' style='margin:10px 0 0'>Early. The free window runs <strong>" + S.wake
      + " to " + s.startT + "</strong> &mdash; " + dur(s.morning) + ".</p>";
  } else if (s.untilWork > 0){
    h += "<p class='muted' style='margin:10px 0 0'><strong>" + dur(s.untilWork) + "</strong> before HQ starts, "
      + "out of a window that is " + dur(s.morning) + " long.</p>";
  } else {
    h += "<p class='muted' style='margin:10px 0 0'>Shift is done.</p>";
  }

  /* The gap. He already runs in these; the app was blind to them. */
  if (d.gap){
    h += "<div class='row'><b>Gap</b><div><strong>" + esc(d.gap) + "</strong> free inside the shift. "
      + "That is a run, or a walk, or lunch somewhere that is not your desk."
      + " <button data-gap='clear' style='min-height:32px;padding:4px 10px;font-size:13px'>Clear</button></div></div>";
  } else {
    h += "<div class='row'><b>Gap</b><div>Where is today's hole in the calendar? "
      + "<input type='text' id='gap' placeholder='13:00-14:30' style='margin-top:6px'>"
      + "<div class='btns'><button data-gap='set'>Set it</button></div></div></div>";
  }

  var summer = euSummer(new Date());
  var alt = (function(){
    var o = summer ? 60 : 120, camp = offset();
    return hhmm(HQ_START_LOCAL - o + camp) + "-" + hhmm(HQ_END_LOCAL - o + camp);
  })();
  h += "<div class='row'><b>HQ</b><div>Malta, " + hhmm(HQ_START_LOCAL) + "-" + hhmm(HQ_END_LOCAL)
    + " their time &middot; currently " + (summer ? "CEST" : "CET") + ".<br><span class='dim'>"
    + (summer ? "From 25 October the same hours become " : "In summer the same hours become ")
    + alt + " here.</span></div></div>";
