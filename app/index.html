<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daylight</title>
<meta name="description" content="A day fixed to head office, lived in Singapore.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daylight">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EDEFEC; --surface:#FBFCFA; --surface-2:#E4E8E3; --sunk:#E0E4DF;
  --line:#D4D9D3; --line-strong:#B7BFB9;
  --ink:#141B18; --ink-2:#4A5551; --ink-3:#79847F;
  --accent:#1F4FE0; --accent-soft:#DDE4FB;
  --signal:#B35C0C; --signal-soft:#F7E6D4;
  --crit:#A03830; --crit-soft:#F3DEDC;
  --good:#2C7A51; --good-soft:#DCEDE3;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
    --line:#293430; --line-strong:#3C4945;
    --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
    --accent:#7C9BFF; --accent-soft:#1C2647;
    --signal:#E09453; --signal-soft:#2E2317;
    --crit:#E08A82; --crit-soft:#2C1C1C;
    --good:#5CB585; --good-soft:#16261D;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
  --line:#293430; --line-strong:#3C4945;
  --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
  --accent:#7C9BFF; --accent-soft:#1C2647;
  --signal:#E09453; --signal-soft:#2E2317;
  --crit:#E08A82; --crit-soft:#2C1C1C;
  --good:#5CB585; --good-soft:#16261D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.wrap{max-width:620px; margin:0 auto;
  padding:18px max(16px, env(safe-area-inset-left)) 26px max(16px, env(safe-area-inset-right));}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.02em;}
h1{font-size:clamp(25px,6.2vw,32px); font-weight:800; line-height:1.1;}
h2{font-size:18px; font-weight:600; margin:24px 0 6px;}
h3{font-size:15px; font-weight:600; margin:0;}
p{margin:9px 0;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);}
.mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-2);} .dim{color:var(--ink-3); font-size:14px;}
strong{font-weight:600;} a{color:var(--accent);}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px;}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 17px; margin:13px 0;}
.card.tip{background:var(--signal-soft); border-color:var(--signal);}
.card.ok{background:var(--good-soft); border-color:var(--good);}
.card.hot{background:var(--crit-soft); border-color:var(--crit);}

/* The shift bar. The single most bespoke thing here: a day fixed to Malta. */
.bar{display:flex; height:34px; border-radius:9px; overflow:hidden; margin:12px 0 6px; border:1px solid var(--line);}
.bar span{display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); min-width:0; overflow:hidden;}
.bar .free{background:var(--good-soft); color:var(--good);}
.bar .work{background:var(--accent-soft); color:var(--accent);}
.bar .rest{background:var(--sunk);}
.bar .now{background:var(--crit); width:3px; min-width:3px; flex:none;}
.legend{display:flex; justify-content:space-between; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}

.say{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r); padding:17px; margin:13px 0;}
.say .lbl{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:7px;}
.say q{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
  font-size:clamp(22px,6.2vw,29px); line-height:1.2; letter-spacing:-.02em; quotes:none;}
.say .after{margin:9px 0 0; font-size:14px; color:var(--ink-2);}

.row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row b{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); flex:none; width:76px; padding-top:3px;}
.row div{flex:1; min-width:0;}

.pill{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:5px; background:var(--sunk); color:var(--ink-2);}
.pill.e{background:var(--good-soft); color:var(--good);}
.pill.m{background:var(--accent-soft); color:var(--accent);}
.pill.l{background:var(--signal-soft); color:var(--signal);}
.pill.hot{background:var(--crit-soft); color:var(--crit);}

button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); padding:12px 15px; min-height:46px;}
button:active{transform:translateY(1px);}
.btns{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap;}
.btns button{flex:1; min-width:130px;}
button.pri{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
:root[data-theme="dark"] button.pri, :root:not([data-theme="light"]) button.pri{color:#0D1211;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) button.pri{color:#fff;} }

/* Four ingredients of a day he already said was good. Tappable, never a streak. */
.ing{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 0;}
.ing button{min-height:66px; padding:9px 4px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; font-size:11.5px; color:var(--ink-3); line-height:1.2;}
.ing button .g{font-size:17px; line-height:1;}
.ing button[aria-pressed="true"]{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:600;}

textarea,input[type=text]{width:100%; font:inherit; padding:12px 13px; border-radius:10px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); resize:vertical;}
textarea{min-height:62px;}

nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20;}
nav button{flex:1; border:none; border-radius:0; background:none; padding:10px 2px 12px;
  font-size:11px; color:var(--ink-3); min-height:60px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;}
nav button[aria-current="true"]{color:var(--accent); font-weight:600;}
nav .ic{font-size:18px; line-height:1;}

table{width:100%; border-collapse:collapse; margin:10px 0; font-size:14.5px;}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400;}
td:first-child{white-space:nowrap; font-family:"JetBrains Mono",monospace; font-weight:500;}
ul{margin:9px 0; padding-left:20px;} li{margin:6px 0;} li::marker{color:var(--ink-3);}
.count{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-weight:700;
  font-size:26px; letter-spacing:-.03em; line-height:1;}

/* ------------------------------------------------------------------ cards
   A collectible has to look collectible. Rows are a spreadsheet; these are
   objects with a face, a rarity and a back you turn over. */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0;}
@media (min-width:520px){ .grid{grid-template-columns:repeat(3,1fr);} }

.cf{position:relative; border-radius:12px; padding:12px 11px 11px; min-height:132px;
  display:flex; flex-direction:column; justify-content:space-between; overflow:hidden;
  border:1px solid var(--line); background:var(--surface); isolation:isolate;}
.cf .nm{font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:14.5px;
  line-height:1.2; letter-spacing:-.01em;}
.cf .nt{font-size:11.5px; line-height:1.35; color:var(--ink-2); margin-top:5px;}
.cf .ft{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:10px;}
.cf .rb{font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:999px; white-space:nowrap;}
.cf .dup{font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:700; color:var(--ink-3);}

.cf.r0{background:var(--surface); border-color:var(--line-strong);}
.cf.r0 .rb{background:var(--sunk); color:var(--ink-3);}
.cf.r1{background:var(--accent-soft); border-color:var(--accent);}
.cf.r1 .rb{background:var(--accent); color:var(--surface);}
.cf.r1 .nt{color:var(--ink-2);}
.cf.r2{background:var(--signal-soft); border-color:var(--signal);}
.cf.r2 .rb{background:var(--signal); color:var(--surface);}
.cf.r3{background:var(--good-soft); border-color:var(--good); box-shadow:0 0 0 1px var(--good) inset;}
.cf.r3 .rb{background:var(--good); color:var(--surface);}

/* Locked cards read as a gap in the set rather than as nothing. */
.cf.lk{background:var(--sunk); border-style:dashed; border-color:var(--line-strong); min-height:112px;}
.cf.lk .nm{color:var(--ink-3); filter:blur(3px); user-select:none;}
.cf.lk .rb{background:transparent; color:var(--ink-3);}

/* Shine, for the ones worth a second look. */
.cf.r2::after,.cf.r3::after{content:""; position:absolute; inset:-40% -120%; z-index:-1;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);
  transform:translateX(-120%);}
.cf.r2.shine::after,.cf.r3.shine::after{animation:sweep 1.15s ease-out .15s 1;}
@keyframes sweep{to{transform:translateX(120%);}}

/* ------------------------------------------------------------------ reveal */
.cf.in{animation:flipin .5s cubic-bezier(.22,1.2,.36,1) both;}
@keyframes flipin{
  from{opacity:0; transform:rotateY(-78deg) translateY(14px) scale(.9);}
  to  {opacity:1; transform:none;}
}
.reveal{perspective:900px;}
.rvl{background:var(--sunk); border-color:var(--line-strong);}
.pack{width:100%; border-radius:14px; padding:26px 18px; text-align:center; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:18px;
  min-height:118px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;}
.pack .sub{font-family:"Instrument Sans",sans-serif; font-weight:400; font-size:13px; color:var(--ink-2);}
.pack:active{transform:scale(.98);}
.pack.big{background:var(--signal-soft); border-color:var(--signal); color:var(--signal);}
.pack.pulse{animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--signal-soft);}50%{box-shadow:0 0 0 7px transparent;}}

.tally{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:15px; text-align:center; margin:14px 0 2px; color:var(--good); font-weight:700;
  animation:rise .45s ease-out both;}
@keyframes rise{from{opacity:0; transform:translateY(8px);}to{opacity:1;transform:none;}}

/* A toast for the moment the third pillar lands. */
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); z-index:60; opacity:0; pointer-events:none;
  background:var(--good); color:var(--surface); border-radius:11px; padding:12px 18px;
  font-weight:600; font-size:14.5px; box-shadow:0 6px 22px rgba(0,0,0,.18); max-width:88vw; text-align:center;}
#toast.on{animation:toast 2.8s ease-out both;}
@keyframes toast{
  0%{opacity:0; transform:translateX(-50%) translateY(20px);}
  12%,78%{opacity:1; transform:translateX(-50%) translateY(0);}
  100%{opacity:0; transform:translateX(-50%) translateY(-8px);}
}

/* Set progress, as a ring rather than another number. */
.ring{width:34px; height:34px; flex:none; transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:4;}
.ring .bg{stroke:var(--sunk);}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .6s ease;}
.ring.done .fg{stroke:var(--good);}
.seth{display:flex; align-items:center; gap:12px; margin:24px 0 4px;}
.seth h2{margin:0;}

@media (prefers-reduced-motion:reduce){
  .cf.in,.cf.r2.shine::after,.cf.r3.shine::after,.pack.pulse,#toast.on,.tally{animation:none !important;}
  #toast.on{opacity:1;}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <div class="eyebrow" id="eyebrow">Daylight</div>
    <h1 id="title">Today</h1>
  </div>
  <button id="theme" title="Switch theme" style="padding:8px 12px; min-height:44px; min-width:44px;">&#9681;</button>
</header>

<main id="view"></main>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<div style="display:none">

</div>

<nav>
  <button data-tab="today" aria-current="true"><span class="ic">&#9737;</span>Today</button>
  <button data-tab="cards"><span class="ic">&#9830;</span>Cards</button>
  <button data-tab="rewards"><span class="ic">&#9733;</span>Rewards</button>
  <button data-tab="next"><span class="ic">&#9654;</span>Next</button>
  <button data-tab="log"><span class="ic">&#10003;</span>More</button>
</nav>

<script>
"use strict";

/* Daylight.

   A bespoke thing, and the brief was specific: keep me accountable, help me
   plan, help me build a routine, help me make the most of my time - for
   somebody who is an expat on European hours, building a name in prediction
   markets, running a Singapore company that holds his Employment Pass, and
   wanting to give something back.

   So it is built around the one fact that shapes every day: work is fixed to
   head office in Malta, not to where he is standing. Everything else - the threads, the
   countdowns, the place of the day - hangs off that. */

/* The shift is defined in Malta local time, not UTC and not Singapore time.
   Malta observes European daylight saving and Singapore does not, so the same
   contracted hours land an hour later in Singapore every winter - which is a
   thing that happens TO him rather than something anyone decided. */
var HQ_START_LOCAL = 10 * 60, HQ_END_LOCAL = 17 * 60;   /* Malta local */

function lastSunday(y, m){            /* m is 1-12 */
  var d = new Date(Date.UTC(y, m, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
/* EU summer time: last Sunday in March to last Sunday in October, 01:00 UTC. */
function euSummer(when){
  var y = when.getFullYear();
  return when >= lastSunday(y, 3) && when < lastSunday(y, 10);
}
function hqOffset(when){ return euSummer(when || new Date()) ? 120 : 60; }
function workUTC(when){
  var o = hqOffset(when);
  return [HQ_START_LOCAL - o, HQ_END_LOCAL - o];
}

/* [ name, minutes offset from UTC ] */
var CAMPS = [
  ["Singapore", 480], ["Sheffield / UK", 60], ["Bangkok", 420], ["Jakarta", 420],
  ["Hanoi", 420], ["Bali", 480], ["Hong Kong", 480], ["Tokyo", 540],
  ["Sydney", 600], ["Colombo", 330], ["Delhi", 330], ["Dubai", 240], ["Lisbon", 60]
];

/* The six things actually going on. Each has one next action, because a thread
   with three next actions has none.
   [ key, name, why it matters, next action, when, hot ] */
var THREADS = [
  ["oct", "The October ask",
   "You are a supplier renegotiating, not an employee asking. And you will be four days past launching a new event.",
   "Fill in the orange bits of the draft. Event numbers, and what your channel drove.", "Week of 27 Oct", true],
  ["client", "A second client",
   "One customer funds the salary, which holds the pass, which is your permission to live here. There is no floor under it.",
   "Follow up with people you meet at NEXTPredict, in November.", "November", true],
  ["family", "Getting them here",
   "Your brother needs a date to book leave against and to save toward. Neither works without a month.",
   "Pick the month and say it out loud to your mum.", "This week", true],
  ["people", "Knowing anyone here",
   "Zero people you see without your partner arranging it. He feels short of community too, so it is a shared problem.",
   "Text Kelvin. Propose a date rather than asking if he is free.", "Today", true],
  ["write", "Something you own",
   "LinkedIn is rented and shared with a client. A newsletter is not, and the list leaves with you.",
   "Start the nostalgia newsletter. One format, not three.", "After 24 Oct", false],
  ["admin", "The boring load-bearing stuff",
   "It is the evidence file for a 2028 PR application, not housekeeping. And your friend carries the director liability.",
   "Health cover. You hold an EP and have none.", "This week", true]
];

/* Dated things. [ label, ISO date, note ] */
var MILESTONES = [
  ["NEXTPredict", "2026-10-22", "Moderating a panel and running it commercially. Negotiate nothing before this."],
  ["The muzzle lifts", "2026-10-24", "Once Kalshi and Polymarket have been on the stage, you can say what you think."],
  ["The conversation", "2026-10-27", "Scope and rate in one document. The line is: I launched this."],
  ["Mum and your brother", "2027-02-01", "February is the driest month and the first window after the hours change."],
  ["PR window", "2028-01-01", "PTS scheme. One to two years of track record, then six to twelve months to process."]
];

/* The next four months, as actually planned. Some end dates are inferred and
   marked - the point is not precision, it is that this stops living in his head.
   [ label, where, start, end, kind, uk, note ] */
var TRIPS = [
["Stopover", "UK", "2026-09-08", "2026-09-08", "move", 1, "One night. Counts as a UK day."],
["Company retreat", "Bulgaria", "2026-09-09", "2026-09-11", "work", 0, "End date assumed - correct it."],
["Family", "UK", "2026-09-12", "2026-09-23", "family", 1, "The twelve days. This is the one to protect from work."],
["Home", "Singapore", "2026-09-24", "2026-10-09", "home", 0, "TOKEN2049 falls in here. Sixteen days - the longest settled run before January."],
["With your partner", "France", "2026-10-10", "2026-10-16", "leisure", 0, "Yours and his. Not a working trip."],
["Family", "UK", "2026-10-17", "2026-10-21", "family", 1, "A few days and a weekend before New York."],
["NEXTPredict", "New York", "2026-10-22", "2026-10-23", "work", 0, "Moderating, and running it commercially. The muzzle lifts on the 24th."],
["Undecided", "UK or home", "2026-10-24", "2026-11-01", "open", 0, "The open week. See below - this is the decision."],
["Home", "Singapore", "2026-11-02", "2026-12-19", "home", 0, "Seven weeks. The first real stretch of ground since June."],
["Christmas", "UK", "2026-12-20", "2027-01-02", "family", 1, "Fourteen days."]
];

function ukDays(includeOpen){
  var n = 0;
  TRIPS.forEach(function(t){
    if (!t[5] && !(includeOpen && t[4] === "open")) return;
    if (t[4] === "open" && !includeOpen) return;
    var a = new Date(t[2] + "T00:00:00"), b = new Date(t[3] + "T00:00:00");
    n += Math.round((b - a) / 86400000) + 1;
  });
  return n;
}

/* The three things he said he would want to look back on, in his order.
   Building a presence came fourth and is deliberately not here - it lives in
   Next, as a thread, not as something measured daily.
   [ key, label, glyph, what it means ] */
var PILLARS = [
  ["train",  "Trained",     "\u25b2", "Gym, a run, or a long walk. Anything that counts as moving on purpose."],
  ["family", "Family",      "\u25cf", "Spoke to someone at home. A message does not count; a conversation does."],
  ["stop",   "Stopped",     "\u25a0", "Finished when the shift finished. Not burning yourself out is a thing you do, not a mood."]
];

/* Bedtime is the keystone. Wake time follows from it, and everything else
   follows from wake time. He named it himself: "simply just agreeing to go to
   sleep at a certain time." */
var BED_DEFAULT = "23:45";

/* A streak you can break in one bad night is a streak that ends in week two.
   Two freezes a month absorb the ordinary misses without making it meaningless. */
var FREEZES_PER_MONTH = 2;

function pDone(iso, key){
  var d = S.days[iso];
  return !!(d && d.p && d.p[key]);
}
function monthOf(iso){ return iso.slice(0, 7); }

/* The first day this pillar was ever recorded. Nothing before it counts as a
   miss - days before he started using the app are not failures. */
function firstDay(key){
  var ks = Object.keys(S.days).filter(function(k){ return pDone(k, key); }).sort();
  return ks.length ? ks[0] : null;
}

/* Walk back from today. A miss inside the tracked period spends a freeze if
   one is left that month, which preserves the run without counting toward it.
   Out of freezes, the streak ends. */
function streak(key){
  var first = firstDay(key);
  if (!first) return 0;
  var n = 0, spent = {}, now = new Date();
  for (var i = 0; i < 400; i++){
    var k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (k < first) break;
    if (pDone(k, key)){ n++; continue; }
    if (k === today()) continue;            /* today is not a miss until it is over */
    var m = monthOf(k);
    spent[m] = (spent[m] || 0) + 1;
    if (spent[m] <= FREEZES_PER_MONTH) continue;   /* frozen: run survives, count does not rise */
    break;
  }
  return n;
}

function freezesLeft(key){
  var first = firstDay(key);
  if (!first) return FREEZES_PER_MONTH;
  var m = monthOf(today()), used = 0, now = new Date();
  for (var i = 1; i < 32; i++){
    var k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (monthOf(k) !== m || k < first) break;
    if (!pDone(k, key)) used++;
  }
  return Math.max(0, FREEZES_PER_MONTH - used);
}

function districts(){

    var p = PLACES.filter(function(x){ return x[0] === n; })[0];
    if (p) seen[p[1]] = (seen[p[1]] || 0) + 1;
  });
  return { all: all, seen: seen };
}

  var n = new Date(), nowLocal = n.getHours()*60 + n.getMinutes();
  return {
    start:start, end:end, wake:wake, now:nowLocal,
    startT:hhmm(start), endT:hhmm(end),
    morning:Math.max(0, start - wake),
    evening:Math.max(0, 1380 - end),
    untilWork:start - nowLocal,
    working: nowLocal >= start && nowLocal < end,
    late: end >= 1440
  };
}
function dur(m){
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m/60), r = m%60;
  if (h && r) return h + "h " + r + "m";
  return h ? h + "h" : r + "m";
}

/* ---------------------------------------------------------------- picking */
function seedFor(s){
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(list, seed){
  var a = list.slice(), r = seed;
  for (var i=a.length-1;i>0;i--){
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    var j = r % (i+1);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(){
  var f = S.filter || 0;   /* 0 all, 1 outdoors, 2 hawker */
  var pool = PLACES.filter(function(p){
    if (S.done[p[0]]) return false;
    if (f === 1 && p[3] !== 0) return false;
    if (f === 2 && p[3] !== 2) return false;
    return true;
  });
  if (!pool.length) pool = PLACES.filter(function(p){
    return f === 1 ? p[3] === 0 : f === 2 ? p[3] === 2 : true;
  });
  if (!pool.length) return null;
  var order = shuffled(pool, seedFor(today()));
  return order[(S.skip[today()] || 0) % order.length];
}

/* ---------------------------------------------------------------- helpers */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function maps(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Singapore");
}
/* Not a difficulty ladder. What kind of place it is, so you know what you are
   walking into - which is information, not a warning. */
var KIND = [["e","Outdoors"],["m","Counter service"],["l","Hawker stall"]];

var PACK_SIZE = 3, STREAK_PACK_SIZE = 5;

function allThree(iso){
  return PILLARS.every(function(g){ return pDone(iso, g[0]); });
}

/* Recomputed from the record rather than incremented, so it cannot drift.
   Full days earn standard packs; every seventh consecutive one earns a streak
   pack, which is bigger and pulls better. */
function packCounts(){
  var full = Object.keys(S.days).filter(allThree).sort();
  var streakPacks = 0, run = 0, prev = null;
  full.forEach(function(k){
    if (prev){
      var gap = Math.round((new Date(k) - new Date(prev)) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else run = 1;
    if (run % 7 === 0) streakPacks++;
    prev = k;
  });
  return { day: full.length, streak: streakPacks };
}
function packsWaiting(){
  var e = packCounts();
  return { day: Math.max(0, e.day - (S.openedDay || 0)),
           streak: Math.max(0, e.streak - (S.openedStreak || 0)) };
}

function rollRarity(r, boosted){
  var w = boosted ? [40, 36, 24, 0] : [RARITY[0][2], RARITY[1][2], RARITY[2][2], 0];
  var total = w[0] + w[1] + w[2], x = r * total;
  if (x < w[0]) return 0;
  if (x < w[0] + w[1]) return 1;
  return 2;
}

/* Pulls prefer cards not yet held, so a pack usually closes a gap rather than
   handing him a fourth kopi-o. */
function openPack(kind){
  var size = kind === "streak" ? STREAK_PACK_SIZE : PACK_SIZE;
  var boosted = kind === "streak";
  var got = [], seed = (Date.now() ^ (Math.random() * 4294967296)) >>> 0;
  for (var n = 0; n < size; n++){
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var rar = rollRarity(((seed >>> 8) & 0xffff) / 65536, boosted);
    var tier = CARDS.filter(function(c){ return c[1] === rar && c[2] !== "gold"; });
    if (!tier.length) tier = CARDS.filter(function(c){ return c[1] === 0; });
    var fresh = tier.filter(function(c){ return !(S.cards || {})[c[0]] && got.indexOf(c[0]) < 0; });
    var from = fresh.length ? fresh : tier.filter(function(c){ return got.indexOf(c[0]) < 0; });
    if (!from.length) from = tier;
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var card = from[seed % from.length];
    got.push(card[0]);
    S.cards = S.cards || {};
    S.cards[card[0]] = (S.cards[card[0]] || 0) + 1;
  }
  if (kind === "streak") S.openedStreak = (S.openedStreak || 0) + 1;
  else S.openedDay = (S.openedDay || 0) + 1;
  save();
  return got;
}
function heldCount(){ return Object.keys(S.cards || {}).length; }

var REWARD_TIERS = [
  [7,   "Weekly",    "Something small. A coffee somewhere new, a book."],
  [30,  "Monthly",   "Something that costs a bit. A meal out, a massage, a day trip."],
  [90,  "Quarterly", "Something you would otherwise talk yourself out of."]
];
function bestStreak(){
  return Math.max.apply(null, PILLARS.map(function(g){ return streak(g[0]); }));
}

/* ---------------------------------------------------------------- progression
   A game is sticky when there is always something you are close to. So: sets
   you can be one card from finishing, a level that always has a next one, and
   two kinds of pack so a streak feels different from a good day. */

function setCards(key){ return CARDS.filter(function(c){ return c[2] === key; }); }
function setHeld(key){
  return setCards(key).filter(function(c){ return (S.cards || {})[c[0]]; }).length;
}
function setsComplete(){
  return SETS.filter(function(s){ return setHeld(s[0]) === setCards(s[0]).length; }).length;
}

function xp(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){ if (held[c[0]]) n += RARITY[c[1]][3]; });
  Object.keys(S.days).forEach(function(k){ if (allThree(k)) n += 15; });
  n += Object.keys(S.done || {}).length * 20;
  n += setsComplete() * 100;
  return n;
}

/* Ranks rather than bare numbers - a level should say something about you. */
var RANKS = [
  [0,     "Just landed"],
  [120,   "Two months in"],
  [320,   "Finding your way"],
  [640,   "Regular"],
  [1100,  "Local-ish"],
  [1750,  "Knows a guy"],
  [2600,  "Gives directions"],
  [3700,  "Been here years"],
  [5200,  "Institution"]
];
function rank(){
  var x = xp(), i = 0;
  for (var j = 0; j < RANKS.length; j++) if (x >= RANKS[j][0]) i = j;
  var next = RANKS[i + 1] || null;
  return { level: i + 1, name: RANKS[i][1], xp: x,
           from: RANKS[i][0], to: next ? next[0] : null, nextName: next ? next[1] : null };
}

/* The nearest set to finishing. This is the hook - "one more card" is a much
   better prompt than "collect them all". */
function nearestSet(){
  var best = null;
  SETS.forEach(function(s){
    if (s[0] === "gold") return;
    var total = setCards(s[0]).length, have = setHeld(s[0]);
    if (have === total || have === 0) return;
    var left = total - have;
    if (!best || left < best.left) best = { set: s, left: left, have: have, total: total };
  });
  return best;
}

/* ---------------------------------------------------------------- feel
   The reveal is the whole point. A list appearing is not a pack opening. */
function buzz(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}
function toast(msg){
  var el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("on");
  void el.offsetWidth;               /* restart the animation */
  el.classList.add("on");
}
function reduced(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* Count-up, because a number that jumps is a number nobody watches. */
function countUp(el, from, to, ms){
  if (reduced() || from === to){ el.textContent = to; return; }
  var t0 = performance.now();
  (function step(now){
    var k = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function cardFace(c, count, opts){
  opts = opts || {};
  var r = c[1], cls = "cf r" + r + (count ? "" : " lk") + (opts.extra || "");
  var h = "<div class='" + cls + "'" + (opts.style ? " style='" + opts.style + "'" : "") + ">";
  h += "<div><div class='nm'>" + esc(count ? c[0] : "Locked away") + "</div>";
  if (count) h += "<div class='nt'>" + esc(c[3]) + "</div>";
  h += "</div>";
  h += "<div class='ft'><span class='rb'>" + RARITY[r][0] + "</span>"
     + (count > 1 ? "<span class='dup'>x" + count + "</span>" : "") + "</div>";
  h += "</div>";
  return h;
}

/* Cards turn over one at a time, rare ones catch the light, and the phone
   buzzes harder for the good ones. */
function playReveal(names){
  var box = document.getElementById("reveal");
  if (!box) return;
  box.innerHTML = "";
  /* Whatever you were scrolled to, the pack is what you are looking at now. */
  var ease = reduced() ? "auto" : "smooth";
  box.parentNode.scrollIntoView({ behavior: ease, block: "start" });
  var gained = 0, fresh = 0;
  names.forEach(function(name, i){
    var c = CARDS.filter(function(x){ return x[0] === name; })[0];
    if (!c) return;
    gained += RARITY[c[1]][3];
    if (S.cards[name] === 1) fresh++;
    var d = document.createElement("div");
    d.innerHTML = cardFace(c, S.cards[name], { extra: " in", style: "animation-delay:" + (i * 0.22) + "s" });
    var el = d.firstChild;
    box.appendChild(el);
    var wait = reduced() ? 0 : (i * 220 + 120);
    setTimeout(function(){
      if (c[1] >= 2){ el.classList.add("shine"); buzz([18, 40, 26]); }
      else buzz(12);
    }, wait);
  });
  var t = document.createElement("div");
  t.className = "tally";
  var dupes = names.length - fresh;
  t.textContent = "+" + fresh + " new"
    + (dupes ? "  \u00b7  " + dupes + " spare" : "")
    + "  \u00b7  +" + gained + " XP";
  t.style.animationDelay = (reduced() ? 0 : names.length * 0.22 + 0.15) + "s";
  box.parentNode.insertBefore(t, box.nextSibling);
  /* And once the last one has turned over, the score comes to you. */
  setTimeout(function(){
    var r = t.getBoundingClientRect();
    if (r.bottom > window.innerHeight - 80) t.scrollIntoView({ behavior: ease, block: "center" });
  }, reduced() ? 0 : names.length * 220 + 400);
}

function ring(have, total){
  var C = 2 * Math.PI * 15, k = total ? have / total : 0;
  return "<svg class='ring" + (k === 1 ? " done" : "") + "' viewBox='0 0 34 34' aria-hidden='true'>"
    + "<circle class='bg' cx='17' cy='17' r='15'></circle>"
    + "<circle class='fg' cx='17' cy='17' r='15' stroke-dasharray='" + (C * k).toFixed(1) + " " + C.toFixed(1) + "'></circle>"
    + "</svg>";
}

/* ---------------------------------------------------------------- the bar */
function barHTML(){
  /* The bar always runs wake to midnight, so the proportions mean something.
     Opening it at 3am should not put the night inside the free segment. */
  var s = shape(), from = s.wake, to = 1440;
  var span = to - from;
  function pct(a, b){ return Math.max(0, Math.min(100, ((b - a) / span) * 100)); }
  var freeW = pct(from, Math.min(s.start, to));
  var workW = pct(Math.max(s.start, from), Math.min(s.end, to));
  var restW = Math.max(0, 100 - freeW - workW);
  var inDay = s.now >= from && s.now <= to;
  var nowPos = pct(from, s.now);

  var h = "<div class='bar' style='position:relative'>";
  if (inDay) h += "<div class='now' style='position:absolute;top:0;bottom:0;left:" + nowPos.toFixed(2) + "%'></div>";
  if (freeW > 0.5) h += "<div class='free' style='width:" + freeW.toFixed(2) + "%;display:flex;align-items:center;justify-content:center'>"
    + (freeW > 16 ? "<span class='free'>Yours</span>" : "") + "</div>";
  if (workW > 0.5) h += "<div class='work' style='width:" + workW.toFixed(2) + "%;display:flex;align-items:center;justify-content:center'>"
    + (workW > 16 ? "<span class='work'>Malta</span>" : "") + "</div>";
  if (restW > 0.5) h += "<div class='rest' style='width:" + restW.toFixed(2) + "%'></div>";
  h += "</div>";
  h += "<div class='legend'><span>" + hhmm(from) + "</span><span class='mono'>" + s.startT
    + " &ndash; " + s.endT + "</span><span>24:00</span></div>";
  return h;
}

/* ---------------------------------------------------------------- say */
function viewSay(){
  var h = "<p class='muted'>Here because you will not remember it, and there is no reason you should. "
        + "Open it in the queue.</p>";

  h += "<div class='card ok'><h3>The three that always work</h3><ul style='margin:8px 0 0'>"
    + "<li><strong>Point, and hold up one finger.</strong> Understood everywhere, rude to nobody.</li>"
    + "<li><strong>&ldquo;One of that, please.&rdquo;</strong> English is official here. They have heard it a thousand times.</li>"
    + "<li><strong>Join the longest queue and order what the person in front ordered.</strong> A recognised national strategy.</li>"
    + "</ul></div>";

  h += "<h2>Kopi</h2><p class='muted'>Two or three terms stacked. <strong>Kopi</strong> alone is coffee, condensed milk, sweet.</p>"
    + "<table><tr><th>Say</th><th>Means</th></tr>"
    + "<tr><td>-o</td><td>No milk. Black, still sweet.</td></tr>"
    + "<tr><td>-c</td><td>Evaporated milk instead of condensed.</td></tr>"
    + "<tr><td>kosong</td><td>No sugar at all.</td></tr>"
    + "<tr><td>siew dai</td><td>Less sweet. The one you want.</td></tr>"
    + "<tr><td>gah dai</td><td>Sweeter.</td></tr>"
    + "<tr><td>gao</td><td>Strong.</td></tr>"
    + "<tr><td>po</td><td>Weak.</td></tr>"
    + "<tr><td>peng</td><td>Iced.</td></tr>"
    + "<tr><td>da bao</td><td>Take away. Goes last.</td></tr>"
    + "<tr><td>teh</td><td>Same system, tea.</td></tr></table>";

  h += "<div class='card'><h3>Three orders for most days</h3>"
    + "<div class='row'><b>Standard</b><div><strong>Kopi-o siew dai.</strong> The most ordinary thing you can say.</div></div>"
    + "<div class='row'><b>Milky</b><div><strong>Kopi-c siew dai.</strong></div></div>"
    + "<div class='row'><b>Hot day</b><div><strong>Kopi-o peng.</strong></div></div></div>"
    + "<p class='dim'>They shout it back across the stall. That is the order reaching whoever makes it, not a correction.</p>";

  h += "<h2>Hawker centres</h2><div class='card'>"
    + "<div class='row'><b>Seat first</b><div>Table before queue, and <strong>chope</strong> it with a packet of tissues. Everybody does this.</div></div>"
    + "<div class='row'><b>Sharing</b><div>Normal at a big table. <strong>&ldquo;Can sit?&rdquo;</strong> is the whole phrase.</div></div>"
    + "<div class='row'><b>Cash</b><div>Fastest. Small notes. PayNow is common but do not count on it.</div></div>"
    + "<div class='row'><b>Trays</b><div>Returning yours has been required since 2021. Station is near the exit.</div></div>"
    + "<div class='row'><b>Timing</b><div>Avoid 12:00&ndash;13:30 near the CBD. Go at 14:00 &mdash; no queue, nobody behind you.</div></div></div>";

  h += "<h2>Hokkien</h2><p class='muted'>His family speak it, and it is the one nobody teaches.</p>"
    + "<table><tr><th>Say</th><th>Means</th></tr>"
    + "<tr><td>chiah pa boe</td><td>Have you eaten? The standard greeting. Say yes.</td></tr>"
    + "<tr><td>ho chiah</td><td>Delicious. For his mother's table.</td></tr>"
    + "<tr><td>kam siah</td><td>Thank you.</td></tr></table>"
    + "<div class='card ok'><p style='margin:0'><strong>Better than any of this: ask his family to teach you.</strong> "
    + "Hokkien is the language that got squeezed out, and the people who still speak it know that. "
    + "Asking an elder for five phrases does more for belonging than a term of classes.</p></div>";
  return h;
}

/* ---------------------------------------------------------------- log */
function viewLog(){
  var h = "";
  var earned = BADGES.filter(function(b){ return totalDone(b[2]) >= b[0]; });
  var next = BADGES.filter(function(b){ return totalDone(b[2]) < b[0]; })
                   .sort(function(a,b){ return (a[0]-totalDone(a[2])) - (b[0]-totalDone(b[2])); })[0];

  /* Streaks first, because that is the thing he asked for. */
  h += "<div class='card'><h3>Streaks</h3><div class='ing' style='grid-template-columns:repeat(3,1fr)'>";
  PILLARS.forEach(function(g){
    h += "<div style='text-align:center;padding:10px 4px'><div style='font-size:19px'>" + g[2] + "</div>"
      + "<span class='count'>" + streak(g[0]) + "</span>"
      + "<div class='dim' style='font-size:11px'>" + g[1] + "</div></div>";
  });
  h += "</div></div>";

  /* Badges. Earned ones solid, the next one shown so there is something to aim at. */
  h += "<h2>Badges</h2>";
  if (earned.length){
    h += "<div class='card ok'>";
    earned.forEach(function(b){
      h += "<div class='row'><b>" + b[0] + "</b><div><strong>" + esc(b[1]) + "</strong><br>"
        + "<span class='dim'>" + esc(b[3]) + "</span></div></div>";
    });
    h += "</div>";
  } else {
    h += "<div class='card'><p class='muted' style='margin:0'>None yet. The first one is three training "
      + "sessions, which is genuinely the hardest three.</p></div>";
  }
  if (next){
    var have = totalDone(next[2]), pct = Math.round(100 * have / next[0]);
    h += "<div class='card'><h3>Next: " + esc(next[1]) + "</h3>"
      + "<p class='dim' style='margin:6px 0 8px'>" + esc(next[3]) + "</p>"
      + "<div style='height:9px;background:var(--sunk);border-radius:5px;overflow:hidden'>"
      + "<div style='height:100%;width:" + pct + "%;background:var(--good)'></div></div>"
      + "<p class='dim' style='margin:7px 0 0'>" + have + " of " + next[0] + "</p></div>";
  }

  /* The collection. Districts, because most of Singapore is still unvisited. */
  var dd = districts(), names = Object.keys(dd.all).sort();
  var got = names.filter(function(n){ return dd.seen[n]; }).length;
  h += "<h2>Singapore</h2>";
  h += "<div class='card'><div style='display:flex;align-items:baseline;gap:12px'>"
    + "<span class='count'>" + got + "/" + names.length + "</span>"
    + "<div><h3>districts</h3><div class='dim'>" + Object.keys(S.done).length + " places logged</div></div></div>";
  h += "<div style='display:flex;flex-wrap:wrap;gap:6px;margin-top:12px'>";
  names.forEach(function(n){
    var on = !!dd.seen[n];
    h += "<span class='pill" + (on ? " e" : "") + "' style='" + (on ? "" : "opacity:.45") + "'>"
      + esc(n) + (on ? " " + dd.seen[n] : "") + "</span>";
  });
  h += "</div></div>";

  /* The plain record underneath. */
  var keys = Object.keys(S.days).filter(function(k){
    var d = S.days[k];
    return d.said || d.kept !== undefined || (d.p && Object.keys(d.p).length) || d.bedok !== undefined;
  }).sort().reverse();

  if (keys.length){
    h += "<h2>Days</h2><div class='card'>";
    keys.slice(0, 40).forEach(function(k){
      var d = S.days[k];
      var marks = PILLARS.filter(function(g){ return d.p && d.p[g[0]]; }).map(function(g){ return g[2]; }).join(" ");
      h += "<div class='row'><b>" + esc(nice(k)) + "</b><div>"
        + (marks ? "<span style='font-size:15px'>" + marks + "</span> " : "")
        + (d.bedok === true ? "<span class='pill e'>bed</span> " : d.bedok === false ? "<span class='pill'>late</span> " : "")
        + (d.said ? esc(d.said) : "<span class='dim'>nothing named</span>")
        + "</div></div>";
    });
    h += "</div>";
  }
  h += "<div class='btns'><button data-tab='trips'>Trips and UK days</button>"
    + "<button data-tab='say'>Phrasebook</button></div>";
  h += "<div class='btns'><button data-reset='1'>Clear everything</button></div>";
  return h;
}

/* ---------------------------------------------------------------- trips */
function viewTrips(){
  var base = ukDays(false), withOpen = base + 9;
  var h = "";

  /* The number he cannot hold in his head, and the one that costs real money. */
  var band = withOpen <= 45 ? "e" : withOpen <= 90 ? "l" : "hot";
  h += "<div class='card" + (withOpen > 45 ? " hot" : " ok") + "'>";
  h += "<div style='display:flex;align-items:baseline;gap:14px'><span class='count'>" + base + "</span>"
    + "<div><h3>UK days this tax year</h3><div class='dim'>6 Apr 2026 to 5 Apr 2027</div></div></div>";
  h += "<p class='muted' style='margin:12px 0 0'>Take the open week in the UK and it is <strong>"
    + withOpen + "</strong>. Under 46 you would need four ties to be UK resident, which you do not have. "
    + "<strong>Over 46 and three ties is enough</strong> &mdash; and you plausibly have work and "
    + "accommodation already.</p>";
  h += "<p class='dim' style='margin:8px 0 0'>So this year is fine. But you are one trip from the band "
    + "that taxes your Singapore salary, and there are still three months of the tax year after "
    + "Christmas. Do not carry this in your head.</p>";
  h += "</div>";

  h += "<h2>Between now and January</h2>";
  var last = null;
  TRIPS.forEach(function(t){
    var d = daysUntil(t[2]), gone = daysUntil(t[3]) < 0, now = d <= 0 && !gone;
    var len = Math.round((new Date(t[3]+"T00:00:00") - new Date(t[2]+"T00:00:00"))/86400000) + 1;
    h += "<div class='card" + (now ? " ok" : "") + "' style='" + (gone ? "opacity:.5" : "") + "'>";
    h += "<div style='display:flex;justify-content:space-between;gap:10px;align-items:flex-start'>"
      + "<div><h3>" + esc(t[1]) + "</h3><div class='dim'>" + esc(t[0]) + " &middot; "
      + nice(t[2]) + (t[2] !== t[3] ? " to " + nice(t[3]) : "") + " &middot; " + len + "d</div></div>"
      + "<span class='pill" + (t[5] ? " l" : t[4]==="home" ? " e" : "") + "'>"
      + (t[5] ? "UK day" + (len>1?"s":"") : t[4]) + "</span></div>";
    h += "<p class='dim' style='margin:8px 0 0'>" + esc(t[6]) + "</p>";
    h += "</div>";
  });

  h += "<div class='card tip'><h3>The open week is the whole decision &mdash; and it has a third factor</h3>"
    + "<p style='margin:8px 0 0'><strong>The conversation falls inside it.</strong> The week of 27 October "
    + "is exactly when you should be renegotiating, and NEXT is a UK company. Take the UK week and you can "
    + "do it <em>in a room</em>, four days after launching their event, instead of over video from "
    + "Singapore with a seven-hour gap. For a rate negotiation that is worth a great deal.</p>"
    + "<p style='margin:8px 0 0'>Straight home after New York and you land in Singapore with "
    + "<strong>seven unbroken weeks</strong> before Christmas &mdash; the first real ground you will "
    + "have had since June, and the window where a routine can actually start.</p>"
    + "<p>Take the UK week and you get more family, and you go to <strong>" + withOpen + " UK days</strong>, and the seven weeks "
    + "becomes six. Both are defensible. But pick it now rather than at an airport, because you have "
    + "already told me what happens to you when the ground keeps moving.</p></div>";

  h += "<div class='card'><h3>What actually survives all this</h3>"
    + "<div class='row'><b>Everywhere</b><div><strong>parkrun.</strong> It runs in the UK, Bulgaria, "
    + "France, the US and Singapore, and one barcode works at all of them. This is the reason it was "
    + "the right anchor.</div></div>"
    + "<div class='row'><b>Mostly</b><div><strong>Your mum.</strong> Easier for four of these weeks, "
    + "since you will be in the same house.</div></div>"
    + "<div class='row'><b>Nowhere</b><div><strong>The gym, the hawker lunches, the daily place.</strong> "
    + "Those need ground. They start in November.</div></div></div>";
  return h;
}

/* ---------------------------------------------------------------- collection */
function viewCards(){
  var w = packsWaiting(), r = rank(), near = nearestSet();
  var h = "";

  /* The reveal lives here and is filled in after render, so it can be sequenced. */
  if (S.reveal && S.reveal.length){
    h += "<div class='card rvl'><h3>" + (S.revealKind === "streak" ? "Streak pack" : "Pack") + "</h3>"
      + "<div class='grid reveal' id='reveal'></div>"
      + "<div class='btns'><button data-reveal='clear'>Done</button></div></div>";
  }

  var pct = r.to ? Math.round(100 * (r.xp - r.from) / (r.to - r.from)) : 100;
  h += "<div class='card'><div style='display:flex;justify-content:space-between;align-items:baseline;gap:12px'>"
    + "<div><h3>" + esc(r.name) + "</h3><div class='dim'>level " + r.level + "</div></div>"
    + "<span class='count' id='xp'>" + r.xp + "</span></div>";
  h += "<div style='height:9px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:11px'>"
    + "<div style='height:100%;width:" + pct + "%;background:var(--accent);transition:width .7s ease'></div></div>";
  h += "<p class='dim' style='margin:7px 0 0'>"
    + (r.to ? (r.to - r.xp) + " to <strong>" + esc(r.nextName) + "</strong>" : "Top rank. Nothing above this.")
    + "</p></div>";

  /* Packs as objects you tap, not buttons in a row. */
  if (w.streak){
    h += "<div class='pack big pulse' data-pack='streak' role='button' tabindex='0'>"
      + "Open a streak pack<span class='sub'>Five cards, better odds"
      + (w.streak > 1 ? " &middot; " + w.streak + " waiting" : "") + "</span></div>";
  }
  if (w.day){
    h += "<div class='pack" + (w.streak ? "" : " pulse") + "' data-pack='day' role='button' tabindex='0'>"
      + "Open a pack<span class='sub'>Three cards"
      + (w.day > 1 ? " &middot; " + w.day + " waiting" : "") + "</span></div>";
  }
  if (!w.day && !w.streak){
    h += "<div class='card'><h3>No packs waiting</h3>"
      + "<p class='muted' style='margin:8px 0 0'>A day with all three earns one. Every seventh "
      + "consecutive full day earns a streak pack &mdash; five cards, better odds.</p>"
      + "<p class='dim' style='margin:8px 0 0'>" + heldCount() + " of " + CARDS.length + " cards held.</p></div>";
  }

  if (near){
    h += "<div class='card tip'><h3>" + near.left + " from finishing " + esc(near.set[1]) + "</h3>"
      + "<p style='margin:7px 0 0'>" + esc(near.set[2]) + "</p>"
      + "<p class='dim' style='margin:7px 0 0'>" + near.have + " of " + near.total + " &middot; a set is worth 100 XP.</p></div>";
  }

  SETS.forEach(function(st){
    var cs = setCards(st[0]), have = setHeld(st[0]), done = have === cs.length;
    h += "<div class='seth'>" + ring(have, cs.length)
      + "<div><h2>" + esc(st[1]) + "</h2><div class='dim'>" + have + " of " + cs.length
      + (done ? " &middot; complete" : "") + "</div></div></div>";
    h += "<p class='dim' style='margin:0 0 6px'>" + esc(st[2]) + "</p>";
    h += "<div class='grid'>";
    cs.forEach(function(c){ h += cardFace(c, (S.cards || {})[c[0]]); });
    h += "</div>";
    if (st[0] === "gold"){
      var unclaimed = cs.filter(function(c){ return !(S.cards || {})[c[0]]; });
      if (unclaimed.length){
        h += "<div class='card'><h3>Claim one</h3><p class='dim' style='margin:6px 0 0'>Only when it "
          + "has actually happened.</p><div class='btns'>";
        unclaimed.forEach(function(c){
          h += "<button data-claim='" + esc(c[0]) + "'>" + esc(c[0]) + "</button>";
        });
        h += "</div></div>";
      }
    }
  });
  return h;
}

/* ---------------------------------------------------------------- rewards */
function viewRewards(){
  var best = bestStreak();
  var h = "<p class='muted'>You set these. The app only decides when they are earned, because a treat "
        + "you granted yourself on a Tuesday is not a reward.</p>";

  h += "<div class='card'><div style='display:flex;align-items:baseline;gap:14px'>"
    + "<span class='count'>" + best + "</span><div><h3>best current streak</h3>"
    + "<div class='dim'>across the three</div></div></div></div>";

  REWARD_TIERS.forEach(function(t){
    var name = (S.rewards || {})[t[0]];
    var unlocked = best >= t[0];
    var claimed = ((S.claimed || {})[t[0]] || 0);
    h += "<div class='card" + (unlocked && name ? " ok" : "") + "'>";
    h += "<div style='display:flex;justify-content:space-between;gap:10px;align-items:flex-start'>"
      + "<h3>" + t[1] + "</h3><span class='pill" + (unlocked ? " e" : "") + "'>" + t[0] + " days</span></div>";
    h += "<p class='dim' style='margin:6px 0 0'>" + esc(t[2]) + "</p>";
    if (name){
      h += "<p style='margin:9px 0 0'><strong>" + esc(name) + "</strong>"
        + (claimed ? " <span class='dim'>&middot; claimed " + claimed + "x</span>" : "") + "</p>";
      h += "<div class='btns'>";
      if (unlocked) h += "<button class='pri' data-claimreward='" + t[0] + "'>Earned it &mdash; claim</button>";
      h += "<button data-setreward='" + t[0] + "'>Change</button></div>";
      if (!unlocked) h += "<p class='dim' style='margin:8px 0 0'>" + (t[0] - best) + " days to go.</p>";
    } else {
      h += "<div class='btns'><button data-setreward='" + t[0] + "'>Set what this earns you</button></div>";
    }
    h += "</div>";
  });

  h += "<div class='card tip'><h3>Pick things you would otherwise not do</h3>"
    + "<p style='margin:8px 0 0'>A reward you would have had anyway is not a reward. So set the bar "
    + "at things you currently talk yourself out of.</p>"
    + "<div class='row'><b>Weekly</b><div>A coffee somewhere you have never been. A book. The good "
    + "hawker centre across the island rather than the nearest one.</div></div>"
    + "<div class='row'><b>Monthly</b><div>A proper meal out. A massage. A day in Batam &mdash; the "
    + "ferry is forty-five minutes and costs less than a taxi to Changi.</div></div>"
    + "<div class='row'><b>Quarterly</b><div>The one you keep deferring. A weekend in Bangkok, "
    + "Penang or Yogyakarta. GTA VI. Or the flight that gets your brother here.</div></div>"
    + "<p class='dim' style='margin:9px 0 0'>You can work from any of those, which is the whole "
    + "point of living where you live.</p></div>";
  return h;
}

/* ---------------------------------------------------------------- shell */
var TABS = {
  today:   ["Today", "A day fixed to head office", viewToday],
  cards:   ["Cards", "Ninety, and you are barely home this year", viewCards],
  rewards: ["Rewards", "What consistency buys you", viewRewards],
  next:    ["Next", "What is actually going on", viewNext],
  trips:   ["Trips", "Where you will be, and the UK count", viewTrips],
  say:     ["Say", "Read it in the queue", viewSay],
  log:     ["Log", "The record, so you are not holding it", viewLog]
};
var tab = "today";
var LAST_XP = null;

function render(){
  var t = TABS[tab];
  document.getElementById("title").textContent = t[0];
  document.getElementById("eyebrow").textContent = t[1];
  var prevXp = LAST_XP;
  document.getElementById("view").innerHTML = t[2]();
  if (S.reveal && S.reveal.length && tab === "cards"){
    playReveal(S.reveal);
  }
  var xpEl = document.getElementById("xp");
  if (xpEl){
    var now = Number(xpEl.textContent);
    if (prevXp !== null && prevXp !== now) countUp(xpEl, prevXp, now, 900);
    LAST_XP = now;
  }
  var nav = document.querySelectorAll("nav button");
  for (var i=0;i<nav.length;i++){
    nav[i].setAttribute("aria-current", nav[i].dataset.tab === tab ? "true" : "false");
  }
  window.scrollTo(0,0);
}

function campSheet(){
  var names = CAMPS.map(function(c){ return c[0]; });
  var i = names.indexOf(S.camp);
  var next = names[(i + 1) % names.length];
  S.camp = next; save(); render();
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("button, .pack") : null;
  if (!b) return;
  var d = day(today());

  if (b.dataset.tab){ tab = b.dataset.tab; render(); return; }
  if (b.dataset.camp){ campSheet(); return; }
  if (b.dataset.p){
    var k = b.dataset.p, wasFull = allThree(today());
    if (d.p[k]) delete d.p[k]; else d.p[k] = 1;
    save();
    if (!wasFull && allThree(today())){
      var sp = packsWaiting();
      buzz([25, 60, 25, 60, 45]);
      toast(sp.streak ? "Streak pack earned." : "All three. Pack earned.");
    } else if (d.p[k]) buzz(14);
    render(); return;
  }
  if (b.dataset.bed === "1" || b.dataset.bed === "0"){ day(shift(-1)).bedok = b.dataset.bed === "1"; save(); render(); return; }
  if (b.dataset.bed === "x"){ delete day(shift(-1)).bedok; save(); render(); return; }
  if (b.dataset.bedtime){
    var v = prompt("Bed by what time? 24h, e.g. 23:45", S.bed || BED_DEFAULT);
    if (v && /^\d{1,2}:\d{2}$/.test(v.trim())){ S.bed = v.trim(); save(); render(); }
    return;
  }
  if (b.dataset.gap === "set"){
    var g = (document.getElementById("gap").value || "").trim();
    if (g){ d.gap = g; save(); render(); }
    return;
  }
  if (b.dataset.gap === "clear"){ delete d.gap; save(); render(); return; }
  if (b.dataset.say){
    var v = (document.getElementById("said").value || "").trim();
    if (v){ d.said = v; save(); render(); }
    return;
  }
  if (b.dataset.unsay){ delete d.said; save(); render(); return; }
  if (b.dataset.kept){ day(shift(-1)).kept = b.dataset.kept === "1"; save(); render(); return; }
  if (b.dataset.thread){
    var st = S.threads[b.dataset.thread] || (S.threads[b.dataset.thread] = {});
    if (st.done) delete st.done; else st.done = today();
    save(); render(); return;
  }
  if (b.dataset.done){ S.done[b.dataset.done] = today(); delete S.skip[today()]; save(); tab = "log"; render(); return; }
  if (b.dataset.skip){ S.skip[today()] = (S.skip[today()] || 0) + 1; save(); render(); return; }
  if (b.dataset.easy){ S.filter = ((S.filter || 0) + 1) % 3; delete S.skip[today()]; save(); render(); return; }
  if (b.dataset.pack){
    LAST_XP = rank().xp;
    S.revealKind = b.dataset.pack;
    S.reveal = openPack(b.dataset.pack);
    buzz(30); tab = "cards"; render(); return;
  }
  if (b.dataset.reveal){ delete S.reveal; delete S.revealKind; save(); render(); return; }
  if (b.dataset.claim){
    S.cards = S.cards || {}; S.cards[b.dataset.claim] = 1; save();
    LAST_XP = null; S.revealKind = "gold"; S.reveal = [b.dataset.claim];
    buzz([30, 70, 40]); tab = "cards"; render(); return;
  }
  if (b.dataset.setreward){
    var tier = b.dataset.setreward;
    var v = prompt("What does this one earn you?", (S.rewards || {})[tier] || "");
    if (v !== null){ S.rewards = S.rewards || {}; if (v.trim()) S.rewards[tier] = v.trim(); else delete S.rewards[tier]; save(); render(); }
    return;
  }
  if (b.dataset.claimreward){
    var tr = b.dataset.claimreward;
    S.claimed = S.claimed || {}; S.claimed[tr] = (S.claimed[tr] || 0) + 1; save(); render(); return;
  }
  if (b.dataset.reset){
    if (confirm("Clear everything logged? This cannot be undone.")){
      S.done = {}; S.skip = {}; S.days = {}; S.threads = {}; S.cards = {}; S.claimed = {}; S.openedDay = 0; S.openedStreak = 0; delete S.reveal; save(); render();
    }
    return;
  }
  if (b.id === "theme"){
    var cur = document.documentElement.getAttribute("data-theme");
    var nx = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (nx) document.documentElement.setAttribute("data-theme", nx);
    else document.documentElement.removeAttribute("data-theme");
    S.theme = nx; save();
  }
});

if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
render();
/* The shift moves under you, so keep the bar honest. */
setInterval(function(){ if (tab === "today") render(); }, 60000);
</script>
</body>
