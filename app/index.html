<style>
:root{
  --ground:#EDEFEC; --surface:#FBFCFA; --surface-2:#E4E8E3; --sunk:#E0E4DF;
  --line:#D4D9D3; --line-strong:#B7BFB9;
  --ink:#141B18; --ink-2:#4A5551; --ink-3:#79847F;
  --accent:#1F4FE0; --accent-soft:#DDE4FB; --on-accent:#FFFFFF;
  --signal:#B35C0C; --signal-soft:#F7E6D4;
  --good:#2C7A51; --good-soft:#DCEDE3; --crit:#A03830; --crit-soft:#F3DEDC;
  --build:#3D4CBE; --move:#2C7A51; --enjoy:#A0447E; --discover:#B35C0C; --campaign:#0F6E70;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(20,27,24,.06), 0 6px 18px -10px rgba(20,27,24,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
    --line:#293430; --line-strong:#3C4945;
    --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
    --accent:#7C9BFF; --accent-soft:#1C2647; --on-accent:#0D1211;
    --signal:#E09453; --signal-soft:#2E2317;
    --good:#5CB585; --good-soft:#16261D; --crit:#E08A82; --crit-soft:#2C1C1C;
    --build:#8B96EE; --move:#5CB585; --enjoy:#DE86BC; --discover:#E09453; --campaign:#4FB3B5;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
  --line:#293430; --line-strong:#3C4945;
  --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
  --accent:#7C9BFF; --accent-soft:#1C2647; --on-accent:#0D1211;
  --signal:#E09453; --signal-soft:#2E2317;
  --good:#5CB585; --good-soft:#16261D; --crit:#E08A82; --crit-soft:#2C1C1C;
  --build:#8B96EE; --move:#5CB585; --enjoy:#DE86BC; --discover:#E09453; --campaign:#4FB3B5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;}
/* Respect the notch and the home indicator on iPhone. */
#root{max-width:600px; margin:0 auto;
  padding:0 max(16px, env(safe-area-inset-left)) 116px max(16px, env(safe-area-inset-right));}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; touch-action:manipulation;}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-s); padding:9px 10px; width:100%;}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);}
.row{display:flex; align-items:center;}
.muted{color:var(--ink-2);} .dim{color:var(--ink-3);}

header{position:sticky; top:0; z-index:20; background:var(--ground); padding:14px 0 10px; border-bottom:1px solid var(--line);}
.brandrow{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:11px;}
.brand{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:21px; letter-spacing:-.03em;}
.brand em{font-style:normal; color:var(--signal);}
.where{display:flex; align-items:center; gap:5px; margin-top:4px; padding:3px 0; font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
.where b{color:var(--ink-2); font-weight:500;}
.countdown{text-align:right; line-height:1.15;}
.countdown b{display:block; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:25px; font-weight:700; letter-spacing:-.02em;}
.countdown span{font-size:12.5px; color:var(--ink-3);}

.daybar{position:relative; height:36px; border-radius:8px; overflow:hidden; display:flex; background:var(--sunk); border:1px solid var(--line);}
.seg{position:relative; display:flex; align-items:center; justify-content:center; min-width:0;}
.seg em{font-style:normal; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px;}
.seg-free{background:var(--good-soft);} .seg-free em{color:var(--good);}
.seg-work{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 5px,var(--surface-2) 5px,var(--surface-2) 10px);} .seg-work em{color:var(--ink-3);}
.seg-eve{background:var(--signal-soft);} .seg-eve em{color:var(--signal);}
.fill{position:absolute; inset:0 auto 0 0; background:color-mix(in srgb, var(--ink) 8%, transparent);}
.nowline{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--accent); z-index:3;}
.nowline::before{content:""; position:absolute; top:-1px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
.scale{display:flex; justify-content:space-between; margin-top:6px; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3);}

nav{position:fixed; left:0; right:0; bottom:0; z-index:30; padding:0 env(safe-area-inset-left) 0 env(safe-area-inset-right); background:color-mix(in srgb, var(--ground) 93%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line);}
.navinner{max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.navbtn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-height:50px; padding:6px 2px; border-radius:var(--r-s); color:var(--ink-3);}
.navbtn span{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;}
.navbtn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.navbtn.on{color:var(--accent); background:var(--accent-soft);}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);}
section{margin-top:20px;}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px;}
.sechead h2{font-size:17px;}
.cardhead{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); border-radius:var(--r) var(--r) 0 0;}
.cardhead strong{font-size:14.5px;}

.item{display:flex; align-items:flex-start; gap:12px; padding:14px 14px; min-height:52px; border-bottom:1px solid var(--line); width:100%; text-align:left;}
.item:last-child{border-bottom:none;}
.tick{flex:none; width:24px; height:24px; border-radius:50%; border:1.6px solid var(--line-strong); margin-top:1px; display:grid; place-items:center;}
.tick svg{width:13px; height:13px; stroke:var(--on-accent); fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; opacity:0;}
.tick.on{background:var(--accent); border-color:var(--accent);} .tick.on svg{opacity:1;}
.tick.sq{border-radius:6px;}
.done .itemtitle{text-decoration:line-through; color:var(--ink-3);}
.itembody{flex:1; min-width:0;}
.itemtitle{font-weight:500; letter-spacing:-.005em;}
.itemnote{font-size:13.5px; color:var(--ink-2); margin-top:3px; line-height:1.45;}
.itemmeta{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:5px; font-size:12.5px; color:var(--ink-3);}
.dot{width:8px; height:8px; border-radius:50%; flex:none;}

/* The inspiration card - the one thing this app is for. */
.pitch{border-radius:var(--r); border:1px solid var(--signal); background:var(--signal-soft); padding:17px; position:relative; overflow:hidden;}
.pitch .eyebrow{color:var(--signal);}
.pitch h3{font-size:25px; margin:8px 0 0; letter-spacing:-.025em; line-height:1.15;}
.pitch .p-note{font-size:15px; color:var(--ink-2); margin:8px 0 0; max-width:44ch;}
.pitch .p-meta{display:flex; flex-wrap:wrap; gap:9px; margin-top:13px; font-size:12.5px; color:var(--ink-3); align-items:center;}
.pitch .p-act{display:flex; gap:9px; margin-top:15px; flex-wrap:wrap;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:12px 17px; min-height:46px; border-radius:var(--r-s); background:var(--accent); color:var(--on-accent); font-weight:600; font-size:15px;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong); font-weight:500;}
.btn.sm{padding:9px 14px; min-height:40px; font-size:13.5px;}
.btn.block{width:100%;}
.chip{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em; padding:3px 7px; border-radius:5px; background:var(--sunk); color:var(--ink-2); white-space:nowrap;}
.chip.good{background:var(--good-soft); color:var(--good);}
.chip.warn{background:var(--crit-soft); color:var(--crit);}
.chip.sig{background:var(--signal-soft); color:var(--signal);}

.pills{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:10px 15px; min-height:42px; display:inline-flex; align-items:center; border-radius:99px; border:1px solid var(--line-strong); font-size:13.5px; font-family:"JetBrains Mono",monospace; color:var(--ink-2);}
.pill.on{background:var(--ink); color:var(--ground); border-color:var(--ink);}
.pill.tiny{padding:8px 13px; min-height:38px; font-size:12.5px;}

.slots{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px;}
.slot{padding:13px 13px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface); text-align:left;}
.slot .n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:21px; font-weight:700; letter-spacing:-.02em;}
.slot .n s{text-decoration:none; color:var(--ink-3); font-size:13px; font-weight:400;}
.slot .lbl{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); margin-top:2px;}
.pips{display:flex; gap:3px; margin-top:7px;}
.pips i{height:4px; flex:1; border-radius:2px; background:var(--sunk);}

.dots{display:flex; gap:3px; flex:1; min-width:120px;}
.dots i{flex:1; height:9px; border-radius:2px; background:var(--sunk);}
.bar{height:7px; border-radius:99px; background:var(--sunk); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:99px;}

table{width:100%; border-collapse:collapse; font-size:14px;}
.scroll{overflow-x:auto; border-radius:0 0 var(--r) var(--r);}
th,td{text-align:left; padding:11px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
th:first-child,td:first-child{padding-left:12px;} th:last-child,td:last-child{padding-right:12px;}
th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:400;}
tr:last-child td{border-bottom:none;}
td.city{white-space:normal; min-width:104px;}
td.city b{font-weight:600;} td.city span{display:block; font-size:11.5px; color:var(--ink-3);}
tr.here{background:var(--accent-soft);}

.sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,14,13,.45);}
.sheetbox{width:100%; max-width:600px; max-height:88dvh; overflow:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border-radius:18px 18px 0 0; border:1px solid var(--line); padding:18px max(16px, env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));}
@media(min-width:640px){ .sheet{align-items:center;} .sheetbox{border-radius:18px; max-height:80vh;} }
.field{margin-bottom:12px;} .field label{display:block; margin-bottom:5px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.empty-note{padding:18px 14px; text-align:center; color:var(--ink-3); font-size:13.5px;}
.toast{position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:99px; font-size:13.5px; z-index:60; box-shadow:var(--shadow);}
hr.rule{border:none; border-top:1px solid var(--line); margin:18px 0;}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   Daylight
   Work is fixed to London (08:00-15:00 UTC), so where you sit decides the
   SHAPE of the day, not the amount of it: free morning equals your UTC
   offset, evening equals eight hours minus it. Flying west trades one for
   the other, hour for hour.
   ===================================================================== */

/* =====================================================================
   The library. Every row: title, where, hours, category, scope, flags, note.
   flags: i = indoors (works in rain), p = good with someone else.
   scope: sg = Singapore, reg = the region, home = no travel needed.
   Hours for regional trips are 10 for a day trip, 48 for a weekend.
   ===================================================================== */
const LIB_ROWS = [

/* --- Singapore: green and outdoors --- */
["MacRitchie TreeTop Walk","Central catchment",5,"move","sg","p","Suspension bridge over the canopy. Go early, before the heat and the crowds."],
["Southern Ridges, end to end","Mount Faber to Kent Ridge",3,"move","sg","p","Henderson Waves at dusk is the best twenty minutes of it."],
["Bukit Timah summit","Bukit Timah",2,"move","sg","","The highest point in Singapore, and it is 164 metres."],
["Sungei Buloh Wetlands","Kranji",3,"discover","sg","p","Mangroves, monitor lizards, and migratory birds between September and March."],
["Pulau Ubin by bike","Changi Point ferry",6,"discover","sg","p","Bumboat over, rent a bike, ride to Chek Jawa at low tide."],
["Coney Island","Punggol",3,"move","sg","p","Flat, shaded, and quiet on a weekday morning."],
["The Rail Corridor","Bukit Timah to Tanjong Pagar",3,"move","sg","","The old KTM line. Do one segment or the whole spine."],
["Labrador Nature Reserve","Labrador Park",2,"discover","sg","","WWII gun batteries and a stretch of coast most people miss."],
["Fort Canning tree tunnel","Fort Canning",2,"discover","sg","p","Get there before nine if you want the tunnel to yourself."],
["Botanic Gardens and the orchids","Tanglin",3,"discover","sg","p","The Orchid Garden earns its entry fee. The rest is free."],
["Cloud Forest","Gardens by the Bay",3,"enjoy","sg","ip","Cold, indoors, and the best thing to do in Singapore in the rain."],
["OCBC Skyway after dark","Gardens by the Bay",1,"enjoy","sg","p","Time it for the 19:45 light show and look down on it."],
["Cycle East Coast to Changi Village","East Coast",4,"move","sg","p","Finish with nasi lemak at Changi Village and take the bus back."],
["St John's and Lazarus Islands","Marina South Pier",6,"discover","sg","p","Ferry out, walk between them, and have the beach to yourself midweek."],
["Sisters' Islands","Marina South Pier",5,"discover","sg","p","Singapore's only marine park. Snorkelling on a good day."],
["Kranji Marshes","Kranji",3,"discover","sg","","Raptors, kingfishers, and almost nobody else."],
["Windsor Nature Park","Upper Thomson",2,"move","sg","","The quiet way into MacRitchie, on a boardwalk."],
["Wallace Trail, Dairy Farm","Bukit Panjang",2,"move","sg","","Short, steep, and named after the man who nearly beat Darwin to it."],
["Chestnut Nature Park","Upper Bukit Timah",3,"move","sg","","The only proper mountain bike trails on the island."],
["Pasir Ris mangrove boardwalk","Pasir Ris",2,"discover","sg","p","Herons at dawn, and a boardwalk straight through the mangrove."],
["Changi Point Coastal Walk","Changi",2,"move","sg","p","Ends at the ferry terminal, which is how Ubin days start."],
["Jurong Lake Gardens","Jurong",2,"move","sg","p","The best of the newer parks, and rarely busy."],
["Cable car from Mount Faber","Harbourfront",3,"enjoy","sg","p","Worth it once for the view, and once more at night."],
["Sembawang Hot Spring Park","Sembawang",2,"discover","sg","p","Boil an egg in the spring water. Genuinely, that is the activity."],
["Lorong Buangkok","Hougang",1,"discover","sg","","The last surviving kampong on the island. Go quietly, people live there."],
["Haw Par Villa","Pasir Panjang",2,"discover","sg","p","The Ten Courts of Hell. Not a gentle way to spend a morning."],
["Thow Kwang dragon kiln","Jurong",2,"discover","sg","p","One of two surviving dragon kilns. Open days only, so check first."],
["Fly a kite at Marina Barrage","Marina",2,"enjoy","sg","p","The rooftop is the only reliable wind in central Singapore."],
["Henderson Waves at sunrise","Mount Faber",1,"move","sg","p","Empty at six. Completely different place than in the evening."],
["Punggol Waterway","Punggol",2,"move","sg","p","Flat loop, good for a slow run or a first ride."],

/* --- Singapore: neighbourhoods --- */
["Tiong Bahru on foot","Tiong Bahru",2,"discover","sg","p","Art deco estate, the wet market upstairs, and two good bookshops."],
["Kampong Glam and Haji Lane","Bugis",2,"discover","sg","p","Sultan Mosque, then the lanes behind it, then a long coffee."],
["Little India and Tekka","Little India",2,"discover","sg","p","Loudest, densest, best-smelling two hours available."],
["Chinatown and the Tooth Relic","Chinatown",2,"discover","sg","p","The temple is free and the fourth floor is worth the stairs."],
["Joo Chiat and Katong","East Coast",3,"discover","sg","p","Peranakan shophouses, then laksa, in that order."],
["Geylang Serai market","Geylang",2,"discover","sg","p","Best in the run-up to Hari Raya, good the rest of the year."],
["Balestier heritage trail","Balestier",2,"discover","sg","","Shophouses, a Sun Yat Sen villa, and the bak kut teh afterwards."],
["Everton Park and Duxton","Tanjong Pagar",2,"discover","sg","p","Old estate, new cafes, murals worth the detour."],
["Dempsey Hill","Holland",3,"enjoy","sg","p","Old barracks turned into somewhere to spend a slow afternoon."],
["Holland Village","Holland",2,"enjoy","sg","p","Still the easiest place to lose two hours over lunch."],
["Jalan Besar","Jalan Besar",2,"discover","sg","p","Coffee, football history, and the last of the old trades."],
["Emerald Hill shophouses","Orchard",1,"discover","sg","p","Two minutes off Orchard Road and a century away from it."],
["Bukit Pasoh","Outram",2,"discover","sg","p","Clan associations by day, small restaurants by night."],
["Kallang Riverside","Kallang",2,"move","sg","p","Run the river, then watch whoever is training on the water."],

/* --- Singapore: food --- */
["Old Airport Road Food Centre","Mountbatten",2,"enjoy","sg","ip","Arguably the best hawker centre on the island. Go hungry."],
["Maxwell Food Centre","Chinatown",1,"enjoy","sg","ip","Famous, busy, and still good. Get there before noon."],
["Chomp Chomp","Serangoon Gardens",2,"enjoy","sg","p","Night only. Satay, sting ray, and sugar cane juice."],
["Tiong Bahru Market","Tiong Bahru",1,"enjoy","sg","ip","Breakfast upstairs, then walk the estate below."],
["Golden Mile Complex","Beach Road",2,"enjoy","sg","ip","Thai food and a building worth seeing while it is still there."],
["Zion Riverside Food Centre","River Valley",1,"enjoy","sg","ip","Small, riverside, and quietly one of the better ones."],
["Amoy Street Food Centre","Telok Ayer",1,"enjoy","sg","i","Office-lunch chaos at noon. Calm and excellent at two."],
["Adam Road Food Centre","Bukit Timah",1,"enjoy","sg","i","Worth the trip for the nasi lemak alone."],
["Newton Food Centre","Newton",1,"enjoy","sg","ip","Touristy and everyone says so. The satay is still the satay."],
["Tekka Centre","Little India",1,"enjoy","sg","i","Biryani downstairs, fabric upstairs."],
["Katong laksa, properly","Katong",2,"enjoy","sg","p","Try two rival shops in one sitting and pick a side."],
["Balestier bak kut teh","Balestier",1,"enjoy","sg","i","Peppery Teochew style. Free soup refills, always."],
["Geylang after midnight","Geylang",2,"enjoy","sg","","Frog porridge at one in the morning is a local rite."],
["Three hawker centres on foot","Anywhere central",3,"enjoy","sg","p","One dish each, walk between them. The best cheap day out here."],

/* --- Singapore: indoors and culture --- */
["National Gallery Singapore","City Hall",3,"enjoy","sg","ip","Two old buildings, one great collection, and a rooftop bar."],
["ArtScience Museum","Marina Bay",2,"enjoy","sg","ip","Hit and miss by exhibition. Check what is on before going."],
["National Museum of Singapore","Bras Basah",3,"enjoy","sg","i","The history gallery is genuinely well done."],
["Peranakan Museum","Armenian Street",2,"enjoy","sg","ip","Small, sharp, and the best context for Katong afterwards."],
["Asian Civilisations Museum","Empress Place",2,"enjoy","sg","i","The shipwreck gallery alone is worth the visit."],
["Singapore Art Museum","Tanjong Pagar Distripark",2,"enjoy","sg","ip","Contemporary, in a working port warehouse."],

/* Great-circle distance in km - enough precision for "which is nearest". */
function distKm(aLat, aLon, bLat, bLon){
  const R = 6371, p = Math.PI/180;
  const dLat = (bLat-aLat)*p, dLon = (bLon-aLon)*p;
  const h = Math.sin(dLat/2)**2 + Math.cos(aLat*p)*Math.cos(bLat*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function coffeeMatches(){
  const q = (S.ui.cq || "").trim().toLowerCase();
  let list = COFFEE.filter(x =>
    (!q || x.n.toLowerCase().indexOf(q) >= 0) && (!S.ui.cd || x.d === S.ui.cd));
  const me = S.ui.near;
  if(me){
    list = list.map(x => Object.assign({km: distKm(me[0], me[1], x.lat, x.lon)}, x))
               .sort((a,b) => a.km - b.km);
  } else {
    list = list.slice().sort((a,b) => a.n.toLowerCase() < b.n.toLowerCase() ? -1 : 1);
  }
  return list;
}
const COFFEE_PAGE = 60;

function migrate(){
  let old = null;
  try{ const r = localStorage.getItem("daylight.v1"); if(r) old = JSON.parse(r); }catch(e){}
  if(!old) return null;
  const s = seed();
  if(old.profile) s.profile = Object.assign(s.profile, old.profile);

  if(Array.isArray(old.routine) && old.routine.length){
    s.habits = old.routine.map(r => ({id:r.id, name:r.label, anchor:"wake", tiny:"", days:[0,1,2,3,4,5,6]}));

  if(old.routineLog) s.habitLog = old.routineLog;
  if(Array.isArray(old.log)) s.log = old.log;
  if(old.routineLog) s.routineLog = old.routineLog;
  if(Array.isArray(old.places)){

                     h:p.hours || 3, c:"discover", s:"sg", indoor:false, pair:true, n:"",

}

/* ---------------------------- time ---------------------------- */
const pad = n => String(n).padStart(2,"0");
const t2m = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
function hhmm(m){ const x = ((m % 1440) + 1440) % 1440; return pad(Math.floor(x/60))+":"+pad(x%60); }
function dur(m){
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m/60), r = m%60;
  return h ? (r ? h+"h "+pad(r)+"m" : h+"h") : r+"m";
}
function hrs(m){ return (Math.round(m/6)/10) + "h"; }
function span(h){ return h >= 24 ? Math.round(h/24)+" days" : h+"h"; }
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ const x = new Date(d); return addDays(x, -((x.getDay()+6)%7)); }

const camp = code => CAMPS.find(c => c.code === code) || CAMPS.find(c => c.code === "SIN");

function shape(c){
  const start = S.profile.workStartUTC + c.off;
  const end   = S.profile.workEndUTC   + c.off;
  const wake  = t2m(S.profile.wake);
  return { start, end, startT:hhmm(start), endT:hhmm(end),
           morning:Math.max(0, start - wake), evening:Math.max(0, 1380 - end), late:end >= 1440 };
}
function verdict(c){

  if(s.late) return {t:s.endT+" finish", k:"warn"};
  if(c.off === 480) return {t:"Same", k:""};
  if(s.evening >= 210) return {t:"Best shape", k:"good"};
  if(s.evening >= 60) return {t:"Gains a PM", k:"sig"};
  return {t:"Marginal", k:""};
}

function nowLocal(){
  const d = new Date();
  return (d.getUTCHours()*60 + d.getUTCMinutes() + camp(S.profile.camp).off + 1440) % 1440;
}

/* ---------------------------- ideas ---------------------------- */
function allIdeas(){ return LIB.concat(S.custom); }
function isBeen(id){ return !!S.been[id]; }
function isSaved(id){ return S.saved.indexOf(id) >= 0; }

/* Free hours left today at the current basecamp - used to pre-filter suggestions. */
function hoursLeftToday(){
  const c = camp(S.profile.camp), s = shape(c), n = nowLocal();
  if(n < s.start) return (s.start - n)/60 + s.evening/60;
  if(n < s.end) return s.evening/60;
  return Math.max(0, (1380 - n)/60);
}

function filtered(){
  const u = S.ui;
  return allIdeas().filter(x => {
    if(u.fScope !== "all" && x.s !== u.fScope) return false;
    if(u.fHours && x.h > u.fHours) return false;
    if(u.fPair && !x.pair) return false;
    if(u.fIndoor && !x.indoor) return false;
    return true;
  });
}

function hash32(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
/* Shuffle the pool into a stable order for the day, then walk it. Deterministic,
   so a re-render never reshuffles under your thumb, and "something else" cannot
   hand you the same idea twice until the whole pool is exhausted. */
function pickFrom(pool){
  if(!pool.length) return null;
  const salt = key(new Date());
  const ordered = pool.slice().sort((a,b) => hash32(a.id + salt) - hash32(b.id + salt));
  return ordered[((S.ui.roll % ordered.length) + ordered.length) % ordered.length];
}
function rollPick(){ return pickFrom(filtered().filter(x => !isBeen(x.id))); }

/* Today's suggestion ignores the browse filters and obeys one rule instead:
   it has to actually fit in the hours left before the day runs out.
   Coffee is held back to every third roll - there are enough cafes, and they
   fit every slot, that they would otherwise crowd out everything else. */
function todayPick(){
  const cap = hoursLeftToday();
  const coffeeTurn = S.ui.roll % 3 === 0;
  const ok = x => !isBeen(x.id) && (coffeeTurn || x.s !== "cafe");
  let pool = allIdeas().filter(x => ok(x) && x.h <= cap);
  if(!pool.length) pool = allIdeas().filter(x => ok(x) && x.h <= Math.max(1, cap));
  if(!pool.length) pool = allIdeas().filter(x => !isBeen(x.id) && x.h <= Math.max(1, cap));
  return pickFrom(pool);
}

function markBeen(x){
  S.been[x.id] = key(new Date());
  S.saved = S.saved.filter(i => i !== x.id);
  S.log.push({id:uid(), cat:x.c, label:x.t, date:key(new Date())});
  save();
}

   starts, so they move with you rather than being clock times you must obey. */

  return [

    {k:"prework", label:"Before the shift",at:Math.max(wake, s.start - 60)},
    {k:"post",    label:"After the shift", at:s.end}
  ];
}

function habitApplies(h, d){ return (h.days || [0,1,2,3,4,5,6]).indexOf(d.getDay()) >= 0; }
function habitDone(h, d){ return (S.habitLog[key(d)] || []).indexOf(h.id) >= 0; }
function habitShare(h){
  let done = 0, poss = 0;
  for(let i=0;i<14;i++){
    const d = addDays(new Date(), -i);
    if(!habitApplies(h, d)) continue;
    poss++; if(habitDone(h, d)) done++;
  }
  return poss ? Math.round(done/poss*100) : 0;
}
/* The only alarm worth raising. Missing once is normal and forgiven; missing
   twice in a row is how a habit actually dies, so that is what gets flagged. */
function missedLastTime(h){
  for(let i=1;i<=7;i++){
    const d = addDays(new Date(), -i);
    if(!habitApplies(h, d)) continue;
    return !habitDone(h, d);
  }
  return false;
}
function everDone(h){
  for(let i=0;i<14;i++){ if(habitDone(h, addDays(new Date(), -i))) return true; }
  return false;
}
/* A habit you have never started is not "at risk" - it is just new. Only warn
   about dropping something you were actually doing. */
function atRisk(h){
  const t = new Date();
  return habitApplies(h, t) && !habitDone(h, t) && everDone(h) && missedLastTime(h);
}
function habitDots(h){
  let out = "";
  for(let i=13;i>=0;i--){
    const d = addDays(new Date(), -i);
    out += habitApplies(h, d)
      ? '<i style="background:'+(habitDone(h,d) ? "var(--good)" : "var(--sunk)")+'"></i>'
      : '<i style="opacity:.2"></i>';
  }
  return '<div class="dots">'+out+"</div>";
}

  if(wire) wire(sheetEl);
}

/* ---------------------------- header ---------------------------- */
function header(){
  const c = camp(S.profile.camp), s = shape(c), n = nowLocal();
  const wake = t2m(S.profile.wake);
  const a = wake, b = Math.max(s.end, 1380), width = b - a;

  const segs = [];
  const push = (k, x, y, label) => { if(y > x) segs.push({k, w:(y-x)/width*100, x, y, label}); };
  push("free", a, s.start, "Free \u00b7 " + hrs(s.morning));
  push("work", s.start, s.end, "Work");
  push("eve", s.end, b, s.evening >= 60 ? "Evening \u00b7 " + hrs(s.evening) : "");

  const bar = segs.map(g => {
    const passed = Math.min(1, Math.max(0, (n - g.x)/(g.y - g.x)));
    return '<div class="seg seg-'+g.k+'" style="flex:0 0 '+g.w.toFixed(3)+'%">'
      + '<div class="fill" style="width:'+(passed*100).toFixed(1)+'%"></div>'
      + (g.w >= 15 && g.label ? "<em>"+g.label+"</em>" : "") + "</div>";
  }).join("");
  const pos = Math.min(100, Math.max(0, (n - a)/width*100));
  const marker = (n >= a && n <= b) ? '<div class="nowline" style="left:'+pos.toFixed(2)+'%"></div>' : "";

  let big, small;
  if(n < s.start){ big = dur(s.start - n); small = "until work at " + s.startT; }
  else if(n < s.end){ big = dur(s.end - n); small = "left of the shift"; }
  else { big = s.evening >= 60 ? dur(Math.max(0, 1380 - n)) : "\u2014"; small = s.evening >= 60 ? "of evening left" : "day's done"; }

  const d = new Date();
  return '<header><div class="brandrow"><div>'
    + '<div class="brand">Day<em>light</em></div>'
    + '<button class="where" data-camp="1"><b>'+esc(c.city)+"</b> \u00b7 UTC+"+(c.off/60)
    + " \u00b7 " + DAYNAME[d.getDay()] + "</button></div>"
    + '<div class="countdown"><b>'+big+"</b><span>"+small+"</span></div></div>"
    + '<div class="daybar">'+bar+marker+"</div>"
    + '<div class="scale"><span>'+hhmm(a)+"</span><span>"+hhmm(b)+"</span></div></header>";
}

/* ============================ habits ============================ */
function habitsSection(){
  const t = new Date();
  const due = S.habits.filter(h => habitApplies(h, t));
  const done = due.filter(h => habitDone(h, t)).length;
  const risky = due.filter(atRisk);

  let html = '<section><div class="sechead"><h2>Habits</h2>'
    + '<span class="eyebrow">'+done+" / "+due.length+" today</span></div>";

  if(risky.length){
    html += '<div class="card" style="padding:14px 15px; margin-bottom:10px; background:var(--signal-soft); border-color:var(--signal)">'
      + '<div class="eyebrow" style="color:var(--signal)">Do not miss twice</div>'
      + '<p style="margin:6px 0 0; font-size:13.5px; color:var(--ink-2)">You missed '
      + risky.map(h => '<strong style="color:var(--ink)">'+esc(h.name)+"</strong>").join(" and ")
      + " last time. Missing once is nothing at all. Missing twice is how a habit ends "
      + "&mdash; so do the small version if that is all today has in it.</p></div>";
  }

  if(!due.length){
    html += '<div class="card empty-note">Nothing due today.</div>';
  } else {
    html += '<div class="card">';
    anchors().forEach(a => {
      const list = due.filter(h => (h.anchor || "wake") === a.k);
      if(!list.length) return;
      html += '<div class="cardhead" style="border-radius:0"><div class="row" style="gap:8px">'
        + '<strong style="font-size:13px">'+a.label+"</strong>"
        + '<span class="chip mono">'+hhmm(a.at)+"</span></div>"
        + '<span class="dim mono" style="font-size:11px">'+list.filter(h=>habitDone(h,t)).length+"/"+list.length+"</span></div>";
      list.forEach(h => {
        const on = habitDone(h, t), risk = atRisk(h);
        html += '<div class="item'+(on?" done":"")+'">'
          + '<button class="tick sq'+(on?" on":"")+'" data-hab="'+h.id+'" aria-label="Done">'
          + '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></button>'
          + '<div class="itembody"><div class="itemtitle">'+esc(h.name)+"</div>"
          + (h.tiny && !on ? '<div class="itemnote">Bad day version: '+esc(h.tiny)+"</div>" : "")
          + '<div class="itemmeta">'+habitDots(h)
          + '<span class="mono">'+habitShare(h)+"%</span>"
          + (risk ? '<span class="chip sig">missed last time</span>' : "") + "</div></div>"
          + '<button class="dim" data-habedit="'+h.id+'" aria-label="Edit" style="font-size:11px; padding:2px 6px">edit</button></div>';
      });
    });
    html += "</div>";
  }
  html += '<div class="row" style="gap:9px; margin-top:10px">'
    + '<button class="btn sm ghost" data-newhab="1">Add a habit</button></div>'
    + '<p class="dim" style="font-size:12px; margin:9px 0 0">Fourteen days shown per habit. '
    + "No streaks &mdash; one miss costs a fourteenth, not the lot.</p></section>";
  return html;
}

/* ============================ REVIEW ============================ */
function viewReview(){
  const hs = S.habits || [];
  const been = Object.keys(S.been).length;
  const from = addDays(new Date(), -27);
  const recent = logsIn(from, new Date());

  let html = '<section><div class="sechead"><h2>Last four weeks</h2></div>'
    + '<div class="card" style="padding:16px; margin-bottom:12px">'
    + '<div class="eyebrow" style="margin-bottom:13px">Habits, last 14 days</div>'
    + (hs.length ? hs.map(h =>
        '<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between; gap:10px; margin-bottom:6px">'
        + '<span style="font-size:13.5px">'+esc(h.name)+"</span>"
        + '<span class="mono dim" style="font-size:12px">'+habitShare(h)+"%</span></div>"
        + habitDots(h)
        + '<div class="dim" style="font-size:11.5px; margin-top:5px">'+(ANCHORS[h.anchor]||"On waking")
        + ((h.days||[]).length === 5 ? " &middot; weekdays" : "") + "</div></div>").join("")
      : '<div class="empty-note">No habits yet.</div>')
    + '<p class="dim" style="font-size:12px; margin:2px 0 0">Faint squares are days it did not apply. '
    + "A share, not a streak: one miss costs a fourteenth.</p></div>";

  html += '<div class="card" style="padding:16px; margin-bottom:12px">'
    + '<div class="row" style="justify-content:space-between; align-items:baseline">'
    + '<div><div class="eyebrow">Been to</div>'
    + '<div class="mono" style="font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1.1">'+been+"</div></div>"
    + '<div class="dim" style="font-size:12px; text-align:right">of '+allIdeas().length+" ideas<br>on the list</div></div>"
    + '<div class="bar" style="margin-top:11px"><i style="width:'+(been/allIdeas().length*100).toFixed(1)+'%; background:var(--discover)"></i></div></div>';

  const weeks = [];
  for(let w=3; w>=0; w--){
    const ws = weekStart(addDays(new Date(), -7*w)), we = addDays(ws, 6);
    const by = {}; Object.keys(CATS).forEach(k => by[k]=0);
    logsIn(ws, we).forEach(l => { if(by[l.cat] !== undefined) by[l.cat]++; });
    weeks.push({ws, by, sum:Object.values(by).reduce((a,b)=>a+b,0)});
  }
  const peak = Math.max(4, ...weeks.map(w => w.sum));
  html += '<div class="card" style="padding:16px; margin-bottom:12px"><div class="eyebrow" style="margin-bottom:12px">By week</div>'
    + '<div style="display:flex; gap:10px; align-items:flex-end; height:96px">'
    + weeks.map(w => '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end">'
        + '<div style="width:100%; height:'+Math.max(3, w.sum/peak*100)+'%; border-radius:5px 5px 0 0; overflow:hidden; display:flex; flex-direction:column-reverse">'
        + Object.keys(CATS).map(k => w.by[k] ? '<div style="height:'+(w.by[k]/w.sum*100)+"%; background:"+CATS[k].color+'"></div>' : "").join("")
        + '</div><span class="mono dim" style="font-size:10px">'+pad(w.ws.getDate())+"."+pad(w.ws.getMonth()+1)+"</span></div>").join("")
    + "</div></div>";

  html += '<div class="card" style="padding:16px; margin-bottom:12px"><div class="eyebrow" style="margin-bottom:12px">Where it went</div>';
  const tot = recent.length || 1;
  Object.keys(CATS).forEach(k => {
    const n = recent.filter(l => l.cat === k).length, p = Math.round(n/tot*100);
    const want4 = (S.targets[k]||0)*4;
    html += '<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between; margin-bottom:5px">'
      + '<span class="row" style="gap:7px; font-size:13.5px">'+catDot(k)+CATS[k].label+"</span>"
      + '<span class="mono dim" style="font-size:12px">'+n+" / "+want4+" \u00b7 "+p+"%</span></div>"
      + '<div class="bar"><i style="width:'+(want4?Math.min(100,n/want4*100):0)+"%; background:"+CATS[k].color+'"></i></div></div>';
  });
  html += "</div>";

  html += '<div class="sechead" style="margin-top:20px"><h2>Weekly targets</h2></div>'
    + '<div class="card" style="padding:15px"><div class="grid2">'
    + Object.keys(CATS).map(k => '<div class="field"><label class="eyebrow">'+CATS[k].label+"</label>"
        + '<input type="number" min="0" max="14" class="mono" value="'+(S.targets[k]||0)+'" data-tgt="'+k+'"></div>').join("")
    + "</div></div>";

  html += '<hr class="rule"><div class="row" style="gap:9px">'
    + '<button class="btn ghost" data-export="1">Export</button>'
    + '<button class="btn ghost" data-import="1">Import</button></div>'
    + '<p class="dim" style="font-size:12px; margin-top:9px">Stored on this device only. Export before clearing browser data.</p>';
  return html + "</section>";
}

function logSheet(cat){
  openSheet("<h2 style='font-size:17px; margin-bottom:6px'>Log "+CATS[cat].label+"</h2>"
    + '<p class="muted" style="font-size:13.5px; margin:0 0 14px">'+CATS[cat].blurb+"</p>"
    + '<div class="field"><label class="eyebrow">What was it? (optional)</label><input id="lg"></div>'
    + '<button class="btn block" data-submit="1">Log it</button>'
    + '<button class="btn ghost block" style="margin-top:9px" data-close="1">Cancel</button>',
    el => {
      const go = () => {
        S.log.push({id:uid(), cat, label:el.querySelector("#lg").value.trim(), date:key(new Date())});
        save(); closeSheet(); render(); toast(CATS[cat].label + " logged");
      };
      el.querySelector("[data-submit]").addEventListener("click", go);
      el.querySelector("#lg").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
      el.querySelector("[data-close]").addEventListener("click", closeSheet);
    });
}

function ideaSheet(){
  openSheet("<h2 style='font-size:17px; margin-bottom:14px'>Add an idea</h2>"
    + '<div class="field"><label class="eyebrow">What</label><input id="it" placeholder="e.g. Kayak to Pulau Ubin"></div>'
    + '<div class="field"><label class="eyebrow">Why, in a line (optional)</label><input id="in"></div>'
    + '<div class="grid2"><div class="field"><label class="eyebrow">Where</label><input id="iw" value="Singapore"></div>'
    + '<div class="field"><label class="eyebrow">Hours</label><input id="ih" type="number" min="1" max="200" class="mono" value="3"></div></div>'
    + '<div class="grid2"><div class="field"><label class="eyebrow">Kind</label><select id="ic">'
    + Object.keys(CATS).map(k => '<option value="'+k+'">'+CATS[k].label+"</option>").join("") + "</select></div>"
    + '<div class="field"><label class="eyebrow">Scope</label><select id="is">'
    + Object.keys(SCOPES).map(k => '<option value="'+k+'">'+SCOPES[k]+"</option>").join("") + "</select></div></div>"
    + '<button class="btn block" data-submit="1">Add</button>'
    + '<button class="btn ghost block" style="margin-top:9px" data-close="1">Cancel</button>',
    el => {
      el.querySelector("[data-submit]").addEventListener("click", () => {
        const t = el.querySelector("#it").value.trim();
        if(!t){ toast("Needs a name"); return; }
        S.custom.push({ id:"C"+uid(), t, n:el.querySelector("#in").value.trim(),
          w:el.querySelector("#iw").value.trim() || "Singapore",
          h:Math.max(1, +el.querySelector("#ih").value || 3),
          c:el.querySelector("#ic").value, s:el.querySelector("#is").value,
          indoor:false, pair:true });
        save(); closeSheet(); render(); toast("Added");
      });
      el.querySelector("[data-close]").addEventListener("click", closeSheet);
    });
}

function habitSheet(h){
  const isNew = !h;
  const v = h || {name:"", anchor:"wake", tiny:"", days:[0,1,2,3,4,5,6]};
  const dayMode = (v.days || []).length === 5 ? "week" : ((v.days || []).length === 2 ? "wend" : "all");
  openSheet("<h2 style='font-size:17px; margin-bottom:6px'>"+(isNew?"New habit":"Edit habit")+"</h2>"
    + '<p class="muted" style="font-size:13.5px; margin:0 0 15px">Anchor it to something that already happens. '
    + "That way there is no new decision to make.</p>"
    + '<div class="field"><label class="eyebrow">The habit</label>'
    + '<input id="hn" value="'+esc(v.name)+'" placeholder="e.g. Twenty minutes of Malay"></div>'
    + '<div class="field"><label class="eyebrow">Bad day version</label>'
    + '<input id="ht" value="'+esc(v.tiny||"")+'" placeholder="The two-minute one you can always do">'
    + '<p class="dim" style="font-size:12px; margin:6px 0 0">What keeps a habit alive is doing the small one, not skipping.</p></div>'
    + '<div class="grid2"><div class="field"><label class="eyebrow">When</label><select id="ha">'
    + Object.keys(ANCHORS).map(k => '<option value="'+k+'"'+(v.anchor===k?" selected":"")+">"+ANCHORS[k]+"</option>").join("")
    + '</select></div><div class="field"><label class="eyebrow">Which days</label><select id="hd">'
    + [["all","Every day"],["week","Weekdays"],["wend","Weekends"]].map(([k,l]) =>
        '<option value="'+k+'"'+(dayMode===k?" selected":"")+">"+l+"</option>").join("")
    + "</select></div></div>"
    + '<button class="btn block" data-submit="1">Save</button>'
    + (isNew ? "" : '<button class="btn ghost block" style="margin-top:9px; color:var(--crit); border-color:var(--crit)" data-hdel="1">Delete</button>')
    + '<button class="btn ghost block" style="margin-top:9px" data-close="1">Cancel</button>',
    el => {
      el.querySelector("[data-submit]").addEventListener("click", () => {
        const name = el.querySelector("#hn").value.trim();
        if(!name){ toast("Give it a name"); return; }
        const dm = el.querySelector("#hd").value;
        const days = dm === "week" ? [1,2,3,4,5] : dm === "wend" ? [0,6] : [0,1,2,3,4,5,6];
        const next = {name, tiny:el.querySelector("#ht").value.trim(), anchor:el.querySelector("#ha").value, days};
        if(isNew) S.habits.push(Object.assign({id:uid()}, next)); else Object.assign(h, next);
        save(); closeSheet(); render(); toast(isNew ? "Added" : "Saved");
      });
      const del = el.querySelector("[data-hdel]");
      if(del) del.addEventListener("click", () => {
        S.habits = S.habits.filter(x => x.id !== h.id);
        save(); closeSheet(); render(); toast("Deleted");
      });
      el.querySelector("[data-close]").addEventListener("click", closeSheet);
    });
}

function exportData(){
  const json = JSON.stringify(S, null, 2);
  (async () => {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if(dl){
      try{ await dl.save({filename:"daylight-"+key(new Date())+".json", data:json}); toast("Exported"); return; }
      catch(e){ /* declined - fall through to copy */ }
    }
    openSheet("<h2 style='font-size:17px; margin-bottom:12px'>Copy your data</h2>"
      + '<textarea rows="12" class="mono" style="font-size:11px">'+esc(json)+"</textarea>"
      + '<button class="btn ghost block" style="margin-top:12px" data-close="1">Done</button>',
      el => el.querySelector("[data-close]").addEventListener("click", closeSheet));
  })();
}
function importData(){
  openSheet("<h2 style='font-size:17px; margin-bottom:12px'>Import</h2>"
    + '<p class="muted" style="font-size:13.5px; margin:0 0 11px">Replaces everything on this device.</p>'
    + '<textarea id="imp" rows="10" class="mono" style="font-size:11px" placeholder="{ ... }"></textarea>'
    + '<button class="btn block" style="margin-top:12px" data-impgo="1">Replace my data</button>'
    + '<button class="btn ghost block" style="margin-top:9px" data-close="1">Cancel</button>',
    el => {
      el.querySelector("[data-impgo]").addEventListener("click", () => {
        try{
          const next = JSON.parse(el.querySelector("#imp").value);
          if(!next || !Array.isArray(next.log)) throw new Error("bad shape");
          S = next; S.ui = Object.assign(seed().ui, S.ui || {}); save(); closeSheet(); render(); toast("Imported");
        }catch(e){ toast("That isn't a valid export"); }
      });
      el.querySelector("[data-close]").addEventListener("click", closeSheet);
    });
}

/* ============================ the bot's record ============================
   The bot asks, you reply in Telegram, it commits the answer to bot/state.json.
   On GitHub Pages that file is same-origin, so this reads it directly - the app
   never asks you to log anything. Anywhere else it simply stays hidden. */
let BOT = null;
function loadBot(){
  return fetch("../bot/state.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(j => { BOT = (j && j.days) ? j : null; })
    .catch(() => { BOT = null; });
}
function botDays(n){
  if(!BOT) return [];
  const out = [];
  for(let i=0;i<n;i++){
    const k = key(addDays(new Date(), -i)), e = BOT.days[k];
    if(e && e.commitment) out.push(Object.assign({date:k}, e));
  }
  return out;
}
function botSection(){
  if(!BOT) return "";
  const recent = botDays(14);
  if(!recent.length) return "";
  const kept = recent.filter(d => d.done === true).length;
  const broke = recent.filter(d => d.done === false).length;
  const silent = recent.length - kept - broke;
  const today = BOT.days[key(new Date())] || {};

  let html = '<section><div class="sechead"><h2>What you told the bot</h2>'
    + '<span class="eyebrow">last 14 days</span></div>';
  if(today.commitment){
    html += '<div class="pitch" style="margin-bottom:12px">'
      + '<div class="eyebrow">Today you said</div><h3>'+esc(today.commitment)+"</h3>"
      + '<div class="p-meta">'
      + (today.done === true ? '<span class="chip good">done</span>'
        : today.done === false ? '<span class="chip warn">not done</span>'
        : '<span class="chip">not answered yet</span>') + "</div></div>";
  }
  html += '<div class="card" style="padding:16px">'
    + '<div class="row" style="gap:18px; flex-wrap:wrap">'
    + '<div><div class="eyebrow">Kept</div><div class="mono" style="font-size:26px; font-weight:700; color:var(--good)">'+kept+"</div></div>"
    + '<div><div class="eyebrow">Not done</div><div class="mono" style="font-size:26px; font-weight:700">'+broke+"</div></div>"
    + '<div><div class="eyebrow">Never answered</div><div class="mono" style="font-size:26px; font-weight:700; color:var(--signal)">'+silent+"</div></div>"
    + "</div>"
    + '<p class="dim" style="font-size:12px; margin:12px 0 0">Straight from the bot. You did not type any of this into the app '
    + "&mdash; which is the point.</p></div></section>";
  return html;
}

/* ============================ render ============================ */
const VIEWS = {today:viewToday, ideas:viewIdeas, where:viewWhere, review:viewReview};

function render(){
  document.getElementById("root").innerHTML = header() + (VIEWS[S.ui.view] || viewToday)();
  document.querySelectorAll("nav").forEach(n => n.remove());
  document.body.insertAdjacentHTML("beforeend", nav());
  wire();
}
function on(sel, fn){ document.querySelectorAll(sel).forEach(el => el.addEventListener("click", () => fn(el))); }

function wireCoffeeRows(){
  document.querySelectorAll("[data-cbeen]").forEach(el => el.addEventListener("click", () => {
    const x = COFFEE.find(y => y.id === el.dataset.cbeen);
    if(!x) return;
    if(isBeen(x.id)){
      delete S.been[x.id];
      const i = S.log.map(l => l.label).lastIndexOf(x.n);
      if(i >= 0) S.log.splice(i,1);
      save();
    } else {
      S.been[x.id] = key(new Date());
      S.log.push({id:uid(), cat:"enjoy", label:x.n, date:key(new Date())});
      save(); toast("Logged - " + x.n);
    }
    const list = document.getElementById("clist");
    if(list){ list.innerHTML = coffeeListHTML(); wireCoffeeRows(); }
  }));
}

function wire(){
  on("[data-go]", el => { S.ui.view = el.dataset.go; save(); render(); window.scrollTo(0,0); });
  on("[data-camp]", campSheet);

  on("[data-hab]", el => {
    const k = key(new Date()), list = S.habitLog[k] || [];
    const i = list.indexOf(el.dataset.hab);
    if(i >= 0) list.splice(i,1); else list.push(el.dataset.hab);
    S.habitLog[k] = list; save(); render();
  });
  on("[data-newhab]", () => habitSheet(null));
  on("[data-habedit]", el => habitSheet(S.habits.find(h => h.id === el.dataset.habedit)));
  on("[data-log]", el => logSheet(el.dataset.log));
  on("[data-rmlog]", el => { S.log = S.log.filter(l => l.id !== el.dataset.rmlog); save(); render(); });

  on("[data-roll]", () => { S.ui.roll++; save(); render(); });
  on("[data-been]", el => {
    const x = allIdeas().find(y => y.id === el.dataset.been);
    if(!x) return;
    markBeen(x); render(); toast("Logged as " + CATS[x.c].label);
  });
  on("[data-unbeen]", el => {
    delete S.been[el.dataset.unbeen];
    const x = allIdeas().find(y => y.id === el.dataset.unbeen);
    if(x){ const i = S.log.map(l => l.label).lastIndexOf(x.t); if(i >= 0) S.log.splice(i,1); }
    save(); render();
  });
  on("[data-save]", el => {
    const id = el.dataset.save;
    if(isSaved(id)) S.saved = S.saved.filter(i => i !== id); else S.saved.push(id);
    save(); render();
  });
  on("[data-unsave]", el => { S.saved = S.saved.filter(i => i !== el.dataset.unsave); save(); render(); });
  on("[data-newidea]", ideaSheet);

  on("[data-fs]", el => { S.ui.fScope = el.dataset.fs; S.ui.roll++; S.ui.cn = COFFEE_PAGE; save(); render(); });

  /* Search updates only the list, so the keyboard and caret stay put. */
  const cq = document.getElementById("cq");
  if(cq) cq.addEventListener("input", () => {
    S.ui.cq = cq.value; S.ui.cn = COFFEE_PAGE; save();
    const list = document.getElementById("clist");
    if(list){ list.innerHTML = coffeeListHTML(); wireCoffeeRows(); }
    const head = document.querySelector(".sechead .eyebrow");
    void head;
  });
  const cd = document.getElementById("cd");
  if(cd) cd.addEventListener("change", () => { S.ui.cd = cd.value; S.ui.cn = COFFEE_PAGE; save(); render(); });
  on("[data-cmore]", () => { S.ui.cn = (S.ui.cn || COFFEE_PAGE) + COFFEE_PAGE; save();
    const list = document.getElementById("clist");
    if(list){ list.innerHTML = coffeeListHTML(); wireCoffeeRows(); } });
  on("[data-near]", () => {
    if(S.ui.near){ S.ui.near = null; save(); render(); return; }
    if(!navigator.geolocation){ toast("This browser will not share location"); return; }
    toast("Finding you...");
    navigator.geolocation.getCurrentPosition(
      pos => { S.ui.near = [pos.coords.latitude, pos.coords.longitude]; S.ui.cn = COFFEE_PAGE; save(); render(); },
      ()  => toast("Could not get your location"),
      {timeout:8000, maximumAge:300000});
  });
  wireCoffeeRows();
  on("[data-fh]", el => { S.ui.fHours = +el.dataset.fh; S.ui.roll++; save(); render(); });
  on("[data-fp]", () => { S.ui.fPair = !S.ui.fPair; S.ui.roll++; save(); render(); });
  on("[data-fi]", () => { S.ui.fIndoor = !S.ui.fIndoor; S.ui.roll++; save(); render(); });

  on("[data-export]", exportData);
  on("[data-import]", importData);
  document.querySelectorAll("[data-tgt]").forEach(el =>
    el.addEventListener("change", () => { S.targets[el.dataset.tgt] = Math.max(0, +el.value || 0); save(); render(); }));
}

render();
loadBot().then(() => { if(BOT) render(); });
setInterval(() => {
  if(sheetEl) return;
  const h = document.querySelector("header");
  if(!h) return;
  h.outerHTML = header();
  on("[data-camp]", campSheet);
}, 60000);
</script>
