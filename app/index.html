<title>Daylight</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#EDEFEC; --surface:#FBFCFA; --surface-2:#E4E8E3; --sunk:#E0E4DF;
  --line:#D4D9D3; --line-strong:#B7BFB9;
  --ink:#141B18; --ink-2:#4A5551; --ink-3:#79847F;
  --accent:#1F4FE0; --accent-soft:#DDE4FB; --on-accent:#FFFFFF;
  --signal:#B35C0C; --signal-soft:#F7E6D4;
  --good:#2C7A51; --good-soft:#DCEDE3; --warn:#916510; --crit:#A03830; --crit-soft:#F3DEDC;
  --build:#3D4CBE; --move:#2C7A51; --enjoy:#A0447E; --discover:#B35C0C; --campaign:#0F6E70;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(20,27,24,.06), 0 6px 18px -10px rgba(20,27,24,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
    --line:#293430; --line-strong:#3C4945;
    --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
    --accent:#7C9BFF; --accent-soft:#1C2647; --on-accent:#0D1211;
    --signal:#E09453; --signal-soft:#2E2317;
    --good:#5CB585; --good-soft:#16261D; --warn:#D6A44E; --crit:#E08A82; --crit-soft:#2C1C1C;
    --build:#8B96EE; --move:#5CB585; --enjoy:#DE86BC; --discover:#E09453; --campaign:#4FB3B5;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
  --line:#293430; --line-strong:#3C4945;
  --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
  --accent:#7C9BFF; --accent-soft:#1C2647; --on-accent:#0D1211;
  --signal:#E09453; --signal-soft:#2E2317;
  --good:#5CB585; --good-soft:#16261D; --warn:#D6A44E; --crit:#E08A82; --crit-soft:#2C1C1C;
  --build:#8B96EE; --move:#5CB585; --enjoy:#DE86BC; --discover:#E09453; --campaign:#4FB3B5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
#root{max-width:600px; margin:0 auto; padding:0 16px 110px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0;}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-s); padding:9px 10px; width:100%;}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);}
.row{display:flex; align-items:center;}
.muted{color:var(--ink-2);} .dim{color:var(--ink-3);}

header{position:sticky; top:0; z-index:20; background:var(--ground); padding:14px 0 10px; border-bottom:1px solid var(--line);}
.brandrow{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:11px;}
.brand{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:19px; letter-spacing:-.03em;}
.brand em{font-style:normal; color:var(--signal);}
.where{display:flex; align-items:center; gap:5px; margin-top:2px; font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
.where b{color:var(--ink-2); font-weight:500;}
.countdown{text-align:right; line-height:1.15;}
.countdown b{display:block; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:22px; font-weight:700; letter-spacing:-.02em;}
.countdown span{font-size:11.5px; color:var(--ink-3);}

.daybar{position:relative; height:32px; border-radius:8px; overflow:hidden; display:flex; background:var(--sunk); border:1px solid var(--line);}
.seg{position:relative; display:flex; align-items:center; justify-content:center; min-width:0;}
.seg em{font-style:normal; font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px;}
.seg-free{background:var(--good-soft);} .seg-free em{color:var(--good);}
.seg-work{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 5px,var(--surface-2) 5px,var(--surface-2) 10px);} .seg-work em{color:var(--ink-3);}
.seg-eve{background:var(--signal-soft);} .seg-eve em{color:var(--signal);}
.fill{position:absolute; inset:0 auto 0 0; background:color-mix(in srgb, var(--ink) 8%, transparent);}
.nowline{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--accent); z-index:3;}
.nowline::before{content:""; position:absolute; top:-1px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
.scale{display:flex; justify-content:space-between; margin-top:5px; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--ink-3);}

nav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--ground) 93%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line);}
.navinner{max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); padding:7px 8px calc(7px + env(safe-area-inset-bottom));}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 2px; border-radius:var(--r-s); color:var(--ink-3);}
.navbtn span{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;}
.navbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.navbtn.on{color:var(--accent); background:var(--accent-soft);}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);}
section{margin-top:20px;}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px;}
.sechead h2{font-size:15px;}
.cardhead{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); border-radius:var(--r) var(--r) 0 0;}
.cardhead strong{font-size:13.5px;}

.item{display:flex; align-items:flex-start; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line); width:100%; text-align:left;}
.item:last-child{border-bottom:none;}
.tick{flex:none; width:22px; height:22px; border-radius:50%; border:1.6px solid var(--line-strong); margin-top:1px; display:grid; place-items:center;}
.tick svg{width:12px; height:12px; stroke:var(--on-accent); fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; opacity:0;}
.tick.on{background:var(--accent); border-color:var(--accent);} .tick.on svg{opacity:1;}
.tick.sq{border-radius:6px;}
.done .itemtitle{text-decoration:line-through; color:var(--ink-3);}
.itembody{flex:1; min-width:0;}
.itemtitle{font-weight:500; letter-spacing:-.005em;}
.itemmeta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:3px; font-size:12px; color:var(--ink-3);}
.dot{width:8px; height:8px; border-radius:50%; flex:none;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 15px; border-radius:var(--r-s); background:var(--accent); color:var(--on-accent); font-weight:600; font-size:14px;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong); font-weight:500;}
.btn.sm{padding:6px 11px; font-size:12.5px;}
.btn.block{width:100%;}
.chip{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.06em; padding:3px 7px; border-radius:5px; background:var(--sunk); color:var(--ink-2); white-space:nowrap;}
.chip.good{background:var(--good-soft); color:var(--good);}
.chip.warn{background:var(--crit-soft); color:var(--crit);}
.chip.sig{background:var(--signal-soft); color:var(--signal);}

.slots{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px;}
.slot{padding:11px 12px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface);}
.slot .n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:19px; font-weight:700; letter-spacing:-.02em;}
.slot .n s{text-decoration:none; color:var(--ink-3); font-size:13px; font-weight:400;}
.slot .lbl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); margin-top:2px;}
.pips{display:flex; gap:3px; margin-top:7px;}
.pips i{height:4px; flex:1; border-radius:2px; background:var(--sunk);}

.bar{height:7px; border-radius:99px; background:var(--sunk); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:99px;}
.pills{display:flex; gap:7px; flex-wrap:wrap;}
.pill{padding:7px 12px; border-radius:99px; border:1px solid var(--line-strong); font-size:13px; font-family:"JetBrains Mono",monospace; color:var(--ink-2);}
.pill.on{background:var(--ink); color:var(--ground); border-color:var(--ink);}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
.scroll{overflow-x:auto; border-radius:0 0 var(--r) var(--r);}
th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
th:first-child,td:first-child{padding-left:12px;} th:last-child,td:last-child{padding-right:12px;}
th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:400;}
tr:last-child td{border-bottom:none;}
td.city{white-space:normal; min-width:104px;}
td.city b{font-weight:600;} td.city span{display:block; font-size:11.5px; color:var(--ink-3);}
tr.here{background:var(--accent-soft);}

.sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,14,13,.45);}
.sheetbox{width:100%; max-width:600px; max-height:88vh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; border:1px solid var(--line); padding:18px 16px calc(22px + env(safe-area-inset-bottom));}
@media(min-width:640px){ .sheet{align-items:center;} .sheetbox{border-radius:18px; max-height:80vh;} }
.field{margin-bottom:12px;} .field label{display:block; margin-bottom:5px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.empty-note{padding:18px 14px; text-align:center; color:var(--ink-3); font-size:13.5px;}
.toast{position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:99px; font-size:13.5px; z-index:60; box-shadow:var(--shadow);}
hr.rule{border:none; border-top:1px solid var(--line); margin:18px 0;}
</style>

<div id="root"></div>

<script>
"use strict";
/* =====================================================================
   Daylight - your work is fixed to London (08:00-15:00 UTC), so where you
   sit decides the shape of your day, not the amount of it.
   Free morning == your UTC offset.  Evening == 8h minus it.
   ===================================================================== */

const KEY = "daylight.v1";
const STORE = {
  read(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  write(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); return true; }catch(e){ return false; } }
};

/* Basecamps: offset in minutes from UTC, flight time from Singapore in minutes. */
const CAMPS = [
  {code:"DXB", city:"Dubai",            country:"UAE",         off:240, fly:450},
  {code:"MLE", city:"Mal\u00e9",        country:"Maldives",    off:300, fly:270},
  {code:"CMB", city:"Colombo",          country:"Sri Lanka",   off:330, fly:240},
  {code:"DEL", city:"Delhi",            country:"India",       off:330, fly:340},
  {code:"BOM", city:"Mumbai",           country:"India",       off:330, fly:330},
  {code:"KTM", city:"Kathmandu",        country:"Nepal",       off:345, fly:300},
  {code:"RGN", city:"Yangon",           country:"Myanmar",     off:390, fly:190},
  {code:"BKK", city:"Bangkok",          country:"Thailand",    off:420, fly:140},
  {code:"HKT", city:"Phuket",           country:"Thailand",    off:420, fly:110},
  {code:"CNX", city:"Chiang Mai",       country:"Thailand",    off:420, fly:200},
  {code:"SGN", city:"Ho Chi Minh City", country:"Vietnam",     off:420, fly:120},
  {code:"DAD", city:"Da Nang",          country:"Vietnam",     off:420, fly:170},
  {code:"HAN", city:"Hanoi",            country:"Vietnam",     off:420, fly:195},
  {code:"PNH", city:"Phnom Penh",       country:"Cambodia",    off:420, fly:130},
  {code:"REP", city:"Siem Reap",        country:"Cambodia",    off:420, fly:135},
  {code:"VTE", city:"Vientiane",        country:"Laos",        off:420, fly:180},
  {code:"CGK", city:"Jakarta",          country:"Indonesia",   off:420, fly:110},
  {code:"SIN", city:"Singapore",        country:"",            off:480, fly:0},
  {code:"KUL", city:"Kuala Lumpur",     country:"Malaysia",    off:480, fly:60},
  {code:"BWN", city:"Bandar Seri Begawan", country:"Brunei",   off:480, fly:125},
  {code:"BKI", city:"Kota Kinabalu",    country:"Malaysia",    off:480, fly:155},
  {code:"DPS", city:"Bali",             country:"Indonesia",   off:480, fly:155},
  {code:"MNL", city:"Manila",           country:"Philippines", off:480, fly:220},
  {code:"HKG", city:"Hong Kong",        country:"",            off:480, fly:240},
  {code:"TPE", city:"Taipei",           country:"Taiwan",      off:480, fly:280},
  {code:"PER", city:"Perth",            country:"Australia",   off:480, fly:320},
  {code:"ICN", city:"Seoul",            country:"South Korea", off:540, fly:380},
  {code:"NRT", city:"Tokyo",            country:"Japan",       off:540, fly:420},
  {code:"SYD", city:"Sydney",           country:"Australia",   off:600, fly:480, dst:true}
];

const CATS = {
  build:    {label:"Build",    color:"var(--build)",    blurb:"The one project"},
  move:     {label:"Move",     color:"var(--move)",     blurb:"Training, walking, swimming"},
  enjoy:    {label:"Enjoy",    color:"var(--enjoy)",    blurb:"Watch, make, play"},
  discover: {label:"Discover", color:"var(--discover)", blurb:"Somewhere new"},
  campaign: {label:"Campaign", color:"var(--campaign)", blurb:"The December ask"}
};

function seed(){
  return {
    v:1,
    profile:{ workStartUTC:480, workEndUTC:900, wake:"08:00", camp:"SIN" },
    /* The routine: the same short sequence every morning. Being routined is
       mostly about the start being identical, not the day being planned. */
    routine:[
      {id:"r1", label:"Up, no phone in bed"},
      {id:"r2", label:"Outside for ten minutes"},
      {id:"r3", label:"Breakfast, sitting down"},
      {id:"r4", label:"Name today's first block"}
    ],
    targets:{ build:2, move:3, enjoy:3, discover:1, campaign:2 },
    places:[
      {id:"p1", name:"MacRitchie treetop walk", where:"Singapore", hours:3},
      {id:"p2", name:"Southern Ridges walk",    where:"Singapore", hours:3},
      {id:"p3", name:"Pulau Ubin by bike",      where:"Singapore", hours:5},
      {id:"p4", name:"Tiong Bahru, on foot",    where:"Singapore", hours:2},
      {id:"p5", name:"Sungei Buloh wetlands",   where:"Singapore", hours:3},
      {id:"p6", name:"Kampong Glam + Rochor",   where:"Singapore", hours:2},
      {id:"p7", name:"Batam or Bintan day trip",where:"Indonesia", hours:9},
      {id:"p8", name:"Melaka weekend",          where:"Malaysia",  hours:36}
    ],
    log:[],          /* {id, cat, label, date} */
    routineLog:{},   /* date -> [routine ids done] */
    ui:{ view:"today" }
  };
}

let S = STORE.read() || seed();
S.ui = S.ui || {view:"today"};
S.ui.view = S.ui.view || "today";
if(!Array.isArray(S.log)) S.log = [];
if(!Array.isArray(S.places)) S.places = seed().places;
if(!Array.isArray(S.routine)) S.routine = seed().routine;
if(!S.routineLog || typeof S.routineLog !== "object") S.routineLog = {};
S.profile = Object.assign(seed().profile, S.profile || {});
S.targets = Object.assign(seed().targets, S.targets || {});

function save(){ STORE.write(S); }
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------------------------- time ---------------------------- */
const pad = n => String(n).padStart(2,"0");
const t2m = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
function hhmm(m){ const x = ((m % 1440) + 1440) % 1440; return pad(Math.floor(x/60))+":"+pad(x%60); }
function dur(m){
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m/60), r = m%60;
  return h ? (r ? h+"h "+pad(r)+"m" : h+"h") : r+"m";
}
function hrs(m){ const h = m/60; return (Math.round(h*10)/10) + "h"; }
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ const x = new Date(d); return addDays(x, -((x.getDay()+6)%7)); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

const camp = code => CAMPS.find(c => c.code === code) || CAMPS.find(c => c.code === "SIN");

/* The whole model in four lines: work is fixed in UTC, so local shape
   follows directly from the offset. */
function shape(c){
  const start = S.profile.workStartUTC + c.off;   /* local minutes, may exceed 1440 */
  const end   = S.profile.workEndUTC   + c.off;
  const wake  = t2m(S.profile.wake);
  return {
    start, end,
    startT: hhmm(start), endT: hhmm(end),
    morning: Math.max(0, start - wake),
    evening: Math.max(0, 1380 - end),        /* usable until 23:00 local */
    late: end >= 1440                         /* finishes at or after midnight */
  };
}
function verdict(c){
  const s = shape(c);
  if(s.late) return {t:s.endT+" finish", k:"warn"};
  if(c.off === 480) return {t:"Same", k:""};
  if(s.evening >= 210) return {t:"Best shape", k:"good"};
  if(s.evening >= 60) return {t:"Gains a PM", k:"sig"};
  return {t:"Marginal", k:""};
}
/* Country plus flight time, or "home" - a bare country reads oddly for city states. */
function sub(c){
  if(!c.fly) return "home";
  return (c.country ? c.country + " \u00b7 " : "") + dur(c.fly);
}

/* Local "now" at the basecamp, derived from real UTC. */
function nowLocal(){
  const d = new Date();
  return (d.getUTCHours()*60 + d.getUTCMinutes() + camp(S.profile.camp).off + 1440) % 1440;
}

/* ---------------------------- data ---------------------------- */
function logsIn(fromDate, toDate){
  const a = key(fromDate), b = key(toDate);
  return S.log.filter(l => l.date >= a && l.date <= b);
}
function weekCount(cat){
  const ws = key(weekStart(new Date()));
  return S.log.filter(l => l.cat === cat && l.date >= ws).length;
}
function addLog(cat, label){
  S.log.push({id:uid(), cat, label, date:key(new Date())});
  save();
}
function routineToday(){ return S.routineLog[key(new Date())] || []; }
function routineStreakless(){
  /* Share of routine steps completed over the last 14 days - deliberately a
     rolling share, not a chain, so one bad morning costs 1/14 rather than all. */
  let done = 0, poss = 0;
  for(let i=0;i<14;i++){
    const k = key(addDays(new Date(), -i));
    poss += S.routine.length;
    done += (S.routineLog[k] || []).length;
  }
  return poss ? Math.round(done/poss*100) : 0;
}

/* ---------------------------- view helpers ---------------------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catDot = c => '<span class="dot" style="background:'+CATS[c].color+'"></span>';
let sheetEl = null, toastT = null;

function toast(msg){
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 1900);
}
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl = null; } }
function openSheet(html, wire){
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "sheet";
  sheetEl.innerHTML = '<div class="sheetbox">' + html + "</div>";
  sheetEl.addEventListener("click", e => { if(e.target === sheetEl) closeSheet(); });
  document.body.appendChild(sheetEl);
  if(wire) wire(sheetEl);
}

/* ---------------------------- header ---------------------------- */
function header(){
  const c = camp(S.profile.camp), s = shape(c), n = nowLocal();
  const wake = t2m(S.profile.wake);
  const spanStart = wake, spanEnd = Math.max(s.end, 1380);
  const span = spanEnd - spanStart;

  const segs = [];
  const push = (k, a, b, label) => {
    if(b <= a) return;
    segs.push({k, w:(b-a)/span*100, a, b, label});
  };
  push("free", spanStart, s.start, "Free \u00b7 " + hrs(s.morning));
  push("work", s.start, s.end, "Work");
  push("eve", s.end, spanEnd, s.evening >= 60 ? "Evening \u00b7 " + hrs(s.evening) : "");

  const bar = segs.map(g => {
    const passed = Math.min(1, Math.max(0, (n - g.a)/(g.b - g.a)));
    return '<div class="seg seg-'+g.k+'" style="flex:0 0 '+g.w.toFixed(3)+'%">'
      + '<div class="fill" style="width:'+(passed*100).toFixed(1)+'%"></div>'
      + (g.w >= 15 && g.label ? "<em>"+g.label+"</em>" : "") + "</div>";
  }).join("");

  const pos = Math.min(100, Math.max(0, (n - spanStart)/span*100));
  const marker = (n >= spanStart && n <= spanEnd) ? '<div class="nowline" style="left:'+pos.toFixed(2)+'%"></div>' : "";

  let big, small;
  if(n < s.start){ big = dur(s.start - n); small = "until work at " + s.startT; }
  else if(n < s.end){ big = dur(s.end - n); small = "left of the shift"; }
  else { big = s.evening >= 60 ? dur(Math.max(0, 1380 - n)) : "\u2014"; small = s.evening >= 60 ? "of evening left" : "day's done"; }

  const d = new Date();
  return '<header><div class="brandrow"><div>'
    + '<div class="brand">Day<em>light</em></div>'
    + '<button class="where" data-camp="1"><b>'+esc(c.city)+"</b> \u00b7 UTC+"+(c.off/60)
    + " \u00b7 " + DAYNAME[d.getDay()] + "</button></div>"
    + '<div class="countdown"><b>'+big+"</b><span>"+small+"</span></div></div>"
    + '<div class="daybar">'+bar+marker+"</div>"
    + '<div class="scale"><span>'+hhmm(spanStart)+"</span><span>"+hhmm(spanEnd)+"</span></div></header>";
}

/* ============================ TODAY ============================ */
function viewToday(){
  const doneR = routineToday(), c = camp(S.profile.camp), s = shape(c), n = nowLocal();
  let html = "";

  /* 1. Routine - the fixed start. */
  html += '<section><div class="sechead"><h2>The start</h2>'
    + '<span class="eyebrow">'+doneR.length+" / "+S.routine.length+"</span></div>"
    + '<div class="card">'
    + S.routine.map(r => {
        const on = doneR.includes(r.id);
        return '<button class="item'+(on?" done":"")+'" data-rt="'+r.id+'">'
          + '<span class="tick sq'+(on?" on":"")+'"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span>'
          + '<span class="itembody"><span class="itemtitle">'+esc(r.label)+"</span></span></button>";
      }).join("")
    + "</div>"
    + '<p class="dim" style="font-size:12px; margin:8px 0 0">Same four things every morning, wherever you are. '
    + "Missing one costs you a fraction, not a streak.</p></section>";

  /* 2. This week's guaranteed slots. */
  html += '<section><div class="sechead"><h2>Owed this week</h2>'
    + '<span class="eyebrow">tap to log</span></div><div class="slots">'
    + Object.keys(CATS).map(k => {
        const have = weekCount(k), want = S.targets[k] || 0;
        if(!want) return "";
        return '<button class="slot" data-log="'+k+'">'
          + '<div class="n" style="color:'+CATS[k].color+'">'+have+"<s> / "+want+"</s></div>"
          + '<div class="lbl">'+catDot(k)+CATS[k].label+"</div>"
          + '<div class="pips">' + Array.from({length:want}, (_,i) =>
              '<i style="background:'+(i<have?CATS[k].color:"var(--sunk)")+'"></i>').join("") + "</div></button>";
      }).join("")
    + "</div></section>";

  /* 3. Where the day stands. */
  if(n < s.start){
    html += '<section><div class="card" style="padding:15px">'
      + '<div class="eyebrow" style="margin-bottom:6px">Today\u2019s window</div>'
      + '<p class="muted" style="margin:0; font-size:13.5px">You have <strong style="color:var(--ink)">'
      + dur(s.start - n) + '</strong> before work'
      + (s.evening >= 60 ? ", and " + hrs(s.evening) + " after it." : ", and no evening once it starts.")
      + "</p></div></section>";
  }

  /* 4. Today's logged items. */
  const today = S.log.filter(l => l.date === key(new Date()));
  if(today.length){
    html += '<section><div class="sechead"><h2>Logged today</h2></div><div class="card">'
      + today.map(l => '<div class="item"><div class="itembody"><div class="itemtitle">'
          + esc(l.label || CATS[l.cat].label) + "</div>"
          + '<div class="itemmeta">'+catDot(l.cat)+"<span>"+CATS[l.cat].label+"</span></div></div>"
          + '<button class="dim" data-rmlog="'+l.id+'" style="font-size:18px; line-height:1; padding:2px 4px">&times;</button></div>').join("")
      + "</div></section>";
  }
  return html;
}

/* ============================ WEEK ============================ */
function viewWeek(){
  const ws = weekStart(new Date());
  let html = '<section><div class="sechead"><h2>This week</h2>'
    + '<span class="eyebrow">'+DAYNAME[ws.getDay()]+" "+pad(ws.getDate())+"</span></div><div class=\"card\">";

  Object.keys(CATS).forEach(k => {
    const want = S.targets[k] || 0, have = weekCount(k);
    const pct = want ? Math.min(100, have/want*100) : 0;
    html += '<div class="item" style="display:block">'
      + '<div class="row" style="justify-content:space-between; gap:10px">'
      + '<span class="row" style="gap:8px"><span class="dot" style="background:'+CATS[k].color+'"></span>'
      + '<strong style="font-weight:500">'+CATS[k].label+"</strong>"
      + '<span class="dim" style="font-size:12px">'+CATS[k].blurb+"</span></span>"
      + '<span class="mono dim" style="font-size:12px">'+have+" / "+want+"</span></div>"
      + '<div class="bar" style="margin-top:8px"><i style="width:'+pct+"%; background:"+CATS[k].color+'"></i></div>'
      + "</div>";
  });
  html += "</div>";

  const short = Object.keys(CATS).filter(k => weekCount(k) < (S.targets[k]||0));
  html += '<p class="dim" style="font-size:12.5px; margin-top:10px">'
    + (short.length
        ? "Still owed: " + short.map(k => CATS[k].label).join(", ") + "."
        : "Everything owed this week has been done.")
    + " Slots roll over as a share, never as a streak.</p></section>";

  /* Four-week share - the honest longer view. */
  const from = addDays(new Date(), -27);
  const recent = logsIn(from, new Date());
  const byCat = {}; Object.keys(CATS).forEach(k => byCat[k] = 0);
  recent.forEach(l => { if(byCat[l.cat] !== undefined) byCat[l.cat]++; });
  const tot = recent.length || 1;

  html += '<section><div class="sechead"><h2>Last four weeks</h2>'
    + '<span class="eyebrow">'+recent.length+" logged</span></div><div class=\"card\" style=\"padding:15px\">";
  Object.keys(CATS).forEach(k => {
    const want4 = (S.targets[k]||0) * 4, p = want4 ? Math.min(100, byCat[k]/want4*100) : 0;
    html += '<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between; margin-bottom:5px">'
      + '<span class="row" style="gap:7px; font-size:13.5px">'+catDot(k)+CATS[k].label+"</span>"
      + '<span class="mono dim" style="font-size:12px">'+byCat[k]+" / "+want4+"</span></div>"
      + '<div class="bar"><i style="width:'+p+"%; background:"+CATS[k].color+'"></i></div></div>';
  });
  html += "</div></section>";

  html += '<section><div class="sechead"><h2>Targets</h2></div><div class="card" style="padding:15px"><div class="grid2">'
    + Object.keys(CATS).map(k =>
        '<div class="field"><label class="eyebrow">'+CATS[k].label+" / week</label>"
        + '<input type="number" min="0" max="14" class="mono" value="'+(S.targets[k]||0)+'" data-tgt="'+k+'"></div>').join("")
    + "</div></div></section>";
  return html;
}

/* ============================ REVIEW ============================ */
function viewReview(){
  const days = []; for(let i=27;i>=0;i--) days.push(addDays(new Date(), -i));
  const recent = logsIn(days[0], new Date());
  const rp = routineStreakless();
  const been = S.places.filter(p => p.done).length;

  let html = '<section><div class="sechead"><h2>Last four weeks</h2></div>'
    + '<div class="card" style="padding:16px; margin-bottom:12px">'
    + '<div class="row" style="justify-content:space-between; align-items:baseline">'
    + '<div><div class="eyebrow">Routine held</div>'
    + '<div class="mono" style="font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1.1">'+rp+"%</div></div>"
    + '<div class="dim" style="font-size:12px; text-align:right; max-width:170px">of your morning steps<br>over the last 14 days</div></div>'
    + '<div class="bar" style="margin-top:11px"><i style="width:'+rp+'%; background:var(--accent)"></i></div>'
    + '<p class="dim" style="font-size:12px; margin:10px 0 0">A share, not a streak. One rough morning moves this a little; '
    + "a rough fortnight moves it a lot.</p></div>";

  /* Weekly totals over four weeks, stacked by category. */
  const weeks = [];
  for(let w=3; w>=0; w--){
    const ws = weekStart(addDays(new Date(), -7*w));
    const we = addDays(ws, 6);
    const by = {}; Object.keys(CATS).forEach(k => by[k]=0);
    logsIn(ws, we).forEach(l => { if(by[l.cat] !== undefined) by[l.cat]++; });
    weeks.push({ws, by, sum:Object.values(by).reduce((a,b)=>a+b,0)});
  }
  const peak = Math.max(4, ...weeks.map(w => w.sum));
  html += '<div class="card" style="padding:16px; margin-bottom:12px"><div class="eyebrow" style="margin-bottom:12px">By week</div>'
    + '<div style="display:flex; gap:10px; align-items:flex-end; height:96px">'
    + weeks.map(w =>
        '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end">'
        + '<div style="width:100%; height:'+Math.max(3, w.sum/peak*100)+'%; border-radius:5px 5px 0 0; overflow:hidden; display:flex; flex-direction:column-reverse">'
        + Object.keys(CATS).map(k => w.by[k] ? '<div style="height:'+(w.by[k]/w.sum*100)+"%; background:"+CATS[k].color+'"></div>' : "").join("")
        + '</div><span class="mono dim" style="font-size:10px">'+pad(w.ws.getDate())+"."+pad(w.ws.getMonth()+1)+"</span></div>").join("")
    + "</div></div>";

  /* Balance. */
  html += '<div class="card" style="padding:16px; margin-bottom:12px"><div class="eyebrow" style="margin-bottom:12px">Where it went</div>';
  const tot = recent.length || 1;
  Object.keys(CATS).forEach(k => {
    const n = recent.filter(l => l.cat === k).length, p = Math.round(n/tot*100);
    html += '<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between; margin-bottom:5px">'
      + '<span class="row" style="gap:7px; font-size:13.5px">'+catDot(k)+CATS[k].label+"</span>"
      + '<span class="mono dim" style="font-size:12px">'+n+" \u00b7 "+p+"%</span></div>"
      + '<div class="bar"><i style="width:'+p+"%; background:"+CATS[k].color+'"></i></div></div>';
  });
  html += "</div>";

  html += '<div class="card" style="padding:16px"><div class="row" style="justify-content:space-between; align-items:baseline">'
    + '<div><div class="eyebrow">Places been</div>'
    + '<div class="mono" style="font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1.1">'+been+"</div></div>"
    + '<div class="dim" style="font-size:12px; text-align:right">'+S.places.filter(p=>!p.done).length+" still on the list</div></div></div>";

  html += '<hr class="rule"><div class="row" style="gap:9px">'
    + '<button class="btn ghost" data-export="1">Export</button>'
    + '<button class="btn ghost" data-import="1">Import</button></div>'
    + '<p class="dim" style="font-size:12px; margin-top:9px">Stored on this device only. Export before clearing browser data.</p>';
  return html + "</section>";
}

function exportData(){
  const json = JSON.stringify(S, null, 2);
  (async () => {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if(dl){
      try{ await dl.save({filename:"daylight-"+key(new Date())+".json", data:json}); toast("Exported"); return; }
      catch(e){ /* declined or unavailable - fall through */ }
    }
    openSheet("<h2 style='font-size:17px; margin-bottom:12px'>Copy your data</h2>"
      + '<textarea rows="12" class="mono" style="font-size:11px">'+esc(json)+"</textarea>"
      + '<button class="btn ghost block" style="margin-top:12px" data-close="1">Done</button>',
      el => el.querySelector("[data-close]").addEventListener("click", closeSheet));
  })();
}
function importData(){
  openSheet("<h2 style='font-size:17px; margin-bottom:12px'>Import</h2>"
    + '<p class="muted" style="font-size:13.5px; margin:0 0 11px">Replaces everything on this device.</p>'
    + '<textarea id="imp" rows="10" class="mono" style="font-size:11px" placeholder="{ ... }"></textarea>'
    + '<button class="btn block" style="margin-top:12px" data-impgo="1">Replace my data</button>'
    + '<button class="btn ghost block" style="margin-top:9px" data-close="1">Cancel</button>',
    el => {
      el.querySelector("[data-impgo]").addEventListener("click", () => {
        try{

          S = next; S.ui = S.ui || {view:"today"}; save(); closeSheet(); render(); toast("Imported");
        }catch(e){ toast("That isn't a valid export"); }
      });
      el.querySelector("[data-close]").addEventListener("click", closeSheet);
    });
}

/* ============================ render ============================ */
const VIEWS = {today:viewToday, week:viewWeek, places:viewPlaces, review:viewReview};

function render(){
  document.getElementById("root").innerHTML = header() + (VIEWS[S.ui.view] || viewToday)();
  document.querySelectorAll("nav").forEach(n => n.remove());
  document.body.insertAdjacentHTML("beforeend", nav());
  wire();
}
function on(sel, fn){ document.querySelectorAll(sel).forEach(el => el.addEventListener("click", () => fn(el))); }

function wire(){
  on("[data-go]", el => { S.ui.view = el.dataset.go; save(); render(); window.scrollTo(0,0); });
  on("[data-camp]", campSheet);

  on("[data-rt]", el => {
    const k = key(new Date()), list = S.routineLog[k] || [];
    const i = list.indexOf(el.dataset.rt);
    if(i >= 0) list.splice(i,1); else list.push(el.dataset.rt);
    S.routineLog[k] = list; save(); render();
  });
  on("[data-log]", el => logSheet(el.dataset.log));
  on("[data-rmlog]", el => { S.log = S.log.filter(l => l.id !== el.dataset.rmlog); save(); render(); });

  on("[data-ptab]", el => { S.ui.placeTab = el.dataset.ptab; save(); render(); });
  on("[data-newplace]", placeSheet);
  on("[data-place]", el => {
    const p = S.places.find(x => x.id === el.dataset.place);
    if(!p) return;
    p.done = true; p.doneDate = key(new Date());
    addLog("discover", p.name);
    render(); toast("Been \u2014 logged as Discover");
  });
  on("[data-unplace]", el => {
    const p = S.places.find(x => x.id === el.dataset.unplace);
    if(p){ p.done = false; delete p.doneDate; save(); render(); }
  });
  on("[data-rmplace]", el => { S.places = S.places.filter(p => p.id !== el.dataset.rmplace); save(); render(); });

  on("[data-export]", exportData);
  on("[data-import]", importData);

  document.querySelectorAll("[data-tgt]").forEach(el =>
    el.addEventListener("change", () => {
      S.targets[el.dataset.tgt] = Math.max(0, +el.value || 0); save(); render();
    }));
}

render();
setInterval(() => {
  if(sheetEl) return;
  const h = document.querySelector("header");
  if(!h) return;
  h.outerHTML = header();
  /* outerHTML swap drops listeners - reattach the one control the header owns. */
  on("[data-camp]", campSheet);
}, 60000);
</script>
