<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daylight</title>
<meta name="description" content="A day fixed to head office, lived in Singapore.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080B12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23080B12'/><circle cx='50' cy='50' r='19' fill='none' stroke='%23F2B735' stroke-width='7'/><path d='M50 10v12M50 78v12M10 50h12M78 50h12M21.7 21.7l8.5 8.5M69.8 69.8l8.5 8.5M78.3 21.7l-8.5 8.5M30.2 69.8l-8.5 8.5' stroke='%23F2B735' stroke-width='7' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylight">
<!-- Self-hosted. The game keeps its typeface on a plane, and opening it tells
     Google nothing. Regenerate with: node scripts/fetch-fonts.mjs -->
<link rel="stylesheet" href="fonts.css">
<style>
/* ===================================================================== tokens
   Night is the default and the only default. A game is a lit object in a dark
   room; a light-mode game is a document. Light mode survives as a legibility
   escape hatch, not as a second design. */
:root{
  --bg:#080B12; --bg2:#0C1119; --panel:#131A26; --panel2:#1A2330; --sunk:#0A0E16;
  --line:#1F2A3A; --line2:#2E3D52;
  --ink:#EEF3F8; --ink2:#9AAAC0; --ink3:#61738C;
  --gold:#F2B735; --gold2:#FFE38A; --goldInk:#3A2A05; --goldSoft:#2A2008;
  --jade:#3FD9A0; --jadeSoft:#0E2C24; --jadeInk:#8FF0CB;
  --ember:#FF7A3D; --emberSoft:#2C1710;
  --violet:#7C6BFF; --violetSoft:#1A1636; --violetInk:#C9BEFF;
  --crit:#FF5D5D; --critSoft:#2C1214;
  --r:16px; --r2:22px;
  --tap:cubic-bezier(.2,.9,.3,1);
  --pop:cubic-bezier(.2,1.5,.4,1);
  --hud:64px;
}
/* The escape hatch. Same structure, lifted ground, so nothing reflows. */
:root[data-theme="light"]{
  --bg:#EEF1F5; --bg2:#E4E9F0; --panel:#FFFFFF; --panel2:#F3F6FA; --sunk:#E1E7EF;
  --line:#D3DCE7; --line2:#B9C6D6;
  --ink:#0F1720; --ink2:#41505F; --ink3:#6D7D8F;
  --gold:#B87F0A; --gold2:#8A5E05; --goldInk:#FFF6DE; --goldSoft:#FBEDCB;
  --jade:#0E8C60; --jadeSoft:#DDF3EA; --jadeInk:#0A5C40;
  --ember:#C4501A; --emberSoft:#FAE6DB;
  --violet:#5442D8; --violetSoft:#E7E3FB; --violetInk:#3B2CA8;
  --crit:#C0342F; --critSoft:#FAE0DF;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; height:100%}
body{
  margin:0; min-height:100%;
  background:
    radial-gradient(125% 58% at 50% -10%, var(--bg2) 0%, transparent 62%),
    radial-gradient(90% 40% at 100% 102%, var(--bg2) 0%, transparent 72%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace; font-variant-numeric:tabular-nums}
.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:800; letter-spacing:-.03em}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",
    "Microsoft YaHei",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif; margin:0; letter-spacing:-.025em;
  text-wrap:balance}
h2{font-size:13px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--ink3);
  margin:26px 2px 10px}
h3{font-size:16.5px; font-weight:700}
p{margin:9px 0}
a{color:var(--violetInk)}
.dim{color:var(--ink3); font-size:13px}
.muted{color:var(--ink2); font-size:14px}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:8px}

/* ===================================================================== shell */
#screen{padding:2px 14px calc(104px + env(safe-area-inset-bottom)); max-width:600px; margin:0 auto}
#screen.turn{animation:turn .26s var(--tap) both}
@keyframes turn{from{opacity:0; transform:translateY(9px) scale(.995)} to{opacity:1; transform:none}}
#screen.turn-back{animation:turnb .26s var(--tap) both}
@keyframes turnb{from{opacity:0; transform:translateY(-7px)} to{opacity:1; transform:none}}

/* ------------------------------------------------------------------- boot
   A game announces itself for a beat before it hands you a screen. It also
   covers the one frame where the save is read and the shift is computed. */
#boot{position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; background:var(--bg);
  transition:opacity .42s ease, visibility .42s}
#boot.gone{opacity:0; visibility:hidden; pointer-events:none}
#boot .mk{width:104px; height:104px}
#boot .nm{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:30px;
  letter-spacing:-.035em; animation:bootin .5s var(--pop) both .08s}
#boot .sub{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink3); animation:bootin .5s var(--pop) both .16s}
@keyframes bootin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
#boot .ring{position:absolute; width:150px; height:150px; border-radius:50%;
  border:1px solid var(--line2); border-top-color:var(--gold); animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* --------------------------------------------------------------------- HUD */
#hud{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 10px;
  max-width:600px; margin:0 auto;
  background:linear-gradient(180deg,var(--bg) 12%,color-mix(in srgb,var(--bg) 72%,transparent) 72%,transparent);
  backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3)}
.crest{position:relative; width:46px; height:46px; flex:none; border:0; background:none; padding:0;
  cursor:pointer}
.crest svg{width:46px; height:46px; transform:rotate(-90deg); display:block}
.crest circle{fill:none; stroke-width:4}
.crest .bg{stroke:var(--line)}
.crest .fg{stroke:var(--gold); stroke-linecap:round; transition:stroke-dasharray .9s var(--tap)}
.crest b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:16px; font-weight:800; color:var(--gold2)}
.crest.up{animation:crestpop .7s var(--pop)}
@keyframes crestpop{0%{transform:none}40%{transform:scale(1.22)}100%{transform:none}}
.who{flex:1; min-width:0}
.who .rk{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:14.5px;
  line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .xpbar{margin-top:5px; height:5px; border-radius:3px; background:var(--line); overflow:hidden;
  position:relative}
.who .xpbar i{position:absolute; inset:0 auto 0 0; border-radius:3px;
  background:linear-gradient(90deg,#5B7BFF,var(--violet) 60%,#B08BFF); transition:width .9s var(--tap)}
.who .xpn{margin-top:4px; font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3)}
.chips{display:flex; gap:6px; flex:none}
.chip{display:flex; align-items:center; gap:5px; padding:7px 9px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line); min-height:44px; color:inherit;
  font:inherit; cursor:pointer; transition:transform .12s var(--tap)}
.chip:active{transform:scale(.94)}
.chip svg{width:16px; height:16px; flex:none; display:block}
.chip b{font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:800; letter-spacing:-.02em}
.chip.gold b{color:var(--gold2)} .chip.jade b{color:var(--jade)} .chip.ember b{color:var(--ember)}
.chip.bump{animation:bump .5s var(--pop)}
@keyframes bump{0%{transform:none}35%{transform:scale(1.18)}100%{transform:none}}

/* --------------------------------------------------------------------- nav */
#nav{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  max-width:600px; margin:0 auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 60%,transparent),var(--bg) 42%);
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid color-mix(in srgb,var(--ink) 7%,transparent)}
#nav button{flex:1; border:0; background:none; padding:8px 2px 6px; min-height:58px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  color:var(--ink3); font:inherit; font-size:10px; letter-spacing:.04em; position:relative;
  border-radius:14px; transition:color .18s}
#nav button svg{width:23px; height:23px; display:block; position:relative; z-index:1}
#nav button span.lb{position:relative; z-index:1}
#nav button[aria-current="true"]{color:var(--gold2)}
#nav button[aria-current="true"]::before{content:""; position:absolute; inset:2px 5px;
  border-radius:14px; background:color-mix(in srgb,var(--gold) 11%,transparent);
  animation:navin .24s var(--pop) both}
@keyframes navin{from{transform:scale(.82); opacity:0} to{transform:none; opacity:1}}
#nav button:active svg{transform:scale(.88); transition:transform .1s}
.badge{position:absolute; top:5px; right:calc(50% - 21px); min-width:18px; height:18px;
  border-radius:9px; background:var(--ember); color:#2A1004; font-family:"JetBrains Mono",monospace;
  font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--bg); padding:0 3px; z-index:2}
.badge.pulse{animation:bpulse 1.9s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* ==================================================================== pieces */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 15px; margin:12px 0;
  box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%,transparent) inset, 0 6px 16px rgba(0,0,0,.22)}
.panel.jade{border-color:color-mix(in srgb,var(--jade) 45%,transparent);
  background:linear-gradient(150deg,var(--jadeSoft),var(--panel) 68%)}
.panel.ember{border-color:color-mix(in srgb,var(--ember) 45%,transparent);
  background:linear-gradient(150deg,var(--emberSoft),var(--panel) 68%)}
.panel.violet{border-color:color-mix(in srgb,var(--violet) 45%,transparent);
  background:linear-gradient(150deg,var(--violetSoft),var(--panel) 68%)}
.panel.crit{border-color:color-mix(in srgb,var(--crit) 45%,transparent);
  background:linear-gradient(150deg,var(--critSoft),var(--panel) 68%)}

.row{display:flex; gap:10px; align-items:flex-start; padding:10px 0;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row b.k{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink3); flex:none; width:78px; padding-top:3px}
.row div{flex:1; min-width:0; font-size:14.5px}

.tag{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:6px;
  background:var(--sunk); color:var(--ink2); border:1px solid var(--line)}
.tag.jade{background:var(--jadeSoft); color:var(--jade); border-color:transparent}
.tag.gold{background:var(--goldSoft); color:var(--gold2); border-color:transparent}
.tag.ember{background:var(--emberSoft); color:var(--ember); border-color:transparent}
.tag.violet{background:var(--violetSoft); color:var(--violetInk); border-color:transparent}
.tag.crit{background:var(--critSoft); color:var(--crit); border-color:transparent}

/* Buttons have physics. A flat rectangle that changes colour is a link. */
button.btn{font:inherit; cursor:pointer; border-radius:13px; border:1px solid var(--line2);
  background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--ink);
  padding:12px 15px; min-height:48px; font-weight:600; font-size:14.5px;
  box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent) inset, 0 3px 0 rgba(0,0,0,.3),
    0 6px 14px rgba(0,0,0,.22);
  transition:transform .1s var(--tap), box-shadow .1s var(--tap)}
button.btn:active{transform:translateY(3px);
  box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent) inset, 0 0 0 rgba(0,0,0,.3),
    0 2px 6px rgba(0,0,0,.24)}
button.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#D89412);
  border-color:#C99417; color:var(--goldInk);
  box-shadow:0 2px 0 rgba(255,255,255,.45) inset, 0 3px 0 #9C7010, 0 8px 20px rgba(242,183,53,.26)}
button.btn.pri:active{box-shadow:0 2px 0 rgba(255,255,255,.45) inset, 0 0 0 #9C7010,
  0 3px 8px rgba(242,183,53,.2)}
button.btn.go{background:linear-gradient(180deg,#5CE8B5,var(--jade) 55%,#22A87A);
  border-color:#2FBF8C; color:#05231A;
  box-shadow:0 2px 0 rgba(255,255,255,.4) inset, 0 3px 0 #1A8060, 0 8px 20px rgba(63,217,160,.22)}
button.btn.go:active{box-shadow:0 2px 0 rgba(255,255,255,.4) inset, 0 0 0 #1A8060, 0 3px 8px rgba(63,217,160,.18)}
button.btn.quiet{background:none; border-color:var(--line); box-shadow:none; color:var(--ink2);
  font-weight:500}
button.btn.quiet:active{transform:scale(.97); box-shadow:none}
button.btn[disabled]{opacity:.4; pointer-events:none}
.btns{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
.btns button.btn{flex:1 1 auto; min-width:120px}
.btns.tight button.btn{min-height:42px; font-size:13.5px; padding:8px 12px}

input[type=text],input[type=number],textarea{width:100%; font:inherit; padding:13px 14px;
  border-radius:13px; border:1px solid var(--line2); background:var(--sunk); color:var(--ink);
  resize:vertical; font-size:16px}
textarea{min-height:70px}
input::placeholder,textarea::placeholder{color:var(--ink3)}
/* ==================================================================== the card
   A collectible is an object: portrait, framed in metal, art in a window, a
   name plate, a rarity gem, and a back you turn over. A box with text in it is
   a website no matter what the text says. */
.tc{position:relative; aspect-ratio:5/7; perspective:1100px; -webkit-perspective:1100px;
  container-type:inline-size}
.tc-i{position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.3,1.3,.5,1)}
.tc.down .tc-i{transform:rotateY(180deg)}
.tc-f,.tc-b{position:absolute; inset:0; border-radius:11px; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.24)}
.tc-b{transform:rotateY(180deg)}
.tc-f{padding:5px; background:linear-gradient(155deg,var(--fa),var(--fb) 38%,var(--fc) 62%,var(--fb))}
.tc-pane{position:absolute; inset:5px; border-radius:7px; overflow:hidden; background:var(--pane);
  display:flex; flex-direction:column; box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}
.tc-art{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; color:var(--cink);
  background:radial-gradient(120% 90% at 50% 20%,var(--artA),var(--artB));
  border-top:1px solid rgba(0,0,0,.2); border-bottom:1px solid rgba(0,0,0,.2);
  box-shadow:0 0 14px rgba(0,0,0,.1) inset}
.tc-art svg{position:absolute; inset:0; width:100%; height:100%; display:block}
/* The Mandarin set puts the character itself in the window, at size. It is the
   most beautiful thing in the deck and it is also the actual lesson. */
.tc-han{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--cink); font-weight:600; line-height:1; padding:2px 4px 17%;
  font-size:30px; font-size:clamp(20px,34cqw,96px); opacity:.94; white-space:nowrap}
.tc-nm{flex:none; padding:5px 7px; font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
  letter-spacing:-.015em; line-height:1.1; color:var(--plateInk);
  background:linear-gradient(180deg,var(--plateA),var(--plateB));
  font-size:clamp(8.5px,2.7vw,11.5px); overflow:hidden; text-wrap:balance;
  display:flex; align-items:center; min-height:26px}
.tc-nt{flex:none; padding:6px 8px 7px; font-size:10px; line-height:1.32; color:var(--plateInk2);
  background:linear-gradient(180deg,var(--plateB),var(--plateA)); display:none}
.tc.lg .tc-nm{font-size:17px; padding:9px 12px; min-height:0}
.tc.lg .tc-art{flex:0 0 62%}
.tc.lg .tc-nt{display:flex; align-items:flex-start; flex:1 1 auto; font-size:12.5px; padding:10px 12px 12px}
.tc-gem{position:absolute; right:5px; bottom:5px; width:13px; height:13px; z-index:4;
  border-radius:3px; transform:rotate(45deg); border:1px solid rgba(0,0,0,.32);
  background:linear-gradient(140deg,var(--fc),var(--fa)); box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tc.lg .tc-gem{width:20px; height:20px}
.tc-cnt{position:absolute; left:5px; bottom:5px; z-index:4; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; font-weight:800; padding:1px 5px; border-radius:5px;
  background:rgba(0,0,0,.55); color:#fff}
/* Unseen since it arrived. Every collection game needs this dot. */
.tc-new{position:absolute; left:4px; top:4px; z-index:5; width:9px; height:9px; border-radius:50%;
  background:var(--ember); box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 0 9px var(--ember)}

.tc.r0{--fa:#9AA5A0; --fb:#C9D1CC; --fc:#7E8A85; --pane:#F4F6F3;
  --artA:#E7EBE6; --artB:#CFD6D0; --cink:#2B3531; --plateA:#EDF0EC; --plateB:#DFE4DF;
  --plateInk:#1E2724; --plateInk2:#4E5854}
.tc.r1{--fa:#3F6BE8; --fb:#8FA9F5; --fc:#2749A8; --pane:#F2F5FE;
  --artA:#DCE5FD; --artB:#B9C9F7; --cink:#16255C; --plateA:#E6ECFE; --plateB:#D3DDFA;
  --plateInk:#16255C; --plateInk2:#41548F}
.tc.r2{--fa:#D98B2B; --fb:#F2C77A; --fc:#A85F0E; --pane:#FEF7EC;
  --artA:#FBE9CC; --artB:#F3CE9B; --cink:#5A3407; --plateA:#FCEFDA; --plateB:#F7E2C2;
  --plateInk:#5A3407; --plateInk2:#8A6224}
.tc.r3{--fa:#C8A227; --fb:#FBEC9B; --fc:#8C6A0B; --pane:#FFFBEA;
  --artA:#FCF3CE; --artB:#F0DE94; --cink:#4C3A03; --plateA:#FDF6DB; --plateB:#F8EDBE;
  --plateInk:#4C3A03; --plateInk2:#7A6212}
.tc.r3 .tc-f{box-shadow:0 0 0 1px #E9CF63, 0 2px 6px rgba(0,0,0,.3), 0 0 22px rgba(226,186,60,.5)}

.tc-holo{position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.5;
  mix-blend-mode:color-dodge;
  background:conic-gradient(from var(--ang,0deg) at 50% 45%,
    rgba(255,0,128,.34),rgba(255,200,0,.34),rgba(0,255,190,.34),
    rgba(80,120,255,.34),rgba(255,0,128,.34))}
.tc.r3 .tc-holo{opacity:.66}
.tc-glare{position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 48%,transparent 60%);
  transform:translateX(-130%)}
.tc.sweep .tc-glare{animation:glare 1.1s ease-out .1s 1}
@keyframes glare{to{transform:translateX(130%)}}
.tc-b{background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 7px,transparent 7px 14px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 7px,transparent 7px 14px),
    linear-gradient(160deg,#1B3A6B,#0C1B33 55%,#16305A);
  border:1px solid rgba(255,255,255,.14)}
.tc-b::after{content:""; position:absolute; inset:9px; border-radius:5px;
  border:1px solid rgba(255,255,255,.22);
  background:radial-gradient(60% 40% at 50% 50%,rgba(255,255,255,.13),transparent 70%)}
.tc-mark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  z-index:2; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; color:rgba(255,255,255,.5);
  font-size:min(9vw,28px); letter-spacing:-.04em}
/* A card he does not hold is shown as its own face, drained. He has to be able
   to see what he is missing and what it would take - a grid of identical backs
   is a filing cabinet, not a collection. */
.tc.miss .tc-f{filter:saturate(.12) brightness(.62) contrast(.9)}
.tc.miss .tc-pane{opacity:.86}
.tc.miss .tc-nm{color:var(--plateInk2)}
.tc.miss::after{content:""; position:absolute; inset:0; border-radius:11px; z-index:3;
  pointer-events:none; background:color-mix(in srgb,var(--bg) 34%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent) inset}
.tc.miss.lg::after{background:color-mix(in srgb,var(--bg) 22%,transparent)}

/* ============================================================== the collection
   Was a 16,856-pixel scroll of face-down cards. Now: one set at a time, chosen
   from a rail that stays on screen, with a progress ring you can read at a
   glance and a filter that answers the only two questions you ever have —
   what am I missing, and what is nearly done. */
.rail{position:sticky; top:calc(var(--hud) + env(safe-area-inset-top)); z-index:20; margin:0 -14px; padding:9px 14px 10px;
  display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;
  background:linear-gradient(180deg,var(--bg) 62%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none; scroll-snap-align:start; display:flex; align-items:center; gap:8px;
  padding:7px 12px 7px 8px; min-height:44px; border-radius:13px; cursor:pointer; font:inherit;
  font-size:13.5px; font-weight:600; color:var(--ink2);
  border:1px solid var(--line); background:var(--panel); transition:all .18s var(--tap)}
.rail button[aria-current="true"]{color:var(--ink); border-color:var(--gold);
  background:linear-gradient(150deg,var(--goldSoft),var(--panel) 70%)}
.rail button:active{transform:scale(.95)}
.rail .rg{flex:none; width:26px; height:26px}
.rail .rg circle{fill:none; stroke-width:4}
.rail .rg .bg{stroke:var(--line2)}
.rail .rg .fg{stroke:var(--violet); stroke-linecap:round; transition:stroke-dasharray .6s var(--tap)}
.rail button[aria-current="true"] .rg .fg{stroke:var(--gold)}
.rail .rg.done .fg{stroke:var(--jade)}
.rail .lock{opacity:.55}

.sethead{display:flex; align-items:flex-start; gap:12px; margin:14px 0 4px}
.sethead .big{font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:800;
  letter-spacing:-.04em; line-height:1; flex:none}
.sethead .big small{display:block; font-family:"Instrument Sans",sans-serif; font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); font-weight:500; margin-top:5px}
.sethead .bd{flex:1; min-width:0}
.sethead .bd h3{font-size:19px}
.sethead .bd p{margin:3px 0 0; font-size:13px; color:var(--ink3)}

.filters{display:flex; gap:6px; margin:12px 0 2px}
.filters button{flex:1; padding:8px 6px; min-height:40px; border-radius:11px; cursor:pointer;
  font:inherit; font-size:12px; font-weight:600; color:var(--ink3);
  border:1px solid var(--line); background:var(--panel)}
.filters button[aria-pressed="true"]{color:var(--ink); border-color:var(--line2);
  background:var(--panel2)}

.binder{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:12px 0 4px;
  container-type:inline-size}
@media (min-width:520px){.binder{grid-template-columns:repeat(4,1fr)}}
.binder .tc{cursor:pointer; transition:transform .12s var(--tap)}
.binder .tc:active{transform:scale(.95)}
.empty{text-align:center; padding:34px 16px; color:var(--ink3); font-size:14px}

.door{display:flex; align-items:center; gap:13px; padding:15px 16px; margin:11px 0;
  border-radius:var(--r); border:1px dashed var(--line2); background:var(--sunk)}
.door .lk{flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; background:var(--panel); border:1px solid var(--line2); color:var(--ink3)}
.door .bd{flex:1; min-width:0}
.door .bd b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
  font-size:16px; color:var(--ink2)}
.door .bd span{display:block; font-size:12.5px; color:var(--ink3); line-height:1.3; margin-top:2px}
.door .at{flex:none; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3); text-align:right; max-width:92px; line-height:1.3}

/* ==================================================================== packs */
.pk{position:relative; width:100%; max-width:190px; margin:14px auto 4px; aspect-ratio:3/4;
  border-radius:11px; cursor:pointer; overflow:hidden; border:none; padding:0; display:block;
  background:linear-gradient(150deg,#2A3F86,#5C7BD8 28%,#1B2C63 55%,#4A66C4 78%,#22356F);
  box-shadow:0 8px 24px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.16) inset;
  color:#fff; font-family:"Bricolage Grotesque",sans-serif;
  transition:transform .12s var(--tap)}
.pk.big{background:linear-gradient(150deg,#6B4A0E,#E0B54B 28%,#4E360A 55%,#C79A34 78%,#5A3F0C)}
.pk-strip{position:absolute; top:0; left:0; right:0; height:20%;
  border-bottom:2px dashed rgba(255,255,255,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04))}
.pk-body{position:absolute; inset:20% 0 0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:5px; text-align:center; padding:8px 14px}
.pk-ttl{font-weight:800; font-size:15px; letter-spacing:-.02em; line-height:1.1;
  text-shadow:0 1px 3px rgba(0,0,0,.45)}
.pk-sub{font-family:"Instrument Sans",sans-serif; font-weight:500; font-size:11px; opacity:.86;
  line-height:1.25}
.pk-n{position:absolute; top:22%; right:9px; font-family:"JetBrains Mono",monospace; font-size:11px;
  font-weight:800; background:rgba(0,0,0,.42); padding:2px 7px; border-radius:20px}
.pk-sheen{position:absolute; inset:-30% -60%; pointer-events:none;
  background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  animation:pksheen 3.4s ease-in-out infinite}
@keyframes pksheen{0%{transform:translateX(-60%)}55%,100%{transform:translateX(60%)}}
.pk:active{transform:scale(.975)}
.pk.tear .pk-strip{animation:tear .42s ease-in forwards}
@keyframes tear{to{transform:translateY(-130%) rotate(-7deg); opacity:0}}
.pk.tear{animation:pkgo .5s ease-in .18s forwards}
@keyframes pkgo{to{transform:scale(1.15); opacity:0}}

/* ================================================================= the stage */
#stage{position:fixed; inset:0; z-index:120; display:none;
  background:radial-gradient(80% 55% at 50% 38%,#1B2942,#050810 72%);
  padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  overscroll-behavior:contain}
#stage.on{display:flex; animation:fadein .28s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#stage .rays{position:absolute; inset:0; pointer-events:none; opacity:0; z-index:0;
  background:conic-gradient(from 0deg at 50% 42%,transparent 0 12deg,rgba(255,255,255,.09) 12deg 18deg,
    transparent 18deg 30deg,rgba(255,255,255,.07) 30deg 34deg,transparent 34deg 60deg);
  animation:spin 26s linear infinite}
#stage.lit .rays{opacity:1; transition:opacity .5s}
#stage .step{position:relative; z-index:2; font-family:"JetBrains Mono",monospace; font-size:12px;
  letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.62); min-height:16px}
#stage .slot{position:relative; z-index:2; width:min(66vw,250px); max-height:56vh; aspect-ratio:5/7;
  container-type:inline-size}
#stage .slot .tc{position:absolute; inset:0}
#stage .under{position:relative; z-index:2; width:min(66vw,250px); display:flex; gap:8px}
#stage .under button{flex:1; min-height:48px; border-radius:13px; font-weight:700; font:inherit;
  font-size:14.5px; cursor:pointer; border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.1); color:#fff}
#stage .under button.pri{background:linear-gradient(180deg,#FFE38A,#F2B735 60%,#D89412);
  color:#3A2A05; border-color:#C99417; font-weight:800}
#stage .dots{position:relative; z-index:2; display:flex; gap:6px}
#stage .dots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.24)}
#stage .dots i.on{background:#fff}
#stage .dots i.hi{background:#F5C451; box-shadow:0 0 8px #F5C451}
#stage .ghost{position:absolute; inset:0; border-radius:11px;
  background:linear-gradient(160deg,#1B3A6B,#0C1B33); border:1px solid rgba(255,255,255,.12);
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
#stage .g1{transform:translateY(9px) scale(.965); opacity:.62}
#stage .g2{transform:translateY(17px) scale(.93); opacity:.34}
.burst{position:absolute; inset:0; z-index:4; pointer-events:none}
.burst i{position:absolute; left:50%; top:46%; width:5px; height:5px; border-radius:50%;
  background:#FFD86B; opacity:0; animation:spark .95s ease-out forwards}
@keyframes spark{0%{opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.25)}}
.score{position:relative; z-index:2; text-align:center; color:#fff; animation:rise .5s ease-out both}
.score .big{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:31px; font-weight:800; letter-spacing:-.03em; color:#8FE3B4}
.score .sm{font-size:13px; color:rgba(255,255,255,.7); margin-top:3px}
.score .shard{margin-top:8px; font-family:"JetBrains Mono",monospace; font-size:14px;
  font-weight:700; color:#7FE6C0}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
.lvlup{position:relative; z-index:2; font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:21px; color:#F5C451; text-align:center; animation:pop .5s var(--pop) both}
@keyframes pop{from{opacity:0; transform:scale(.6)}to{opacity:1; transform:none}}

/* ============================================================== card detail */
#sheet{position:fixed; inset:0; z-index:110; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; padding:24px;
  background:rgba(4,7,12,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#sheet.on{display:flex; animation:fadein .2s ease-out both}
#sheet .slot{width:min(70vw,262px); aspect-ratio:5/7; position:relative; container-type:inline-size}
#sheet .slot .tc{position:absolute; inset:0}
#sheet .meta{color:rgba(255,255,255,.75); text-align:center; font-size:13.5px; max-width:290px}
#sheet .acts{display:flex; gap:9px}
#sheet button{min-height:48px; padding:0 22px; border-radius:13px; font-weight:700; font:inherit;
  font-size:14.5px; cursor:pointer; border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.11); color:#fff}
#sheet button.pri{background:linear-gradient(180deg,#5CE8B5,#3FD9A0 60%,#22A87A); color:#05231A;
  border-color:#2FBF8C; font-weight:800}

/* ============================================================ the modal system
   Every native prompt() and confirm() is gone. Those dialogs say "web page" in
   the system font of whatever browser you happen to be holding. */
#modal{position:fixed; inset:0; z-index:150; display:none; align-items:flex-end;
  justify-content:center; background:rgba(4,7,12,.72);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
#modal.on{display:flex; animation:fadein .18s ease-out both}
#modal .mw{width:100%; max-width:560px; background:var(--panel);
  border:1px solid var(--line2); border-bottom:0;
  border-radius:24px 24px 0 0; padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 44px rgba(0,0,0,.5); animation:sheetup .3s var(--tap) both;
  max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
#modal .grab{width:38px; height:4px; border-radius:2px; background:var(--line2);
  margin:6px auto 14px}
#modal h3{font-size:20px; margin-bottom:4px}
#modal .say{color:var(--ink2); font-size:14px; margin:6px 0 14px}
#modal label{display:block; font-family:"JetBrains Mono",monospace; font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); margin:12px 0 6px}
#modal .opts{display:grid; gap:8px; margin:12px 0}
#modal .opts button{width:100%; text-align:left; padding:14px 15px; min-height:52px}
#modal .pre{font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:800;
  text-align:center; padding:10px 0 2px; color:var(--gold2)}

/* ==================================================================== toast */
#toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); z-index:130; opacity:0; pointer-events:none;
  background:linear-gradient(180deg,#5CE8B5,var(--jade)); color:#05231A; border-radius:14px;
  padding:12px 18px; font-weight:700; font-size:14.5px; box-shadow:0 8px 26px rgba(0,0,0,.4);
  max-width:88vw; text-align:center}
#toast.on{animation:toast 2.9s ease-out both}
#toast.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:var(--goldInk)}
@keyframes toast{0%{opacity:0; transform:translateX(-50%) translateY(20px)}
  10%,80%{opacity:1; transform:translateX(-50%) translateY(0)}
  100%{opacity:0; transform:translateX(-50%) translateY(-8px)}}

/* ================================================== the full-screen celebration
   The third pillar landing is the single most important moment in the app. It
   used to be a re-render and a toast. */
#fx{position:fixed; inset:0; z-index:140; pointer-events:none; display:none}
#fx.on{display:block}
#fx .flash{position:absolute; inset:0; background:radial-gradient(60% 45% at 50% 42%,
  rgba(255,227,138,.5),transparent 70%); animation:flash .8s ease-out forwards}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#fx .conf{position:absolute; top:-14px; width:8px; height:13px; border-radius:2px;
  animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0); opacity:1}
  100%{transform:translateY(102vh) rotate(var(--spin)); opacity:.9}}
#fx .ann{position:absolute; left:0; right:0; top:34%; text-align:center; padding:0 24px; isolation:isolate}
#fx .ann::before{content:""; position:absolute; inset:-56px -10px; z-index:-1;
  background:radial-gradient(58% 100% at 50% 50%,
    color-mix(in srgb,var(--bg) 94%,transparent),
    color-mix(in srgb,var(--bg) 66%,transparent) 52%, transparent 76%)}
#fx .ann b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:clamp(30px,10vw,44px); letter-spacing:-.04em; color:var(--gold2);
  text-shadow:0 4px 24px rgba(242,183,53,.5); animation:annin .6s var(--pop) both}
#fx .ann span{display:block; margin-top:8px; font-size:15px; color:var(--ink);
  animation:annin .6s var(--pop) both .1s}
@keyframes annin{from{opacity:0; transform:scale(.65) translateY(14px)}to{opacity:1; transform:none}}
/* A number that flies from where it was earned to the HUD chip that holds it. */
.fly{position:fixed; z-index:145; pointer-events:none; font-family:"JetBrains Mono",monospace;
  font-weight:800; font-size:17px; color:var(--gold2); text-shadow:0 2px 10px rgba(0,0,0,.6);
  transition:transform .72s cubic-bezier(.4,0,.25,1), opacity .72s ease}

/* =================================================================== the pot */
.vault{position:relative; overflow:hidden; padding:22px 20px; margin:14px 0; border-radius:var(--r2);
  border:1px solid color-mix(in srgb,var(--jade) 45%,transparent);
  background:linear-gradient(150deg,var(--jadeSoft),var(--panel) 72%)}
.vault .amt{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:clamp(42px,13vw,62px); font-weight:800; letter-spacing:-.05em; line-height:1;
  color:var(--jade)}
.vault .cap{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink3); margin-top:9px}
.vault p{margin:10px 0 0; font-size:13.5px; color:var(--ink2)}
.ledger{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:14px; overflow:hidden; margin:12px 0}
.ledger div{display:flex; justify-content:space-between; gap:12px; padding:11px 14px;
  background:var(--panel); font-size:14px}
.ledger div span:last-child{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:700; flex:none}
.ledger div.out span:last-child{color:var(--crit)}
.ledger div.tot{background:var(--sunk); font-weight:700}

.flame{display:flex; align-items:center; gap:16px; padding:18px; margin:13px 0; border-radius:var(--r2);
  border:1px solid color-mix(in srgb,var(--ember) 45%,transparent); color:var(--ink);
  background:linear-gradient(150deg,var(--emberSoft),var(--panel) 70%)}
.flame .n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:46px;
  font-weight:800; letter-spacing:-.05em; line-height:.9; color:var(--ember); flex:none;
  text-align:center}
.flame .n small{display:block; font-family:"Instrument Sans",sans-serif; font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink3); margin-top:7px;
  white-space:nowrap}
.flame p{margin:0; font-size:13.5px; color:var(--ink2)}

.trk{display:flex; gap:14px; align-items:flex-start; padding:15px; margin:11px 0;
  border-radius:var(--r); border:1px solid var(--line);
  background:linear-gradient(150deg,var(--panel),var(--panel2))}
.trk.won{border-color:color-mix(in srgb,var(--jade) 50%,transparent);
  background:linear-gradient(150deg,var(--jadeSoft),var(--panel) 70%)}
.trk .mdl{position:relative; width:58px; height:58px; flex:none}
.trk .mdl svg{width:58px; height:58px; transform:rotate(-90deg)}
.trk .mdl circle{fill:none; stroke-width:5}
.trk .mdl .bg{stroke:var(--line)}
.trk .mdl .fg{stroke:var(--ember); stroke-linecap:round; transition:stroke-dasharray .7s var(--tap)}
.trk.won .mdl .fg{stroke:var(--jade)}
.trk .mdl b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:800}
.trk .bd{flex:1; min-width:0}
.trk .bd .lbl{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink3)}
.trk .bd h3{font-size:16.5px; margin:2px 0 0}
.trk .bd p{margin:5px 0 0; font-size:13.5px; color:var(--ink2)}

.medals{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0}
.md{text-align:center}
.md .disc{width:100%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:17px;
  border:2px solid var(--line2); background:var(--sunk); color:var(--ink3)}
.md.got .disc{border-color:#C8A227; color:#3A2A05;
  background:radial-gradient(65% 65% at 35% 28%,#FBEC9B,#D9B23C 60%,#B08C1C);
  box-shadow:0 3px 12px rgba(180,140,30,.4)}
.md .lbl{font-size:10.5px; line-height:1.2; margin-top:5px; color:var(--ink3)}
.md.got .lbl{color:var(--ink2); font-weight:600}

/* ================================================================== the shop
   The sink. Duplicates stop being dead weight and start being the thing that
   finishes a set. */
.wares{display:grid; gap:10px; margin:12px 0}
.ware{display:flex; align-items:center; gap:13px; padding:14px; border-radius:var(--r);
  border:1px solid var(--line); background:linear-gradient(150deg,var(--panel),var(--panel2));
  width:100%; text-align:left; cursor:pointer; font:inherit; color:var(--ink); min-height:74px;
  transition:transform .12s var(--tap)}
.ware:active{transform:scale(.985)}
.ware[disabled]{opacity:.45; pointer-events:none}
.ware .ic{flex:none; width:44px; height:44px; border-radius:13px; display:flex; align-items:center;
  justify-content:center; background:var(--sunk); border:1px solid var(--line2); color:var(--jade)}
.ware .bd{flex:1; min-width:0}
.ware .bd b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:16px}
.ware .bd span{display:block; font-size:12.5px; color:var(--ink3); line-height:1.3; margin-top:1px}
.ware .cost{flex:none; display:flex; align-items:center; gap:4px; font-family:"JetBrains Mono",monospace;
  font-size:15px; font-weight:800; color:var(--jade)}
.ware .cost svg{width:15px; height:15px}

/* ==================================================== the three, as a board */
.bhead{display:flex; align-items:center; gap:10px; margin:24px 2px 10px}
.bhead h2{margin:0; flex:1}
.pips{display:flex; gap:4px; flex:none}
.pips i{width:19px; height:5px; border-radius:3px; background:var(--line);
  transition:background .3s, box-shadow .3s}
.pips i.on{background:var(--jade); box-shadow:0 0 8px color-mix(in srgb,var(--jade) 55%,transparent)}
.pips i.all{background:var(--gold); box-shadow:0 0 10px var(--gold)}
.pips i.carried{background:var(--line2);
  background-image:repeating-linear-gradient(115deg,transparent 0 2px,color-mix(in srgb,var(--jade) 55%,transparent) 2px 4px)}

.q{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  padding:13px 14px; border-radius:var(--r); min-height:76px; margin:8px 0; color:var(--ink);
  border:1px solid var(--line); font:inherit;
  background:linear-gradient(150deg,var(--panel),var(--panel2));
  box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%,transparent) inset, 0 6px 16px rgba(0,0,0,.26);
  transition:transform .12s var(--tap), border-color .22s, background .22s}
.q:active{transform:scale(.985)}
.q .g{flex:none; width:44px; height:44px; border-radius:14px; display:flex; align-items:center;
  justify-content:center; background:var(--sunk); border:1px solid var(--line2); color:var(--ink3);
  transition:all .22s}
.q .t{flex:1; min-width:0}
.q .t b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:16.5px;
  letter-spacing:-.02em}
.q .t span{display:block; font-size:12.5px; color:var(--ink3); line-height:1.3; margin-top:1px}
.q .n{flex:none; text-align:center; min-width:46px}
.q .n b{display:block; font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:800;
  letter-spacing:-.03em; line-height:1}
.q .n span{display:block; font-size:8.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink3); margin-top:3px}
.q.on{border-color:color-mix(in srgb,var(--jade) 50%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--jade) 13%,transparent),var(--panel) 62%)}
.q.on .g{background:var(--jade); border-color:var(--jade); color:#05231A}
.q.on .t b{color:var(--jadeInk)}
.q.on .n b{color:var(--jade)}
.q.hot .n b{color:var(--gold2)}
.q.pop{animation:qpop .45s var(--pop)}
@keyframes qpop{0%{transform:none}40%{transform:scale(1.035)}100%{transform:none}}

/* the big claim button — the only gold thing on the home screen */
.claim{position:relative; display:block; width:100%; border:0; padding:0; margin:14px 0 4px;
  border-radius:var(--r2); overflow:hidden; cursor:pointer; color:var(--goldInk);
  background:linear-gradient(160deg,var(--gold2),var(--gold) 46%,#D89412);
  box-shadow:0 10px 28px color-mix(in srgb,var(--gold) 28%,transparent),
    0 2px 0 rgba(255,255,255,.5) inset, 0 -3px 0 rgba(0,0,0,.16) inset;
  transition:transform .12s var(--tap)}
.claim:active{transform:translateY(2px) scale(.99)}
.claim .in{display:flex; align-items:center; gap:13px; padding:16px 18px; text-align:left}
.claim .glyph{width:44px; height:44px; flex:none; border-radius:13px; background:rgba(58,42,5,.14);
  display:flex; align-items:center; justify-content:center}
.claim .t{flex:1; min-width:0}
.claim .t b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:19px; letter-spacing:-.025em; line-height:1.05}
.claim .t span{display:block; font-size:12.5px; opacity:.74; margin-top:2px; font-weight:500}
.claim .shine{position:absolute; inset:-40% -60%; pointer-events:none;
  background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);
  animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-55%)}55%,100%{transform:translateX(55%)}}
/* the same slab, when there is nothing to claim */
.claim.idle{background:var(--panel); border:1px solid var(--line); color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.24)}
.claim.idle .glyph{background:var(--sunk); border:1px solid var(--line2); color:var(--ink3)}
.claim.idle .t span{opacity:1; color:var(--ink3)}
.claim.idle .shine{display:none}

/* the shift, drawn as a track */
.strip{margin:16px 0 0; padding:13px 14px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--panel)}
.striph{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px}
.striph b{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:14.5px}
.striph span{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink3); flex:none}
.track{position:relative; height:26px; border-radius:9px; overflow:hidden; display:flex;
  background:var(--sunk)}
.track .free{background:linear-gradient(180deg,color-mix(in srgb,var(--jade) 34%,transparent),
  color-mix(in srgb,var(--jade) 15%,transparent))}
.track .work{background:linear-gradient(180deg,color-mix(in srgb,var(--violet) 42%,transparent),
  color-mix(in srgb,var(--violet) 18%,transparent))}
.track .rest{background:var(--sunk)}
.track .now{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ember);
  box-shadow:0 0 10px var(--ember); z-index:2}
.tlab{display:flex; justify-content:space-between; margin-top:6px; font-family:"JetBrains Mono",monospace;
  font-size:10px; color:var(--ink3)}

/* the season track */
.season{margin:20px 0 0; padding:15px; border-radius:var(--r2);
  border:1px solid color-mix(in srgb,var(--violet) 42%,transparent);
  background:linear-gradient(150deg,var(--violetSoft),var(--panel) 72%)}
.season .top{display:flex; align-items:baseline; gap:10px}
.season .top b{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:17px; flex:1}
.season .top span{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink2); flex:none}
.season p{margin:7px 0 0; font-size:12.5px; color:var(--ink3)}
/* Seven gates do not fit across a phone, and squeezing them turns every label
   into an ellipsis. Let the ladder scroll instead. */
.nodes{display:flex; gap:7px; margin-top:13px; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch; margin-inline:-4px; padding-inline:4px}
.nodes::-webkit-scrollbar{display:none}
.node{flex:0 0 62px; text-align:center; min-width:0}
.node .d{height:44px; border-radius:13px; border:1px solid var(--line2); background:var(--sunk);
  display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace;
  font-size:12px; font-weight:800; color:var(--ink3)}
.node.got .d{border-color:var(--gold); color:var(--goldInk);
  background:radial-gradient(70% 70% at 35% 25%,var(--gold2),var(--gold) 62%,#C08D12)}
.node.next .d{border-color:var(--violet); color:var(--violetInk);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 16%,transparent)}
.node .l{font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3);
  margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* freezes */
.frz{margin:12px 0 0; padding:13px 15px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--panel)}
.frz.cold{border-color:color-mix(in srgb,var(--violet) 55%,transparent); background:var(--violetSoft)}
.frz .top{display:flex; align-items:center; gap:11px}
.frz .pips2{display:flex; gap:5px; flex:none}
.frz .pips2 i{width:13px; height:13px; border-radius:50%; background:var(--sunk);
  border:1px solid var(--line2)}
.frz .pips2 i.on{background:var(--violet); border-color:var(--violet);
  box-shadow:0 0 7px color-mix(in srgb,var(--violet) 55%,transparent)}
.frz .lbl{flex:1; min-width:0; font-size:13.5px; color:var(--ink2)}
.frz .lbl b{color:var(--ink)}

/* the count-up number, used wherever a total changes */
.tick{font-variant-numeric:tabular-nums}

table{width:100%; border-collapse:collapse; margin:10px 0; font-size:14.5px}
th,td{text-align:left; padding:10px 11px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink3); font-weight:400}
td:first-child{white-space:nowrap; font-family:"JetBrains Mono",monospace; font-weight:600}
ul{margin:9px 0; padding-left:20px} li{margin:6px 0} li::marker{color:var(--ink3)}

/* ================================================================ reduced motion
   Off, not slower. Everything stays legible and every card is face up. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important}
  #toast.on{opacity:1}
  .tc-i{transition:none !important}
  #fx{display:none !important}
}


/* ============================================================ the compact board
   Second round of this. The first pass got the top of Today right and then let
   it become a document again: a freeze explainer, a paragraph about Malta, the
   rationale for bedtime, and a full write-up of the place of the day, all
   stacked down the home screen. Two thousand pixels.

   Everything that is a THING YOU DO is now a row you tap. Everything that is a
   REASON is behind it, in a sheet. The home screen is the board; the prose
   still exists and is one tap away, which is where prose belongs in a game. */
.tile{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  padding:11px 13px; border-radius:14px; min-height:62px; margin:8px 0; color:var(--ink);
  border:1px solid var(--line); background:var(--panel); font:inherit;
  transition:transform .12s var(--tap), border-color .22s, background .22s}
.tile:active{transform:scale(.985)}
.tile .ic{flex:none; width:38px; height:38px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; background:var(--sunk); border:1px solid var(--line2); color:var(--ink3);
  transition:all .22s}
.tile .bd{flex:1; min-width:0}
.tile .bd b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
  font-size:15.5px; letter-spacing:-.015em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .bd span{display:block; font-size:12.5px; color:var(--ink3); line-height:1.3; margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .rt{flex:none; display:flex; align-items:center; gap:7px; color:var(--ink3); font-size:13px;
  font-weight:600}
.tile.on{border-color:color-mix(in srgb,var(--jade) 45%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--jade) 11%,transparent),var(--panel) 62%)}
.tile.on .ic{background:var(--jade); border-color:var(--jade); color:#05231A}
.tile.on .bd b{color:var(--jadeInk)}
.tile.warn{border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.tile.warn .ic{color:var(--crit)}
/* Bedtime is the keystone but it is not one of the three, and green would put
   it in the same family as the tiles that earn the pack. Night is night. */
.tile.night.on{border-color:color-mix(in srgb,var(--violet) 50%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--violet) 14%,transparent),var(--panel) 62%)}
.tile.night.on .ic{background:var(--violet); border-color:var(--violet); color:#0B0820}
.tile.night.on .bd b{color:var(--violetInk)}

/* The row of small things: freezes, the gap, where he is standing. Chips, not
   panels - each is one number and a sheet behind it. */
.mini{display:flex; gap:7px; margin:10px -14px 0; padding:0 14px; overflow-x:auto;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.mini::-webkit-scrollbar{display:none}
.mini button{flex:none; display:flex; align-items:center; gap:7px; padding:8px 13px; min-height:44px;
  border-radius:13px; border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition:transform .12s var(--tap)}
.mini button:active{transform:scale(.95)}
.mini button svg{width:16px; height:16px; flex:none; color:var(--ink3)}
.mini button b{font-family:"JetBrains Mono",monospace; font-weight:800; color:var(--ink)}
.mini button.cold{border-color:color-mix(in srgb,var(--violet) 50%,transparent);
  background:var(--violetSoft)}

/* The shift, compact. It is the identity of the whole app, so it stays on the
   board - but the paragraph explaining Malta moved into a sheet behind it. */
.strip.tap{cursor:pointer; width:100%; text-align:left; font:inherit; color:var(--ink);
  transition:transform .12s var(--tap)}
.strip.tap:active{transform:scale(.99)}

</style>
</head>

<script>
"use strict";

/* Daylight.

   A day planner welded to a card game, for one person: an expat on European
   hours, running a Singapore company that holds his Employment Pass, wanting a
   routine he can keep.

   It is built around the one fact that shapes every day: work is fixed to head
   office in Malta, not to where he is standing. Everything else - the threads,
   the countdowns, the place of the day - hangs off that.

   The last version was true and useful and looked like a website. This one is
   the same truth with the manners of a game: a lit dark shell, a persistent
   HUD, a claim you can see from the door, an economy where a duplicate is
   worth something, and no browser dialog anywhere. */

/* ------------------------------------------------------------------ the shift
   Defined in Malta local time, not UTC and not Singapore time. Malta observes
   European daylight saving and Singapore does not, so the same contracted
   hours land an hour later in Singapore every winter - a thing that happens TO
   him rather than something anyone decided. */
var HQ_START_LOCAL = 10 * 60, HQ_END_LOCAL = 17 * 60;   /* Malta local */

function lastSunday(y, m){            /* m is 1-12 */
  var d = new Date(Date.UTC(y, m, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
/* EU summer time: last Sunday in March to last Sunday in October, 01:00 UTC. */
function euSummer(when){
  var y = when.getFullYear();
  return when >= lastSunday(y, 3) && when < lastSunday(y, 10);
}
function hqOffset(when){ return euSummer(when || new Date()) ? 120 : 60; }
function workUTC(when){
  var o = hqOffset(when);
  return [HQ_START_LOCAL - o, HQ_END_LOCAL - o];
}

/* [ name, minutes offset from UTC ] */
var CAMPS = [
  ["Singapore", 480], ["Sheffield / UK", 60], ["Bangkok", 420], ["Jakarta", 420],
  ["Hanoi", 420], ["Bali", 480], ["Hong Kong", 480], ["Tokyo", 540],
  ["Sydney", 600], ["Colombo", 330], ["Delhi", 330], ["Dubai", 240], ["Lisbon", 60],
  ["Valletta", 120], ["Sofia", 180], ["Paris", 120], ["New York", -240]
];

/* The six things actually going on. Each has one next action, because a thread
   with three next actions has none.
   [ key, name, why it matters, next action, when, hot ] */
var THREADS = [
  ["oct", "The October ask",
   "You are a supplier renegotiating, not an employee asking. And you will be four days past launching a new event.",
   "Fill in the orange bits of the draft. Event numbers, and what your channel drove.", "Week of 27 Oct", true],
  ["client", "A second client",
   "One customer funds the salary, which holds the pass, which is your permission to live here. There is no floor under it.",
   "Follow up with people you meet at NEXTPredict, in November.", "November", true],
  ["family", "Getting them here",
   "Your brother needs a date to book leave against and to save toward. Neither works without a month.",
   "Pick the month and say it out loud to your mum.", "This week", true],
  ["people", "Knowing anyone here",
   "Zero people you see without your partner arranging it. He feels short of community too, so it is a shared problem.",
   "Text Kelvin. Propose a date rather than asking if he is free.", "Today", true],
  ["write", "Something you own",
   "LinkedIn is rented and shared with a client. A newsletter is not, and the list leaves with you.",
   "Start the nostalgia newsletter. One format, not three.", "After 24 Oct", false],
  ["admin", "The boring load-bearing stuff",
   "It is the evidence file for a 2028 PR application, not housekeeping. And your friend carries the director liability.",
   "Health cover. You hold an EP and have none.", "This week", true]
];

/* Dated things. [ label, ISO date, note ] */
var MILESTONES = [
  ["NEXTPredict", "2026-10-22", "Moderating a panel and running it commercially. Negotiate nothing before this."],
  ["The muzzle lifts", "2026-10-24", "Once Kalshi and Polymarket have been on the stage, you can say what you think."],
  ["The conversation", "2026-10-27", "Scope and rate in one document. The line is: I launched this."],
  ["Mum and your brother", "2027-02-01", "February is the driest month and the first window after the hours change."],
  ["PR window", "2028-01-01", "PTS scheme. One to two years of track record, then six to twelve months to process."]
];

/* The next four months, as actually planned. Some end dates are inferred and
   marked - the point is not precision, it is that this stops living in his head.
   [ label, where, start, end, kind, uk, note ] */
var TRIPS = [
["Stopover", "UK", "2026-09-08", "2026-09-08", "move", 1, "One night. Counts as a UK day."],
["Company retreat", "Bulgaria", "2026-09-09", "2026-09-11", "work", 0, "End date assumed - correct it."],
["Family", "UK", "2026-09-12", "2026-09-23", "family", 1, "The twelve days. This is the one to protect from work."],
["Home", "Singapore", "2026-09-24", "2026-10-09", "home", 0, "TOKEN2049 falls in here. Sixteen days - the longest settled run before January."],
["With your partner", "France", "2026-10-10", "2026-10-16", "leisure", 0, "Yours and his. Not a working trip."],
["Family", "UK", "2026-10-17", "2026-10-21", "family", 1, "A few days and a weekend before New York."],
["NEXTPredict", "New York", "2026-10-22", "2026-10-23", "work", 0, "Moderating, and running it commercially. The muzzle lifts on the 24th."],
["Undecided", "UK or home", "2026-10-24", "2026-11-01", "open", 0, "The open week. See below - this is the decision."],
["Home", "Singapore", "2026-11-02", "2026-12-19", "home", 0, "Seven weeks. The first real stretch of ground since June."],
["Christmas", "UK", "2026-12-20", "2027-01-02", "family", 1, "Fourteen days."]
];

function ukDays(includeOpen){
  var n = 0;
  TRIPS.forEach(function(t){
    if (!t[5] && !(includeOpen && t[4] === "open")) return;
    if (t[4] === "open" && !includeOpen) return;
    var a = new Date(t[2] + "T00:00:00"), b = new Date(t[3] + "T00:00:00");
    n += Math.round((b - a) / 86400000) + 1;
  });
  return n;
}

/* The three things he said he would want to look back on, in his order.
   Building a presence came fourth and is deliberately not here - it lives in
   Threads, not as something measured daily.
   [ key, label, icon key, what it means ] */
var PILLARS = [
  ["train",  "Trained", "train",  "Moving on purpose. Gym, a run, or a long walk."],
  ["family", "Family",  "family", "A conversation with someone at home. A message does not count."],
  ["stop",   "Stopped", "stop",   "Finished when the shift finished. Not burning out is a thing you do."]
];

/* ---------------------------------------------------------------- storage
   v5 reads a v4 save untouched: every field the old app wrote still means the
   same thing, and the two new ones (crafted, spent spares) default empty. */
var KEY = "daylight.v4";
var S = load();

function load(){
  var d = { camp:"Singapore", wake:"08:30", bed:"23:45", done:{}, skip:{}, filter:0,
            days:{}, threads:{}, cards:{}, rewards:{}, claimed:{}, openedDay:0, openedStreak:0,
            theme:null, mute:false, rate:0, spends:[], freezes:{},
            crafted:{}, sparesSpent:0, seen:{}, booted:0 };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){ var p = JSON.parse(raw); for (var k in d) if (k in p) d[k] = p[k]; }
  } catch(e){}
  return d;
}
function save(){ FD = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* days[iso] = { p:{}, said:"...", kept:bool, bedok:bool, gap:"..." } */
function day(iso){
  var d = S.days[iso];
  if (!d){ d = S.days[iso] = { p:{} }; }
  if (!d.p) d.p = {};
  return d;
}

/* ---------------------------------------------------------------- dates */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-"
       + String(d.getDate()).padStart(2,"0");
}
function today(){ return iso(new Date()); }
function shift(n){ var d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
function nice(s){
  var p = s.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + m[Number(p[1])-1];
}
function daysUntil(isoStr){
  var a = new Date(today() + "T00:00:00"), b = new Date(isoStr + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
/* Saturday and Sunday. There is no Malta shift on either, which is the whole
   reason the "Stopped" pillar behaves differently on them. */
function isWeekend(k){
  var d = new Date(k + "T00:00:00").getDay();
  return d === 0 || d === 6;
}

/* ---------------------------------------------------------------- day shape */
function t2m(s){ var p = s.split(":"); return Number(p[0])*60 + Number(p[1]); }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
function offset(){
  for (var i=0;i<CAMPS.length;i++) if (CAMPS[i][0] === S.camp) return CAMPS[i][1];
  return 480;
}
function shape(){
  var off = offset(), wake = t2m(S.wake);
  var w = workUTC(new Date());
  var start = w[0] + off, end = w[1] + off;
  var n = new Date(), nowLocal = n.getHours()*60 + n.getMinutes();
  return {
    start:start, end:end, wake:wake, now:nowLocal,
    startT:hhmm(start), endT:hhmm(end),
    morning:Math.max(0, start - wake),
    evening:Math.max(0, 1380 - end),
    untilWork:start - nowLocal,
    working: nowLocal >= start && nowLocal < end,
    late: end >= 1440,
    weekend: isWeekend(today())
  };
}
function dur(m){
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m/60), r = m%60;
  if (h && r) return h + "h " + r + "m";
  return h ? h + "h" : r + "m";
}

/* ------------------------------------------------------------ the three
   A pillar is required on a day when it is possible to do it honestly.
   "Stopped" means finishing when the shift finishes, and at the weekend there
   is no shift to finish - so it is carried rather than owed. This is the same
   rule his Mandarin study already runs on: weekdays only, the weekend absorbed
   rather than counted as a failure. It only ever adds days; nothing he has
   already earned can go down. */
function required(key, k){
  if (key === "stop" && isWeekend(k)) return false;
  return true;
}
function pDone(k, key){
  var d = S.days[k];
  return !!(d && d.p && d.p[key]);
}
/* Satisfied for the purposes of a full day and a streak: either ticked, or not
   owed today. */
function pMet(k, key){ return pDone(k, key) || !required(key, k); }
function allThree(k){
  return PILLARS.every(function(g){ return pMet(k, g[0]); })
      && PILLARS.some(function(g){ return pDone(k, g[0]); });
}
function monthOf(k){ return k.slice(0, 7); }

/* The first day this pillar was ever recorded. Nothing before it counts as a
   miss - days before he started using the app are not failures. */
function firstDay(key){
  var ks = Object.keys(S.days).filter(function(k){ return pDone(k, key); }).sort();
  return ks.length ? ks[0] : null;
}

/* Freezes are spent by hand. An earlier version spent them the moment the
   streak walker found a gap, which meant they were gone before he knew a day
   had gone wrong - a safety net you cannot feel is not a safety net. */
function frozen(k){ return !!(S.freezes || {})[k]; }
function freezesUsed(month){
  return Object.keys(S.freezes || {}).filter(function(k){ return monthOf(k) === month; }).length;
}
function freezesLeft(month){
  return Math.max(0, FREEZES_PER_MONTH - freezesUsed(month || monthOf(today())));
}
function canFreeze(k){
  if (k > today() || allThree(k)) return false;
  return frozen(k) || freezesLeft(monthOf(k)) > 0;
}

/* Walk back from today. A frozen day carries the run across without counting
   toward it. A day the pillar was not owed on is skipped entirely. */
function streak(key){
  var first = firstDay(key);
  if (!first) return 0;
  var n = 0, now = new Date();
  for (var i = 0; i < 500; i++){
    var k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (k < first) break;
    if (pDone(k, key)){ n++; continue; }
    if (!required(key, k)) continue;        /* no shift to finish, so nothing owed */
    if (k === today()) continue;            /* today is not a miss until it is over */
    if (frozen(k)) continue;                /* spent deliberately, on this date */
    break;
  }
  return n;
}
function bestStreak(){
  return Math.max.apply(null, PILLARS.map(function(g){ return streak(g[0]); }));
}
function totalDone(key){
  var n = 0;
  Object.keys(S.days).forEach(function(k){ if (pDone(k, key)) n++; });
  return n;
}

/* Counted once per change rather than once per card per pack draw. */
var FD = null;
function fullDays(){
  if (FD === null) FD = Object.keys(S.days).filter(allThree).length;
  return FD;
}

/* --------------------------------------------------------------- the packs
   Recomputed from the record rather than incremented, so nothing can drift and
   nothing can be lost. That property is worth more than any urgency mechanic,
   which is why there are no timers and nothing expires. */
function packCounts(){
  var full = Object.keys(S.days).filter(allThree).sort();
  var streakPacks = 0, run = 0, prev = null;
  full.forEach(function(k){
    if (prev){
      var gap = Math.round((new Date(k) - new Date(prev)) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else run = 1;
    if (run % 7 === 0) streakPacks++;
    prev = k;
  });
  return { day: full.length, streak: streakPacks };
}
function packsWaiting(){
  var e = packCounts();
  return { day: Math.max(0, e.day - (S.openedDay || 0)),
           streak: Math.max(0, e.streak - (S.openedStreak || 0)) };
}
function packsTotal(){ var w = packsWaiting(); return w.day + w.streak; }

/* Weights track the pool rather than a guess at it, so a common pull is not
   four commons deep before an uncommon appears. */
function poolWeights(){
  var n = [0,0,0], i;
  for (i = 0; i < CARDS.length; i++) if (inPool(CARDS[i])) n[CARDS[i][1]]++;
  var t = n[0] + n[1] + n[2];
  if (!t) return [62, 27, 11];
  /* A mild bias toward common, so rare stays worth something. */
  return [n[0] / t * 100 * 1.25, n[1] / t * 100, n[2] / t * 100 * 0.72];
}
function rollRarity(r, boosted){
  var w = poolWeights();
  if (boosted) w = [w[0] * 0.62, w[1] * 1.15, w[2] * 2.1];
  var total = w[0] + w[1] + w[2], x = r * total;
  if (x < w[0]) return 0;
  if (x < w[0] + w[1]) return 1;
  return 2;
}

/* Gold is earned by hand and locked sets are not his yet, so neither can turn
   up in a pack. Pulling a card for a set you cannot see is a bug that looks
   like a feature until you try to find it. */
function inPool(c){ return c[2] !== "gold" && setOpen(c[2]); }

function openPack(kind){
  var size = kind === "streak" ? STREAK_PACK_SIZE : PACK_SIZE;
  var boosted = kind === "streak";
  var got = [], seed = (Date.now() ^ (Math.random() * 4294967296)) >>> 0;
  for (var n = 0; n < size; n++){
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var rar = rollRarity(((seed >>> 8) & 0xffff) / 65536, boosted);
    var tier = CARDS.filter(function(c){ return c[1] === rar && inPool(c); });
    if (!tier.length) tier = CARDS.filter(function(c){ return c[1] === 0 && inPool(c); });
    if (!tier.length) tier = CARDS.filter(inPool);
    if (!tier.length) break;
    var fresh = tier.filter(function(c){ return !(S.cards || {})[c[0]] && got.indexOf(c[0]) < 0; });
    var from = fresh.length ? fresh : tier.filter(function(c){ return got.indexOf(c[0]) < 0; });
    if (!from.length) from = tier;
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var card = from[seed % from.length];
    got.push(card[0]);
    S.cards = S.cards || {};
    S.cards[card[0]] = (S.cards[card[0]] || 0) + 1;
    S.seen = S.seen || {};
    if (S.cards[card[0]] === 1) S.seen[card[0]] = 0;   /* new, not yet looked at */
  }
  if (kind === "streak") S.openedStreak = (S.openedStreak || 0) + 1;
  else S.openedDay = (S.openedDay || 0) + 1;
  save();
  return got;
}

/* ---------------------------------------------------------------- spares
   Seventy-two per cent of everything he will ever pull is a card he already
   holds. That used to be worth nothing. Now a spare is worth spares, and
   spares finish a set.

   They are not money. They never appear on the Pot screen, nothing converts
   between the two, and they cannot buy a pack - a pack is what the three
   pillars earned or it is not a pack. Recomputed from the record, like
   everything else here, so the number cannot drift. */
function sparesEarned(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){
    var have = held[c[0]] || 0;
    if (have > 1) n += (have - 1) * RARITY[c[1]][4];
  });
  return n;
}
function spares(){ return Math.max(0, sparesEarned() - (S.sparesSpent || 0)); }
function craftCost(c){ return RARITY[c[1]][5]; }
function canCraft(c){
  return !!c && c[1] !== 3 && !(S.cards || {})[c[0]] && setOpen(c[2]) && spares() >= craftCost(c);
}
function craft(name){
  var c = cardByName(name);
  if (!canCraft(c)) return false;
  S.sparesSpent = (S.sparesSpent || 0) + craftCost(c);
  S.cards = S.cards || {};
  S.cards[name] = 1;
  S.crafted = S.crafted || {};
  S.crafted[name] = today();
  S.seen = S.seen || {};
  S.seen[name] = 0;
  save();
  return true;
}
/* ------------------------------------------------------------- collection */
var BY_NAME = {};
CARDS.forEach(function(c){ BY_NAME[c[0]] = c; });
function cardByName(n){ return BY_NAME[n]; }
function setNeeds(key){
  var s = SETS.filter(function(x){ return x[0] === key; })[0];
  return s && s[3] ? s[3] : 0;
}
function setOpen(key){ return fullDays() >= setNeeds(key); }
function setCards(key){ return CARDS.filter(function(c){ return c[2] === key; }); }
function setHeld(key){
  return setCards(key).filter(function(c){ return (S.cards || {})[c[0]]; }).length;
}
function setsComplete(){
  return SETS.filter(function(s){ return setHeld(s[0]) === setCards(s[0]).length; }).length;
}
function heldCount(){ return Object.keys(S.cards || {}).length; }
function goldHeld(){
  return CARDS.filter(function(c){ return c[1] === 3 && (S.cards || {})[c[0]]; }).length;
}
function newCount(){
  var n = 0, seen = S.seen || {};
  Object.keys(S.cards || {}).forEach(function(k){ if (seen[k] === 0) n++; });
  return n;
}
/* The nearest set to finishing. "One more card" is a much better prompt than
   "collect them all". */
function nearestSet(){
  var best = null;
  SETS.forEach(function(s){
    if (s[0] === "gold" || !setOpen(s[0])) return;
    var total = setCards(s[0]).length, have = setHeld(s[0]);
    if (have === total || have === 0) return;
    var left = total - have;
    if (!best || left < best.left) best = { set: s, left: left, have: have, total: total };
  });
  return best;
}
function nextDoor(){
  return SETS.filter(function(s){ return !setOpen(s[0]); })
             .sort(function(a, b){ return a[3] - b[3]; })[0] || null;
}

/* --------------------------------------------------------------- progression */
function xp(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){ if (held[c[0]]) n += RARITY[c[1]][3]; });
  Object.keys(S.days).forEach(function(k){ if (allThree(k)) n += 15; });
  n += Object.keys(S.done || {}).length * 20;
  n += setsComplete() * 100;
  return n;
}
function rank(){
  var x = xp(), i = 0;
  for (var j = 0; j < RANKS.length; j++) if (x >= RANKS[j][0]) i = j;
  var next = RANKS[i + 1] || null;
  return { level: i + 1, name: RANKS[i][1], xp: x,
           from: RANKS[i][0], to: next ? next[0] : null, nextName: next ? next[1] : null };
}

/* ------------------------------------------------------------------- the pot
   His idea and a better one than XP: a number in real money that builds while
   he is consistent and goes down when he spends it on himself.

   He sets the rate, because a rate the app picked would be the app deciding
   what his consistency is worth. Everything else is a multiple of it, so the
   whole economy moves when he changes one number. */
function rate(){ var r = Number(S.rate); return r > 0 ? r : RATE_DEFAULT; }
function potEarned(){
  var r = rate(), pc = packCounts();
  return {
    days:     pc.day * r,
    streaks:  pc.streak * r * 2,
    sets:     setsComplete() * r * 3,
    trophies: goldHeld() * r * 5
  };
}
function potSpent(){
  return (S.spends || []).reduce(function(a, s){ return a + Number(s[1] || 0); }, 0);
}
function potTotal(){
  var e = potEarned();
  return e.days + e.streaks + e.sets + e.trophies;
}
function pot(){ return potTotal() - potSpent(); }
function money(n){
  return "$" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "");
}
function num(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* ---------------------------------------------------------------- picking */
function seedFor(s){
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(list, seed){
  var a = list.slice(), r = seed;
  for (var i=a.length-1;i>0;i--){
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    var j = r % (i+1);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* One reroll a day. An unlimited "somewhere else" hands back the daily
   decision this whole design exists to remove. */
var REROLLS_PER_DAY = 1;
function rerollsLeft(){ return Math.max(0, REROLLS_PER_DAY - (S.skip[today()] || 0)); }
function pick(){
  var f = S.filter || 0;   /* 0 all, 1 outdoors, 2 hawker */
  var pool = PLACES.filter(function(p){
    if (S.done[p[0]]) return false;
    if (f === 1 && p[3] !== 0) return false;
    if (f === 2 && p[3] !== 2) return false;
    return true;
  });
  if (!pool.length) pool = PLACES.filter(function(p){
    return f === 1 ? p[3] === 0 : f === 2 ? p[3] === 2 : true;
  });
  if (!pool.length) return null;
  var order = shuffled(pool, seedFor(today()));
  return order[(S.skip[today()] || 0) % order.length];
}
function districts(){
  var seen = {}, all = {};
  PLACES.forEach(function(p){ all[p[1]] = (all[p[1]] || 0) + 1; });
  Object.keys(S.done).forEach(function(n){
    var p = PLACES.filter(function(x){ return x[0] === n; })[0];
    if (p) seen[p[1]] = (seen[p[1]] || 0) + 1;
  });
  return { all: all, seen: seen };
}

/* ---------------------------------------------------------------- helpers */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function maps(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Singapore");
}

function reduced(){
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e){ return false; }
}
function ring(have, total, cls){
  var C = 2 * Math.PI * 15, k = total ? have / total : 0;
  return "<svg class='rg" + (k >= 1 ? " done" : "") + (cls ? " " + cls : "")
    + "' viewBox='0 0 34 34' aria-hidden='true'>"
    + "<circle class='bg' cx='17' cy='17' r='15'></circle>"
    + "<circle class='fg' cx='17' cy='17' r='15' stroke-dasharray='"
    + (C * k).toFixed(1) + " " + C.toFixed(1) + "'></circle></svg>";
}
