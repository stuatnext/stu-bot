<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daylight</title>
<meta name="description" content="A day fixed to head office, lived in Singapore.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080B12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23080B12'/><circle cx='50' cy='50' r='19' fill='none' stroke='%23F2B735' stroke-width='7'/><path d='M50 10v12M50 78v12M10 50h12M78 50h12M21.7 21.7l8.5 8.5M69.8 69.8l8.5 8.5M78.3 21.7l-8.5 8.5M30.2 69.8l-8.5 8.5' stroke='%23F2B735' stroke-width='7' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylight">
<!-- Self-hosted. The game keeps its typeface on a plane, and opening it tells
     Google nothing. Regenerate with: node scripts/fetch-fonts.mjs -->
<link rel="stylesheet" href="fonts.css?v=24">
<link rel="stylesheet" href="css/tokens.css?v=24">
<link rel="stylesheet" href="css/shell.css?v=24">
<link rel="stylesheet" href="css/scene.css?v=24">
<link rel="stylesheet" href="css/cards.css?v=24">
<link rel="stylesheet" href="css/body.css?v=24">
<link rel="stylesheet" href="css/you.css?v=24">
<link rel="stylesheet" href="css/overlays.css?v=24">
</head>
<body>


<div id="boot">
  <svg class="mk" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="21" stroke="#F2B735" stroke-width="4"/>
    <path d="M50 8v13M50 79v13M8 50h13M79 50h13M20.5 20.5l9.2 9.2M70.3 70.3l9.2 9.2M79.5 20.5l-9.2 9.2M29.7 70.3l-9.2 9.2"
      stroke="#F2B735" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="nm">Daylight</div>
  <div class="sub">Fixed to Malta &middot; lived in Singapore</div>
  <div class="bld">v24</div>
</div>

<header id="hud">
  <button class="crest" id="crest" title="Rank">
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle class="bg" cx="23" cy="23" r="19"></circle>
      <circle class="fg" cx="23" cy="23" r="19" stroke-dasharray="0 120"></circle>
    </svg><b>1</b>
  </button>
  <div class="hudgap"></div>
  <div class="chips">
    <button class="chip flame" id="chipFlame" title="Streak">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color:#FF9600">
        <path d="M12 2.6c.6 3.4-1.2 5-2.8 6.8C7.4 11.4 6 13.2 6 16a6 6 0 0 0 12 0c0-2.3-1-4.2-2.4-5.8-.4 1.2-1 2-2 2.6.6-3.6-.4-7.6-1.6-10.2Z"
          stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="#FFB84D"/></svg>
      <b id="chipFlameN">0</b>
    </button>
    <button class="chip gold" id="chipPot" title="The pot">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.6" style="color:var(--gold)"/>
        <path d="M8 4.2v7.6M6 6.1h3.1a1.6 1.6 0 0 1 0 3.2H6" stroke="var(--gold2)" stroke-width="1.5"
          stroke-linecap="round"/></svg>
      <b id="chipPotN">0</b>
    </button>
    <button class="chip jade" id="chipShard" title="Shards">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1.7 14 5.1v6L8 14.5 2 11.1v-6z" stroke="var(--jade)" stroke-width="1.5"
          stroke-linejoin="round"/>
        <path d="M8 5.3 11 7.1v3.4L8 12.2 5 10.5V7.1z" fill="var(--jade)" opacity=".45"/></svg>
      <b id="chipShardN">0</b>
    </button>
  </div>
</header>

<main id="screen"></main>

<nav id="nav">
  <button data-tab="today" aria-current="true">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2"
      stroke="currentColor" stroke-width="2"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6
      M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"/></svg><span class="lb">Today</span></button>
  <button data-tab="gym">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 8.5v7M17.5 8.5v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.4 10.4v3.2M20.6 10.4v3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.5 12h11" stroke="currentColor" stroke-width="2"/></svg><span class="lb">Gym</span></button>
  <button data-tab="food">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3v8a2.5 2.5 0 0 0 5 0V3M8.5 11v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 3c-1.5 1.5-2 3.5-2 5.5s.8 3 2 3.2V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lb">Food</span></button>
  <button data-tab="basics">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c3.4 4 6 6.6 6 10a6 6 0 0 1-12 0c0-3.4 2.6-6 6-10Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="lb">Water</span></button>
  <button data-tab="work">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="7.5" width="18" height="12.5" rx="2.4" stroke="currentColor" stroke-width="2"/><path d="M9 7.5V5.6A1.6 1.6 0 0 1 10.6 4h2.8A1.6 1.6 0 0 1 15 5.6v1.9" stroke="currentColor" stroke-width="2"/></svg><span class="lb">Work</span></button>
  <button data-tab="cards">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.2" y="5" width="12" height="15.5"
      rx="2" stroke="currentColor" stroke-width="2"/><path d="M8.4 3.4h9.2a2 2 0 0 1 2 2v11.4"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lb">Cards</span></button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<div id="stage" aria-live="polite"></div>
<div id="sheet"></div>
<div id="chip" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<!-- The front door. A game says who it is before it hands you anything, and
     this one had no first screen at all - it opened straight onto a loaded HUD
     with two zeroed currencies. Shown once, ever. -->
<div id="coach" aria-live="polite"></div>

<div id="gate" hidden>
  <svg class="mk" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="19" stroke="#F2B735" stroke-width="6"/>
    <path d="M50 8v13M50 79v13M8 50h13M79 50h13M20.5 20.5l9.2 9.2M70.3 70.3l9.2 9.2M79.5 20.5l-9.2 9.2M29.7 70.3l-9.2 9.2"
      stroke="#F2B735" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>Daylight</h1>
  <p>A day fixed to Malta, lived in Singapore.</p>
  <div class="go">Tap to begin</div>
</div>

<!-- The game, one concern per file, loaded in dependency order. No build
     step, no framework: what is in this folder is what runs. -->
<script src="js/data.js?v=24"></script>
<script src="js/state.js?v=24"></script>
<script src="js/audio.js?v=24"></script>
<script src="js/sky.js?v=24"></script>
<script src="js/fx.js?v=24"></script>
<script src="js/art.js?v=24"></script>
<script src="js/cardui.js?v=24"></script>
<script src="js/scene.js?v=24"></script>
<script src="js/collection.js?v=24"></script>
<script src="js/quest.js?v=24"></script>
<script src="js/gym.js?v=24"></script>
<script src="js/food.js?v=24"></script>
<script src="js/basics.js?v=24"></script>
<script src="js/work.js?v=24"></script>
<script src="js/you.js?v=24"></script>
<script src="js/coach.js?v=24"></script>
<script src="js/app.js?v=24"></script>
</body>
</html>
