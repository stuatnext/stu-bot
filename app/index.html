<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daylight</title>
<meta name="description" content="A day fixed to head office, lived in Singapore.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080B12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23080B12'/><circle cx='50' cy='50' r='19' fill='none' stroke='%23F2B735' stroke-width='7'/><path d='M50 10v12M50 78v12M10 50h12M78 50h12M21.7 21.7l8.5 8.5M69.8 69.8l8.5 8.5M78.3 21.7l-8.5 8.5M30.2 69.8l-8.5 8.5' stroke='%23F2B735' stroke-width='7' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylight">
<!-- Self-hosted. The game keeps its typeface on a plane, and opening it tells
     Google nothing. Regenerate with: node scripts/fetch-fonts.mjs -->
<link rel="stylesheet" href="fonts.css?v=10">
<link rel="stylesheet" href="css/tokens.css?v=10">
<link rel="stylesheet" href="css/shell.css?v=10">
<link rel="stylesheet" href="css/scene.css?v=10">
<link rel="stylesheet" href="css/cards.css?v=10">
<link rel="stylesheet" href="css/you.css?v=10">
<link rel="stylesheet" href="css/overlays.css?v=10">
</head>
<body>

<!-- The place. Every beautiful mobile game is set somewhere; this one is set
     in Singapore, so Singapore stands on the horizon - Esplanade, the CBD,
     Marina Bay Sands, the Flyer, the supertrees - tinted by the same sky
     variables as everything else. Stars come out when the sky does. -->
<div id="stars" aria-hidden="true">
  <svg viewBox="0 0 390 480" preserveAspectRatio="xMidYMin slice">
    <g fill="#CBD6FF">
      <circle cx="23" cy="64" r="1.1"/><circle cx="58" cy="142" r=".8"/>
      <circle class="tw" cx="86" cy="38" r="1.4"/><circle cx="121" cy="96" r=".9"/>
      <circle cx="149" cy="201" r=".8"/><circle class="tw2" cx="176" cy="54" r="1.6"/>
      <circle cx="204" cy="150" r=".9"/><circle cx="238" cy="88" r="1.2"/>
      <circle cx="262" cy="32" r=".8"/><circle cx="291" cy="120" r="1"/>
      <circle class="tw" cx="317" cy="70" r="1.5"/><circle cx="346" cy="178" r=".8"/>
      <circle cx="368" cy="44" r="1"/><circle cx="31" cy="232" r=".9"/>
      <circle cx="95" cy="262" r="1.1"/><circle cx="163" cy="286" r=".8"/>
      <circle class="tw2" cx="228" cy="244" r="1"/><circle cx="300" cy="268" r=".9"/>
      <circle cx="355" cy="236" r="1.2"/><circle cx="12" cy="150" r=".8"/>
      <circle cx="137" cy="20" r=".9"/><circle cx="258" cy="196" r="1.1"/>
      <circle cx="43" cy="300" r=".8"/><circle class="tw" cx="190" cy="330" r="1"/>
      <circle cx="330" cy="320" r=".8"/><circle cx="74" cy="192" r="1.2"/>
      <circle cx="283" cy="352" r=".9"/><circle cx="222" cy="20" r="1.1"/>
      <circle cx="350" cy="120" r=".9"/><circle cx="110" cy="340" r=".9"/>
    </g>
  </svg>
</div>
<div id="scene" aria-hidden="true">
  <svg viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice">
    <path class="far" d="M0 120 V88 H22 V80 H40 V92 H60 V74 H84 V90 H106 V68 H128
      V86 H150 V72 H172 V90 H196 V66 H220 V84 H244 V76 H268 V92 H290 V70 H314
      V88 H338 V78 H362 V94 H390 V120 Z"/>
    <path class="near" d="M0 120 V102 H14 V96 H30 V120 Z
      M34 120 A21 21 0 0 1 76 120 Z  M64 120 A18 18 0 0 1 100 120 Z
      M104 120 V52 H118 V46 H122 V52 H136 V120 Z
      M140 120 V36 H158 V120 Z  M162 120 V58 H176 V120 Z  M176 120 V88 H188 V120 Z
      M196 120 V54 H210 V120 Z  M216 120 V54 H230 V120 Z  M236 120 V54 H250 V120 Z
      M188 54 V50 Q188 44 196 44 H252 Q262 44 262 52 V54 Z  M188 52 L177 46 L188 44 Z
      M330 62 L340 44 L350 62 L343 120 H337 Z
      M352 70 L360 54 L368 70 L363 120 H357 Z
      M371 76 L378 62 L385 76 L381 120 H375 Z"/>
    <circle class="wire" cx="296" cy="74" r="21" stroke-width="5" fill="none"/>
    <path class="wire" d="M296 74 L284 120 M296 74 L308 120" stroke-width="4" fill="none"/>
    <circle class="neardot" cx="296" cy="74" r="4"/>
  </svg>
</div>

<div id="boot">
  <svg class="mk" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="21" stroke="#F2B735" stroke-width="4"/>
    <path d="M50 8v13M50 79v13M8 50h13M79 50h13M20.5 20.5l9.2 9.2M70.3 70.3l9.2 9.2M79.5 20.5l-9.2 9.2M29.7 70.3l-9.2 9.2"
      stroke="#F2B735" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="nm">Daylight</div>
  <div class="sub">Fixed to Malta &middot; lived in Singapore</div>
  <div class="bld">v10</div>
</div>

<header id="hud">
  <button class="crest" id="crest" title="Rank">
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle class="bg" cx="23" cy="23" r="19"></circle>
      <circle class="fg" cx="23" cy="23" r="19" stroke-dasharray="0 120"></circle>
    </svg><b>1</b>
  </button>
  <div class="hudgap"></div>
  <div class="chips">
    <button class="chip gold" id="chipPot" title="The pot">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.6" style="color:var(--gold)"/>
        <path d="M8 4.2v7.6M6 6.1h3.1a1.6 1.6 0 0 1 0 3.2H6" stroke="var(--gold2)" stroke-width="1.5"
          stroke-linecap="round"/></svg>
      <b id="chipPotN">0</b>
    </button>
    <button class="chip jade" id="chipShard" title="Shards">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1.7 14 5.1v6L8 14.5 2 11.1v-6z" stroke="var(--jade)" stroke-width="1.5"
          stroke-linejoin="round"/>
        <path d="M8 5.3 11 7.1v3.4L8 12.2 5 10.5V7.1z" fill="var(--jade)" opacity=".45"/></svg>
      <b id="chipShardN">0</b>
    </button>
  </div>
</header>

<main id="screen"></main>

<nav id="nav">
  <button data-tab="today" aria-current="true">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2"
      stroke="currentColor" stroke-width="2"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6
      M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"/></svg><span class="lb">Today</span></button>
  <button data-tab="cards">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.2" y="5" width="12" height="15.5"
      rx="2" stroke="currentColor" stroke-width="2"/><path d="M8.4 3.4h9.2a2 2 0 0 1 2 2v11.4"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lb">Cards</span></button>
  <button data-tab="you">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6"
      stroke="currentColor" stroke-width="2"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"/></svg><span class="lb">You</span></button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<div id="stage" aria-live="polite"></div>
<div id="sheet"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<!-- The front door. A game says who it is before it hands you anything, and
     this one had no first screen at all - it opened straight onto a loaded HUD
     with two zeroed currencies. Shown once, ever. -->
<div id="coach" aria-live="polite"></div>

<div id="gate" hidden>
  <svg class="mk" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="19" stroke="#F2B735" stroke-width="6"/>
    <path d="M50 8v13M50 79v13M8 50h13M79 50h13M20.5 20.5l9.2 9.2M70.3 70.3l9.2 9.2M79.5 20.5l-9.2 9.2M29.7 70.3l-9.2 9.2"
      stroke="#F2B735" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>Daylight</h1>
  <p>A day fixed to Malta, lived in Singapore.</p>
  <div class="go">Tap to begin</div>
</div>

<!-- The game, one concern per file, loaded in dependency order. No build
     step, no framework: what is in this folder is what runs. -->
<script src="js/data.js?v=10"></script>
<script src="js/state.js?v=10"></script>
<script src="js/audio.js?v=10"></script>
<script src="js/sky.js?v=10"></script>
<script src="js/fx.js?v=10"></script>
<script src="js/art.js?v=10"></script>
<script src="js/cardui.js?v=10"></script>
<script src="js/scene.js?v=10"></script>
<script src="js/collection.js?v=10"></script>
<script src="js/you.js?v=10"></script>
<script src="js/coach.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
