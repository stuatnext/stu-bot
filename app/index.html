<style>
:root{
  --ground:#EDEFEC; --surface:#FBFCFA; --surface-2:#E4E8E3; --sunk:#E0E4DF;
  --line:#D4D9D3; --line-strong:#B7BFB9;
  --ink:#141B18; --ink-2:#4A5551; --ink-3:#79847F;
  --accent:#1F4FE0; --accent-soft:#DDE4FB;
  --signal:#B35C0C; --signal-soft:#F7E6D4;
  --good:#2C7A51; --good-soft:#DCEDE3;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
    --line:#293430; --line-strong:#3C4945;
    --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
    --accent:#7C9BFF; --accent-soft:#1C2647;
    --signal:#E09453; --signal-soft:#2E2317;
    --good:#5CB585; --good-soft:#16261D;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#151D1B; --surface-2:#1D2724; --sunk:#111917;
  --line:#293430; --line-strong:#3C4945;
  --ink:#E9EEEB; --ink-2:#A5B0AB; --ink-3:#77837E;
  --accent:#7C9BFF; --accent-soft:#1C2647;
  --signal:#E09453; --signal-soft:#2E2317;
  --good:#5CB585; --good-soft:#16261D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.wrap{max-width:620px; margin:0 auto;
  padding:20px max(16px, env(safe-area-inset-left)) 28px max(16px, env(safe-area-inset-right));}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.02em;}
h1{font-size:clamp(26px,6.5vw,34px); font-weight:800; line-height:1.1;}
h2{font-size:19px; font-weight:600; margin:26px 0 6px;}
h3{font-size:15px; font-weight:600; margin:0;}
p{margin:9px 0;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);}
.mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-2);}
.dim{color:var(--ink-3); font-size:14px;}
strong{font-weight:600;}
a{color:var(--accent);}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px;}

header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin:14px 0;}
.card.hero{padding:20px 18px;}
.card.tip{background:var(--signal-soft); border-color:var(--signal);}
.card.ok{background:var(--good-soft); border-color:var(--good);}

.say{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r);
  padding:18px 18px 16px; margin:14px 0;}
.say .lbl{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px;}
.say q{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
  font-size:clamp(23px,6.4vw,30px); line-height:1.2; letter-spacing:-.02em; quotes:none;}
.say .after{margin:10px 0 0; font-size:14px; color:var(--ink-2);}

.row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row b{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); flex:none; width:74px; padding-top:3px;}
.row div{flex:1; min-width:0;}

.pill{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:5px; background:var(--sunk); color:var(--ink-2);}
.pill.e{background:var(--good-soft); color:var(--good);}
.pill.m{background:var(--accent-soft); color:var(--accent);}
.pill.l{background:var(--signal-soft); color:var(--signal);}

button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); padding:13px 16px; min-height:46px;}
button:active{transform:translateY(1px);}
.btns{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap;}
.btns button{flex:1; min-width:132px;}
button.pri{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
:root[data-theme="dark"] button.pri, :root:not([data-theme="light"]) button.pri{color:#0D1211;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) button.pri{color:#fff;} }

nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20;}
nav button{flex:1; border:none; border-radius:0; background:none; padding:11px 4px 13px;
  font-size:11.5px; color:var(--ink-3); min-height:60px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;}
nav button[aria-current="true"]{color:var(--accent); font-weight:600;}
nav .ic{font-size:19px; line-height:1;}

table{width:100%; border-collapse:collapse; margin:10px 0; font-size:14.5px;}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400;}
td:first-child{white-space:nowrap; font-family:"JetBrains Mono",monospace; font-weight:500;}
ul{margin:9px 0; padding-left:20px;} li{margin:6px 0;} li::marker{color:var(--ink-3);}
.hide{display:none;}
</style>

<body>
<div class="wrap">

<header>
  <div>
    <div class="eyebrow" id="eyebrow">Daylight</div>
    <h1 id="title">Today</h1>
  </div>
  <button id="theme" title="Switch theme" style="padding:8px 12px; min-height:44px; min-width:44px;">&#9681;</button>
</header>

<main id="view"></main>

</div>

<nav>
  <button data-tab="today" aria-current="true"><span class="ic">&#9737;</span>Today</button>
  <button data-tab="week"><span class="ic">&#9634;</span>Anchors</button>
  <button data-tab="say"><span class="ic">&#9786;</span>Phrasebook</button>
  <button data-tab="been"><span class="ic">&#10003;</span>Been</button>
</nav>

<script>
"use strict";

/* Daylight.
   One place a day, and the exact words to say when you get there.

   The whole point of this rewrite: the barrier was never finding somewhere.
   It was not knowing what to say at the counter. So every place carries a
   script, and the script is set in the largest type on the page, because it
   gets read one-handed while standing in a queue. */

/* nerve: 0 = nothing to order, 1 = order in English at a counter, 2 = hawker stall
   [ name, area, mrt, nerve, when, why, order, say, after, pay ] */
var PLACES = [
["Southern Ridges","Telok Blangah","HarbourFront",0,"Early, before it bakes","Ten kilometres of connected parks and the Henderson Waves bridge. The best long walk on the island and you never have to speak to anyone.","","","","Free"],
["MacRitchie Reservoir","Central catchment","Caldecott",0,"Open at 07:00","Boardwalk along the water, monkeys, and the TreeTop Walk if you go the whole way round. Properly quiet on a weekday.","","","","Free"],
["Singapore Botanic Gardens","Tanglin","Botanic Gardens",0,"05:00 to midnight","UNESCO listed, free, and enormous. The rain forest section is six minutes of actual jungle in the middle of a city.","","","","Free, Orchid Garden $15"],
["Fort Canning Park","Museum quarter","Dhoby Ghaut",0,"Any time","The tree tunnel everyone photographs, plus spice gardens and a lot of history under your feet. Small enough for an hour.","","","","Free"],
["Labrador Nature Reserve","Southern coast","Labrador Park",0,"07:00 onward","Coastal path, old gun emplacements and wartime tunnels. Views across to the islands. Rarely busy.","","","","Free"],
["Rail Corridor","Bukit Timah","Beauty World",0,"Morning","The old KTM railway line, now a green spine running most of the length of the island. Start at the restored Bukit Timah station.","","","","Free"],
["Bukit Brown Cemetery","Toa Payoh fringe","Caldecott",0,"Daylight only","Overgrown Chinese cemetery, enormous and strange, and the most atmospheric place in Singapore. Wear proper shoes.","","","","Free"],
["Coney Island","Punggol","Punggol",0,"07:00 to 19:00","Rustic, scrubby, and almost empty on a weekday. Cycle it or walk the length in about an hour.","","","","Free"],
["Sungei Buloh Wetland Reserve","Kranji","Kranji then bus",0,"07:00, mornings best","Mangroves, mudskippers, monitor lizards and migratory birds. Feels a very long way from Tanjong Pagar, which is the point.","","","","Free"],
["Pulau Ubin","Off Changi","Tanah Merah then bus",0,"Ferry from 06:00","Boat over, hire a bike, and it is Singapore forty years ago. A whole day, and the furthest you can get without a passport.","","","","Ferry $4 each way, cash"],
["Punggol Waterway Park","Punggol","Punggol",0,"Any time","Long flat water-side path, good bridges, and almost nobody there mid-morning.","","","","Free"],
["Katong and Joo Chiat","East coast","Marine Parade",0,"Morning light is best","Peranakan shophouses in colours you will not believe, and the best-looking street in the city on Koon Seng Road.","","","","Free"],
["Tiong Bahru estate","Tiong Bahru","Tiong Bahru",0,"Any time","1930s art deco walk-ups, curved balconies, air raid shelter. Twenty minutes on foot and completely different from where you live.","","","","Free"],
["Emerald Hill","Orchard","Somerset",0,"Any time","One street of restored Peranakan terraces hiding right behind Orchard Road. Two minutes off the main drag and silent.","","","","Free"],
["Thian Hock Keng Temple","Telok Ayer","Telok Ayer",0,"09:00 to 17:00","The oldest Hokkien temple in Singapore, built for sailors giving thanks for surviving the crossing. Ten minutes walk from you.","","","","Free"],
["Sri Mariamman Temple","Chinatown","Chinatown",0,"07:00 to 12:00, 18:00 to 21:00","The oldest Hindu temple here, with a gopuram covered in painted figures. Remove your shoes at the door.","","","","Free"],
["Kampong Glam and Sultan Mosque","Arab Street","Bugis",0,"Mosque 10:00 to 12:00","Textile shops, Haji Lane, and the golden dome. Wardah Books is worth twenty minutes on its own.","","","","Free"],
["Haw Par Villa","Pasir Panjang","Haw Par Villa",0,"09:00 to 22:00","A tiger balm millionaire built a theme park of Chinese moral parables including the Ten Courts of Hell. Genuinely unsettling and completely free.","","","","Free"],
["National Gallery Singapore","City Hall","City Hall",0,"10:00 to 19:00","Two colonial buildings joined together, the best Southeast Asian art collection anywhere, and cold air on a bad day.","","","","Free for residents"],
["Peranakan Museum","Bras Basah","Bras Basah",0,"10:00 to 19:00","Small, beautifully done, and it explains a lot about the culture you have married into.","","","","Free for residents"],
["Gardens by the Bay outer gardens","Marina","Bayfront",0,"05:00 to 02:00","The outdoor gardens are free and mostly empty early. Supertrees without the queue.","","","","Free outdoors"],
["East Coast Park","East coast","Bedok then bus",0,"Any time","Fifteen kilometres of seafront path with actual sea breeze. Where half of Singapore goes to exercise.","","","","Free"],
["Dairy Farm Nature Park","Bukit Timah","Hillview",0,"07:00","Old quarry with a lake in it, plus the Wallace Trail. Steep enough to feel like exercise.","","","","Free"],
["Jurong Lake Gardens","West","Lakeside",0,"Any time","Big, new, quiet, and completely across the island from you. The Rasau Walk is on stilts over the water.","","","","Free"],
["Marina Barrage","Marina","Bayfront then walk",0,"Rooftop always open","Grass roof with the whole skyline in front of it. Everyone flies kites. Sit down for an hour.","","","","Free"],

["Tiong Bahru Bakery","Tiong Bahru","Tiong Bahru",1,"07:30 to 20:00","The kouign-amann is the thing. Order at the counter, entirely in English, and sit with the estate outside.","A kouign-amann and a flat white","A kouign-amann and a flat white, please","They will ask for a name or a number. Nothing else is required of you.","Card fine, about $12"],
["Chye Seng Huat Hardware","Jalan Besar","Bendemeer",1,"09:00 to 22:00","An old hardware shop turned into a roastery around a circular bar. Order at the counter, sit at the bar, nobody talks to you.","A long black, or the filter of the day","A long black, please","If they ask which bean, saying whichever you recommend is a completely normal answer.","Card, about $7"],
["Nylon Coffee Roasters","Everton Park","Outram Park",1,"08:30 to 18:00","A hole in the wall under an HDB block, ten minutes from you, and one of the best roasters in the country.","A piccolo","A piccolo, please","There is nowhere to sit. Standing outside with it is what everyone does.","Card, about $6"],
["Common Man Coffee Roasters","Robertson Quay","Fort Canning",1,"07:30 to 18:00","Big, busy, Australian in character, and completely unintimidating. Good for a long breakfast alone with a book.","Whatever is on the brunch menu, and a flat white","A flat white, please, and I will order food at the table","You are seated first here, so the ordering happens sitting down. Easiest possible version.","Card, about $30"],
["Atlas Coffeehouse","Duke's Road","Botanic Gardens",1,"08:00 to 19:00","Five minutes from the Botanic Gardens, so you can walk first and sit afterwards. Bright, easy, English throughout.","A cortado","A cortado, please","Pair it with the Gardens and you have a whole morning that requires almost no talking.","Card, about $7"],
["Kurasu Singapore","Tanjong Pagar","Tanjong Pagar",1,"08:00 to 18:00","Japanese roaster, precise and quiet, and it is on your doorstep. A good one for a first attempt because the staff explain everything.","A hand drip, whichever bean they suggest","A hand drip, please, whichever you would recommend","Asking for a recommendation is normal here rather than a confession. They enjoy it.","Card, about $8"],
["Apartment Coffee","Jalan Besar","Jalan Besar",1,"09:00 to 18:00","Set back off the road, small, calm, and the sort of place where nobody hurries you. Good on a low day.","A white coffee","A white coffee, please","Small enough that you may end up talking to whoever made it. That is allowed.","Card, about $7"],
["Wardah Books","Kampong Glam","Bugis",1,"11:00 to 18:00","An independent bookshop specialising in the Muslim world and Southeast Asia. Nobody will bother you and nothing has to be ordered.","Nothing. Browse.","Just browsing, thanks","Then Sultan Mosque is a hundred metres away.","Free to look"],
["Kinokuniya, Ngee Ann City","Orchard","Orchard",1,"10:00 to 21:30","One of the largest bookshops in Southeast Asia. An hour in here on a bad afternoon is a legitimate use of a day.","Nothing, unless you want to","Do you have this in stock?","Staff are used to being asked and it is all in English.","Card"],

["Maxwell Food Centre","Chinatown","Maxwell",2,"08:00 to 22:00, quieter before 11:30","The famous one, and rightly. Twelve minutes on foot from Tanjong Pagar, so there is no journey to talk yourself out of.","Hainanese chicken rice, steamed","One chicken rice, steamed. Eat here.","They will ask breast or thigh, and whether you want it to go. Thigh is the better answer.","Cash, about $6. Some stalls take PayNow."],
["Amoy Street Food Centre","Telok Ayer","Telok Ayer",2,"07:00 to 15:00, dead after 14:00","Your nearest proper hawker centre and the best one for a first go, because it empties out after the office lunch rush.","Whichever stall has a queue of five or fewer","One of that, please. Eat here.","Go at 14:00. Half the stalls are closing, nobody is rushing you, and you can look at everything without a queue behind you.","Cash, about $5"],
["Chinatown Complex Food Centre","Chinatown","Chinatown",2,"08:00 to 20:00","The biggest hawker centre in Singapore, over two hundred stalls, and a Michelin-listed chicken rice stall among them. Overwhelming on purpose.","Anything. Walk a full lap first, then decide.","One of that, please","Two hundred stalls means nobody is watching you. Anonymity is easier than a quiet room.","Cash, about $5"],
["Tiong Bahru Market","Tiong Bahru","Tiong Bahru",2,"07:00 to 14:00 for breakfast","Wet market below, hawkers upstairs, and the best chwee kueh in the city. Morning is when it is alive.","Chwee kueh, five pieces","Chwee kueh, five, take away","Steamed rice cakes with preserved radish. Two dollars. Almost impossible to get wrong.","Cash, about $2.50"],
["Old Airport Road Food Centre","Dakota","Dakota",2,"11:00 to 21:00","Widely held to be the best hawker centre in Singapore by people who care a great deal about this. Worth the trip east.","Char kway teow, or lor mee","One char kway teow. Eat here.","They may ask if you want cockles. No cockles is an entirely normal answer.","Cash, about $6"],
["Tekka Centre","Little India","Little India",2,"07:00 to 22:00","Indian food, and the easiest hawker centre to order in because everything is in English and the stallholders are chatty.","Roti prata, two plain, with curry","Two plain prata, please","The single lowest-risk hawker order in Singapore. It costs about two dollars and nobody has ever got it wrong.","Cash, about $3"],
["Golden Mile Food Centre","Beach Road","Nicoll Highway",2,"08:00 to 20:00","Thai and local, in a brutalist block that is worth seeing on its own. Less touristed than the famous ones.","Whatever the longest queue is having","One of that, please","Joining the longest queue and copying the person in front is a completely valid strategy and everybody does it.","Cash, about $6"],
["Hong Lim Market and Food Centre","Chinatown","Chinatown",2,"06:00 to 15:00","Old-school, office-lunch crowd, and several legendary stalls. Go at 14:00 when the rush has gone.","Curry chicken noodle, or wonton mee","One wonton mee, dry","Dry or soup is the only question. Dry is the safer answer.","Cash, about $5"],
["Zion Riverside Food Centre","Havelock","Havelock",2,"11:00 to 22:00","Small, riverside, and much less frantic than the famous ones. A gentle place to practise.","Char kway teow or fried carrot cake","One fried carrot cake, black","Black is the sweet dark soy version, white is not. Both are correct, black is nicer.","Cash, about $5"],
["Adam Road Food Centre","Bukit Timah","Botanic Gardens",2,"07:00 to 23:00","Ten minutes from the Botanic Gardens, so walk first and eat after. Famous for nasi lemak and Muslim food.","Nasi lemak with chicken wing","Nasi lemak, chicken wing","Coconut rice, fried chicken, egg, anchovies, sambal. If you have one Malay dish, have this one.","Cash, about $6"],
["Newton Food Centre","Newton","Newton",2,"16:00 to 02:00","Open late, which almost nothing else useful is when you finish at eleven. Touristy, and that makes it easy.","Satay, ten sticks, chicken","Ten chicken satay, please","Stallholders here will approach you, which removes the hardest part entirely.","Cash, about $10"],
["ABC Brickworks Food Centre","Bukit Merah","Redhill",2,"08:00 to 22:00","A neighbourhood one rather than a famous one, which means it is calmer and the prices are lower.","Ba chor mee, dry, or the char kway teow","One bak chor mee, dry, small","Minced pork noodles. They will ask about chilli. Saying a little is the safe answer.","Cash, about $5"],
["Alexandra Village Food Centre","Queenstown","Redhill",2,"07:00 to 22:00","Proper local crowd, no tourists, and a famous chicken wing stall. This is what the ordinary version looks like.","Fried chicken wings, three","Three chicken wings","Three wings and a drink is about six dollars and involves saying five words.","Cash, about $6"],
["Ghim Moh Market","Buona Vista","Buona Vista",2,"07:00 to 14:00","A morning market centre in the middle of an estate. Breakfast here is what a normal Singaporean Tuesday looks like.","Chwee kueh, or the roasted meats","One kaya toast set","Toast, soft eggs and a kopi. Ordering the set means you say three words and get a whole breakfast.","Cash, about $5"],
["Berseh Food Centre","Jalan Besar","Jalan Besar",2,"07:00 to 20:00","Quiet, unglamorous and near several good coffee places, so you can chain it with something easy.","Fish soup, or the yong tau foo","One fish soup","Yong tau foo is the one where you point at things in a tray and they cook them. Pointing is the entire mechanic.","Cash, about $6"],
["Whampoa Makan Place","Balestier","Boon Keng",2,"06:00 to 22:00","Two blocks, open extremely early, and full of people who have been coming for forty years.","Kaya toast and kopi, or the lor mee","Kaya toast set, and one kopi-o siew dai","This is where to try your first proper kopi order. Nobody there is in a hurry at nine in the morning.","Cash, about $4"]
];

var NERVE = [
  ["e","Nothing to order"],
  ["m","Order in English"],
  ["l","Hawker stall"]
];

/* ---------------------------------------------------------------- storage */
var KEY = "daylight.v3";
var S = load();

function load(){
  var d = { done:{}, skip:{}, easyOnly:false, theme:null };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in d) if (k in p) d[k] = p[k]; }
  } catch(e){}
  return d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------------------------------------------------------------- dates */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return iso(new Date()); }
function nice(s){
  var p = s.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + m[Number(p[1])-1];
}

/* ---------------------------------------------------------------- picking
   A stable pseudo-random ordering per day, so today's suggestion does not
   change when you reopen the page, but tomorrow's is different. */
function seedFor(s){
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(list, seed){
  var a = list.slice(), r = seed;
  for (var i=a.length-1;i>0;i--){
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    var j = r % (i+1);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function eligible(){
  return PLACES.filter(function(p){
    if (S.done[p[0]]) return false;
    if (S.easyOnly && p[3] !== 0) return false;
    return true;
  });
}
function pick(){
  var pool = eligible();
  if (!pool.length){
    // Everything done at this level. Fall back to the full list so it never dead-ends.
    pool = S.easyOnly ? PLACES.filter(function(p){ return p[3]===0; }) : PLACES.slice();
  }
  if (!pool.length) return null;
  var order = shuffled(pool, seedFor(today()));
  var n = S.skip[today()] || 0;
  return order[n % order.length];
}

/* ---------------------------------------------------------------- helpers */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function maps(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Singapore");
}

/* ---------------------------------------------------------------- views */
function viewToday(){
  var p = pick();
  if (!p) return "<div class='card'><p>Nothing left. That is a good problem.</p></div>";

  var n = NERVE[p[3]];
  var h = "";

  h += "<div class='card hero'>";
  h += "<div style='display:flex;justify-content:space-between;gap:10px;align-items:flex-start'>";
  h += "<div><h2 style='margin:0 0 3px'>" + esc(p[0]) + "</h2>";
  h += "<div class='dim'>" + esc(p[1]) + " &middot; " + esc(p[2]) + "</div></div>";
  h += "<span class='pill " + n[0] + "'>" + esc(n[1]) + "</span>";
  h += "</div>";
  h += "<p class='muted' style='margin-top:12px'>" + esc(p[5]) + "</p>";
  h += "<div class='row'><b>When</b><div>" + esc(p[4]) + "</div></div>";
  h += "<div class='row'><b>Cost</b><div>" + esc(p[9]) + "</div></div>";
  h += "</div>";

  if (p[7]){
    h += "<div class='say'>";
    h += "<span class='lbl'>Say this</span>";
    h += "<q>" + esc(p[7]) + "</q>";
    if (p[8]) h += "<p class='after'>" + esc(p[8]) + "</p>";
    h += "</div>";
    if (p[6]) h += "<div class='card'><div class='row'><b>Order</b><div>" + esc(p[6]) + "</div></div></div>";
  }

  h += "<div class='btns'>";
  h += "<button class='pri' data-done='" + esc(p[0]) + "'>I went</button>";
  h += "<button data-skip='1'>Somewhere else</button>";
  h += "</div>";
  h += "<div class='btns'>";
  h += "<button onclick=\"window.open('" + maps(p[0]) + "','_blank','noopener')\">Open in Maps</button>";
  h += "<button data-easy='1'>" + (S.easyOnly ? "Show me everything" : "Something easier") + "</button>";
  h += "</div>";

  if (p[3] === 2){
    h += "<div class='card tip'><h3>If the words go</h3>"
      + "<p style='margin:8px 0 0'>Point at what you want and hold up one finger. That is what half the queue is doing and "
      + "nobody has ever minded. <strong>You do not have to get the local phrasing right to be served.</strong></p></div>";
  }
  return h;
}

function viewWeek(){
  var h = "<p class='muted'>The two things that are fixed. Everything else on this page is optional.</p>";

  h += "<div class='card'><h3>Saturday, 07:30 &mdash; parkrun</h3>"
    + "<p class='muted' style='margin:6px 0 0'>Same event every week. Pick the one furthest from Tanjong Pagar, not the nearest, "
    + "so turning up puts you somewhere else in Singapore with the whole day ahead. Walking is allowed and nobody finishes last.</p>"
    + "<p class='dim' style='margin:8px 0 0'>Bishan-Ang Mo Kio &middot; East Coast &middot; West Coast &middot; Bay East &middot; Bedok Reservoir</p></div>";

  h += "<div class='card'><h3>Wednesday, 14:30 &mdash; call your mum</h3>"
    + "<p class='muted' style='margin:6px 0 0'>About seven in the morning for her. Walk while you talk. "
    + "The thing that moves this off 30% is her expecting it, not you remembering it &mdash; so tell her it is every Wednesday.</p>"
    + "<p class='dim' style='margin:8px 0 0'>If you are late, call anyway. Ten minutes at 15:20 beats a clean miss.</p></div>";

  h += "<div class='card'><h3>Not yet started</h3>"
    + "<div class='row'><b>Today</b><div>Text Kelvin about the games night. Propose a date rather than asking if he is free.</div></div>"
    + "<div class='row'><b>22-23 Oct</b><div>NEXTPredict. Negotiate nothing before it.</div></div>"
    + "<div class='row'><b>27 Oct</b><div>The conversation. Scope and rate in one document.</div></div>"
    + "</div>";
  return h;
}

function viewSay(){
  var h = "<p class='muted'>Here because you will not remember it, and there is no reason you should. "
        + "Open it in the queue.</p>";

  h += "<div class='card ok'><h3>The three that always work</h3>"
    + "<ul style='margin:8px 0 0'>"
    + "<li><strong>Point, and hold up one finger.</strong> Universally understood, faintly rude to nobody, and extremely common.</li>"
    + "<li><strong>&ldquo;One of that, please.&rdquo;</strong> English is an official language and every stallholder has heard this a thousand times.</li>"
    + "<li><strong>Join the longest queue and order what the person in front ordered.</strong> This is a recognised national strategy, not a cop-out.</li>"
    + "</ul></div>";

  h += "<h2>Kopi</h2>"
    + "<p class='muted'>Two or three terms stacked together. <strong>Kopi</strong> on its own is coffee with condensed milk and sugar.</p>";
  h += "<table><tr><th>Say</th><th>Means</th></tr>"
    + "<tr><td>kopi</td><td>Coffee, condensed milk, sweet. The default.</td></tr>"
    + "<tr><td>-o</td><td>No milk. Black, still sweet.</td></tr>"
    + "<tr><td>-c</td><td>Evaporated milk instead of condensed.</td></tr>"
    + "<tr><td>kosong</td><td>No sugar at all.</td></tr>"
    + "<tr><td>siew dai</td><td>Less sweet. The one you want.</td></tr>"
    + "<tr><td>gah dai</td><td>Sweeter.</td></tr>"
    + "<tr><td>gao</td><td>Strong.</td></tr>"
    + "<tr><td>po</td><td>Weak.</td></tr>"
    + "<tr><td>peng</td><td>Iced.</td></tr>"
    + "<tr><td>da bao</td><td>Take away. Goes last.</td></tr>"
    + "<tr><td>teh</td><td>Same system, but tea.</td></tr>"
    + "</table>";
  h += "<div class='card'><h3>Three orders that cover most days</h3>"
    + "<div class='row'><b>Standard</b><div><strong>Kopi-o siew dai.</strong> Black, a bit sweet. The most ordinary thing you can say.</div></div>"
    + "<div class='row'><b>Milky</b><div><strong>Kopi-c siew dai.</strong> Evaporated milk, less sugar.</div></div>"
    + "<div class='row'><b>Hot day</b><div><strong>Kopi-o peng.</strong> Iced.</div></div>"
    + "</div>";
  h += "<p class='dim'>They will often repeat it back loudly across the stall. That is the order going to the person making it, "
    + "not a correction of your pronunciation.</p>";

  h += "<h2>Hawker centres</h2>";
  h += "<div class='card'>"
    + "<div class='row'><b>Seat first</b><div>Find a table before you queue, and <strong>chope</strong> it with a packet of tissues. That is the accepted signal and everybody uses it.</div></div>"
    + "<div class='row'><b>Sharing</b><div>Sitting with strangers at a big table is normal. <strong>&ldquo;Can sit?&rdquo;</strong> is the whole phrase.</div></div>"
    + "<div class='row'><b>Ordering</b><div>Each stall separately, and you usually pay and wait there. Some give you a buzzer.</div></div>"
    + "<div class='row'><b>Cash</b><div>Still fastest. Bring small notes. Plenty take PayNow now, but do not count on it.</div></div>"
    + "<div class='row'><b>Trays</b><div>Returning your tray has been required since 2021. Return station is near the exit.</div></div>"
    + "<div class='row'><b>Timing</b><div>Avoid 12:00 to 13:30 near the CBD. Go at 14:00 instead &mdash; calm, no queue, nobody behind you.</div></div>"
    + "</div>";

  h += "<h2>Two words in Hokkien</h2>"
    + "<p class='muted'>Worth having, given who you are going to be having dinner with.</p>"
    + "<table><tr><th>Say</th><th>Means</th></tr>"
    + "<tr><td>chiah pa boe</td><td>Have you eaten? The standard greeting, and the correct answer is yes.</td></tr>"
    + "<tr><td>ho chiah</td><td>Delicious. Deploy at his mother's table.</td></tr>"
    + "<tr><td>kam siah</td><td>Thank you.</td></tr>"
    + "</table>"
    + "<p class='dim'>Better than any of this: ask his family to teach you. Asking an elder for their Hokkien is a much warmer "
    + "thing than getting it right off a page.</p>";
  return h;
}

function viewBeen(){
  var names = Object.keys(S.done);
  if (!names.length){
    return "<div class='card'><h3>Nothing here yet</h3>"
      + "<p class='muted' style='margin:8px 0 0'>Which is exactly right for day one. Go to one place, press <strong>I went</strong>, "
      + "and this fills up on its own.</p></div>";
  }
  names.sort(function(a,b){ return S.done[b].localeCompare(S.done[a]); });
  var h = "<div class='card ok'><h3>" + names.length + (names.length===1 ? " place" : " places") + "</h3>"
        + "<p class='muted' style='margin:8px 0 0'>No streak, no target. Just the list getting longer.</p></div>";
  h += "<div class='card'>";
  names.forEach(function(n){
    h += "<div class='row'><b>" + esc(nice(S.done[n])) + "</b><div>" + esc(n) + "</div></div>";
  });
  h += "</div>";
  h += "<div class='btns'><button data-reset='1'>Clear everything</button></div>";
  return h;
}

/* ---------------------------------------------------------------- shell */
var TABS = {
  today: ["Today", "One place, and what to say", viewToday],
  week:  ["Anchors", "The fixed points", viewWeek],
  say:   ["Phrasebook", "Read it in the queue", viewSay],
  been:  ["Been", "Where you have got to", viewBeen]
};
var tab = "today";

function render(){
  var t = TABS[tab];
  document.getElementById("title").textContent = t[0];
  document.getElementById("eyebrow").textContent = t[1];
  document.getElementById("view").innerHTML = t[2]();
  var nav = document.querySelectorAll("nav button");
  for (var i=0;i<nav.length;i++){
    nav[i].setAttribute("aria-current", nav[i].dataset.tab === tab ? "true" : "false");
  }
  window.scrollTo(0,0);
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("button") : null;
  if (!b) return;
  if (b.dataset.tab){ tab = b.dataset.tab; render(); return; }
  if (b.dataset.done){ S.done[b.dataset.done] = today(); delete S.skip[today()]; save(); tab = "been"; render(); return; }
  if (b.dataset.skip){ S.skip[today()] = (S.skip[today()] || 0) + 1; save(); render(); return; }
  if (b.dataset.easy){ S.easyOnly = !S.easyOnly; delete S.skip[today()]; save(); render(); return; }
  if (b.dataset.reset){
    if (confirm("Clear every place you have logged? This cannot be undone.")){
      S.done = {}; S.skip = {}; save(); render();
    }
    return;
  }
  if (b.id === "theme"){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    S.theme = next; save();
  }
});

if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
render();
</script>

</html>
