/* ---------------------------------------------------------------- storage
   v5 reads a v4 save untouched: every field the old app wrote still means the
   same thing, and the two new ones (crafted, spent spares) default empty. */
var KEY = "daylight.v4";
var S = load();

function load(){
  var d = { camp:"Singapore", wake:"08:30", bed:"23:45", done:{}, skip:{}, filter:0,
            days:{}, threads:{}, cards:{}, rewards:{}, claimed:{}, openedDay:0, openedStreak:0,
            theme:null, mute:false, rate:0, spends:[], freezes:{},
            crafted:{}, sparesSpent:0, seen:{}, booted:0, onboarded:0 };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){ var p = JSON.parse(raw); for (var k in d) if (k in p) d[k] = p[k]; }
  } catch(e){}
  /* A save with history belongs to someone who already knows what the three
     are. Only a genuinely empty one gets the tutorial board. */
  if (!d.onboarded && Object.keys(d.days).length) d.onboarded = 1;
  return d;
}
function save(){ FD = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* days[iso] = { p:{}, said:"...", kept:bool, bedok:bool, gap:"..." } */
function day(iso){
  var d = S.days[iso];
  if (!d){ d = S.days[iso] = { p:{} }; }
  if (!d.p) d.p = {};
  return d;
}

/* ---------------------------------------------------------------- dates */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-"
       + String(d.getDate()).padStart(2,"0");
}
function today(){ return iso(new Date()); }
function shift(n){ var d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
function nice(s){
  var p = s.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + m[Number(p[1])-1];
}
function daysUntil(isoStr){
  var a = new Date(today() + "T00:00:00"), b = new Date(isoStr + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
/* Saturday and Sunday. There is no Malta shift on either, which is the whole
   reason the "Stopped" pillar behaves differently on them. */
function isWeekend(k){
  var d = new Date(k + "T00:00:00").getDay();
  return d === 0 || d === 6;
}

/* ---------------------------------------------------------------- day shape */
function t2m(s){ var p = s.split(":"); return Number(p[0])*60 + Number(p[1]); }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
function offset(){
  for (var i=0;i<CAMPS.length;i++) if (CAMPS[i][0] === S.camp) return CAMPS[i][1];
  return 480;
}
function shape(){
  var off = offset(), wake = t2m(S.wake);
  var w = workUTC(new Date());
  var start = w[0] + off, end = w[1] + off;
  var n = new Date(), nowLocal = n.getHours()*60 + n.getMinutes();
  return {
    start:start, end:end, wake:wake, now:nowLocal,
    startT:hhmm(start), endT:hhmm(end),
    morning:Math.max(0, start - wake),
    evening:Math.max(0, 1380 - end),
    untilWork:start - nowLocal,
    working: nowLocal >= start && nowLocal < end,
    late: end >= 1440,
    weekend: isWeekend(today())
  };
}
function dur(m){
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m/60), r = m%60;
  if (h && r) return h + "h " + r + "m";
  return h ? h + "h" : r + "m";
}

/* ------------------------------------------------------------ the three
   A pillar is required on a day when it is possible to do it honestly.
   "Stopped" means finishing when the shift finishes, and at the weekend there
   is no shift to finish - so it is carried rather than owed. This is the same
   rule his Mandarin study already runs on: weekdays only, the weekend absorbed
   rather than counted as a failure. It only ever adds days; nothing he has
   already earned can go down. */
function required(key, k){
  if (key === "stop" && isWeekend(k)) return false;
  return true;
}
function pDone(k, key){
  var d = S.days[k];
  return !!(d && d.p && d.p[key]);
}
/* Satisfied for the purposes of a full day and a streak: either ticked, or not
   owed today. */
function pMet(k, key){ return pDone(k, key) || !required(key, k); }
function allThree(k){
  return PILLARS.every(function(g){ return pMet(k, g[0]); })
      && PILLARS.some(function(g){ return pDone(k, g[0]); });
}
function monthOf(k){ return k.slice(0, 7); }

/* The first day this pillar was ever recorded. Nothing before it counts as a
   miss - days before he started using the app are not failures. */
function firstDay(key){
  var ks = Object.keys(S.days).filter(function(k){ return pDone(k, key); }).sort();
  return ks.length ? ks[0] : null;
}

/* Freezes are spent by hand. An earlier version spent them the moment the
   streak walker found a gap, which meant they were gone before he knew a day
   had gone wrong - a safety net you cannot feel is not a safety net. */
function frozen(k){ return !!(S.freezes || {})[k]; }
function freezesUsed(month){
  return Object.keys(S.freezes || {}).filter(function(k){ return monthOf(k) === month; }).length;
}
function freezesLeft(month){
  return Math.max(0, FREEZES_PER_MONTH - freezesUsed(month || monthOf(today())));
}
function canFreeze(k){
  if (k > today() || allThree(k)) return false;
  return frozen(k) || freezesLeft(monthOf(k)) > 0;
}

/* Walk back from today. A frozen day carries the run across without counting
   toward it. A day the pillar was not owed on is skipped entirely. */
function streak(key){
  var first = firstDay(key);
  if (!first) return 0;
  var n = 0, now = new Date();
  for (var i = 0; i < 500; i++){
    var k = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (k < first) break;
    if (pDone(k, key)){ n++; continue; }
    if (!required(key, k)) continue;        /* no shift to finish, so nothing owed */
    if (k === today()) continue;            /* today is not a miss until it is over */
    if (frozen(k)) continue;                /* spent deliberately, on this date */
    break;
  }
  return n;
}
function bestStreak(){
  return Math.max.apply(null, PILLARS.map(function(g){ return streak(g[0]); }));
}
function totalDone(key){
  var n = 0;
  Object.keys(S.days).forEach(function(k){ if (pDone(k, key)) n++; });
  return n;
}

/* Counted once per change rather than once per card per pack draw. */
var FD = null;
function fullDays(){
  if (FD === null) FD = Object.keys(S.days).filter(allThree).length;
  return FD;
}

/* --------------------------------------------------------------- the packs
   Recomputed from the record rather than incremented, so nothing can drift and
   nothing can be lost. That property is worth more than any urgency mechanic,
   which is why there are no timers and nothing expires. */
function packCounts(){
  var full = Object.keys(S.days).filter(allThree).sort();
  var streakPacks = 0, run = 0, prev = null;
  full.forEach(function(k){
    if (prev){
      var gap = Math.round((new Date(k) - new Date(prev)) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else run = 1;
    if (run % 7 === 0) streakPacks++;
    prev = k;
  });
  return { day: full.length, streak: streakPacks };
}
function packsWaiting(){
  var e = packCounts();
  return { day: Math.max(0, e.day - (S.openedDay || 0)),
           streak: Math.max(0, e.streak - (S.openedStreak || 0)) };
}
function packsTotal(){ var w = packsWaiting(); return w.day + w.streak; }

/* Weights track the pool rather than a guess at it, so a common pull is not
   four commons deep before an uncommon appears. */
function poolWeights(){
  var n = [0,0,0], i;
  for (i = 0; i < CARDS.length; i++) if (inPool(CARDS[i])) n[CARDS[i][1]]++;
  var t = n[0] + n[1] + n[2];
  if (!t) return [62, 27, 11];
  /* A mild bias toward common, so rare stays worth something. */
  return [n[0] / t * 100 * 1.25, n[1] / t * 100, n[2] / t * 100 * 0.72];
}
function rollRarity(r, boosted){
  var w = poolWeights();
  if (boosted) w = [w[0] * 0.62, w[1] * 1.15, w[2] * 2.1];
  var total = w[0] + w[1] + w[2], x = r * total;
  if (x < w[0]) return 0;
  if (x < w[0] + w[1]) return 1;
  return 2;
}

/* Gold is earned by hand and locked sets are not his yet, so neither can turn
   up in a pack. Pulling a card for a set you cannot see is a bug that looks
   like a feature until you try to find it. */
function inPool(c){ return c[2] !== "gold" && setOpen(c[2]); }

function openPack(kind){
  var size = kind === "streak" ? STREAK_PACK_SIZE : PACK_SIZE;
  var boosted = kind === "streak";
  var got = [], seed = (Date.now() ^ (Math.random() * 4294967296)) >>> 0;
  for (var n = 0; n < size; n++){
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var rar = rollRarity(((seed >>> 8) & 0xffff) / 65536, boosted);
    var tier = CARDS.filter(function(c){ return c[1] === rar && inPool(c); });
    if (!tier.length) tier = CARDS.filter(function(c){ return c[1] === 0 && inPool(c); });
    if (!tier.length) tier = CARDS.filter(inPool);
    if (!tier.length) break;
    var fresh = tier.filter(function(c){ return !(S.cards || {})[c[0]] && got.indexOf(c[0]) < 0; });
    var from = fresh.length ? fresh : tier.filter(function(c){ return got.indexOf(c[0]) < 0; });
    if (!from.length) from = tier;
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    var card = from[seed % from.length];
    got.push(card[0]);
    S.cards = S.cards || {};
    S.cards[card[0]] = (S.cards[card[0]] || 0) + 1;
    S.seen = S.seen || {};
    if (S.cards[card[0]] === 1) S.seen[card[0]] = 0;   /* new, not yet looked at */
  }
  if (kind === "streak") S.openedStreak = (S.openedStreak || 0) + 1;
  else S.openedDay = (S.openedDay || 0) + 1;
  save();
  return got;
}

/* ---------------------------------------------------------------- spares
   Seventy-two per cent of everything he will ever pull is a card he already
   holds. That used to be worth nothing. Now a spare is worth spares, and
   spares finish a set.

   They are not money. They never appear on the Pot screen, nothing converts
   between the two, and they cannot buy a pack - a pack is what the three
   pillars earned or it is not a pack. Recomputed from the record, like
   everything else here, so the number cannot drift. */
function sparesEarned(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){
    var have = held[c[0]] || 0;
    if (have > 1) n += (have - 1) * RARITY[c[1]][4];
  });
  return n;
}
function spares(){ return Math.max(0, sparesEarned() - (S.sparesSpent || 0)); }
function craftCost(c){ return RARITY[c[1]][5]; }
function canCraft(c){
  return !!c && c[1] !== 3 && !(S.cards || {})[c[0]] && setOpen(c[2]) && spares() >= craftCost(c);
}
function craft(name){
  var c = cardByName(name);
  if (!canCraft(c)) return false;
  S.sparesSpent = (S.sparesSpent || 0) + craftCost(c);
  S.cards = S.cards || {};
  S.cards[name] = 1;
  S.crafted = S.crafted || {};
  S.crafted[name] = today();
  S.seen = S.seen || {};
  S.seen[name] = 0;
  save();
  return true;
}
/* ------------------------------------------------------------- collection */
var BY_NAME = {};
CARDS.forEach(function(c){ BY_NAME[c[0]] = c; });
function cardByName(n){ return BY_NAME[n]; }
function setNeeds(key){
  var s = SETS.filter(function(x){ return x[0] === key; })[0];
  return s && s[3] ? s[3] : 0;
}
function setOpen(key){ return fullDays() >= setNeeds(key); }
function setCards(key){ return CARDS.filter(function(c){ return c[2] === key; }); }
function setHeld(key){
  return setCards(key).filter(function(c){ return (S.cards || {})[c[0]]; }).length;
}
function setsComplete(){
  return SETS.filter(function(s){ return setHeld(s[0]) === setCards(s[0]).length; }).length;
}
function heldCount(){ return Object.keys(S.cards || {}).length; }
function goldHeld(){
  return CARDS.filter(function(c){ return c[1] === 3 && (S.cards || {})[c[0]]; }).length;
}
function newCount(){
  var n = 0, seen = S.seen || {};
  Object.keys(S.cards || {}).forEach(function(k){ if (seen[k] === 0) n++; });
  return n;
}
/* The nearest set to finishing. "One more card" is a much better prompt than
   "collect them all". */
function nearestSet(){
  var best = null;
  SETS.forEach(function(s){
    if (s[0] === "gold" || !setOpen(s[0])) return;
    var total = setCards(s[0]).length, have = setHeld(s[0]);
    if (have === total || have === 0) return;
    var left = total - have;
    if (!best || left < best.left) best = { set: s, left: left, have: have, total: total };
  });
  return best;
}
function nextDoor(){
  return SETS.filter(function(s){ return !setOpen(s[0]); })
             .sort(function(a, b){ return a[3] - b[3]; })[0] || null;
}

/* --------------------------------------------------------------- progression */
function xp(){
  var n = 0, held = S.cards || {};
  CARDS.forEach(function(c){ if (held[c[0]]) n += RARITY[c[1]][3]; });
  Object.keys(S.days).forEach(function(k){ if (allThree(k)) n += 15; });
  n += Object.keys(S.done || {}).length * 20;
  n += setsComplete() * 100;
  return n;
}
function rank(){
  var x = xp(), i = 0;
  for (var j = 0; j < RANKS.length; j++) if (x >= RANKS[j][0]) i = j;
  var next = RANKS[i + 1] || null;
  return { level: i + 1, name: RANKS[i][1], xp: x,
           from: RANKS[i][0], to: next ? next[0] : null, nextName: next ? next[1] : null };
}

/* ------------------------------------------------------------------- the pot
   His idea and a better one than XP: a number in real money that builds while
   he is consistent and goes down when he spends it on himself.

   He sets the rate, because a rate the app picked would be the app deciding
   what his consistency is worth. Everything else is a multiple of it, so the
   whole economy moves when he changes one number. */
function rate(){ var r = Number(S.rate); return r > 0 ? r : RATE_DEFAULT; }
function potEarned(){
  var r = rate(), pc = packCounts();
  return {
    days:     pc.day * r,
    streaks:  pc.streak * r * 2,
    sets:     setsComplete() * r * 3,
    trophies: goldHeld() * r * 5
  };
}
function potSpent(){
  return (S.spends || []).reduce(function(a, s){ return a + Number(s[1] || 0); }, 0);
}
function potTotal(){
  var e = potEarned();
  return e.days + e.streaks + e.sets + e.trophies;
}
function pot(){ return potTotal() - potSpent(); }
function money(n){
  return "$" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "");
}
function num(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* ---------------------------------------------------------------- picking */
function seedFor(s){
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(list, seed){
  var a = list.slice(), r = seed;
  for (var i=a.length-1;i>0;i--){
    r = (Math.imul(r, 1664525) + 1013904223) >>> 0;
    var j = r % (i+1);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* One reroll a day. An unlimited "somewhere else" hands back the daily
   decision this whole design exists to remove. */
var REROLLS_PER_DAY = 1;
function rerollsLeft(){ return Math.max(0, REROLLS_PER_DAY - (S.skip[today()] || 0)); }
function pick(){
  var f = S.filter || 0;   /* 0 all, 1 outdoors, 2 hawker */
  var pool = PLACES.filter(function(p){
    if (S.done[p[0]]) return false;
    if (f === 1 && p[3] !== 0) return false;
    if (f === 2 && p[3] !== 2) return false;
    return true;
  });

    return f === 1 ? p[3] === 0 : f === 2 ? p[3] === 2 : true;
  });
  if (!pool.length) return null;

  return order[(S.skip[today()] || 0) % order.length];

/* ====================================================================== the sky
   Which hour of his day the app is lit by. Derived from the clock on the
   device, so it is the sky where he is standing rather than where his work is. */
function skyPhase(){
  var h = new Date().getHours();
  if (h < 5)  return "deepnight";
  if (h < 7)  return "dawn";
  if (h < 11) return "morning";
  if (h < 16) return "day";
  if (h < 19) return "gold";

}
function paintSky(){
  document.documentElement.setAttribute("data-sky", skyPhase());
  /* Safari and Android tint the browser chrome with this, so the frame around
     the app follows the same sky as the app. */

    getComputedStyle(document.documentElement).getPropertyValue("--sky1").trim() || "#080B12");

/* ==================================================================== sound
   Synthesised, so there are no files to load and nothing to go missing. It
   only ever starts on a tap, which is also the only way iOS allows it. */
var AC = null;
function actx(){
  if (S.mute) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e){ return null; }
  return AC;
}
function tone(f, t0, d, type, vol, to){
  var a = actx(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), n = a.currentTime + t0;
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, n);
  if (to) o.frequency.exponentialRampToValueAtTime(to, n + d);
  g.gain.setValueAtTime(0.0001, n);
  g.gain.exponentialRampToValueAtTime(vol || .16, n + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(g); g.connect(a.destination);
  o.start(n); o.stop(n + d + .02);
}
function hiss(t0, d, vol, f0, f1){
  var a = actx(); if (!a) return;
  var len = Math.floor(a.sampleRate * d);
  var buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = a.createBufferSource(); src.buffer = buf;
  var flt = a.createBiquadFilter(); flt.type = "bandpass";
  var n = a.currentTime + t0;
  flt.frequency.setValueAtTime(f0 || 900, n);
  flt.frequency.exponentialRampToValueAtTime(f1 || 2600, n + d);
  var g = a.createGain(); g.gain.setValueAtTime(vol || .14, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  src.connect(flt); flt.connect(g); g.connect(a.destination);
  src.start(n); src.stop(n + d);
}
function sfx(name){
  if (S.mute) return;

  if (name === "nav")   { tone(430, 0, .05, "sine", .07); tone(660, .03, .07, "sine", .05); }
  if (name === "tick")  { tone(880, 0, .07, "triangle", .1, 1180); }
  if (name === "untick"){ tone(420, 0, .09, "triangle", .07, 300); }
  if (name === "tear")  { hiss(0, .42, .2, 500, 3400); tone(150, .02, .3, "sawtooth", .07, 70); }
  if (name === "flip")  { hiss(0, .1, .09, 1600, 500); tone(340, 0, .1, "triangle", .1, 560); }
  if (name === "rare")  { [523, 659, 784].forEach(function(f, i){ tone(f, i * .07, .34, "triangle", .13); }); }
  if (name === "gold")  { [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * .075, .5, "triangle", .15); });
                          hiss(.1, .5, .07, 3000, 7000); }
  if (name === "level") { [392, 523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * .085, .42, "sine", .14); }); }
  if (name === "done")  { tone(587, 0, .16, "sine", .11); tone(784, .09, .26, "sine", .11); }
  if (name === "full")  { [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, i * .09, .55, "triangle", .15); });
                          hiss(.14, .6, .06, 2400, 7200); tone(131, 0, .7, "sine", .1); }
  if (name === "craft") { [330, 494, 659].forEach(function(f, i){ tone(f, i * .06, .3, "sine", .12); });
                          hiss(0, .3, .06, 1800, 5200); }
  if (name === "money") { tone(880, 0, .1, "triangle", .1); tone(1174, .07, .18, "triangle", .09); }
  if (name === "no")    { tone(220, 0, .12, "square", .06, 165); }
}

/* ==================================================================== toast

function toast(msg, gold){

/* ============================================================ the modal system
   Every window.prompt() and window.confirm() is gone. Those dialogs render in
   whatever the browser feels like and say "web page" louder than anything else
   on the screen.

     ask({ title, say, field:{label,value,placeholder,type,prefix}, options:[...],
           confirm:"Do it", cancel:"Back", danger:true })
       -> Promise resolving to the typed value, the chosen option's id,
          true for a bare confirm, or null if dismissed. */
var MODAL = null;
function ask(opts){
  return new Promise(function(resolve){
    var el = document.getElementById("modal");
    var h = "<div class='mw'><div class='grab'></div>";
    h += "<h3>" + esc(opts.title || "") + "</h3>";
    if (opts.say) h += "<p class='say'>" + opts.say + "</p>";
    if (opts.pre) h += "<div class='pre'>" + esc(opts.pre) + "</div>";
    if (opts.field){
      var f = opts.field;
      if (f.label) h += "<label for='mkField'>" + esc(f.label) + "</label>";
      h += "<input id='mkField' type='" + (f.type === "number" ? "text" : "text") + "'"
        + (f.type === "number" ? " inputmode='decimal'" : "")
        + " value='" + esc(f.value == null ? "" : f.value) + "'"
        + " placeholder='" + esc(f.placeholder || "") + "'"
        + " autocomplete='off' autocapitalize='sentences'>";
    }
    if (opts.options && opts.options.length){
      h += "<div class='opts'>";
      opts.options.forEach(function(o){
        h += "<button class='btn" + (o.pri ? " pri" : "") + "' data-mk='" + esc(o.id) + "'>"
          + esc(o.label) + (o.note ? "<span style='display:block;font-weight:500;font-size:12.5px;opacity:.72;margin-top:2px'>" + esc(o.note) + "</span>" : "")
          + "</button>";
      });
      h += "</div>";
    }
    h += "<div class='btns'>";
    if (opts.confirm) h += "<button class='btn " + (opts.danger ? "" : "pri") + "' data-mk='__ok'>"
      + esc(opts.confirm) + "</button>";
    h += "<button class='btn quiet' data-mk='__no'>" + esc(opts.cancel || "Close") + "</button>";
    h += "</div></div>";
    el.innerHTML = h;
    el.className = "on";
    document.body.style.overflow = "hidden";

    var input = document.getElementById("mkField");
    if (input) setTimeout(function(){ try { input.focus(); input.select(); } catch(e){} }, 260);

    function close(v){
      if (!MODAL) return;
      MODAL = null;
      el.className = "";
      el.innerHTML = "";
      document.body.style.overflow = "";
      resolve(v);
    }
    MODAL = { close: close };
    el.onclick = function(ev){
      if (ev.target === el){ close(null); return; }
      var b = ev.target.closest ? ev.target.closest("[data-mk]") : null;
      if (!b) return;
      var id = b.dataset.mk;
      sfx("tap"); buzz(10);
      if (id === "__no") return close(null);
      if (id === "__ok") return close(input ? input.value.trim() : true);
      close(id);
    };
    if (input) input.onkeydown = function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); close(input.value.trim()); }
    };
  });
}
function tell(title, say){ return ask({ title: title, say: say, cancel: "Right" }); }

/* ================================================== the full-screen celebration
   The third pillar landing is the most important moment in the app. It used to
   be a re-render and a green snackbar. */
function celebrate(headline, sub){
  if (reduced()){ toast(headline, true); return; }
  var el = document.getElementById("fx");
  var cols = ["#F2B735","#FFE38A","#3FD9A0","#7C6BFF","#FF7A3D","#EEF3F8"];
  var h = "<div class='flash'></div><div class='ann'><b>" + esc(headline) + "</b>"
        + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div>";
  for (var i = 0; i < 46; i++){
    var d = (Math.random() * .5).toFixed(2), t = (1.5 + Math.random() * 1.1).toFixed(2);
    h += "<i class='conf' style='left:" + (Math.random() * 100).toFixed(1) + "%;"
      + "background:" + cols[i % cols.length] + ";"
      + "--spin:" + Math.round(360 + Math.random() * 900) + "deg;"
      + "animation-duration:" + t + "s;animation-delay:" + d + "s'></i>";

/* A number that flies from the thing that earned it to the chip that holds it.
   Small, and it is most of why a mobile game feels connected rather than
   stateful. */
function fly(fromEl, toSel, text, colour){
  if (reduced() || !fromEl) return;
  var to = document.querySelector(toSel);
  if (!to) return;
  var a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  var n = document.createElement("div");
  n.className = "fly";
  n.textContent = text;
  if (colour) n.style.color = colour;
  n.style.left = (a.left + a.width / 2 - 20) + "px";
  n.style.top = (a.top + a.height / 2 - 10) + "px";
  document.body.appendChild(n);
  requestAnimationFrame(function(){
    n.style.transform = "translate(" + (b.left + b.width / 2 - a.left - a.width / 2) + "px,"
      + (b.top + b.height / 2 - a.top - a.height / 2) + "px) scale(.6)";
    n.style.opacity = "0";
  });
  setTimeout(function(){
    if (n.parentNode) n.parentNode.removeChild(n);
    to.classList.remove("bump"); void to.offsetWidth; to.classList.add("bump");
  }, 720);
}

/* A total that counts up rather than jumping. */
function countTo(el, from, to, fmt, ms){
  if (!el) return;
  if (reduced() || from === to){ el.textContent = fmt(to); return; }
  var t0 = performance.now(), d = ms || 700;
  function step(t){
    var k = Math.min(1, (t - t0) / d);
    var e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* =================================================================== the card
   Art, sound, and a pack opening that takes over the screen. Everything here
   exists because a card you cannot turn over is a paragraph with a border. */

function hashOf(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}

/* Behind every emblem sits one of eight backdrops, picked by the card's name.
   Without this a set of eleven hawker cards is eleven identical bowls, and a
   collection where everything looks the same is not worth collecting.
   Shifts are unsigned: hashOf returns a full uint32, and a signed >> on
   anything with the top bit set goes negative, which once quietly put half the
   deck's artwork off-card at 0.65 scale and 18 degrees off true. */
function backdrop(h){
  var kind = h % 8, o = "<g opacity='.17' stroke='currentColor' fill='none' stroke-width='1.4'>", i, j;
  if (kind === 0){
    for (i = 1; i <= 6; i++) o += "<circle cx='50' cy='50' r='" + (i * 9 + (h % 5)) + "'/>";
  } else if (kind === 1){
    for (i = -4; i < 12; i++) o += "<path d='M" + (i * 13) + " 0 L" + (i * 13 + 60) + " 100'/>";
  } else if (kind === 2){
    for (i = 0; i < 8; i++) for (j = 0; j < 8; j++)
      o += "<circle cx='" + (7 + i * 12.5) + "' cy='" + (7 + j * 12.5) + "' r='1.7' fill='currentColor' stroke='none'/>";
  } else if (kind === 3){
    for (i = 0; i < 26; i++)
      o += "<circle cx='" + ((h >>> (i % 12)) % 100) + "' cy='" + ((h >>> ((i + 5) % 13)) % 100)
         + "' r='" + (1 + (i % 4)) + "' fill='currentColor' stroke='none'/>";
  } else if (kind === 4){
    for (i = 0; i < 8; i++) o += "<path d='M0 " + (i * 15 - 6) + " L50 " + (i * 15 + 6) + " L100 " + (i * 15 - 6) + "'/>";
  } else if (kind === 5){
    for (i = -3; i < 10; i++){
      o += "<path d='M" + (i * 14) + " 0 L" + (i * 14 + 100) + " 100'/>";
      o += "<path d='M" + (i * 14) + " 100 L" + (i * 14 + 100) + " 0'/>";
    }
  } else if (kind === 6){
    for (i = 0; i < 16; i++){
      var a = i * 22.5 * Math.PI / 180;
      o += "<path d='M50 50 L" + (50 + Math.cos(a) * 78).toFixed(1) + " "
         + (50 + Math.sin(a) * 78).toFixed(1) + "'/>";
    }
  } else {
    for (i = 0; i < 7; i++)
      o += "<path d='M-10 " + (100 - i * 15) + " q60 -" + (26 + i * 3) + " 120 0'/>";
  }
  return o + "</g>";
}

/* ------------------------------------------------------------ tone contours
   His recorded weak spots are tone pairs - 2 against 3, 3 against 4, 4 against
   2 - and the note in his study log says he drops the rising lilt on the 2nd
   and flattens the dip on the 3rd. So the Mandarin card draws the shape of the
   tone under the character. It is the only decoration in the deck that is also
   the lesson. */
var TONE_MARKS = {
  "ā":1,"ē":1,"ī":1,"ō":1,"ū":1,"ǖ":1,
  "á":2,"é":2,"í":2,"ó":2,"ú":2,"ǘ":2,
  "ǎ":3,"ě":3,"ǐ":3,"ǒ":3,"ǔ":3,"ǚ":3,
  "à":4,"è":4,"ì":4,"ò":4,"ù":4,"ǜ":4
};
function tonesOf(pinyin){
  var out = [], i;
  for (i = 0; i < pinyin.length; i++){
    var t = TONE_MARKS[pinyin[i]];
    if (t) out.push(t);
  }
  return out;
}
/* One glyph per syllable, laid out across the foot of the art window. */
function toneArt(pinyin, hanzi){
  var tones = tonesOf(pinyin);
  var n = Math.max(tones.length, 1);
  /* a syllable with no mark is the neutral tone, drawn as a dot */
  if (!tones.length) tones = [5];
  var slots = Math.max(tones.length, hanzi ? hanzi.length : 1);
  while (tones.length < slots) tones.push(5);
  var w = 100 / slots, o = "<g opacity='.5' stroke='currentColor' fill='none' stroke-width='2.6' "
        + "stroke-linecap='round' stroke-linejoin='round'>";
  tones.forEach(function(t, i){
    var x0 = i * w + w * 0.24, x1 = i * w + w * 0.76, mid = (x0 + x1) / 2;
    var hi = 79, lo = 92;
    if (t === 1) o += "<path d='M" + x0 + " " + hi + " L" + x1 + " " + hi + "'/>";
    else if (t === 2) o += "<path d='M" + x0 + " " + lo + " L" + x1 + " " + hi + "'/>";
    else if (t === 3) o += "<path d='M" + x0 + " " + (hi + 3) + " Q" + mid + " " + (lo + 4)
      + " " + x1 + " " + (hi - 1) + "'/>";
    else if (t === 4) o += "<path d='M" + x0 + " " + hi + " L" + x1 + " " + lo + "'/>";
    else o += "<circle cx='" + mid + "' cy='" + ((hi + lo) / 2) + "' r='2.2' fill='currentColor' stroke='none'/>";
  });
  return o + "</g>";
}

/* Each set has its own emblem, varied per card by its name, so no two faces
   are identical and every card still reads as belonging somewhere.
   Memoised: this used to regenerate 5,144 SVG nodes on every single render. */
var ART_CACHE = {};
function cardArt(c){
  if (ART_CACHE[c[0]]) return ART_CACHE[c[0]];
  var h = hashOf(c[0]), k = c[2];
  var a = h % 97, b = (h >>> 7) % 89, d = (h >>> 13) % 73;
  var o = "<svg viewBox='0 0 100 100' preserveAspectRatio='xMidYMid meet' aria-hidden='true'>";
  o += backdrop(h);

  /* Mandarin: the character is the picture, and the tone is drawn under it. */
  if (k === "zh"){
    o += toneArt(c[0], c[4]);
    o += "</svg>";
    return (ART_CACHE[c[0]] = o);
  }

  var rot = ((h >>> 17) % 13) - 6, sc = (0.82 + ((h >>> 21) % 18) / 100).toFixed(2);

/* The frame is the rarity and the art window is the card. Without this the
   eleven hawker cards were eleven grey bowls with slightly different
   backdrops, which is not a collection - it is a spreadsheet with rounded
   corners. Hue comes off the card's own name, so it never moves. */
function artTint(c){
  var h = hashOf(c[0] + "~t"), hue = h % 360;
  /* skip the muddy band where everything turns into the same olive */
  if (hue > 62 && hue < 96) hue += 40;
  var sat = 26 + (h >>> 9) % 22;
  return "--artA:hsl(" + hue + "," + sat + "%,93%);"
       + "--artB:hsl(" + ((hue + 18) % 360) + "," + (sat + 10) + "%,79%);"
       + "--cink:hsl(" + hue + "," + Math.min(64, sat + 26) + "%,25%)";
}

/* A card. Face up or face down, small in the binder or large on the stage.
   A card he does not hold in a set he can see is shown as its own face, muted
   - never as a back. He has to be able to ask what a card is, and the one
   place that question gets asked is the one place it used to be refused. */
function tcard(c, count, opts){
  opts = opts || {};
  var r = c[1];
  var cls = "tc r" + r + (opts.down ? " down" : "") + (count ? "" : " miss")
          + (opts.lg ? " lg" : "") + (opts.extra || "");
  var h = "<div class='" + cls + "'" + (opts.attr || "") + ">";
  h += "<div class='tc-i'>";
  h += "<div class='tc-f'><div class='tc-pane'>";
  h += "<div class='tc-nm'>" + esc(c[0]) + "</div>";
  h += "<div class='tc-art' style='" + artTint(c) + "'>" + cardArt(c);
  if (c[2] === "zh" && c[4]) h += "<div class='tc-han zh'>" + esc(c[4]) + "</div>";
  if (r >= 2 && count) h += "<div class='tc-holo'></div>";
  if (count > 1) h += "<span class='tc-cnt'>x" + count + "</span>";
  if (count && (S.seen || {})[c[0]] === 0) h += "<span class='tc-new'></span>";
  h += "<div class='tc-gem'></div></div>";
  h += "<div class='tc-nt'>" + esc(c[3]) + "</div>";
  h += "<div class='tc-glare'></div>";
  h += "</div></div>";
  h += "<div class='tc-b'>" + BACKMARK + "</div>";
  h += "</div></div>";
  return h;
}
/* The back. One mark for the whole deck, so a face-down stack reads as a
   stack: the sun that runs through the app, not a letter. */
var BACKMARK = "<div class='tc-mark'><svg viewBox='0 0 100 100' fill='none' aria-hidden='true'>"
  + "<circle cx='50' cy='50' r='16' stroke='currentColor' stroke-width='4'/>"
  + "<path d='M50 14v10M50 76v10M14 50h10M76 50h10M24.5 24.5l7 7M68.5 68.5l7 7"
  + "M75.5 24.5l-7 7M31.5 68.5l-7 7' stroke='currentColor' stroke-width='4' stroke-linecap='round'/>"
  + "</svg></div>";

/* Touch the card and the foil moves. Rare cards should reward being looked at. */
function tilt(tc){
  if (reduced() || !tc) return;
  function at(ev){
    var t = (ev.touches && ev.touches[0]) || ev;
    var r = tc.getBoundingClientRect();
    var x = (t.clientX - r.left) / r.width - .5, y = (t.clientY - r.top) / r.height - .5;
    var inner = tc.querySelector(".tc-i");
    if (inner && !tc.classList.contains("down")){
      inner.style.transform = "rotateY(" + (x * 17).toFixed(1) + "deg) rotateX("
        + (-y * 17).toFixed(1) + "deg)";
    }
    tc.style.setProperty("--ang", ((x + .5) * 340).toFixed(0) + "deg");
  }
  function off(){
    var inner = tc.querySelector(".tc-i");
    if (inner && !tc.classList.contains("down")) inner.style.transform = "";
  }
  tc.addEventListener("touchmove", function(e){ at(e); }, { passive: true });
  tc.addEventListener("touchend", off);
  tc.addEventListener("mousemove", at);
  tc.addEventListener("mouseleave", off);
}

/* ================================================================= the stage */
var ST = null;
function stageEl(){ return document.getElementById("stage"); }

function openStage(kind){
  var before = rank().level, sparesBefore = spares();
  var got = openPack(kind);
  ST = { cards: got, i: 0, kind: kind, lvlBefore: before, sparesBefore: sparesBefore };
  var el = stageEl();
  el.innerHTML =
      "<div class='rays'></div>"
    + "<div class='step'>Tap to open</div>"
    + "<button class='pk" + (kind === "streak" ? " big" : "") + "' id='stPack'>"
    +   "<span class='pk-sheen'></span><span class='pk-strip'></span>"
    +   "<span class='pk-body'><span class='pk-ttl'>"
    +     (kind === "streak" ? "Streak Pack" : "Day Pack") + "</span>"
    +   "<span class='pk-sub'>" + got.length + " cards</span></span>"
    + "</button>"
    + "<div class='under' style='visibility:hidden'></div>";
  el.className = "on";
  document.body.style.overflow = "hidden";
  document.getElementById("stPack").addEventListener("click", tearPack, { once: true });
}

function tearPack(){
  var pk = document.getElementById("stPack");
  sfx("tear"); buzz([12, 30, 18]);
  pk.classList.add("tear");
  stageEl().classList.add("lit");
  setTimeout(showSlot, reduced() ? 0 : 560);
}

function showSlot(){
  var el = stageEl(), left = ST.cards.length - ST.i;
  var dots = "", i;
  for (i = 0; i < ST.cards.length; i++){
    var c0 = cardByName(ST.cards[i]);
    var seen = i < ST.i;
    dots += "<i class='" + (seen ? (c0 && c0[1] >= 2 ? "on hi" : "on") : "") + "' data-dot='" + i + "'></i>";
  }
  el.innerHTML =
      "<div class='rays'></div>"
    + "<div class='step' id='stStep'>Tap to turn over &middot; " + (ST.i + 1)
    +   " of " + ST.cards.length + "</div>"
    + "<div class='slot' id='stSlot'>"
    +   (left > 2 ? "<div class='ghost g2'></div>" : "")
    +   (left > 1 ? "<div class='ghost g1'></div>" : "")
    + "</div>"
    + "<div class='dots'>" + dots + "</div>"
    + "<div class='under' id='stUnder' style='visibility:hidden'>"
    +   "<button id='stNext'>Next</button></div>";
  el.className = "on lit";

  var c = cardByName(ST.cards[ST.i]);
  var slot = document.getElementById("stSlot");
  slot.insertAdjacentHTML("beforeend", tcard(c, S.cards[c[0]], { down: true, lg: true }));
  var tc = slot.querySelector(".tc");
  tc.addEventListener("click", function(){ turnCard(tc, c); }, { once: true });
  tilt(tc);
  if (reduced()) turnCard(tc, c);
}

function turnCard(tc, c){
  tc.classList.remove("down");
  sfx("flip"); buzz(14);
  var delay = reduced() ? 0 : 340;
  setTimeout(function(){
    if (c[1] >= 2){
      tc.classList.add("sweep");
      sparks(tc, c[1] === 3 ? 22 : 14);
      sfx(c[1] === 3 ? "gold" : "rare");
      buzz([20, 45, 25, 45, 40]);
    }
    var st = document.getElementById("stStep");
    var dup = S.cards[c[0]] > 1;
    if (st) st.textContent = RARITY[c[1]][0] + (dup
      ? " · spare · +" + RARITY[c[1]][4]
      : " · new");
    var dot = document.querySelector("[data-dot='" + ST.i + "']");
    if (dot) dot.className = c[1] >= 2 ? "on hi" : "on";
    var u = document.getElementById("stUnder");
    if (u){
      u.style.visibility = "visible";
      var b = document.getElementById("stNext");
      var last = ST.i >= ST.cards.length - 1;
      b.textContent = last ? "Done" : "Next";
      if (last) b.className = "pri";
      b.onclick = function(){
        sfx("tap");
        if (last) showScore(); else { ST.i++; showSlot(); }
      };
    }
  }, delay);
}

function sparks(host, n){
  if (reduced()) return;
  var b = document.createElement("div");
  b.className = "burst";
  var h = "";
  for (var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2 + Math.random();
    var d = 70 + Math.random() * 90;
    h += "<i style='--dx:" + (Math.cos(a) * d).toFixed(0) + "px;--dy:"
       + (Math.sin(a) * d).toFixed(0) + "px;animation-delay:" + (i * 14) + "ms'></i>";
  }
  b.innerHTML = h;
  host.appendChild(b);
  setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1300);
}

function showScore(){
  var el = stageEl(), fresh = 0, gain = 0;
  ST.cards.forEach(function(n){
    var c = cardByName(n);
    if (!c) return;
    gain += RARITY[c[1]][3];
    if (S.cards[n] === 1) fresh++;
  });
  var spare = ST.cards.length - fresh;
  var gotSpares = spares() - ST.sparesBefore;
  var r = rank(), levelled = r.level > ST.lvlBefore;
  var w = packsWaiting(), more = w.day + w.streak;

  el.innerHTML =
      "<div class='rays'></div>"
    + (levelled ? "<div class='lvlup'>" + esc(r.name) + "</div>" : "")
    + "<div class='score'><div class='big'>+" + gain + " XP</div>"
    +   "<div class='sm'>" + fresh + " new" + (spare ? " &middot; " + spare + " spare" : "")
    +   " &middot; " + heldCount() + " of " + CARDS.length + " held</div>"
    +   (gotSpares > 0 ? "<div class='shard'>+" + gotSpares + " spares</div>" : "")
    + "</div>"
    + "<div class='under'>"
    +   (more ? "<button id='stMore'>Open another</button>" : "")
    +   "<button class='pri' id='stDone'>Done</button></div>";
  el.className = "on lit";
  sfx(levelled ? "level" : "done");
  buzz(levelled ? [30, 60, 30, 60, 60] : 20);
  document.getElementById("stDone").onclick = closeStage;
  var m = document.getElementById("stMore");
  if (m) m.onclick = function(){
    sfx("tap");
    openStage(packsWaiting().streak ? "streak" : "day");
  };
}

function closeStage(){
  /* Opening the first pack is the end of the tutorial: he has done the loop
     once and been paid for it, so the rest of the app can appear. */
  graduate();
  if (typeof coachStop === "function") coachStop();
  sfx("tap");
  var el = stageEl();
  el.className = "";
  el.innerHTML = "";
  document.body.style.overflow = "";
  ST = null;
  paintHud();
  render();
}

/* ------------------------------------------------------------- card detail
   Tapping a card shows you the card. Including one you do not hold - that is
   the only place the question "what is this" gets asked, and it used to be
   answered with a face-down back and the words "not found yet". */
function openSheet(name){
  var c = cardByName(name);
  if (!c) return;
  var held = (S.cards || {})[name];
  var st = SETS.filter(function(s){ return s[0] === c[2]; })[0];
  var el = document.getElementById("sheet");
  if (held && (S.seen || {})[name] === 0){ S.seen[name] = 1; save(); }

  var meta;
  if (held){
    meta = esc(st ? st[1] : "") + " &middot; " + RARITY[c[1]][0]
      + (held > 1 ? " &middot; " + held + " copies, " + ((held - 1) * RARITY[c[1]][4]) + " spares from them" : "")
      + ((S.crafted || {})[name] ? " &middot; crafted" : "");
  } else if (c[1] === 3){
    meta = esc(st ? st[1] : "") + " &middot; not in packs. This one only happens by happening.";
  } else {
    meta = esc(st ? st[1] : "") + " &middot; " + RARITY[c[1]][0] + " &middot; not held";
  }

  var can = canCraft(c), cost = craftCost(c);
  el.innerHTML = "<div class='slot' id='shSlot'></div>"
    + "<div class='meta'>" + meta + "</div>"
    + "<div class='acts'>"
    + (!held && c[1] !== 3 && setOpen(c[2])
        ? "<button class='" + (can ? "pri" : "") + "' " + (can ? "" : "disabled ")
          + "data-craftit='" + esc(name) + "'>"
          + (can ? "Make it &middot; " + cost + " spares" : cost + " spares (" + spares() + ")")
          + "</button>"
        : "")
    + "<button id='shClose'>Close</button></div>";
  el.className = "on";
  document.getElementById("shSlot").innerHTML = tcard(c, held, { lg: true });
  var tc = el.querySelector(".tc");
  if (held) tilt(tc);
  sfx("tap");
  document.getElementById("shClose").onclick = closeSheet;
  el.onclick = function(ev){ if (ev.target === el) closeSheet(); };
}
function closeSheet(){
  var el = document.getElementById("sheet");
  el.className = ""; el.innerHTML = "";
}

/* Trophies are not pulled, they are earned - but the moment should look the
   same, or claiming one feels like ticking a box. */
function claimTrophy(name){
  var before = rank().level;
  S.cards = S.cards || {};
  S.cards[name] = 1;
  S.seen = S.seen || {}; S.seen[name] = 0;
  save();
  ST = { cards: [name], i: 0, kind: "gold", lvlBefore: before, sparesBefore: spares() };
  var el = stageEl();
  el.className = "on lit";
  el.innerHTML = "";
  document.body.style.overflow = "hidden";
  showSlot();
}

/* ==================================================================== the HUD
   Rank, progress, the pot and the spares, on every screen, always. This is
   most of what separates a game client from a page: the furniture never
   leaves, so the app is a place you are in rather than a document you are
   reading. */
var HUD = { xp:0, pot:0, spares:0, level:0 };
function paintHud(animate){
  var r = rank(), pt = pot(), sp = spares();
  var pct = r.to ? (r.xp - r.from) / (r.to - r.from) : 1;
  var C = 2 * Math.PI * 19;

  /* Nothing in the HUD until it means something. Two chips reading zero on a
     first open is the app showing off furniture he has not earned. */
  var earnedAny = potTotal() > 0, hasSpares = sparesEarned() > 0;
  document.getElementById("chipPot").hidden = !earnedAny;
  document.getElementById("chipShard").hidden = !hasSpares;
  document.getElementById("hudXpN").hidden = r.xp === 0;
  document.getElementById("hud").classList.toggle("bare", r.xp === 0);

  var crest = document.getElementById("crest");
  crest.querySelector(".fg").setAttribute("stroke-dasharray", (C * pct).toFixed(1) + " " + C.toFixed(1));
  crest.querySelector("b").textContent = r.level;
  if (animate && r.level > HUD.level && HUD.level){
    crest.classList.remove("up"); void crest.offsetWidth; crest.classList.add("up");
  }
  document.getElementById("hudRank").textContent = r.name;
  document.getElementById("hudXpBar").style.width = (pct * 100).toFixed(1) + "%";
  document.getElementById("hudXpN").textContent = r.to
    ? num(r.xp) + " / " + num(r.to) + " XP" : num(r.xp) + " XP · top rank";

  var potEl = document.getElementById("chipPotN"), spEl = document.getElementById("chipShardN");
  if (animate) countTo(potEl, HUD.pot, pt, function(v){ return num(v); });
  else potEl.textContent = num(pt);
  if (animate) countTo(spEl, HUD.spares, sp, function(v){ return num(v); });
  else spEl.textContent = num(sp);

  HUD = { xp:r.xp, pot:pt, spares:sp, level:r.level };

  var w = packsWaiting(), packs = w.day + w.streak, nu = newCount();
  setBadge("deck", packs || nu, !!packs);
}
function setBadge(tab, n, pulse){
  var b = document.querySelector("#nav button[data-tab='" + tab + "']");
  if (!b) return;
  var old = b.querySelector(".badge");
  if (old) old.remove();
  if (!n) return;
  var s = document.createElement("span");
  s.className = "badge" + (pulse ? " pulse" : "");
  s.textContent = n > 99 ? "99+" : n;
  b.appendChild(s);
}

/* =============================================================== the sky arc
   The dial is gone. Its outer ring is unrolled across the sky itself: one arc
   from midnight to midnight with noon at the apex, Malta's shift drawn along
   it as the bright band, and the sun - the moon, once it is down - riding it
   at now. A widget parked on the world was still a widget; in a game the
   world is the instrument. */
function arcPt(u){
  var x0 = 22, y0 = 150, cx = 195, cy = 4, x1 = 368, y1 = 150, v = 1 - u;
  return [v*v*x0 + 2*v*u*cx + u*u*x1, v*v*y0 + 2*v*u*cy + u*u*y1];
}
function arcSeg(a, b){
  var pts = [], n = Math.max(2, Math.round((b - a) * 90));
  for (var i = 0; i <= n; i++){
    var q = arcPt(a + (b - a) * i / n);
    pts.push(q[0].toFixed(1) + "," + q[1].toFixed(1));
  }
  return pts.join(" ");
}
function skyHTML(){
  var s = shape();
  var h = "<svg viewBox='0 0 390 166' aria-hidden='true'>";
  h += "<polyline class='arc' points='" + arcSeg(0, 1) + "'/>";
  if (!s.weekend && s.end > s.start){
    h += "<polyline class='band' points='"
      + arcSeg(s.start / 1440, Math.min(s.end, 1439) / 1440) + "'/>";
  }
  [360, 720, 1080].forEach(function(m){
    var q = arcPt(m / 1440);
    h += "<circle class='hr' cx='" + q[0].toFixed(1) + "' cy='" + q[1].toFixed(1) + "' r='2.1'/>";
  });
  var now = arcPt(s.now / 1440), ph = skyPhase();
  var night = ph === "night" || ph === "deepnight" || ph === "dusk";
  h += "<circle class='orb" + (night ? " moon" : "") + "' cx='" + now[0].toFixed(1)
    + "' cy='" + now[1].toFixed(1) + "' r='9'/>";
  if (!night){
    for (var k = 0; k < 8; k++){
      var ra = k * Math.PI / 4;
      h += "<line class='ray' x1='" + (now[0] + Math.cos(ra) * 12.5).toFixed(1)
        + "' y1='" + (now[1] + Math.sin(ra) * 12.5).toFixed(1)
        + "' x2='" + (now[0] + Math.cos(ra) * 16.5).toFixed(1)
        + "' y2='" + (now[1] + Math.sin(ra) * 16.5).toFixed(1) + "'/>";
    }
  } else {
    h += "<circle class='cut' cx='" + (now[0] + 5).toFixed(1) + "' cy='"
      + (now[1] - 3.5).toFixed(1) + "' r='8'/>";
  }
  h += "</svg><span class='dtime'>" + esc(dialLabel(s)) + "</span>";
  return h;
}
function dialLabel(s){
  if (s.weekend) return "No shift today";
  if (s.working) return "Malta until " + s.endT;
  if (s.now < s.start) return "Malta has " + s.startT + " \u2013 " + s.endT;
  return "Done at " + s.endT;
}

/* ================================================================== the gem
   What the day pays, floating in the middle of the scene. Three pips - one a
   pillar, in its own colour - light jade as each lands; all of them turns the
   centre gold and it becomes the button that opens the pack. */
function gemHTML(done, packs){
  var t = today();
  var h = "<span class='gcore'>" + svg("pack", 40)
    + (packs > 1 ? "<b class='gn'>" + packs + "</b>" : "") + "</span>";
  h += "<span class='pips'>";
  PILLARS.forEach(function(g){
    var on = pDone(t, g[0]), carried = !on && !required(g[0], t);
    h += "<i class='" + (on ? "on" : carried ? "na" : "") + "' style='--pil:" + g[4] + "'></i>";
  });
  h += "</span>";
  if (!packs) h += "<span class='dcount'>" + done + "<i>/3</i> for a pack</span>";
  return h;
}

/* ================================================================== TODAY
   Not a page any more. One viewport, no scrolling: the sky with the sun on
   it, the gem, one line, three buttons that say what they mean, and a book
   for everything else. A real game's home screen is a scene you stand in,
   not a column you read down. */
function viewToday(){
  var t = today(), d = day(t), y = day(shift(-1));
  var w = packsWaiting(), packs = w.day + w.streak;
  var done = PILLARS.filter(function(g){ return pDone(t, g[0]); }).length;
  var green = !S.onboarded;
  var h = "";

  h += "<div class='sky'>" + skyHTML() + "</div>";

  h += "<div class='gemwrap'><" + (packs ? "button" : "div") + " class='gem"
    + (packs ? " won" : "") + "'" + (packs ? " data-open='1'" : "") + ">"
    + gemHTML(done, packs) + "</" + (packs ? "button" : "div") + ">";

  /* one line, and only one - it sits with the gem, not somewhere below it */
  var owed = PILLARS.filter(function(g){ return required(g[0], t) && !pDone(t, g[0]); }).length;
  var ask, sub;
  if (packs){
    ask = packs === 1 ? "That is a pack." : packs + " packs.";
    sub = "Tap it to open.";
  } else if (allThree(t)){
    ask = "Today is in."; sub = "Back tomorrow for the next one.";
  } else if (!done){
    if (owed === 3){ ask = "Three things make a day."; sub = "Tap what you have done."; }
    else { ask = "Two things make a " + dayName(t) + ".";
           sub = "No shift to stop today. The other two still count."; }
  } else {
    ask = owed === 1 ? "One more." : owed + " to go.";
    sub = "All of them earns a pack.";
  }
  h += "<div class='askwrap'><p class='ask" + (packs ? " gold" : "") + "'>" + esc(ask) + "</p>"
    + "<p class='asksub'>" + esc(sub) + "</p></div></div>";

  /* the three, with their definitions on them */
  h += "<div class='triad'>";
  PILLARS.forEach(function(g){
    var on = pDone(t, g[0]), st = streak(g[0]), carried = !on && !required(g[0], t);
    h += "<button class='pil" + (on ? " on" : "") + (carried ? " carried" : "") + "' data-p='"
      + g[0] + "' style='--pil:" + g[4] + "' aria-pressed='" + (on ? "true" : "false") + "'>"
      + "<span class='disc'>" + svg(on ? "tick" : g[2], 27) + "</span>"
      + "<span class='lb'>" + esc(g[1]) + "</span>"
      + "<span class='gl'>" + esc(g[5]) + "</span>"
      + (st > 0 || carried
          ? "<span class='st'>" + (carried ? "no shift today" : st + (st === 1 ? " day" : " days")) + "</span>"
          : "")
      + "</button>";
  });
  h += "</div>";

  /* On the very first day, that is the whole screen. */
  if (green) return h;

  var alert = y.said && y.kept === undefined;
  h += "<button class='bookbtn' data-bookopen='1'>" + svg("pen", 15)
    + "<span>Today\u2019s book</span>" + (alert ? "<i class='dot'></i>" : "") + "</button>";
  return h;
}
function dayName(k){
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
    [new Date(k + "T00:00:00").getDay()];
}

/* The doors were always a progression track; they were just never drawn as
   one. Nothing new is being invented here - these are the same six gates. */
function seasonHTML(){
  var fd = fullDays(), locked = SETS.filter(function(s){ return s[3] > 0; })
    .sort(function(a,b){ return a[3] - b[3]; });
  if (!locked.length) return "";
  var next = locked.filter(function(s){ return fd < s[3]; })[0];
  var h = "<div class='season'><div class='top'><b>The long game</b>"
    + "<span class='mono'>" + heldCount() + " / " + CARDS.length + "</span></div>";
  h += "<p>" + (next
      ? esc((next[3] - fd) + " more full " + (next[3] - fd === 1 ? "day" : "days") + " opens "
            + next[1] + " — " + setCards(next[0]).length + " cards that cannot turn up before then.")
      : "Every set is open. What is left is the finding.") + "</p>";
  h += "<div class='nodes'>";
  locked.forEach(function(s){
    var open = fd >= s[3], isNext = next && next[0] === s[0];
    /* Two sets begin with "The", so the first word is not a label. */
    var w = s[1].split(" ");
    var lab = (w[0].toLowerCase() === "the" && w[1]) ? w[1] : w[0];
    h += "<div class='node" + (open ? " got" : isNext ? " next" : "") + "'>"
      + "<div class='d'>" + s[3] + "</div><div class='l'>" + esc(lab) + "</div></div>";
  });
  h += "</div></div>";
  return h;
}

/* ==================================================================== DECK
   One set at a time behind a rail that stays on screen. The old screen put all
   seventeen sets and 158 cards in a single column - sixteen thousand pixels of
   identical grey backs, which is a filing cabinet with the drawer taken out. */
var DECKSET = null, DECKFILTER = 0;   /* 0 all, 1 missing, 2 held */

function viewDeck(){
  var fd = fullDays(), w = packsWaiting(), h = "";

  /* packs first, because that is what he came for */
  if (w.streak || w.day){
    h += "<div style='display:flex;gap:11px;justify-content:center;margin:8px 0 4px'>";
    if (w.streak) h += "<button class='pk big' data-pack='streak' style='flex:1 1 0;max-width:150px;margin:0'>"
      + "<span class='pk-sheen'></span><span class='pk-strip'></span>"
      + (w.streak > 1 ? "<span class='pk-n'>" + w.streak + "</span>" : "")
      + "<span class='pk-body'><span class='pk-ttl'>Streak Pack</span>"
      + "<span class='pk-sub'>Five cards &middot; better odds</span></span></button>";
    if (w.day) h += "<button class='pk' data-pack='day' style='flex:1 1 0;max-width:150px;margin:0'>"
      + "<span class='pk-sheen'></span><span class='pk-strip'></span>"
      + (w.day > 1 ? "<span class='pk-n'>" + w.day + "</span>" : "")
      + "<span class='pk-body'><span class='pk-ttl'>Day Pack</span>"
      + "<span class='pk-sub'>Three cards</span></span></button>";
    h += "</div>";
  }

  /* pick the set to show: last chosen, else the one nearest finishing */
  var open = SETS.filter(function(s){ return setOpen(s[0]); });
  if (!DECKSET || !open.filter(function(s){ return s[0] === DECKSET; }).length){
    var near = nearestSet();
    DECKSET = near ? near.set[0] : open[0][0];
  }

  /* the rail */
  h += "<div class='rail'>";
  SETS.forEach(function(s){
    var cs = setCards(s[0]), have = setHeld(s[0]), openS = setOpen(s[0]);
    h += "<button data-set='" + s[0] + "'" + (s[0] === DECKSET ? " aria-current='true'" : "")
      + (openS ? "" : " class='lock'") + ">"
      + (openS ? ring(have, cs.length) : "<span style='width:26px;display:flex;justify-content:center'>"
          + svg("lock", 18) + "</span>")
      + "<span>" + esc(s[1]) + "</span></button>";
  });
  h += "</div>";

  var st = SETS.filter(function(s){ return s[0] === DECKSET; })[0];
  var cs = setCards(DECKSET), have = setHeld(DECKSET), done = have === cs.length;

  h += "<div class='sethead'><div class='big'>" + have + "<small>of " + cs.length + "</small></div>"
    + "<div class='bd'><h3>" + esc(st[1]) + (done ? " &middot; complete" : "") + "</h3>"
    + "<p>" + esc(st[2]) + "</p></div></div>";

  if (DECKSET === "gold"){
    var unclaimed = cs.filter(function(c){ return !(S.cards || {})[c[0]]; });
    if (unclaimed.length){
      h += "<div class='panel ember'><h3>Claim one</h3>"
        + "<p class='dim' style='margin:6px 0 0'>Only when it has actually happened. These are not in "
        + "packs and they cannot be made.</p><div class='btns tight'>";
      unclaimed.forEach(function(c){
        h += "<button class='btn' data-claim='" + esc(c[0]) + "'>" + esc(c[0]) + "</button>";
      });
      h += "</div></div>";
    }
  } else {
    h += "<div class='filters'>"
      + "<button data-df='0'" + (DECKFILTER === 0 ? " aria-pressed='true'" : "") + ">All " + cs.length + "</button>"
      + "<button data-df='1'" + (DECKFILTER === 1 ? " aria-pressed='true'" : "") + ">Missing " + (cs.length - have) + "</button>"
      + "<button data-df='2'" + (DECKFILTER === 2 ? " aria-pressed='true'" : "") + ">Held " + have + "</button>"
      + "</div>";
  }

  var show = cs.filter(function(c){
    var n = (S.cards || {})[c[0]];
    if (DECKFILTER === 1) return !n;
    if (DECKFILTER === 2) return !!n;
    return true;
  });
  if (show.length){
    h += "<div class='binder'>";
    show.forEach(function(c){
      var n = (S.cards || {})[c[0]];
      h += tcard(c, n, { attr: " data-card=\"" + esc(c[0]) + "\"" });
    });
    h += "</div>";
  } else {
    h += "<div class='empty'>" + (DECKFILTER === 1 ? "Nothing missing here." : "Nothing held here yet.") + "</div>";
  }

  /* spares, under the set they would finish */
  var sp = spares();
  var missing = cs.filter(function(c){ return !(S.cards || {})[c[0]] && c[1] !== 3; });
  var affordable = missing.filter(function(c){ return craftCost(c) <= sp; });
  if (DECKSET !== "gold"){
    h += "<h2>Spares</h2><div class='panel'>";
    h += "<div style='display:flex;align-items:center;gap:13px'>"
      + "<span style='color:var(--jade);flex:none'>" + svg("spare", 30) + "</span>"
      + "<div style='flex:1'><div class='mono' style='font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--jade)'>"
      + num(sp) + "</div><div class='dim'>from " + num(sparesEarned()) + " earned</div></div></div>";
    h += "<p class='dim' style='margin:10px 0 0'>Every card you pull twice is worth spares: "
      + RARITY[0][4] + " for a common, " + RARITY[1][4] + " uncommon, " + RARITY[2][4] + " rare. "
      + "They make a card you are missing — " + RARITY[0][5] + ", " + RARITY[1][5] + " or "
      + RARITY[2][5] + " — and nothing else. They are not money and they do not buy packs.</p>";
    if (missing.length){
      h += "<div class='btns'><button class='btn " + (affordable.length ? "go" : "quiet") + "'"
        + (affordable.length ? "" : " disabled") + " data-craft='" + DECKSET + "'>"
        + (affordable.length ? "Make one from " + esc(st[1]) : "Not enough for anything in " + esc(st[1]))
        + "</button></div>";
    }
    h += "</div>";
  }

  /* the next door */
  var door = nextDoor();
  if (door){
    var dleft = door[3] - fd;
    h += "<div class='door'><span class='lk'>" + svg("lock", 18) + "</span>"
      + "<span class='bd'><b>" + esc(door[1]) + "</b><span>" + setCards(door[0]).length
      + " cards, sealed. They cannot turn up in a pack before then.</span></span>"
      + "<span class='at'>" + dleft + " full<br>" + (dleft === 1 ? "day" : "days") + "</span></div>";
  }
  /* the ladder lived on Today; progression belongs with the collection */
  if (fd >= 3) h += seasonHTML();
  return h;
}

/* ===================================================================== POT
   Real money at a rate he set. Spares are deliberately not on this screen and
   nothing here converts into anything there. */
/* A ledger is a document. A vault is a screen: one number you care about, a
   bar that shows where it came from, and the prizes it is aimed at. */
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

function viewPot(){
  var best = bestStreak(), e = potEarned(), spent = potSpent(), have = pot(), h = "";
  var pc = packCounts();

  h += "<div class='vault'>"
    + "<div class='amt' id='potBig'>" + money(have) + "</div>"
    + "<div class='cap'>yours to spend</div>"
    + "<div class='btns'><button class='btn pri' data-spend='1'>Spent some</button>"
    +   "<button class='btn' data-rate='1'>Change the rate</button></div>"
    + "<p class='fine'>" + money(rate()) + " a full day, and it never expires. The only rule is that "
    +   "you tell it when you spend, so the number stays true.</p></div>";

  /* where it came from, as a bar rather than a table */
  var src = [
    [e.days,     plural(pc.day, "full day", "full days"),                 "var(--jade)"],
    [e.streaks,  plural(pc.streak, "seven-day run", "seven-day runs"),    "var(--gold)"],
    [e.sets,     plural(setsComplete(), "set finished", "sets finished"), "var(--violetInk)"],
    [e.trophies, plural(goldHeld(), "trophy", "trophies"),                "var(--ember)"]
  ].filter(function(r){ return r[0] > 0; });
  if (src.length){
    h += "<div class='fill'><div class='fbar'>";
    src.forEach(function(r){ h += "<i style='flex:" + r[0] + ";background:" + r[2] + "'></i>"; });
    h += "</div><div class='fkeys'>";
    src.forEach(function(r){
      h += "<div class='fk'><i style='background:" + r[2] + "'></i>"
        + "<b>" + money(r[0]) + "</b><span>" + esc(r[1]) + "</span></div>";
    });
    h += "</div>";
    if (spent) h += "<div class='fout'><span>Spent so far</span><b>&minus;" + money(spent) + "</b></div>";
    h += "</div>";
  }

  if ((S.spends || []).length){
    h += "<h2>What you spent it on</h2><div class='recs'>";
    S.spends.slice().reverse().slice(0, 8).forEach(function(s){
      h += "<div class='rec'><span class='rd'>" + esc(nice(s[0])) + "</span>"
        + "<span class='rt'>" + esc(s[2] || "Something") + "</span>"
        + "<b class='rv'>" + money(s[1]) + "</b></div>";
    });
    h += "</div>";
  }

  /* the prizes: a run, and three things it buys */
  h += "<div class='flame'><div class='n'>" + best + "<small>day streak</small></div>"
    + "<p>Your best run across the three. The prizes below unlock off it.</p></div>";

  REWARD_TIERS.forEach(function(t){
    var name = (S.rewards || {})[t[0]];
    var unlocked = best >= t[0];
    var claimed = ((S.claimed || {})[t[0]] || 0);
    var k = Math.min(1, best / t[0]), C = 2 * Math.PI * 25;
    h += "<div class='trk" + (unlocked ? " won" : "") + "'>";
    h += "<div class='mdl'><svg viewBox='0 0 58 58' aria-hidden='true'>"
      + "<circle class='bg' cx='29' cy='29' r='25'></circle>"
      + "<circle class='fg' cx='29' cy='29' r='25' stroke-dasharray='"
      + (C * k).toFixed(1) + " " + C.toFixed(1) + "'></circle></svg><b>" + t[0] + "</b></div>";
    h += "<div class='bd'><div class='lbl'>" + t[1] + " &middot; " + t[0] + " days</div>";
    h += "<h3>" + (name ? esc(name) : "Nothing set yet") + "</h3>";
    if (!name) h += "<p>" + esc(t[2]) + "</p>";
    if (claimed) h += "<p class='dim'>Claimed " + claimed + (claimed === 1 ? " time" : " times") + ".</p>";
    h += "<div class='btns tight'>";
    if (name && unlocked) h += "<button class='btn pri' data-claimreward='" + t[0] + "'>Earned it</button>";
    h += "<button class='btn quiet' data-setreward='" + t[0] + "'>" + (name ? "Change" : "Set it") + "</button>";
    h += "</div>";
    if (name && !unlocked) h += "<p class='dim'>" + (t[0] - best) + " more days.</p>";
    h += "</div></div>";
  });

  h += "<details class='why wide'><summary>What makes a good prize</summary>"
    + "<p>A reward you would have had anyway is not a reward. Set the bar at things you currently "
    + "talk yourself out of &mdash; the good hawker centre across the island rather than the nearest "
    + "one, a day in Batam, the flight that gets your brother here.</p></details>";

  h += "<h2>Trophies</h2><div class='medals'>";
  BADGES.forEach(function(b){
    var n = totalDone(b[2]), got = n >= b[0];
    h += "<div class='md" + (got ? " got" : "") + "' title='" + esc(b[3]) + "'>"
      + "<div class='disc'>" + b[0] + "</div><div class='lbl'>" + esc(b[1]) + "</div></div>";
  });
  h += "</div>";
  var nx = BADGES.filter(function(b){ return totalDone(b[2]) < b[0]; })
                 .sort(function(a,b){ return (a[0]-totalDone(a[2])) - (b[0]-totalDone(b[2])); })[0];
  if (nx) h += "<p class='dim'>Next: <strong>" + esc(nx[1]) + "</strong> at " + nx[0] + " &mdash; "
    + (nx[0] - totalDone(nx[2])) + " to go. Total days, not consecutive ones, so a bad week costs "
    + "you nothing here.</p>";
  return h;
}

  var went = TRIPS.filter(function(t){ return t[2].slice(0, 4) === yr && daysUntil(t[3]) < 0; });
  if (went.length){
    h += "<h2>Where you went</h2><div class='panel'>";
    went.forEach(function(t){
      h += "<div class='row'><b class='k'>" + esc(nice(t[2])) + "</b><div><strong>" + esc(t[1]) + "</strong> "
        + "<span class='dim'>" + esc(t[0]) + "</span></div></div>";
    });
    h += "</div>";
  }
  return h;
}

/* ==================================================================== the shell
   Screens, transitions, and every interaction. There is no window.prompt() and
   no window.confirm() anywhere below this line. */
var TABS = {
  today:   viewToday,
  deck:    viewDeck,
  pot:     viewPot,
  threads: viewThreads,
  more:    viewMore,
  trips:   viewTrips,
  say:     viewSay,
  recap:   viewRecap
};
/* Which bottom-bar item lights up for a screen that has no item of its own. */
var UNDER = { trips: "threads", say: "more", recap: "more" };
var tab = "today";

function isLight(){ return document.documentElement.getAttribute("data-theme") === "light"; }

function render(opts){
  opts = opts || {};
  var el = document.getElementById("screen");
  var keep = opts.keepScroll ? window.scrollY : null;
  /* Today is a scene: one viewport, no scrolling. Every other tab is a list
     and scrolls like one. */
  document.body.classList.toggle("scene", tab === "today");
  closeBook();
  el.innerHTML = TABS[tab]();
  if (opts.turn){
    el.classList.remove("turn", "turn-back");
    void el.offsetWidth;
    el.classList.add(opts.back ? "turn-back" : "turn");
  }
  var lit = UNDER[tab] || tab;
  var nav = document.querySelectorAll("#nav button");
  for (var i = 0; i < nav.length; i++){
    nav[i].setAttribute("aria-current", nav[i].dataset.tab === lit ? "true" : "false");
  }
  paintHud(!!opts.animate);
  coachSync();
  /* Going to a new screen goes to the top. Re-drawing the one you are on does
     not - losing your place mid-screen is what a page navigation feels like. */
  if (keep === null) window.scrollTo(0, 0); else window.scrollTo(0, keep);
}
function go(next){
  if (next === tab) return;
  var order = ["today","deck","pot","threads","more"];
  var back = order.indexOf(next) >= 0 && order.indexOf(next) < order.indexOf(UNDER[tab] || tab);
  tab = next;
  sfx("nav"); buzz(8);
  render({ turn: true, back: back });
}

/* The most important interaction in the app. When the third one lands, the
   celebration takes the screen and the pack drops onto the tile the thumb is
   still on - no navigation, no snackbar, and nothing opened on his behalf. */
function tapPillar(key, btn){
  var t = today(), d = day(t), wasFull = allThree(t);
  if (d.p[key]) delete d.p[key]; else d.p[key] = 1;
  save();
  var nowFull = allThree(t);

  if (!wasFull && nowFull){
    var w = packsWaiting();
    buzz([28, 60, 28, 60, 55]);
    sfx("full");
    celebrate(w.streak ? "Seven in a row" : "All three",
      w.streak ? "A streak pack. Five cards, better odds." : "That is a pack, and " + money(rate()) + " in the pot.");
    if (btn){
      btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
      fly(btn, "#chipPot", "+" + money(rate()), "var(--gold2)");
    }
    setTimeout(function(){ render({ keepScroll: true, animate: true }); }, reduced() ? 0 : 620);
    return;
  }
  if (d.p[key]){ buzz(14); sfx("tick");
    if (btn){ btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
  } else { sfx("untick"); }
  render({ keepScroll: true, animate: true });
}

/* The one thing spares buy. He picks the card; nothing is chosen for him. */
async function askCraft(setKey){
  var sp = spares();
  var missing = setCards(setKey).filter(function(c){
    return !(S.cards || {})[c[0]] && c[1] !== 3;
  }).sort(function(a, b){ return craftCost(a) - craftCost(b); });
  if (!missing.length){ toast("Nothing missing in this one."); return; }
  var v = await ask({
    title: "Make a card",
    say: "You have <strong>" + num(sp) + " spares</strong>. They came from cards you pulled twice, and "
       + "this is the only thing they do.",
    options: missing.map(function(c){
      var cost = craftCost(c), can = cost <= sp;
      return { id: c[0], label: c[0] + "  ·  " + cost, pri: can,
               note: can ? RARITY[c[1]][0] : RARITY[c[1]][0] + " · " + (cost - sp) + " short" };
    }),
    cancel: "Close"
  });
  if (!v) return;
  var card = cardByName(v);
  if (!canCraft(card)){ sfx("no"); toast("Not enough spares for that one."); return; }
  craft(v);
  sfx("craft"); buzz([16, 40, 16]);
  render({ keepScroll: true, animate: true });
  setTimeout(function(){ openSheet(v); }, 220);
}

async function bedSheet(){
  var y = day(shift(-1)), bt = S.bed || BED_DEFAULT, s = shape();
  var clash = s.end >= t2m(bt);
  var say = "Wake time follows from this, and everything else follows from wake time. You said it "
          + "yourself: the thing to agree is simply a time.";
  if (clash){
    say += "<br><br><strong>Not possible today.</strong> The shift ends at " + s.endT + " and bed is "
        + esc(bt) + ". Malta keeps you to 17:00 their time all year, so when their clocks go back on "
        + "25 October the same contract quietly moves your finish to midnight. Nobody chose that. It "
        + "is a drafting defect, and it is the strongest thing you have to take into the October "
        + "conversation.";
  }
  var opts = [];
  if (y.bedok === undefined){
    opts.push({ id: "yes", label: "Made it last night", pri: true });
    opts.push({ id: "no", label: "Did not" });
  } else {
    opts.push({ id: "clear", label: "Last night: " + (y.bedok ? "made it" : "missed it"),
                note: "Tap to change" });
  }
  opts.push({ id: "time", label: "Change the time", note: "Currently " + bt });

  } else if (v === "clear"){
    delete day(shift(-1)).bedok; save(); render({ keepScroll: true });
    bedSheet();
  } else if (v === "time"){ askBedtime(); }
}

async function frzSheet(){
  var t = today(), yk = shift(-1), left = freezesLeft();
  var opts = [];
  if (frozen(t)) opts.push({ id: "t", label: "Today is frozen", note: "Tap to give it back" });
  else if (canFreeze(t)) opts.push({ id: "t", label: "Freeze today" });
  if (frozen(yk)) opts.push({ id: "y", label: "Yesterday is frozen", note: "Tap to give it back" });
  else if (canFreeze(yk) && Object.keys(S.days).length) opts.push({ id: "y", label: "Freeze yesterday" });
  var say = "A frozen day carries the run across without counting toward it. The run survives; a day "
          + "you did not do is not a day you did. Nothing is spent unless you press it — a safety net "
          + "you cannot feel is not a safety net.";
  if (!left && !opts.length){
    say += "<br><br>None left until "
        + nice(iso(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1)))
        + ". Which is the point of there being a number.";
  }
  var v = await ask({ title: left + " of " + FREEZES_PER_MONTH + " freezes left", say: say,
                      options: opts, cancel: "Close" });
  if (!v) return;
  var fk = v === "t" ? t : yk;
  if (frozen(fk)){ delete S.freezes[fk]; save(); sfx("tap"); toast("Freeze returned."); }
  else if (canFreeze(fk)){
    S.freezes = S.freezes || {}; S.freezes[fk] = 1; day(fk); save();
    buzz([18, 40, 18]); sfx("flip");
    toast((fk === t ? "Today" : "Yesterday") + " frozen. " + freezesLeft() + " left this month.");
  }
  render({ keepScroll: true, animate: true });
}

/* --------------------------------------------------------------- the handler */
document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("button, .tc, [data-card]") : null;
  if (!b) return;
  var t = today(), d = day(t), ds = b.dataset || {};

  /* a row tapped inside the book closes the book, then runs as itself */
  if (b.closest && b.closest("#book") && !ds.bookclose) closeBook();

  if (ds.coachskip){ coachSkip(); return; }
  if (ds.tab){ go(ds.tab); return; }
  if (ds.go){ location.href = ds.go; return; }
  if (ds.p){ tapPillar(ds.p, b); return; }
  if (ds.open){ sfx("tap"); openStage(packsWaiting().streak ? "streak" : "day"); return; }
  if (ds.pack){ sfx("tap"); openStage(ds.pack); return; }
  if (ds.card){ openSheet(ds.card); return; }
  if (ds.craftit){ closeSheet(); askCraft(cardByName(ds.craftit)[2]); return; }
  if (ds.set){ DECKSET = ds.set; DECKFILTER = 0; sfx("tap"); render({ keepScroll: true }); return; }
  if (ds.df){ DECKFILTER = Number(ds.df); sfx("tap"); render({ keepScroll: true }); return; }
  if (ds.craft){ askCraft(ds.craft); return; }
  if (ds.claim){ askClaimTrophy(ds.claim); return; }
  if (ds.camp){ askCamp(); return; }
  if (ds.bedsheet){ bedSheet(); return; }
  if (ds.frzsheet){ frzSheet(); return; }
  if (ds.hq){ hqSheet(); return; }
  if (ds.saysheet){ saySheet(); return; }
  if (ds.keptsheet){ keptSheet(); return; }
  if (ds.place){ placeSheet(); return; }
  if (ds.gap === "set"){ askGap(); return; }
  if (ds.gap === "clear"){ delete d.gap; save(); sfx("tap"); render({ keepScroll: true }); return; }
  if (ds.bedtime){ askBedtime(); return; }
  if (ds.bed === "1" || ds.bed === "0"){
    day(shift(-1)).bedok = ds.bed === "1"; save();
    sfx(ds.bed === "1" ? "tick" : "untick"); buzz(12);
    render({ keepScroll: true }); return;
  }
  if (ds.bed === "x"){ delete day(shift(-1)).bedok; save(); render({ keepScroll: true }); return; }
  if (ds.say){
    var v = (document.getElementById("said").value || "").trim();
    if (v){ d.said = v; save(); sfx("done"); buzz(12); render({ keepScroll: true }); }
    else sfx("no");
    return;
  }
  if (ds.unsay){ delete d.said; save(); render({ keepScroll: true }); return; }
  if (ds.kept){
    day(shift(-1)).kept = ds.kept === "1"; save();
    sfx(ds.kept === "1" ? "done" : "untick");
    render({ keepScroll: true }); return;
  }
  if (ds.thread){
    var st = S.threads[ds.thread] || (S.threads[ds.thread] = {});
    if (st.done) delete st.done; else { st.done = t; sfx("done"); buzz(16); }
    save(); render({ keepScroll: true }); return;
  }
  if (ds.done){
    S.done[ds.done] = t; delete S.skip[t]; save();
    sfx("done"); buzz([16, 40, 16]);
    toast("Logged. " + Object.keys(S.done).length + " places.");
    render({ keepScroll: true, animate: true }); return;
  }
  if (ds.skip){
    if (!rerollsLeft()){ sfx("no"); return; }
    S.skip[t] = (S.skip[t] || 0) + 1; save(); sfx("tap");
    render({ keepScroll: true }); return;
  }
  if (ds.easy){ S.filter = ((S.filter || 0) + 1) % 3; delete S.skip[t]; save(); sfx("tap");
    render({ keepScroll: true }); return; }
  if (ds.freeze){
    var fk = ds.freeze;
    if (frozen(fk)){
      delete S.freezes[fk]; save(); sfx("tap"); toast("Freeze returned.");
    } else if (canFreeze(fk)){
      S.freezes = S.freezes || {};
      S.freezes[fk] = 1;
      day(fk);
      save(); buzz([18, 40, 18]); sfx("flip");
      toast((fk === t ? "Today" : "Yesterday") + " frozen. " + freezesLeft() + " left this month.");
    }
    render({ keepScroll: true, animate: true }); return;
  }
  if (ds.spend){ askSpend(); return; }
  if (ds.rate){ askRate(); return; }
  if (ds.setreward){ askReward(ds.setreward); return; }
  if (ds.claimreward){
    S.claimed = S.claimed || {};
    S.claimed[ds.claimreward] = (S.claimed[ds.claimreward] || 0) + 1;
    save(); sfx("level"); buzz([25, 55, 25]);
    celebrate("Earned", (S.rewards || {})[ds.claimreward] || "");
    render({ keepScroll: true }); return;
  }
  if (ds.sound){
    S.mute = !S.mute; save();
    if (!S.mute) sfx("done");
    render({ keepScroll: true }); return;
  }
  if (ds.theme || b.id === "theme"){
    var nx = isLight() ? null : "light";
    if (nx) document.documentElement.setAttribute("data-theme", nx);
    else document.documentElement.removeAttribute("data-theme");
    S.theme = nx; save(); sfx("tap");
    render({ keepScroll: true }); return;
  }
  if (ds.replay){
    sfx("tap");
    tab = "today"; render();
    coachStart(true);
    return;
  }
  if (ds.bookopen){ sfx("tap"); openBook(); return; }
  if (ds.bookclose){ closeBook(); return; }
  if (ds.reset){ askReset(); return; }
  if (b.id === "crest"){ sfx("tap"); go("deck"); return; }
  if (b.id === "chipPot"){ sfx("tap"); go("pot"); return; }
  if (b.id === "chipShard"){ sfx("tap"); go("deck"); return; }
});

  var g = document.getElementById("gate");

  g.hidden = false;
  g.addEventListener("click", function(){
    g.classList.add("going");
