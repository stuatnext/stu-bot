      + "<p class='muted' style='margin:8px 0 0'>A day with all three earns one. Every seventh "
      + "consecutive full day earns a streak pack &mdash; five cards, better odds.</p>"
      + "<p class='dim' style='margin:8px 0 0'>" + poolHeld + " of " + pool + " cards open to you, "
      + "out of " + CARDS.length + " in the deck.</p></div>";
  }

  var door = SETS.filter(function(s){ return !setOpen(s[0]); })
                 .sort(function(a, b){ return a[3] - b[3]; })[0];
  if (door){
    var dleft = setNeeds(door[0]) - fullDays();
    h += "<div class='card'><h3>" + dleft + " full " + (dleft === 1 ? "day" : "days")
      + " to " + esc(door[1]) + "</h3>"
      + "<p class='muted' style='margin:7px 0 0'>" + esc(door[2]) + "</p>"
      + "<p class='dim' style='margin:7px 0 0'>" + setCards(door[0]).length
      + " new cards, and they cannot turn up in a pack before then.</p></div>";
  }

  if (near){
    h += "<div class='card tip'><h3>" + near.left + " from finishing " + esc(near.set[1]) + "</h3>"
      + "<p style='margin:7px 0 0'>" + esc(near.set[2]) + "</p>"
      + "<p class='dim' style='margin:7px 0 0'>" + near.have + " of " + near.total
      + " &middot; a finished set is worth 100 XP.</p></div>";
  }

  SETS.forEach(function(st){
    var cs = setCards(st[0]), have = setHeld(st[0]), done = have === cs.length;
    if (!setOpen(st[0])){
      var need = setNeeds(st[0]), left = need - fullDays();
      h += "<div class='door'><span class='lk'>&#9679;</span>"
        + "<span class='bd'><b>" + esc(st[1]) + "</b><span>" + cs.length
        + " cards, sealed. " + left + " more full " + (left === 1 ? "day" : "days")
        + ".</span></span>"
        + "<span class='at'>opens at<br>" + need + " days</span></div>";
      return;
    }
    h += "<div class='seth'>" + ring(have, cs.length)
      + "<div><h2>" + esc(st[1]) + "</h2><div class='dim'>" + have + " of " + cs.length
      + (done ? " &middot; complete" : "") + "</div></div></div>";
    h += "<p class='dim' style='margin:0'>" + esc(st[2]) + "</p>";
    h += "<div class='binder'>";
    cs.forEach(function(c){
      var n = (S.cards || {})[c[0]];
      h += tcard(c, n, { down: !n, attr: " data-card=\"" + esc(c[0]) + "\"" });
    });
    h += "</div>";
    if (st[0] === "gold"){
      var unclaimed = cs.filter(function(c){ return !(S.cards || {})[c[0]]; });
      if (unclaimed.length){
        h += "<div class='card'><h3>Claim one</h3><p class='dim' style='margin:6px 0 0'>Only when it "
          + "has actually happened.</p><div class='btns'>";
        unclaimed.forEach(function(c){
          h += "<button data-claim='" + esc(c[0]) + "'>" + esc(c[0]) + "</button>";
        });
        h += "</div></div>";
      }
    }
  });
  return h;
}

/* ---------------------------------------------------------------- rewards */
function viewRewards(){
  var best = bestStreak();
  var h = "";

  var e = potEarned(), spent = potSpent(), have = pot();
  h += "<div class='pot'><div class='amt'>" + money(have) + "</div>"
    + "<div class='cap'>yours to spend</div>"
    + "<p>Earned at " + money(rate()) + " a full day, and it does not expire. Spend it on "
    + "anything. The only rule is that you tell it when you have, so the number stays true.</p>"
    + "<div class='btns'><button class='pri' data-spend='1'>Spent some</button>"
    + "<button data-rate='1'>Change the rate</button></div></div>";

  h += "<div class='ledger'>"
    + "<div><span>" + packCounts().day + " full days</span><span>" + money(e.days) + "</span></div>"
    + "<div><span>" + packCounts().streak + " seven-day runs</span><span>" + money(e.streaks) + "</span></div>"
    + "<div><span>" + setsComplete() + " sets finished</span><span>" + money(e.sets) + "</span></div>"
    + "<div><span>" + goldHeld() + " trophies</span><span>" + money(e.trophies) + "</span></div>"
    + (spent ? "<div class='out'><span>Spent</span><span>-" + money(spent) + "</span></div>" : "")
    + "<div class='tot'><span>Pot</span><span>" + money(have) + "</span></div></div>";

  if ((S.spends || []).length){
    h += "<h2>What you spent it on</h2><div class='card'>";
    S.spends.slice().reverse().slice(0, 12).forEach(function(s){
      h += "<div class='row'><b>" + esc(nice(s[0])) + "</b><div>" + esc(s[2] || "Something")
        + " <span class='dim'>" + money(s[1]) + "</span></div></div>";
    });
    h += "</div>";
  }

  h += "<div class='flame'><div class='n'>" + best + "<small>day streak</small></div>"
    + "<p>Your best run across the three right now. The pot builds off this, and the three "
    + "prizes below unlock off it.</p></div>";

  REWARD_TIERS.forEach(function(t){
    var name = (S.rewards || {})[t[0]];
    var unlocked = best >= t[0];
    var claimed = ((S.claimed || {})[t[0]] || 0);
    var k = Math.min(1, best / t[0]), C = 2 * Math.PI * 25;
    h += "<div class='trk" + (unlocked ? " won" : "") + "'>";
    h += "<div class='mdl'><svg viewBox='0 0 58 58' aria-hidden='true'>"
      + "<circle class='bg' cx='29' cy='29' r='25'></circle>"
      + "<circle class='fg' cx='29' cy='29' r='25' stroke-dasharray='"
      + (C * k).toFixed(1) + " " + C.toFixed(1) + "'></circle></svg><b>" + t[0] + "</b></div>";
    h += "<div class='bd'>";
    h += "<div class='tag'>" + t[1] + " &middot; " + t[0] + " days</div>";
    h += "<h3>" + (name ? esc(name) : "Nothing set yet") + "</h3>";
    h += "<p class='dim' style='margin:5px 0 0'>" + esc(t[2]) + "</p>";
    if (claimed) h += "<p class='dim' style='margin:4px 0 0'>Claimed " + claimed
      + (claimed === 1 ? " time" : " times") + " so far.</p>";
    h += "<div class='btns'>";
    if (name && unlocked) h += "<button class='pri' data-claimreward='" + t[0] + "'>Earned it &mdash; claim</button>";
    if (!name) h += "<button data-setreward='" + t[0] + "'>Set what this earns you</button>";
    else h += "<button data-setreward='" + t[0] + "'>Change</button>";
    h += "</div>";
    if (name && !unlocked) h += "<p class='dim' style='margin:8px 0 0'>"
      + (t[0] - best) + " more days.</p>";
    h += "</div></div>";
  });

  /* Badges belong here, next to the prizes, not buried in a log. */
  h += "<h2>Trophies</h2>";
  h += "<p class='dim' style='margin:0 0 4px'>Earned by total days, not consecutive ones "
    + "&mdash; so a bad week costs you nothing here.</p>";
  h += "<div class='medals'>";
  BADGES.forEach(function(b){
    var n = totalDone(b[2]), got = n >= b[0];
    h += "<div class='md" + (got ? " got" : "") + "' title='" + esc(b[3]) + "'>"
      + "<div class='disc'>" + b[0] + "</div>"
      + "<div class='lbl'>" + esc(b[1]) + "</div></div>";
  });
  h += "</div>";
  var nx = BADGES.filter(function(b){ return totalDone(b[2]) < b[0]; })
                 .sort(function(a,b){ return (a[0]-totalDone(a[2])) - (b[0]-totalDone(b[2])); })[0];
  if (nx){
    h += "<p class='dim' style='margin:2px 0 0'>Next: <strong>" + esc(nx[1]) + "</strong> at "
      + nx[0] + " &mdash; " + (nx[0] - totalDone(nx[2])) + " to go. " + esc(nx[3]) + "</p>";
  }

  h += "<div class='card tip'><h3>Pick things you would otherwise not do</h3>"
    + "<p style='margin:8px 0 0'>A reward you would have had anyway is not a reward. So set the bar "
    + "at things you currently talk yourself out of.</p>"
    + "<div class='row'><b>Weekly</b><div>A coffee somewhere you have never been. A book. The good "
    + "hawker centre across the island rather than the nearest one.</div></div>"
    + "<div class='row'><b>Monthly</b><div>A proper meal out. A massage. A day in Batam &mdash; the "
    + "ferry is forty-five minutes and costs less than a taxi to Changi.</div></div>"
    + "<div class='row'><b>Quarterly</b><div>The one you keep deferring. A weekend in Bangkok, "
    + "Penang or Yogyakarta. GTA VI. Or the flight that gets your brother here.</div></div>"
    + "<p class='dim' style='margin:9px 0 0'>You can work from any of those, which is the whole "
    + "point of living where you live.</p></div>";
  return h;
}

/* ---------------------------------------------------------------- recap
   He has an SpLD around short-term memory and said as much. A year is exactly
   the span he will not be able to reconstruct in December, and the app has
   been writing it all down anyway. This is the app remembering for him. */
function recapReady(){ return new Date().getMonth() === 11; }

function viewRecap(){
  var yr = String(new Date().getFullYear());
  var keys = Object.keys(S.days).filter(function(k){ return k.slice(0, 4) === yr; }).sort();
  var h = "";

  if (!recapReady()){
    h += "<div class='card tip'><h3>This opens on 1 December</h3>"
      + "<p style='margin:8px 0 0'>A year is exactly the length you said you cannot hold in your "
      + "head. So it gets written down all the way through and handed back to you in one piece, "
      + "at the point where you would otherwise be trying to remember it.</p>"
      + "<p class='dim' style='margin:8px 0 0'>Below is what it has on you so far.</p></div>";
  }

  var full = keys.filter(allThree).length;
  var best = 0, run = 0, prev = null;
  keys.forEach(function(k){
    if (!allThree(k)){ run = 0; prev = k; return; }
    var gap = prev ? Math.round((new Date(k) - new Date(prev)) / 86400000) : 99;
    run = gap === 1 ? run + 1 : 1;
    if (run > best) best = run;
    prev = k;
  });

  h += "<div class='pot'><div class='amt'>" + full + "</div>"
    + "<div class='cap'>full days in " + yr + "</div>"
    + "<p>Days you trained, spoke to someone at home, and finished when the shift finished. "
    + "Your longest unbroken run was <strong>" + best + "</strong>.</p></div>";

  var e = potEarned();
  h += "<div class='ledger'>";
  PILLARS.forEach(function(g){
    var n = keys.filter(function(k){ return pDone(k, g[0]); }).length;
    h += "<div><span>" + g[1] + "</span><span>" + n + " days</span></div>";
  });
  h += "<div><span>Cards held</span><span>" + heldCount() + " of " + CARDS.length + "</span></div>"
    + "<div><span>Sets finished</span><span>" + setsComplete() + " of " + SETS.length + "</span></div>"
    + "<div><span>Trophies</span><span>" + goldHeld() + "</span></div>"
    + "<div><span>Places logged</span><span>" + Object.keys(S.done || {}).length + "</span></div>"
    + "<div class='tot'><span>Earned</span><span>" + money(potTotal()) + "</span></div>"
    + (potSpent() ? "<div class='out'><span>Spent on yourself</span><span>" + money(potSpent()) + "</span></div>" : "")
    + "</div>";

  /* His own words, which are the only part of this he cannot get anywhere else. */
  var said = keys.filter(function(k){ return S.days[k].said; });
  h += "<h2>What you said mattered</h2>";
  if (said.length){
    h += "<p class='dim' style='margin:0 0 6px'>" + said.length + " days where you named one thing. "
      + "These are your words, not the app's.</p><div class='card'>";
    said.slice().reverse().forEach(function(k){
      h += "<div class='row'><b>" + esc(nice(k)) + "</b><div>" + esc(S.days[k].said) + "</div></div>";
    });
    h += "</div>";
  } else {
    h += "<div class='card'><p class='muted' style='margin:0'>Nothing named yet. The box on Today "
      + "takes one line, and in December it is the only part of this you will actually want.</p></div>";
  }

  if ((S.spends || []).length){
    h += "<h2>What it bought you</h2><div class='card'>";
    S.spends.filter(function(s){ return s[0].slice(0, 4) === yr; }).slice().reverse().forEach(function(s){
      h += "<div class='row'><b>" + esc(nice(s[0])) + "</b><div>" + esc(s[2] || "Something")
        + " <span class='dim'>" + money(s[1]) + "</span></div></div>";
    });
    h += "</div>";
  }

  var went = TRIPS.filter(function(t){ return t[2].slice(0, 4) === yr && daysUntil(t[3]) < 0; });
  if (went.length){
    h += "<h2>Where you went</h2><div class='card'>";
    went.forEach(function(t){
      h += "<div class='row'><b>" + esc(nice(t[2])) + "</b><div><strong>" + esc(t[1]) + "</strong> "
        + "<span class='dim'>" + esc(t[0]) + "</span></div></div>";
    });
    h += "</div>";
  }
  return h;
}

/* ---------------------------------------------------------------- shell */
var TABS = {
  today:   ["Today", "A day fixed to head office", viewToday],
  cards:   ["Cards", "Ninety, and you are barely home this year", viewCards],
  rewards: ["Rewards", "What consistency buys you", viewRewards],
  next:    ["Next", "What is actually going on", viewNext],
  trips:   ["Trips", "Where you will be, and the UK count", viewTrips],
  say:     ["Say", "Read it in the queue", viewSay],
  log:     ["Log", "The record, so you are not holding it", viewLog],
  recap:   ["The Year", "Written down so you do not have to remember it", viewRecap]
};
var tab = "today";

function render(){
  var t = TABS[tab];
  document.getElementById("title").textContent = t[0];
  document.getElementById("eyebrow").textContent = t[1];
  document.getElementById("view").innerHTML = t[2]();
  var nav = document.querySelectorAll("nav button");
  for (var i=0;i<nav.length;i++){
    nav[i].setAttribute("aria-current", nav[i].dataset.tab === tab ? "true" : "false");
  }
  window.scrollTo(0,0);
}

function campSheet(){
  var names = CAMPS.map(function(c){ return c[0]; });
  var i = names.indexOf(S.camp);
  var next = names[(i + 1) % names.length];
  S.camp = next; save(); render();
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("button, .tc") : null;
  if (!b) return;
  var d = day(today());

  if (b.dataset.tab){ tab = b.dataset.tab; render(); return; }
  if (b.dataset.camp){ campSheet(); return; }
  if (b.dataset.p){
    var k = b.dataset.p, wasFull = allThree(today());
    if (d.p[k]) delete d.p[k]; else d.p[k] = 1;
    save();
    if (!wasFull && allThree(today())){
      var sp = packsWaiting();
      buzz([25, 60, 25, 60, 45]);
      sfx(sp.streak ? "gold" : "rare");
      toast(sp.streak ? "Streak pack earned." : "All three. Pack earned.");
    } else if (d.p[k]){ buzz(14); sfx("tap"); }
    render(); return;
  }
  if (b.dataset.bed === "1" || b.dataset.bed === "0"){ day(shift(-1)).bedok = b.dataset.bed === "1"; save(); render(); return; }
  if (b.dataset.bed === "x"){ delete day(shift(-1)).bedok; save(); render(); return; }
  if (b.dataset.bedtime){
    var v = prompt("Bed by what time? 24h, e.g. 23:45", S.bed || BED_DEFAULT);
    if (v && /^\d{1,2}:\d{2}$/.test(v.trim())){ S.bed = v.trim(); save(); render(); }
    return;
  }
  if (b.dataset.gap === "set"){
    var g = (document.getElementById("gap").value || "").trim();
    if (g){ d.gap = g; save(); render(); }
    return;
  }
  if (b.dataset.gap === "clear"){ delete d.gap; save(); render(); return; }
  if (b.dataset.say){
    var v = (document.getElementById("said").value || "").trim();
    if (v){ d.said = v; save(); render(); }
    return;
  }
  if (b.dataset.unsay){ delete d.said; save(); render(); return; }
  if (b.dataset.kept){ day(shift(-1)).kept = b.dataset.kept === "1"; save(); render(); return; }
  if (b.dataset.thread){
    var st = S.threads[b.dataset.thread] || (S.threads[b.dataset.thread] = {});
    if (st.done) delete st.done; else st.done = today();
    save(); render(); return;
  }
  if (b.dataset.done){ S.done[b.dataset.done] = today(); delete S.skip[today()]; save(); tab = "log"; render(); return; }
  if (b.dataset.skip){ S.skip[today()] = (S.skip[today()] || 0) + 1; save(); render(); return; }
  if (b.dataset.easy){ S.filter = ((S.filter || 0) + 1) % 3; delete S.skip[today()]; save(); render(); return; }
  if (b.dataset.pack){ openStage(b.dataset.pack); return; }
  if (b.dataset.card){ openSheet(b.dataset.card); return; }
  if (b.dataset.claim){
    claimTrophy(b.dataset.claim); return;
  }
  if (b.dataset.freeze){
    var fk = b.dataset.freeze;
    if (frozen(fk)){
      delete S.freezes[fk]; save(); sfx("tap"); toast("Freeze returned.");
    } else if (canFreeze(fk)){
      S.freezes = S.freezes || {};
      S.freezes[fk] = 1;
      day(fk);                     /* so a frozen day with nothing on it still shows in the log */
      save(); buzz([18, 40, 18]); sfx("flip");
      toast((fk === today() ? "Today" : "Yesterday") + " frozen. "
        + freezesLeft() + " left this month.");
    }
    render(); return;
  }
  if (b.dataset.spend){
    var amt = prompt("How much did you spend? Just the number.", "");
    if (amt === null) return;
    var n = Number(String(amt).replace(/[^0-9.]/g, ""));
    if (!(n > 0)) return;
    var what = prompt("On what?", "");
    if (what === null) return;
    S.spends = S.spends || [];
    S.spends.push([today(), n, String(what).slice(0, 80)]);
    save(); sfx("done"); buzz(20);
    toast(money(n) + " spent. " + money(pot()) + " left.");
    render(); return;
  }
  if (b.dataset.rate){
    var v = prompt("What is one full day worth, in dollars?", String(rate()));
    if (v === null) return;
    var r = Number(String(v).replace(/[^0-9.]/g, ""));
    if (r > 0){ S.rate = r; save(); render(); }
    return;
  }
  if (b.dataset.mute){
    S.mute = !S.mute; save(); paintSound();
    if (!S.mute) sfx("tap");
    return;
  }
  if (b.dataset.setreward){
    var tier = b.dataset.setreward;
    var v = prompt("What does this one earn you?", (S.rewards || {})[tier] || "");
    if (v !== null){ S.rewards = S.rewards || {}; if (v.trim()) S.rewards[tier] = v.trim(); else delete S.rewards[tier]; save(); render(); }
    return;
  }
  if (b.dataset.claimreward){
    var tr = b.dataset.claimreward;
    S.claimed = S.claimed || {}; S.claimed[tr] = (S.claimed[tr] || 0) + 1; save(); render(); return;
  }
  if (b.dataset.reset){
    if (confirm("Clear everything logged? This cannot be undone.")){
      S.done = {}; S.skip = {}; S.days = {}; S.threads = {}; S.cards = {}; S.claimed = {}; S.openedDay = 0; S.openedStreak = 0; delete S.reveal; save(); render();
    }
    return;
  }
  if (b.id === "theme"){
    var cur = document.documentElement.getAttribute("data-theme");
    var nx = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (nx) document.documentElement.setAttribute("data-theme", nx);
    else document.documentElement.removeAttribute("data-theme");
    S.theme = nx; save();
  }
});

if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
function paintSound(){
  var el = document.getElementById("sound");
  if (el){ el.innerHTML = S.mute ? "&#9835;" : "&#9834;"; el.style.opacity = S.mute ? ".4" : "1";
           el.setAttribute("aria-label", S.mute ? "Sound off" : "Sound on"); }
}
paintSound();
render();
/* The shift moves under you, so keep the bar honest. */
setInterval(function(){ if (tab === "today") render(); }, 60000);
</script>
</body>
</html>
